<title id="title">VIS3-01 — Three original ATLAS ornamental signature directions</title>
<desc id="desc">A Grand Atlas: cartouche and compass; B Chronometer: concentric brass instrument; C Illuminated Codex: secular floral illuminated folio. These are proposed original visual motifs, not actual app data or history.</desc>
