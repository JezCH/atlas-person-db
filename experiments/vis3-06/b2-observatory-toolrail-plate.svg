<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 32" fill="none" role="img" aria-label="장식용 정밀 관측기구 프레임 시안, 실제 시간 및 좌표가 아님">
  <desc>VIS3-06-P3 B2. An original neutral half-dial etching for outer Spacetime toolbar chrome. No times, scales, geographic bearings, symbols of historic authority, or inferred astronomical measurements.</desc>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- faint bifilar engraved arms, NOT data-axis ticks -->
    <path d="M5 16H58 M126 16H179" stroke="#c0ae88" stroke-opacity=".66" stroke-width="1.1"/>
    <path d="M9 19H53 M131 19H175" stroke="#b19b73" stroke-opacity=".24" stroke-width=".55"/>
    <path d="M11 13H39 M145 13H173" stroke="#c0ae88" stroke-opacity=".24" stroke-width=".65"/>
    <path d="M55 16c3-6 8-11 14-13 M129 16c-3-6-8-11-14-13" stroke="#c0ae88" stroke-opacity=".55" stroke-width=".9"/>
    <!-- mechanical semicircle is an archival ornamental frame, not a gauge -->
    <path d="M67 17a25 25 0 0 1 50 0" stroke="#d6c29a" stroke-opacity=".86" stroke-width="1.5"/>
    <path d="M72 17a20 20 0 0 1 40 0" stroke="#c0ae88" stroke-opacity=".48" stroke-width=".8"/>
    <path d="M79 17a13 13 0 0 1 26 0" stroke="#d6c29a" stroke-opacity=".45" stroke-width=".85"/>
    <path d="M67 17h50" stroke="#c0ae88" stroke-opacity=".7" stroke-width="1"/>
    <path d="M77 20H107" stroke="#c0ae88" stroke-opacity=".3" stroke-width=".7"/>
    <!-- central secular rivet and opposing finials; intentionally no pointer/degree marks -->
    <path d="M92 10l6 6-6 6-6-6 6-6Z" stroke="#e7d5ad" stroke-opacity=".88" stroke-width="1" fill="#b19b73" fill-opacity=".16"/>
    <circle cx="92" cy="16" r="1.5" fill="#e7d5ad" fill-opacity=".9" stroke="none"/>
    <path d="M58 16l-3-3-3 3 3 3 3-3Z M126 16l3-3 3 3-3 3-3-3Z" stroke="#c0ae88" stroke-opacity=".46" stroke-width=".85"/>
  </g>
</svg>