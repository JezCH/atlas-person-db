name: ATLAS Codex Real-Code Pilot — One Shot

# Single approved push-triggered task. Never periodic or PR-event triggered.
# This commits no runtime / deployment files and never checks out untrusted branches.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/atlas-codex-bot-trigger-one-shot.yml

permissions:
  contents: read

concurrency:
  group: atlas-codex-real-code-pilot-20261020
  cancel-in-progress: false

jobs:
  start-codex-one-off:
    if: >-
      github.repository == 'JezCH/atlas-person-db' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'test(actions): authorize bounded ATLAS autocode pilot [atlas-autocode-20261020]')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: One authenticated GitHub comment starts one autonomous code task
        env:
          GH_TOKEN: ${{ secrets.ATLAS_CODEX_TRIGGER_PAT }}
          TARGET_PR: '2443'
          MARKER: ATLAS-CODEX-AUTOCODE-PILOT-20261020-ONCE
          MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo 'BLOCKED: authenticated repo-scoped PAT is absent; not dispatching.'
            exit 1
          fi
          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          jq -e '.state == "open" and .draft == true' <<< "$PR_JSON" >/dev/null
          EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments?per_page=100" --jq '.[].body')"
          if grep -Fq "$MARKER" <<< "$EXISTING"; then
            echo 'NO CHANGE: already dispatched; no duplicate model work.'
            exit 0
          fi
          BODY=$(cat <<EOF
          @codex ${MARKER} — ATLAS **REAL CODE IMPLEMENTATION** (not review, not read-only inspection). This is exactly one bounded autonomous development pilot.

          The current discussion PR #${TARGET_PR} is ONLY the dispatch mailbox: DO NOT edit, push, or merge its branch. **Work from the latest main at exact SHA ${MAIN_SHA}**, not the old PR head. Read AGENTS.md, WORK_EXECUTION.md, and docs/ATLAS_CURRENT_WORKSTREAMS.md from current main (if missing, fetch those files from GitHub main; stop if the project policy cannot be read). Examine only enough open PR changed-path sets to avoid concrete overlap.

          Select ONE genuinely reproducible, useful, small offline code defect in an independent pure JavaScript/Node utility or non-Production test helper with no overlap to open PRs or active manual work. Exclude Production/site probing, Vercel, database/Polity/Person canonical data, YouTube crawling, browser, GitHub Actions/workflow files, costly or external network operations, other agents, and historic cleanup. If no real independent bug is justified, report **NO CHANGE** here, no branch/PR; do not invent a defect just to pass this pilot.

          If there is a real defect: reproduce it with a focused failing Node regression, create a **NEW branch directly from ${MAIN_SHA}** (do not reuse an open PR branch), modify only the minimal utility and regression test, run focused Node tests and git diff --check. Push this NEW branch and open exactly ONE **NEW Draft PR against main**; do not merge it. Include in the PR changed paths, exact head SHA, failing-before/passing-after evidence, CI status if actually observed, and Production NOT LIVE. Report the new PR URL back in this PR thread. If GitHub push/PR creation is blocked, report the literal error; do not attempt an alternative auth route or retries.

          No other commits/PRs, no paid API, no Vercel Sandbox, no Production/Supabase network read/write, no deploy, no merges, no destructive changes, no recurring job. End after this one unit.
          EOF
          )
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments" -f "body=${BODY}" --jq '.html_url'
