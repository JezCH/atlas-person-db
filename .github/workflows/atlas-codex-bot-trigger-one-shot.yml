name: ATLAS Codex Fresh-Main Code Fix — One Shot

# Precisely one approved merge-commit-triggered code-fix dispatch.
# No cron, PR events, external APIs, deployments or non-ATLAS tasks.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/atlas-codex-bot-trigger-one-shot.yml

permissions:
  contents: read

concurrency:
  group: atlas-codex-freshmain-one-shot-20261020
  cancel-in-progress: false

jobs:
  dispatch-one-codex-fix:
    if: >-
      github.repository == 'JezCH/atlas-person-db' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'test(actions): authorize fresh-main Codex fix [atlas-codefix-20261020]')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Comment a single authenticated code fix request
        env:
          GH_TOKEN: ${{ secrets.ATLAS_CODEX_TRIGGER_PAT }}
          TARGET_PR: '2560'
          MARKER: ATLAS-CODEX-FRESHMAIN-FIX-20261020-ONCE
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo 'BLOCKED: user-authenticated repo-secret missing, no comment.'
            exit 1
          fi
          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
          jq -e '.state == "open" and .draft == true and .head.sha == "502c8801fa640b8db594d7f062c9e23bcae1d6ed"' <<< "$PR_JSON" >/dev/null
          COMMENTS="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments?per_page=100" --jq '.[].body')"
          if grep -Fq "$MARKER" <<< "$COMMENTS"; then
            echo 'NO CHANGE: this model task was already submitted.'
            exit 0
          fi
          BODY=$(cat <<EOF
          @codex ${MARKER} — ATLAS **REAL SOURCE CODE FIX** (not a review). Only one bounded task.

          You are in fresh-main launchpad Draft PR #2560 whose checked-out HEAD must be ${targetSHA}, with local parent commit ${main}. Verify HEAD and git cat-file for this parent. **Do not git fetch or invoke inaccessible internet; do not modify the launchpad PR branch.** Read local AGENTS.md and WORK_EXECUTION.md; if missing, report BLOCKED and stop. The source paths below were checked against all open PR changed paths and have no known overlap.

          REPRODUCIBLE BUG: scripts/vercel-ignore-build.mjs calls trim() in normalizePath(), stripping legitimate leading whitespace in Git file paths. For example, isSafeToSkipPath(' docs/runtime.js') currently wrongly returns true (treated as docs/) though the actual root folder is named ' docs', not 'docs'. Similarly, ' .github/workflows/unsafe.yml' is not an actual .github/workflows path. The classifier must fail closed for these valid distinct paths without disrupting ordinary docs/workflow skip behavior.

          Fix only scripts/vercel-ignore-build.mjs and tests/vercel-ignore-build.test.mjs. First add focused regression cases proving unsafe paths are currently misclassified (red). Make the minimal source fix, show green results from node --test tests/vercel-ignore-build.test.mjs and git diff --check. Do not manufacture claims or run unrelated suites. If reproduction fails, report NO CHANGE and do not publish code.

          If reproducible and tested, make a **NEW separate branch from exact parent ${main}**, NOT from this launchpad's document-only commit. Create exactly ONE NEW **Draft PR against main** with code+test only, if the Codex Cloud publishing integration permits it. Include exact head SHA, paths, red→green evidence, CI status only if observed, and Production NOT LIVE. Do not edit/merge/close PR #2560 or any existing PR. If GitHub push/PR publishing is unavailable, report exact failure and post a bounded source patch or tested diff in the task response for recovery; never request, copy, or circumvent credentials. Do not retry launch or create other tasks.

          No Vercel/Production/Supabase/Sandbox, no deployment, browser, paid API, CI dispatch, data mutation, destructive operations or auto merge. Stop after one code fix or a precise blocker.
          EOF
          )
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments" -f "body=${BODY}" --jq '.html_url'
