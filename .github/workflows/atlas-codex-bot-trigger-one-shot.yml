name: ATLAS Codex Bot-Origin Trigger — One Shot

# Experimental only; opening the single named Draft PR is the entire trigger.
# No cron, workflow_dispatch, production access, deployments or retries.
on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/atlas-codex-bot-trigger-one-shot.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  codex-bot-origin-smoke:
    if: >-
      github.repository == 'JezCH/atlas-person-db' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.number == 2556 &&
      github.event.pull_request.commits == 2 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.user.login == 'JezCH' &&
      github.event.pull_request.head.ref == 'experiment/codex-bot-trigger-20261020' &&
      github.event.pull_request.title == '[DRAFT] ATLAS one-shot Codex bot-origin trigger test'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: atlas-codex-bot-smoke-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Publish exactly one read-only Codex command as github-actions bot
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          @codex ATLAS controlled one-shot **GitHub Actions bot-origin** cloud dispatch test (NOT code review). Resolve this already-published Codex Cloud environment for PR #${PR_NUMBER}, verify the PR-head SHA ${HEAD_SHA}, and report whether you actually executed a Codex Cloud task and could read AGENTS.md. **Read-only only:** No edits, commits, push, PR creation, Actions/workflows, CI, Vercel/Production/Supabase requests, Sandbox, deployments, merges, or additional autonomous runs. Do not retry and do not create or reconfigure environments. Reply with exact results and a task URL if available.
          EOF
          )
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f "body=${BODY}" --jq '.html_url'
