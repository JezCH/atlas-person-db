name: ATLAS Phase III Spacetime Concept Preview

on:
  pull_request:
    paths:
      - "scripts/verify-vis3-06-production-dom-preview.mjs"
      - ".github/workflows/atlas-vis3-06-production-dom-preview.yml"
      - "docs/ui/UI_PHASE_III_VIS3_06_P_REAL_DOM_PREFLIGHT_20261010.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-vis3-06-concept-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production_dom_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ATLAS_PRODUCTION_ORIGIN: https://atlas-person-db.vercel.app
      ATLAS_CDP_URL: http://127.0.0.1:9222
      ATLAS_VISUAL_OUT_DIR: artifacts/vis3-06-production-dom-preview
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Korean browser fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Find Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Validate read-only concept runner syntax
        run: node --check scripts/verify-vis3-06-production-dom-preview.mjs

      - name: Capture same-Production-DOM A/B/C without deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ATLAS_VISUAL_OUT_DIR"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/atlas-vis3-06-preview-chrome \
            --window-size=1600,1000 \
            about:blank >/tmp/atlas-vis3-06-preview-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:9222/json/version >/dev/null
          node scripts/verify-vis3-06-production-dom-preview.mjs

      - name: Upload comparison PNGs and structured geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-vis3-06-real-production-dom-preview-${{ github.sha }}
          path: artifacts/vis3-06-production-dom-preview
          if-no-files-found: warn
          retention-days: 30
