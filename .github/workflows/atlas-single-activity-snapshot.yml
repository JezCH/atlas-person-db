name: ATLAS Single Activity Snapshot

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/atlas-single-activity-snapshot.yml'

permissions:
  contents: read
  id-token: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      ATLAS_AUDIT_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-audit-inventory
      ATLAS_AUDIT_AUDIENCE: atlas-person-db-audit-inventory
      TARGET_ACTIVITY_ID: b7aff6cc-95af-58e6-ba3b-5b2fc6be0600
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot exact blocker Activity from Production
        shell: bash
        run: |
          set -euo pipefail
          request_oidc() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ATLAS_AUDIT_AUDIENCE}" | jq -er '.value'
          }

          payload="$(jq -cn --arg deployment_sha "${GITHUB_SHA}" --arg activity_id "${TARGET_ACTIVITY_ID}" \
            '{deployment_sha:$deployment_sha,mode:"targeted",activity_ids:[$activity_id]}')"

          fetched=false
          for attempt in $(seq 1 60); do
            oidc_token="$(request_oidc)"
            status="$(curl --silent --show-error --output blocker-activity-snapshot.json --write-out '%{http_code}' --request POST \
              -H 'content-type: application/json' \
              -H "authorization: Bearer ${oidc_token}" \
              --data "$payload" "$ATLAS_AUDIT_ENDPOINT")"
            if [[ "$status" == "200" ]]; then
              jq -e --arg id "${TARGET_ACTIVITY_ID}" '
                .ok == true and .marker == "ATLAS_AUDIT_INVENTORY_V1" and
                .mode == "targeted" and .read_only == true and .committed == false and
                .requested_count == 1 and .row_count == 1 and
                (.rows[0].activity_id | ascii_downcase) == ($id | ascii_downcase)
              ' blocker-activity-snapshot.json >/dev/null
              fetched=true
              break
            fi
            code="$(jq -r '.code // "UNKNOWN"' blocker-activity-snapshot.json 2>/dev/null || printf 'UNKNOWN')"
            if [[ "$status" == "404" || ( "$status" == "409" && "$code" == "DEPLOYMENT_SHA_MISMATCH" ) ]]; then
              sleep 10
              continue
            fi
            cat blocker-activity-snapshot.json >&2 || true
            exit 1
          done
          [[ "$fetched" == "true" ]] || exit 1

          jq '.rows[0] | {activity_id,person_id,activity_start,activity_start_month,activity_start_day,activity_start_granularity,activity_start_certainty,activity_start_calendar,activity_end,activity_end_month,activity_end_day,activity_end_granularity,activity_end_certainty,activity_end_calendar,polity_id,role_id,notes,legacy_source_key}' blocker-activity-snapshot.json | tee blocker-activity-row.json

      - name: Upload blocker snapshot
        uses: actions/upload-artifact@v4
        with:
          name: atlas-single-activity-snapshot-${{ github.sha }}
          path: |
            blocker-activity-snapshot.json
            blocker-activity-row.json
          retention-days: 7
