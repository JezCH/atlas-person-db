name: ATLAS Dev Source Snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/atlas-dev-source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pack relevant branch sources
        run: |
          tar -czf atlas-dev-source-snapshot.tar.gz \
            stage2 research docs/stage2 db server scripts tests requirements \
            package.json package-lock.json admin.html admin.js app.js api .github/workflows/atlas-integrity.yml
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-dev-source-snapshot-${{ github.sha }}
          path: atlas-dev-source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
