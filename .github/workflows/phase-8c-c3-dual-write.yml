name: Phase 8C C3 Dual Write Integration

on:
  pull_request:
    paths:
      - "atlas-dual-write-coordinator.js"
      - "tests/atlas-dual-write-coordinator.test.mjs"
      - ".github/workflows/phase-8c-c3-dual-write.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run focused dual-write coordinator tests
        run: node tests/atlas-dual-write-coordinator.test.mjs

      - name: Static safety checks
        shell: bash
        run: |
          set -euo pipefail
          test -f atlas-dual-write-coordinator.js
          ! grep -q "window.ATLAS_DATA_SOURCE" atlas-dual-write-coordinator.js
          ! grep -q "from(.*person_politics_v2" atlas-dual-write-coordinator.js
          ! grep -q "delete.*person_politics_v2" atlas-dual-write-coordinator.js
          grep -q "rollback_required" atlas-dual-write-coordinator.js
          grep -q "legacyAdapter" atlas-dual-write-coordinator.js
          grep -q "v2Writer" atlas-dual-write-coordinator.js
