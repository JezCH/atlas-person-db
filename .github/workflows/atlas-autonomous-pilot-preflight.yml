name: ATLAS Autonomous V1 — Read-only Live Admission Preflight
# One-shot on introduction; optional manual re-run. Never dispatches a model.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/atlas-autonomous-pilot-preflight.yml
  workflow_dispatch:

permissions: {}

jobs:
  admission-proof:
    if: >-
      github.repository == 'JezCH/atlas-person-db' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    steps:
      - name: Inspect actual HOLD pilot with GET-only GitHub API
        uses: actions/github-script@v7
        env:
          # ONLY a boolean, not the secret value, enters this job.
          PAT_CONFIGURED: ${{ secrets.ATLAS_CODEX_TRIGGER_PAT != '' }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo}=context.repo;
            const assert=(ok,msg)=>{if(!ok)throw Error('ATLAS_PREFLIGHT_BLOCKED: '+msg)};
            const ref='main';
            const repoName=owner+'/'+repo;
            const tracked=['scripts/atlas-agent-dependency-map.mjs','tests/atlas-agent-dependency-map.test.mjs'];
            const baseline=(await github.rest.repos.getBranch({owner,repo,branch:ref})).data.commit.sha;
            assert(baseline===context.sha,'main moved since this run was queued');
            const file=async(p,rev)=>{
              const x=(await github.rest.repos.getContent({owner,repo,path:p,ref:rev})).data;
              assert(x.type==='file'&&typeof x.sha==='string','not a blob: '+p);
              return x;
            };
            const decode=x=>JSON.parse(Buffer.from(x.content.replace(/\s/g,''),'base64').toString('utf8'));
            const real=decode(await file('config/atlas-codex-tasks.v1.json',ref));
            const bridge=decode(await file('config/atlas-autonomous-loop.v1.json',ref));
            assert(real.enabled===false&&real.max_commands_per_utc_day===1,'real task registry enabled');
            assert(bridge.enabled===true&&bridge.dispatch_enabled===false,'real dispatch gate opened');
            assert(!real.tasks.some(x=>x.id==='atlas-commented-imports-20261023'),'candidate already in main');
            const issue=(await github.rest.issues.get({owner,repo,issue_number:2603})).data;
            assert(issue.state==='open'&&!issue.pull_request,'pilot Issue is not open');
            const draft=(await github.rest.pulls.get({owner,repo,pull_number:2605})).data;
            assert(draft.state==='open'&&draft.draft&&draft.head.repo.full_name===repoName&&
              draft.base.ref===ref&&draft.changed_files===1,'staged registry PR not an exact HOLD draft');
            const stageFiles=(await github.rest.pulls.listFiles({owner,repo,pull_number:2605,per_page:100})).data;
            assert(stageFiles.length===1&&stageFiles[0].filename==='config/atlas-codex-tasks.v1.json'&&
              stageFiles[0].status==='modified','staged registry changed unrelated files');
            const staged=decode(await file('config/atlas-codex-tasks.v1.json',draft.head.sha));
            assert(staged.enabled===false&&staged.max_commands_per_utc_day===1&&
              staged.tasks.length===real.tasks.length+1&&
              JSON.stringify(staged.tasks.slice(0,-1))===JSON.stringify(real.tasks),'staged registry changes active authority');
            const task=staged.tasks.at(-1);
            assert(task.id==='atlas-commented-imports-20261023'&&task.status==='hold'&&
              task.issue_number===2603&&task.launcher_pr===2604&&
              JSON.stringify(task.paths)===JSON.stringify(tracked),'HOLD candidate differs from exact scope');
            const launcher=(await github.rest.pulls.get({owner,repo,pull_number:2604})).data;
            assert(launcher.state==='open'&&launcher.draft&&launcher.head.repo.full_name===repoName&&
              launcher.head.sha===task.launcher_sha,'launcher SHA/state mismatch');
            for(const p of task.snapshot_paths){
              const [a,b]=await Promise.all([file(p,ref),file(p,task.launcher_sha)]);
              assert(a.sha===b.sha,'immutable launcher snapshot stale: '+p);
            }
            const now=Date.now();
            assert(Date.parse(task.not_before)<=now&&now<=Date.parse(task.expires_at),
              'HOLD pilot 24h review window expired');
            const exists=async p=>{
              try{await github.rest.git.getRef({owner,repo,ref:'heads/'+p});return true}
              catch(e){if(e.status===404)return false;throw e}
            };
            const today=new Date(now).toISOString().slice(0,10);
            assert(!await exists('codex/task-attempt/'+task.id)&&
              !await exists('codex/task-result/'+task.id)&&
              !await exists('codex/daily-attempt/'+today),'model admission already consumed');
            const open=await github.rest.pulls.list({owner,repo,state:'open',per_page:100});
            assert(open.data.length<100,'open PR listing incomplete');
            let checked=0;
            for(const item of open.data){
              const pr=(await github.rest.pulls.get({owner,repo,pull_number:item.number})).data;
              assert(pr.head.sha===item.head.sha&&pr.state==='open'&&pr.base.ref==='main'&&
                Number.isInteger(pr.changed_files)&&pr.changed_files<=300,'PR detail changed or too large');
              const full=[];
              for(let page=1;page<=Math.ceil(pr.changed_files/100);page++){
                const part=(await github.rest.pulls.listFiles({owner,repo,pull_number:pr.number,per_page:100,page})).data;
                assert(part.length<=100,'oversize PR file page');
                full.push(...part);
              }
              assert(full.length===pr.changed_files&&
                new Set(full.map(f=>f.filename)).size===full.length,'incomplete PR file inventory');
              assert(!full.some(f=>tracked.includes(f.filename)||tracked.includes(f.previous_filename)),
                'existing PR modifies pilot source/test: #'+pr.number);
              checked++;
            }
            const secretPresent=process.env.PAT_CONFIGURED==='true';
            const report={status:'HOLD_CANDIDATE_PREFLIGHT_PASSED_NOT_AUTHORIZED',
              issue:2603,launcher_pr:2604,hold_pr:2605,checked_open_prs:checked,
              model_dispatches:0,model_calls:0,pat_secret_configured:secretPresent,
              pat_permission_and_included_credits:'NOT_VERIFIED',
              final_decision:'KEEP_DISABLED_PENDING_EXTERNAL_COST_APPROVAL_AND_NEW_REVIEWED_WINDOW'};
            core.info(JSON.stringify(report));
            await core.summary.addHeading('ATLAS Autonomous V1: Read-only preflight')
              .addCodeBlock(JSON.stringify(report,null,2),'json').write();
