name: ATLAS Codex Patch Relay — bounded one-shot

# Receives a machine-readable patch ONLY from the verified Codex GitHub App.
# No schedule; it neither dispatches agents nor accesses Vercel/Production/Supabase.
on:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - .github/workflows/atlas-codex-patch-relay.yml

permissions: {}

concurrency:
  group: atlas-codex-patch-relay-20261020
  cancel-in-progress: false

jobs:
  validate-without-secrets:
    if: >-
      github.repository == 'JezCH/atlas-person-db' &&
      github.event.action == 'created' &&
      github.event.issue.number == 2560 &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.id == 199175422 &&
      github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
      contains(github.event.comment.body, 'ATLAS-CODEX-PATCH-V1')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bot envelope, base SHA, allowed files and original hashes
        run: |
          set -euo pipefail
          node scripts/atlas-codex-patch-relay.mjs extract "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/plan.json"
          node scripts/atlas-codex-patch-relay.mjs apply "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/applied.json"
          TEST_PATH="$(node -e 'const fs=require("fs");process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).test_path)' "$RUNNER_TEMP/applied.json")"
          node --test "$TEST_PATH"
          git diff --check
          diff -u <(node -e 'const fs=require("fs");console.log(JSON.parse(fs.readFileSync(process.argv[1])).changed_paths.sort().join("\n"))' "$RUNNER_TEMP/applied.json") <(git diff --name-only | sort)
      - name: Carry only validated plan to credentialed publishing stage
        uses: actions/upload-artifact@v4
        with:
          name: atlas-codex-patch-${{ github.event.comment.id }}
          path: ${{ runner.temp }}/plan.json
          retention-days: 1
          if-no-files-found: error

  publish-one-draft:
    needs: validate-without-secrets
    if: needs.validate-without-secrets.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Receive validated plan
        uses: actions/download-artifact@v4
        with:
          name: atlas-codex-patch-${{ github.event.comment.id }}
          path: ${{ runner.temp }}/relay
      - name: Strict revalidation, conflicts gate and Draft PR only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/atlas-codex-patch-relay.mjs apply "$RUNNER_TEMP/relay/plan.json" "$RUNNER_TEMP/published.json"
          git diff --check
          SOURCE="$(node -e 'const fs=require("fs");process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1])).changed_paths[0])' "$RUNNER_TEMP/published.json")"
          TEST="$(node -e 'const fs=require("fs");process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1])).changed_paths[1])' "$RUNNER_TEMP/published.json")"
          EXPECTED="$(node -e 'const fs=require("fs");process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1])).base_sha)' "$RUNNER_TEMP/published.json")"
          CURRENT="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [[ "$CURRENT" != "$EXPECTED" ]]; then echo 'BLOCKED: main advanced since proposed patch'; exit 1; fi
          diff -u <(printf '%s\n' "$SOURCE" "$TEST" | sort) <(git diff --name-only | sort)
          # Resource-scoped optimistic concurrency: any open PR touching either file blocks publication.
          # REST failures are fatal: do not hide their exit status inside process substitution.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[].number' > "$RUNNER_TEMP/open-prs"
          while IFS= read -r PR; do
            [[ -z "$PR" ]] && continue
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files?per_page=100" --jq '.[].filename' > "$RUNNER_TEMP/current-pr-files"
            while IFS= read -r FILE; do
              if [[ "$FILE" == "$SOURCE" || "$FILE" == "$TEST" ]]; then
                echo "BLOCKED: conflicting open PR #${PR} touches ${FILE}"
                exit 1
              fi
            done < "$RUNNER_TEMP/current-pr-files"
          done < "$RUNNER_TEMP/open-prs"
          BRANCH='codex/relay-pilot-20261020'
          if [[ -n "$(git ls-remote --heads origin "$BRANCH")" ]]; then
            echo 'BLOCKED: idempotency branch already exists'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -- "$SOURCE" "$TEST"
          git commit -m 'fix: apply bounded Codex patch proposal (draft only)'
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Publish Draft PR using previously configured repo-scoped user PAT
        env:
          GH_TOKEN: ${{ secrets.ATLAS_CODEX_TRIGGER_PAT }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'BLOCKED: authenticated PR-create PAT secret missing'; exit 1; }
          SOURCE="$(node -e 'const fs=require("fs");process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1])).changed_paths[0])' "$RUNNER_TEMP/published.json")"
          TEST="$(node -e 'const fs=require("fs");process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1])).changed_paths[1])' "$RUNNER_TEMP/published.json")"
          gh pr create --draft --base main --head 'codex/relay-pilot-20261020' \
            --title 'fix: Codex patch relay pilot (review required)' \
            --body "Codex patch relay v1. Only $SOURCE and $TEST. Credential-free validation and focused test PASS; exact preimage and source SHA rechecked. Full CI and human review required. Production NOT LIVE; no merge. Source: PR #2560 bot patch proposal."

  recover-existing-verified-branch-once:
    # One-time completion of previously validated run #39404578493.
    # This job never starts a model or modifies source; branch was pushed by the prior run.
    if: >-
      github.repository == 'JezCH/atlas-person-db' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'fix(ci): finalize one Codex relay Draft PR [atlas-relay-final-20261020]')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/relay-pilot-20261020
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reverify prior Codex bot patch and regression without secrets
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == 'd9803689eef8271fef639152d623a330d3a6cd0c' ]]
          [[ "$(git rev-parse HEAD^)" == '916ecf86821f2760a0610f894d760c4a5d77fc46' ]]
          diff -u <(printf '%s\n' 'scripts/classify-ci-impact.mjs' 'tests/ci-impact-routing.test.mjs' | sort) <(git diff --name-only HEAD^ HEAD | sort)
          git diff --check HEAD^ HEAD
          node --test tests/ci-impact-routing.test.mjs
      - name: Open exactly one Draft PR using limited GitHub user PAT
        env:
          GH_TOKEN: ${{ secrets.ATLAS_CODEX_TRIGGER_PAT }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo 'BLOCKED: PR-create PAT secret unavailable'; exit 1; }
          BRANCH='codex/relay-pilot-20261020'
          ALREADY="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=JezCH:${BRANCH}&state=all&per_page=100" --jq 'length')"
          [[ "$ALREADY" == '0' ]] || { echo 'NO CHANGE: a PR already exists for this branch'; exit 0; }
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[].number' > "$RUNNER_TEMP/open-prs"
          while IFS= read -r PR; do
            [[ -z "$PR" ]] && continue
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files?per_page=100" --jq '.[].filename' > "$RUNNER_TEMP/pr-files"
            if grep -Fxq 'scripts/classify-ci-impact.mjs' "$RUNNER_TEMP/pr-files" || grep -Fxq 'tests/ci-impact-routing.test.mjs' "$RUNNER_TEMP/pr-files"; then
              echo "BLOCKED: open PR ${PR} conflicts with exact verified pilot paths"
              exit 1
            fi
          done < "$RUNNER_TEMP/open-prs"
          gh pr create --draft --base main --head "$BRANCH" \
            --title 'fix(ci): Codex relay automated draft (review required)' \
            --body 'This Draft PR contains exactly the two files submitted by the Codex GitHub App in PR #2560 comment 6288359769. GitHub Actions #39404578493 validated exact bot identity, base and preimage SHA, safe paths, focused Node test without credentials, then committed and pushed d9803689eef8271fef639152d623a330d3a6cd0c. GitHub default token denied PR creation; this bounded continuation revalidated exact branch SHA and test and uses the previously configured repo-scoped GitHub user PAT for PR creation ONLY. Requires independent full CI and review. DO NOT MERGE automatically. Production NOT LIVE.'
