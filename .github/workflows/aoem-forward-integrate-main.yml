name: AOEM Forward Integrate Main

on:
  push:
    branches:
      - agent/register-philip-tribhuwana-narses-durgavati-mulan-20260908
    paths:
      - .github/workflows/aoem-forward-integrate-main.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/register-philip-tribhuwana-narses-durgavati-mulan-20260908
          fetch-depth: 0
      - name: Merge current main without altering reviewed AOEM payload
        shell: bash
        run: |
          git config user.name 'atlas-actions-bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:agent/register-philip-tribhuwana-narses-durgavati-mulan-20260908
