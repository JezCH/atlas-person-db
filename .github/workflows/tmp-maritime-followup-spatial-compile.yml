name: TEMP Maritime Follow-up Spatial Compile

on:
  push:
    branches:
      - codex/maritime-person-followup-20260920
    paths:
      - 'spatial/reviewed-bindings/shards/maritime-pirate-mobile-20260920.bindings.json'
      - '.github/workflows/tmp-maritime-followup-spatial-compile.yml'

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/maritime-person-followup-20260920
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile canonical spatial index
        run: |
          set -euo pipefail
          node scripts/compile-spatial-bindings.mjs
          node scripts/compile-spatial-bindings.mjs --check
      - name: Commit generated canonical artifact
        run: |
          set -euo pipefail
          if git diff --quiet -- atlas-polity-spatial-index.json; then
            echo 'Canonical spatial index already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas-polity-spatial-index.json
          git commit -m 'Spatial: compile maritime pirate reviewed overrides'
          git push origin HEAD:codex/maritime-person-followup-20260920
