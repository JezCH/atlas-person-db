name: Temporary Spatial Compiler 1044

on:
  push:
    branches:
      - agent/spatial-live-debt-france-20260908

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile reviewed Spatial shards
        run: node scripts/compile-spatial-bindings.mjs
      - name: Commit generated canonical index
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- atlas-polity-spatial-index.json; then
            echo "Canonical index already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas-polity-spatial-index.json
          git commit -m "Regenerate Spatial canonical index for France binding"
          git push origin HEAD:agent/spatial-live-debt-france-20260908
