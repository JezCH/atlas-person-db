name: ATLAS P13 Runtime Projection Rehearsal

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime_projection_rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_runtime_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_runtime_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atlas_runtime_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build current Authoring baseline on fresh PostgreSQL
        run: node scripts/verify-schema-baseline.mjs
      - name: Apply and replay Runtime projection schema and compiler
        run: node scripts/verify-runtime-schema-rehearsal.mjs
