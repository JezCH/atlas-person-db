name: ATLAS Batch 23 Candidate Audit

on:
  push:
    branches:
      - agent/spacetime-polity-placement-batch-23-audit

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist formal-looking current unmapped polity candidates
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://atlas-person-db.vercel.app/api/atlas-read?__atlas_read_surface=person' -o /tmp/persons.json
          mkdir -p tmp
          node <<'NODE'
          const fs = require('node:fs');
          const index = JSON.parse(fs.readFileSync('atlas-polity-spatial-index.json','utf8'));
          const body = JSON.parse(fs.readFileSync('/tmp/persons.json','utf8'));
          const map = new Map();
          for (const person of body.persons || []) {
            for (const a of person.activity_summaries || []) {
              const p = a.polity;
              if (!p?.id || index.polity_geography[p.id]) continue;
              const row = map.get(p.id) || { id:p.id, name_en:p.canonical_name_en || '', name_ko:p.preferred_name_ko || '', activities:0, persons:new Set() };
              row.activities += 1;
              row.persons.add(person.display_name || person.canonical_name_en || person.id);
              map.set(p.id,row);
            }
          }
          const formal = /(kingdom|republic|state|sultanate|emirate|county|duchy|principality|khanate|caliphate|confederation|federation|protectorate|colony|commonwealth|empire|domain|government|territory|regency|chiefdom|kingdom|grand duchy|electorate|bishopric|margraviate|landgraviate|shogunate|dynasty|clan|league|union)/i;
          const rows = [...map.values()]
            .filter(r => formal.test(r.name_en))
            .map(r => ({id:r.id,name_en:r.name_en,name_ko:r.name_ko,activities:r.activities,person_count:r.persons.size,sample_persons:[...r.persons].slice(0,4)}))
            .sort((a,b)=>a.name_en.localeCompare(b.name_en))
            .slice(0,180);
          fs.writeFileSync('tmp/batch23-formal-unmapped.json', JSON.stringify({generated_at:new Date().toISOString(),count:rows.length,rows},null,2)+'\n');
          NODE
      - name: Commit audit result and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/atlas-batch23-candidate-audit.yml
          git add tmp/batch23-formal-unmapped.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Persist batch 23 formal unmapped polity audit'
          git push origin HEAD:agent/spacetime-polity-placement-batch-23-audit
