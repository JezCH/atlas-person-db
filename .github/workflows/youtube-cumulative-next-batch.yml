name: YouTube cumulative scalable next batch
on:
  workflow_dispatch:
    inputs:
      next_batch:
        description: "Next cumulative batch number (e.g., 21, 22)"
        required: true
        default: "21"
        type: string
      prior_run_id:
        description: "GitHub run ID holding the immediately preceding validated cumulative corpus"
        required: true
        default: "37889630942"
        type: string
      prior_artifact_name:
        description: "Immediately preceding cumulative artifact name"
        required: true
        default: "youtube-cumulative-batch020-validated"
        type: string
  push:
    branches: [main]
    paths: ['.github/workflows/youtube-cumulative-next-batch.yml']
  pull_request:
    branches: [main]
    paths:
      - 'scripts/youtube-continue-batch018.py'
      - 'tests/test_youtube_batch018_continuation.py'
      - '.github/workflows/youtube-cumulative-next-batch.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: youtube-history-collection
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pycountry
      - run: python -m unittest discover -s tests -p test_youtube_batch018_continuation.py -v
  collect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[yt-b021-collect-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      NEXT_BATCH: ${{ inputs.next_batch || '21' }}
      PRIOR_RUN_ID: ${{ inputs.prior_run_id || '37889630942' }}
      PRIOR_ARTIFACT_NAME: ${{ inputs.prior_artifact_name || 'youtube-cumulative-batch020-validated' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PRIOR_ARTIFACT_NAME }}
          run-id: ${{ env.PRIOR_RUN_ID }}
          path: prior
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pycountry yt-dlp
      - name: Validate source corpus, identity, and frontier
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NEXT_BATCH" =~ ^[0-9]{2,3}$ ]] || { echo "INVALID_NEXT_BATCH"; exit 1; }
          python -m unittest discover -s tests -p test_youtube_batch018_continuation.py -v
          python scripts/youtube-build-person-signal-snapshot.py --root prior --output /tmp/atlas-youtube-previous.json --artifact-id 0 --artifact-digest source-artifact-validation
          echo "BATCH_LABEL=$(printf '%03d' "$((10#$NEXT_BATCH))")" >> "$GITHUB_ENV"
          jq -e --arg next "batch$(printf '%03d' "$((10#$NEXT_BATCH))")" '
            .snapshot.source_state.next_batch==$next
            and .snapshot.source_state.channel_ids_persisted==true
            and .snapshot.channel_count>=6908
            and .snapshot.video_count>=1684134
            and (.channels|length)>=7670
          ' /tmp/atlas-youtube-previous.json >/dev/null
      - name: Collect only the next batch and SHA256-verify every previous file
        shell: bash
        run: |
          set -euo pipefail
          python scripts/youtube-continue-batch018.py --batch "$NEXT_BATCH" --root prior --output cumulative --target-new-channels 800 --minimum-success 300 --search-budget 750 --workers 10 --video-limit 500
          python scripts/youtube-build-person-signal-snapshot.py --root cumulative --output /tmp/atlas-youtube-next.json --artifact-id 0 --artifact-digest pending-upload --previous-snapshot /tmp/atlas-youtube-previous.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          prior=json.loads(Path('/tmp/atlas-youtube-previous.json').read_text())
          current=json.loads(Path('/tmp/atlas-youtube-next.json').read_text())
          n=int(os.environ['NEXT_BATCH'])
          old_channels={r['channel_id'] for r in prior['channels']}
          new_channels={r['channel_id'] for r in current['channels']}
          old_signals={r['raw_name'] for r in prior['signals']}
          new_signals={r['raw_name'] for r in current['signals']}
          assert old_channels.issubset(new_channels), 'LOST_EXISTING_CHANNEL'
          assert old_signals.issubset(new_signals), 'LOST_EXISTING_SIGNAL'
          prior_rows={x['raw_name']:x for x in prior['signals']}
          current_rows={x['raw_name']:x for x in current['signals']}
          assert all(current_rows[name]['distinct_channel_count']>=item['distinct_channel_count']
                     and current_rows[name]['video_count']>=item['video_count']
                     for name,item in prior_rows.items()), 'EXISTING_PERSON_EVIDENCE_REGRESSION'
          assert len(new_channels)-len(old_channels)>=300, 'ONLY_TINY_CHANNEL_INCREMENT'
          assert len(new_channels)>len(old_channels), 'NO_NEW_CHANNELS'
          assert current['snapshot']['video_count']>prior['snapshot']['video_count'], 'NO_NEW_VIDEOS'
          assert current['snapshot']['source_state']['next_batch']==f'batch{n+1:03d}', 'BATCH_FRONTIER_MISMATCH'
          summary=json.loads((Path('cumulative')/f'batch{n:03d}-summary.json').read_text())
          assert summary['preserved_prior_files']>6000, 'PREVIOUS_FILE_COVERAGE_INCOMPLETE'
          assert summary['successful']>=300 and summary['supabase_requests']==0, 'COLLECTION_INVALID'
          print(json.dumps({
            'batch':n, 'original_channels':len(old_channels), 'new_channels':len(new_channels),
            'original_videos':prior['snapshot']['video_count'],
            'new_videos':current['snapshot']['video_count'],
            'original_signals':len(old_signals),'new_signals':len(new_signals),
            **summary
          }))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-cumulative-batch${{ env.BATCH_LABEL }}-validated
          path: cumulative/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-batch${{ env.BATCH_LABEL }}-signal-review
          path: /tmp/atlas-youtube-next.json
          if-no-files-found: error
          retention-days: 90
