name: Phase 8C C2 Writer Contract

on:
  pull_request:
    paths:
      - "atlas-v2-writer-contract.js"
      - "tests/atlas-v2-writer-contract.test.mjs"
      - ".github/workflows/phase-8c-c2-writer-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run writer contract tests
        run: node --test tests/atlas-v2-writer-contract.test.mjs
      - name: Verify production isolation
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('atlas-v2-writer-contract.js','utf8');
          const index = fs.readFileSync('index.html','utf8');
          const admin = fs.readFileSync('admin.html','utf8');
          const failures = [];
          if (!src.includes('STATE_DISABLED')) failures.push('disabled state missing');
          if (!src.includes('STATE_ISOLATED')) failures.push('isolated state missing');
          if (src.includes('.from(') || src.includes('.rpc(')) failures.push('writer contract contains direct database API');
          if (index.includes('atlas-v2-writer-contract.js')) failures.push('writer contract loaded by production index');
          if (admin.includes('atlas-v2-writer-contract.js')) failures.push('writer contract loaded by admin');
          if (src.includes('dual-write') || src.includes('v2-only')) failures.push('unauthorized production mode present');
          fs.mkdirSync('migration/phase-8/tmp/phase8c-c2-writer-contract',{recursive:true});
          const report = {
            marker:'PHASE_8C_C2_WRITER_CONTRACT',
            default_state:'disabled',
            production_loaded:false,
            direct_db_api:false,
            live_v2_commit_authorized:false,
            failures,
            pass:failures.length===0
          };
          fs.writeFileSync('migration/phase-8/tmp/phase8c-c2-writer-contract/verification.json', JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          if (failures.length) process.exit(2);
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-8c-c2-writer-contract-${{ github.sha }}
          path: migration/phase-8/tmp/phase8c-c2-writer-contract
          if-no-files-found: error
          retention-days: 90
