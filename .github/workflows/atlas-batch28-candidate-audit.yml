name: ATLAS Batch 28 Candidate Audit

on:
  push:
    branches:
      - agent/spacetime-polity-placement-batch-28

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch current Production person list and persist unmapped polity candidates
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://atlas-person-db.vercel.app/api/atlas-read?__atlas_read_surface=person' -o /tmp/persons.json
          mkdir -p tmp
          node <<'NODE'
          const fs = require('node:fs');
          const index = JSON.parse(fs.readFileSync('atlas-polity-spatial-index.json','utf8'));
          const body = JSON.parse(fs.readFileSync('/tmp/persons.json','utf8'));
          const map = new Map();
          let activityCount = 0;
          for (const person of body.persons || []) {
            for (const a of person.activity_summaries || []) {
              activityCount += 1;
              const p = a.polity;
              if (!p?.id || index.polity_geography[p.id]) continue;
              const row = map.get(p.id) || {
                id:p.id,
                name_en:p.canonical_name_en || null,
                name_ko:p.preferred_name_ko || null,
                activities:0,
                persons:new Set()
              };
              row.activities += 1;
              row.persons.add(person.display_name || person.canonical_name_en || person.id);
              map.set(p.id,row);
            }
          }
          const rows = [...map.values()].map(r => ({
            id:r.id,
            name_en:r.name_en,
            name_ko:r.name_ko,
            activities:r.activities,
            person_count:r.persons.size,
            sample_persons:[...r.persons].slice(0,4)
          })).sort((a,b)=>(a.name_en||a.id).localeCompare(b.name_en||b.id));
          fs.writeFileSync('tmp/batch28-unmapped.json', JSON.stringify({
            generated_at:new Date().toISOString(),
            person_count:(body.persons||[]).length,
            activity_count:activityCount,
            current_geography_count:Object.keys(index.polity_geography).length,
            current_subregion_count:Object.keys(index.polity_subregions || {}).length,
            unmapped_polity_count:rows.length,
            rows
          }, null, 2) + '\n');
          console.log('UNMAPPED_POLITY_COUNT', rows.length);
          NODE
      - name: Commit audit result and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/atlas-batch28-candidate-audit.yml
          git add tmp/batch28-unmapped.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Persist batch 28 unmapped polity audit'
          git push origin HEAD:agent/spacetime-polity-placement-batch-28
