name: ATLAS Person Domain v2 Final Cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-person-domain-v2-cutover.yml'
      - 'contracts/person-domain-v2-final-cutover.json'
      - 'server/atlas-person-domain-v2-cutover-service.js'
      - 'server/atlas-person-domain-v2-cutover-handler.js'
      - 'server/atlas-person-domain-v2-cutover-github-oidc.js'
      - 'server/atlas-person-domain-service.js'
      - 'server/atlas-person-domain-handler.js'
      - 'atlas-person-domain-registry.js'
      - 'api/atlas-mutate.js'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-person-domain-v2-final-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CUTOVER_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-person-domain-v2-cutover
      DOMAIN_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-person-domain
      RUNTIME_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-read?__atlas_read_surface=runtime-identity
      CUTOVER_AUDIENCE: atlas-person-domain-v2-cutover
      EVIDENCE_DIR: artifacts/person-domain-v2-cutover
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate cutover implementation
        shell: bash
        run: |
          set -euo pipefail
          node --check server/atlas-person-domain-v2-cutover-service.js
          node --check server/atlas-person-domain-v2-cutover-handler.js
          node --check server/atlas-person-domain-v2-cutover-github-oidc.js
          node --test tests/atlas-person-domain-v2-cutover.test.mjs tests/atlas-person-domain-service.test.mjs

      - name: Wait for exact Production cutover runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error --output "$EVIDENCE_DIR/preflight.json" --write-out '%{http_code}' "$CUTOVER_ENDPOINT")"
            if [[ "$status" == "200" ]] && jq -e --arg sha "$GITHUB_SHA" '.ok==true and .runtime_sha==$sha and (.state.ready_for_cutover==true or .state.cutover_complete==true)' "$EVIDENCE_DIR/preflight.json" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          cat "$EVIDENCE_DIR/preflight.json" >&2 || true
          exit 1

      - name: Acquire dedicated cutover OIDC token
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl --fail-with-body --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$CUTOVER_AUDIENCE" | jq -er '.value')"
          echo "::add-mask::$token"
          echo "CUTOVER_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Execute exact atomic v2 cutover
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $CUTOVER_OIDC_TOKEN" \
            -H 'content-type: application/json' \
            --data "$(jq -cn --arg sha "$GITHUB_SHA" '{workflow_sha:$sha}')" \
            "$CUTOVER_ENDPOINT" | tee "$EVIDENCE_DIR/cutover.json"
          jq -e '.ok==true and .state.committed==true and .state.after.cutover_complete==true and (.state.after.knowledge_ids | length)==0 and (.state.after.unsupported | length)==0 and .state.after.constraint.v2==true and .state.after.constraint.validated==true' "$EVIDENCE_DIR/cutover.json" >/dev/null

      - name: Verify public v2 readback
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "$DOMAIN_ENDPOINT" | tee "$EVIDENCE_DIR/domain.json"
          jq -e '.ok==true and .marker=="ATLAS_PERSON_REPRESENTATIVE_DOMAIN_V2" and .schema=="atlas-person-domain/v2" and (.assigned | type=="number") and (.counts | type=="object") and ((.counts.knowledge // 0)==0) and ([.definitions[].code] == ["governance","military","science","technology","commerce","culture","religion","exploration"]) and (([.counts.governance,.counts.military,.counts.science,.counts.technology,.counts.commerce,.counts.culture,.counts.religion,.counts.exploration] | add)==.assigned)' "$EVIDENCE_DIR/domain.json" >/dev/null
          curl --fail-with-body --silent --show-error "$RUNTIME_ENDPOINT" | tee "$EVIDENCE_DIR/runtime.json"
          jq -e --arg sha "$GITHUB_SHA" '.identity.git_commit_sha==$sha and .identity.environment=="production"' "$EVIDENCE_DIR/runtime.json" >/dev/null

      - name: Upload immutable cutover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-person-domain-v2-cutover-${{ github.sha }}
          path: artifacts/person-domain-v2-cutover
          if-no-files-found: error
          retention-days: 90
