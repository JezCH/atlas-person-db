name: Phase 8C C4 Reconciliation Convergence

on:
  pull_request:
    paths:
      - "atlas-v2-command-planner.js"
      - "atlas-reconciliation-bootstrap.js"
      - "server/atlas-mutation-service.js"
      - "tests/atlas-reconciliation-convergence.test.mjs"
      - "tests/phase8c-c6-direct-normalized-read-activation.test.mjs"
      - ".github/workflows/phase-8c-c4-reconciliation-convergence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run reconciliation historical contract or C6 retirement successor
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'retired-from-page-load' atlas-reconciliation-bootstrap.js; then
            node --test tests/phase8c-c6-direct-normalized-read-activation.test.mjs
          else
            node --test tests/atlas-reconciliation-convergence.test.mjs tests/atlas-server-mutation-service.test.mjs tests/atlas-v2-command-planner.test.mjs
            grep -n 'state: "dry-run"' atlas-reconciliation-bootstrap.js
            ! grep -n 'state: "legacy-commit"' atlas-reconciliation-bootstrap.js
            ! grep -nE '\.(insert|update|delete)\(' atlas-reconciliation-bootstrap.js
            grep -n 'operation === "reconcile"' server/atlas-mutation-service.js
            grep -n 'executePlannedMutation' server/atlas-mutation-service.js
            grep -n 'reconciliation_steps' atlas-v2-command-planner.js
          fi
