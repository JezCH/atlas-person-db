name: Linear Spatial B52-B53 One-Shot

on:
  push:
    branches:
      - linear/spatial-b52-b53-superbatch

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply exact reviewed B52-B53 payload
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const indexPath = 'atlas-polity-spatial-index.json';
          const coveragePath = 'tests/person-spacetime-spatial-index-coverage.test.mjs';
          const taxonomyPath = 'tests/spacetime-taxonomy-migration.test.mjs';

          const exact = [
            ['55407a83-2e02-4ea1-898a-c55bc06da69e','west-asia','anatolia'],
            ['bf524697-dd2b-4381-b413-2b6e776453d0','europe','balkans'],
            ['de7f98f0-8328-46d9-80a2-44482453cc88','europe','northern-europe'],
            ['ae3fdc04-1fc0-45b0-8dc2-1a8ecadb8e0d','europe','britain-ireland'],
            ['665c8579-8e59-4787-bd80-1f208045927a','europe','central-europe'],
            ['30efce91-95bb-483a-871d-7b4b4c98ab14','europe','central-europe'],
            ['0c0eb202-5ff6-4280-b664-7764731b508b','east-asia','china'],
            ['613edab4-4903-4f1e-966c-9584f7cd259b','europe','balkans'],
            ['b157d3a1-42fa-4360-a14e-5956de4f9be5','europe','britain-ireland'],
            ['7f02c1d7-e015-418d-9cea-5e860cf3d214','europe','iberia'],
            ['f5c5c3cd-d71b-454a-9a54-98b1b62c5db4','east-asia','china'],
            ['4c976fac-e937-4595-9c7e-0c076c2fb138','southeast-asia','mainland-southeast-asia'],
            ['2fc0442f-1d70-4e7e-9b31-6028ed4bd6cd','east-asia','japan'],
            ['bf8dea9e-a39d-4251-9ccb-25259ecb3acb','east-asia','japan'],
            ['2faaf05f-7144-4195-abc8-55c7db869ffe','east-asia','japan'],
            ['5771f3d5-269e-4b06-adaa-64b096c835ba','east-asia','china'],
            ['98555f36-15aa-4985-8d48-1106c65efd1f','west-asia','iranian-plateau'],
            ['9e475189-82e1-48f1-b4b9-01fe47ac3343','europe','balkans'],
            ['9d274c63-5ef9-4873-9d86-f9ee800e33a4','europe','central-europe'],
            ['e51eaf7b-4dad-4edd-9939-9fefc98198ea','europe','central-europe'],
          ];

          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          if (Object.keys(index.polity_geography).length !== 847 || Object.keys(index.polity_subregions).length !== 821) {
            throw new Error(`unexpected baseline ${Object.keys(index.polity_geography).length}/${Object.keys(index.polity_subregions).length}`);
          }
          for (const [id, region, subregion] of exact) {
            if (Object.hasOwn(index.polity_geography, id) || Object.hasOwn(index.polity_subregions, id)) {
              throw new Error(`payload UUID already present: ${id}`);
            }
            index.polity_geography[id] = region;
            index.polity_subregions[id] = subregion;
          }
          if (Object.keys(index.polity_geography).length !== 867 || Object.keys(index.polity_subregions).length !== 841) {
            throw new Error('post-apply count mismatch');
          }
          fs.writeFileSync(indexPath, JSON.stringify(index, null, 2) + '\n');

          let coverage = fs.readFileSync(coveragePath, 'utf8');
          const oldCoverage = coverage;
          coverage = coverage.replace('assert.equal(Object.keys(index.polity_geography).length, 847);', 'assert.equal(Object.keys(index.polity_geography).length, 867);');
          coverage = coverage.replace('assert.equal(Object.keys(index.polity_subregions).length, 821);', 'assert.equal(Object.keys(index.polity_subregions).length, 841);');
          if (coverage === oldCoverage || coverage.includes('length, 847') || coverage.includes('length, 821')) throw new Error('coverage locks not patched exactly');
          fs.writeFileSync(coveragePath, coverage);

          let taxonomy = fs.readFileSync(taxonomyPath, 'utf8');
          const oldTaxonomy = taxonomy;
          taxonomy = taxonomy.replace('  anatolia: 8,', '  anatolia: 9,');
          taxonomy = taxonomy.replace('assert.equal(Object.keys(index.polity_subregions).length, 821);', 'assert.equal(Object.keys(index.polity_subregions).length, 841);');
          if (taxonomy === oldTaxonomy || taxonomy.includes('  anatolia: 8,') || taxonomy.includes('length, 821')) throw new Error('taxonomy locks not patched exactly');
          fs.writeFileSync(taxonomyPath, taxonomy);
          NODE
      - name: Validate exact spatial delta
        run: node --test tests/person-spacetime-spatial-index-coverage.test.mjs tests/spacetime-taxonomy-migration.test.mjs
      - name: Commit exact three-file delta
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas-polity-spatial-index.json tests/person-spacetime-spatial-index-coverage.test.mjs tests/spacetime-taxonomy-migration.test.mjs
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "[spatial] Apply reviewed B52-B53 superbatch"
          git push origin HEAD:${{ github.ref_name }}
