name: YouTube Batch010 Staging

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/youtube-batch010-staging.yml"
      - "scripts/youtube-batch010-staging.py"

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download batch008 artifact
        uses: actions/download-artifact@v4
        with:
          name: youtube-batch008-staging
          path: prior/batch008
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37575099033

      - name: Download batch009 artifact
        uses: actions/download-artifact@v4
        with:
          name: youtube-batch009-staging
          path: prior/batch009
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37587287988

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector
        run: python -m pip install --disable-pip-version-check yt-dlp

      - name: Collect staging batch
        run: python scripts/youtube-batch010-staging.py

      - name: Upload long-retention staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-batch010-staging-longterm
          path: |
            out/youtube-batch010
            prior/batch008
            prior/batch009
          if-no-files-found: error
          retention-days: 90
