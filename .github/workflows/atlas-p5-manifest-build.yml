name: ATLAS P5 Manifest Build

on:
  pull_request:
    paths:
      - 'stage2/authoring/p5-*.json'
      - 'stage2/execution/p6-execution-identity-allocations.v1.json'
      - 'stage2/integration/baseline-a-politic-resolution-amendments.v1.json'
      - 'scripts/build-stage2-p5-reviewed-identity-source-authoring.mjs'
      - '.github/workflows/atlas-p5-manifest-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact reviewed P5 authoring manifest
        run: |
          mkdir -p artifacts
          node scripts/build-stage2-p5-reviewed-identity-source-authoring.mjs --write artifacts/p5-reviewed-identity-source-authoring.v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-p5-manifest-${{ github.sha }}
          path: artifacts/p5-reviewed-identity-source-authoring.v1.json
          if-no-files-found: error
          retention-days: 30
