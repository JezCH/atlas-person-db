name: ATLAS Integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atlas_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax check active JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find api server scripts -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
          for f in atlas-*.js admin.js app.js asset-loader.js; do test -f "$f" && node --check "$f"; done

      - name: Run complete test suite
        id: complete-tests
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap tests/*.test.mjs 2>&1 | tee atlas-test-results.tap

      - name: Upload test failure diagnostics
        if: failure() && steps.complete-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-test-failure-${{ github.sha }}
          path: atlas-test-results.tap
          if-no-files-found: error
          retention-days: 7

      - name: Verify requirements source of truth
        run: npm run test:requirements

      - name: Verify Vercel-minimized release governance
        run: npm run test:release

      - name: Verify R0 future semantic equivalence
        run: npm run test:r0-gate

      - name: Verify Stage 2 Baseline A integration prep
        run: npm run test:stage2-prep

      - name: Verify current Stage 2 machine-readable domain contract
        run: npm run test:stage2-contract

      - name: Download exact Train 1 Baseline A artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/baseline-a-source
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9135783402/zip" \
            -o artifacts/baseline-a-source.zip
          echo "9f345256859f1605942e36402b135721b631afcaf5863928f1347aa7ea2848dd  artifacts/baseline-a-source.zip" | sha256sum --check --strict
          unzip -q artifacts/baseline-a-source.zip -d artifacts/baseline-a-source
          test -f artifacts/baseline-a-source/atlas-correction-evidence/baseline-a.json
          cp artifacts/baseline-a-source/atlas-correction-evidence/baseline-a.json artifacts/baseline-a-source.json

      - name: Validate Baseline A v2 capture
        run: npm run test:stage2-baseline-a

      - name: Generate fresh Baseline A Stage 2 ledger and work queues
        id: baseline-ledger
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run test:stage2-baseline-a-ledger 2>&1 | tee artifacts/stage2-baseline-a-ledger.log

      - name: Build effective politic-resolution frontier
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-stage2-baseline-a-effective-p5p6-frontier.mjs
          node scripts/verify-stage2-baseline-a-effective-p5p6-frontier.mjs

      - name: Upload Baseline A ledger failure diagnostics
        if: failure() && steps.baseline-ledger.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-stage2-baseline-a-ledger-failure-${{ github.sha }}
          path: artifacts/stage2-baseline-a-ledger.log
          if-no-files-found: error
          retention-days: 7

      - name: Verify Correction v2 prebinding Batch 2
        run: node scripts/verify-stage2-correction-v2-prebinding-batch2.mjs

      - name: Upload Baseline A Stage 2 integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: atlas-stage2-baseline-a-integration-${{ github.sha }}
          path: |
            artifacts/stage2-baseline-a-intake.json
            artifacts/stage2-baseline-a-master-ledger.json
            artifacts/stage2-baseline-a-master-ledger-summary.json
            artifacts/stage2-baseline-a-work-queues.json
            artifacts/stage2-baseline-a-work-queues-summary.json
            artifacts/stage2-baseline-a-person-duplicate-candidates.json
            artifacts/stage2-baseline-a-p5p6-execution-manifest.json
            artifacts/stage2-baseline-a-effective-p5p6-frontier.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify runtime architecture
        run: npm run test:runtime

      - name: Rebuild current v2 schema on fresh PostgreSQL
        run: npm run test:schema

      - name: Rehearse additive Stage 2 schema on current v2 baseline
        run: npm run test:stage2-schema-rehearsal

      - name: Rehearse normalized Stage 2 provenance
        run: npm run test:stage2-provenance-rehearsal

      - name: Rehearse Stage 2 entity boundaries and naming
        run: npm run test:stage2-entity-boundaries

      - name: Rehearse Activity semantic-key v2 replacement
        run: npm run test:stage2-semantic-key-rehearsal

      - name: Rehearse P5 additive schema release candidate and exact replay
        id: p5-schema-release
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          node scripts/rehearse-stage2-p5-additive-schema-release.mjs 2>&1 | tee artifacts/stage2-p5-schema-release.log

      - name: Upload P5 schema release failure diagnostics
        if: failure() && steps.p5-schema-release.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-stage2-p5-schema-release-failure-${{ github.sha }}
          path: artifacts/stage2-p5-schema-release.log
          if-no-files-found: error
          retention-days: 7

      - name: Rehearse exact reviewed P5 identity and Source authoring
        id: p5-entity-authoring
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          node scripts/rehearse-stage2-p5-reviewed-entity-authoring.mjs 2>&1 | tee artifacts/stage2-p5-entity-authoring.log

      - name: Upload P5 entity authoring failure diagnostics
        if: failure() && steps.p5-entity-authoring.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-stage2-p5-entity-authoring-failure-${{ github.sha }}
          path: artifacts/stage2-p5-entity-authoring.log
          if-no-files-found: error
          retention-days: 7
