name: ATLAS Integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check active JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find api server -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
          for f in atlas-*.js admin.js app.js asset-loader.js; do test -f "$f" && node --check "$f"; done
      - name: Run complete test suite
        run: node --test tests/*.test.mjs
