name: ATLAS Integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atlas_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax check active JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find api server scripts -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
          for f in atlas-*.js admin.js app.js asset-loader.js; do test -f "$f" && node --check "$f"; done

      - name: Run complete test suite
        id: complete-tests
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap tests/*.test.mjs 2>&1 | tee atlas-test-results.tap

      - name: Upload test failure diagnostics
        if: failure() && steps.complete-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-test-failure-${{ github.sha }}
          path: atlas-test-results.tap
          if-no-files-found: error
          retention-days: 7

      - name: Verify runtime architecture
        run: npm run test:runtime

      - name: Rebuild current v2 schema on fresh PostgreSQL
        run: npm run test:schema

      - name: Verify Stage 2 domain contract
        run: node scripts/verify-stage2-domain-contract.mjs

      - name: Rehearse Stage 2 semantic schema
        run: node scripts/verify-stage2-schema-blueprint.mjs

      - name: Build current polity semantic master ledger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors \
            https://atlas-person-db.vercel.app/api/atlas-read \
            --output artifacts/atlas-audit-live-input.json
          node scripts/build-polity-semantic-master-ledger.mjs \
            --snapshot artifacts/atlas-audit-live-input.json \
            --out artifacts/polity-semantic-master-ledger.json \
            --summary artifacts/polity-semantic-master-ledger-summary.json

      - name: Derive Stage 2 work queues
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-stage2-work-queues.mjs \
            --ledger artifacts/polity-semantic-master-ledger.json \
            --out artifacts/stage2-work-queues.json \
            --summary artifacts/stage2-work-queues-summary.json

      - name: Audit Person-Polity relation semantics
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-relation-semantics-audit.mjs \
            --ledger artifacts/polity-semantic-master-ledger.json \
            --out artifacts/relation-semantics-audit.json \
            --summary artifacts/relation-semantics-audit-summary.json

      - name: Gate Relation backfill readiness
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-relation-backfill-readiness.mjs \
            --relation-audit artifacts/relation-semantics-audit.json \
            --out artifacts/relation-backfill-readiness.json \
            --summary artifacts/relation-backfill-readiness-summary.json

      - name: Close source-backed direct Relation review
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-direct-relation-review.mjs \
            --readiness artifacts/relation-backfill-readiness.json \
            --out artifacts/direct-relation-review.json \
            --summary artifacts/direct-relation-review-summary.json

      - name: Audit Governance Context semantics
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-governance-context-audit.mjs \
            --ledger artifacts/polity-semantic-master-ledger.json \
            --out artifacts/governance-context-audit.json \
            --summary artifacts/governance-context-audit-summary.json

      - name: Audit Polity-to-Polity relation semantics
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-polity-relation-audit.mjs \
            --ledger artifacts/polity-semantic-master-ledger.json \
            --out artifacts/polity-relation-audit.json \
            --summary artifacts/polity-relation-audit-summary.json

      - name: Audit Polity identity and continuity semantics
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-polity-identity-audit.mjs \
            --ledger artifacts/polity-semantic-master-ledger.json \
            --out artifacts/polity-identity-audit.json \
            --summary artifacts/polity-identity-audit-summary.json

      - name: Audit shared temporal interval semantics
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-temporal-contract-audit.mjs \
            --ledger artifacts/polity-semantic-master-ledger.json \
            --out artifacts/temporal-contract-audit.json \
            --summary artifacts/temporal-contract-audit-summary.json

      - name: Build Stage 2 Production migration preflight
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-stage2-preflight.mjs \
            --master-summary artifacts/polity-semantic-master-ledger-summary.json \
            --relation-summary artifacts/relation-semantics-audit-summary.json \
            --readiness-summary artifacts/relation-backfill-readiness-summary.json \
            --direct-summary artifacts/direct-relation-review-summary.json \
            --governance-summary artifacts/governance-context-audit-summary.json \
            --polity-relation-summary artifacts/polity-relation-audit-summary.json \
            --polity-identity-summary artifacts/polity-identity-audit-summary.json \
            --temporal-summary artifacts/temporal-contract-audit-summary.json \
            --out artifacts/stage2-preflight.json \
            --summary artifacts/stage2-preflight-summary.json

      - name: Upload polity semantic master ledger evidence
        uses: actions/upload-artifact@v4
        with:
          name: atlas-polity-semantic-master-ledger-${{ github.sha }}
          path: |
            artifacts/polity-semantic-master-ledger.json
            artifacts/polity-semantic-master-ledger-summary.json
            artifacts/stage2-work-queues.json
            artifacts/stage2-work-queues-summary.json
            artifacts/relation-semantics-audit.json
            artifacts/relation-semantics-audit-summary.json
            artifacts/relation-backfill-readiness.json
            artifacts/relation-backfill-readiness-summary.json
            artifacts/direct-relation-review.json
            artifacts/direct-relation-review-summary.json
            artifacts/governance-context-audit.json
            artifacts/governance-context-audit-summary.json
            artifacts/polity-relation-audit.json
            artifacts/polity-relation-audit-summary.json
            artifacts/polity-identity-audit.json
            artifacts/polity-identity-audit-summary.json
            artifacts/temporal-contract-audit.json
            artifacts/temporal-contract-audit-summary.json
            artifacts/stage2-preflight.json
            artifacts/stage2-preflight-summary.json
          if-no-files-found: error
          retention-days: 7
