name: ATLAS Integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Validation runs are replaceable. A newer commit on the same PR/ref makes the
# older validation result obsolete, unlike Production mutation workflows.
concurrency:
  group: atlas-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      registration: ${{ steps.classify.outputs.registration }}
      governance: ${{ steps.classify.outputs.governance }}
      ui: ${{ steps.classify.outputs.ui }}
      full: ${{ steps.classify.outputs.full }}
      base_sha: ${{ steps.range.outputs.base_sha }}
      head_sha: ${{ steps.range.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: range
        name: Resolve changed commit range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base_sha=''
          head_sha="$HEAD_SHA"

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              ;;
            push)
              base_sha="$PUSH_BEFORE_SHA"
              ;;
            workflow_dispatch)
              # Manual integrity runs are deliberately conservative and use the
              # full lane because there is no natural change range to optimize.
              ;;
          esac

          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ || "$base_sha" =~ ^0{40}$ ]]; then
            base_sha=''
          elif ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha=''
          fi

          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            head_sha=''
          fi

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - id: classify
        name: Classify durable dependency impacts
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/atlas-changed.txt
          base_sha='${{ steps.range.outputs.base_sha }}'
          head_sha='${{ steps.range.outputs.head_sha }}'

          if [[ -n "$base_sha" && -n "$head_sha" ]]; then
            git diff --name-only --diff-filter=ACMRTUXB "$base_sha" "$head_sha" -- > /tmp/atlas-changed.txt
          fi

          cat /tmp/atlas-changed.txt
          node scripts/classify-ci-impact.mjs < /tmp/atlas-changed.txt >> "$GITHUB_OUTPUT"

  registration_validation:
    needs: classify
    if: needs.classify.outputs.registration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate changed registration data
        shell: bash
        run: |
          set -euo pipefail
          base_sha='${{ needs.classify.outputs.base_sha }}'
          head_sha='${{ needs.classify.outputs.head_sha }}'
          [[ -n "$base_sha" && -n "$head_sha" ]]

          mapfile -t manifests < <(git diff --name-only --diff-filter=ACMRTUXB "$base_sha" "$head_sha" -- 'authoring/requests/*.json')
          if [[ "${#manifests[@]}" -gt 0 ]]; then
            node scripts/validate-authoring-request-files.mjs "${manifests[@]}"
          fi

          if git diff --name-only --diff-filter=ACMRTUXB "$base_sha" "$head_sha" -- | grep -qx 'non-timeline-persons.json'; then
            node scripts/validate-non-timeline-persons.mjs non-timeline-persons.json
          fi

  governance_validation:
    needs: classify
    if: needs.classify.outputs.governance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate current requirements and release governance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-atlas-requirements.mjs
          node scripts/verify-release-governance.mjs

  ui_validation:
    needs: classify
    if: needs.classify.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check changed UI JavaScript
        shell: bash
        run: |
          set -euo pipefail
          base_sha='${{ needs.classify.outputs.base_sha }}'
          head_sha='${{ needs.classify.outputs.head_sha }}'
          [[ -n "$base_sha" && -n "$head_sha" ]]

          while IFS= read -r path; do
            case "$path" in
              *.js|*.mjs|*.cjs)
                [[ -f "$path" ]] && node --check "$path"
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMRTUXB "$base_sha" "$head_sha" --)
      - name: Run focused UI contract tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' tests_to_run < <(find tests -maxdepth 1 -type f \( \
            -name '*ui*.test.mjs' -o \
            -name '*spacetime*.test.mjs' -o \
            -name '*browser*.test.mjs' -o \
            -name '*presentation*.test.mjs' -o \
            -name '*table*.test.mjs' -o \
            -name '*era*.test.mjs' \
          \) -print0)
          if [[ "${#tests_to_run[@]}" -gt 0 ]]; then
            node --test "${tests_to_run[@]}"
          else
            echo 'No focused UI contract tests found; syntax checks are the applicable gate.'
          fi

  full_test:
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atlas_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax check active JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find api server scripts -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
          for f in atlas-*.js admin.js app.js asset-loader.js; do test -f "$f" && node --check "$f"; done

      - name: Run complete current test suite
        id: complete-tests
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap tests/*.test.mjs 2>&1 | tee atlas-test-results.tap

      - name: Upload test failure diagnostics
        if: failure() && steps.complete-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-test-failure-${{ github.sha }}
          path: atlas-test-results.tap
          if-no-files-found: error
          retention-days: 7

      - name: Verify current requirements source of truth
        run: npm run test:requirements

      - name: Verify current release governance
        run: npm run test:release

      - name: Verify current Stage 2 domain contract
        run: npm run test:stage2-contract

      - name: Verify runtime architecture
        run: npm run test:runtime

      - name: Rebuild current v2 schema on fresh PostgreSQL
        run: npm run test:schema

  test:
    name: test
    needs: [classify, registration_validation, governance_validation, ui_validation, full_test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce every selected integrity lane
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ needs.classify.result }}" == "success" ]] || { echo 'Impact classification failed.' >&2; exit 1; }

          registration='${{ needs.classify.outputs.registration }}'
          governance='${{ needs.classify.outputs.governance }}'
          ui='${{ needs.classify.outputs.ui }}'
          full='${{ needs.classify.outputs.full }}'

          [[ "$registration" == 'true' || "$governance" == 'true' || "$ui" == 'true' || "$full" == 'true' ]] || {
            echo 'Classifier selected no integrity lane.' >&2
            exit 1
          }

          if [[ "$registration" == 'true' ]]; then
            [[ "${{ needs.registration_validation.result }}" == 'success' ]] || { echo 'Registration validation failed.' >&2; exit 1; }
          fi
          if [[ "$governance" == 'true' ]]; then
            [[ "${{ needs.governance_validation.result }}" == 'success' ]] || { echo 'Governance validation failed.' >&2; exit 1; }
          fi
          if [[ "$ui" == 'true' ]]; then
            [[ "${{ needs.ui_validation.result }}" == 'success' ]] || { echo 'UI validation failed.' >&2; exit 1; }
          fi
          if [[ "$full" == 'true' ]]; then
            [[ "${{ needs.full_test.result }}" == 'success' ]] || { echo 'Full integrity suite failed.' >&2; exit 1; }
          fi

          echo "Required integrity lanes passed: registration=$registration governance=$governance ui=$ui full=$full"
