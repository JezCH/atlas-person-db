name: ATLAS Authoring Apply

on:
  push:
    branches:
      - main
    paths:
      - 'authoring/requests/*.json'
      - '.github/workflows/atlas-authoring-apply.yml'
      - '.github/atlas-authoring-preflight.txt'
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Path under authoring/requests/ (required unless bootstrap_only=true)'
        required: false
        type: string
      bootstrap_only:
        description: 'Apply only bounded authoring ledger migrations; do not author Person/Activity data'
        required: true
        default: false
        type: boolean
      audit_all_approved:
        description: 'Read-only preflight of every approved atlas-human-authoring/v1 manifest; never mutate Person/Activity data'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-authoring-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      ATLAS_AUTHORING_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-authoring-apply
      ATLAS_HUMAN_AUTHORING_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-authoring
      ATLAS_PERSON_READ_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-read
      ATLAS_AUTHORING_AUDIENCE: atlas-person-db-authoring
      ATLAS_AUTHORING_TRANSPORT_VERSION: '2'
      ATLAS_PERSON_DOMAIN_V2_CUTOVER_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-person-domain-v2-cutover
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve approved Stage 2 authoring requests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas-authoring-evidence/responses
          : > /tmp/atlas-candidates.txt
          : > /tmp/atlas-manifests.txt
          bootstrap_only=false
          audit_all_approved=false
          preflight_only=false

          if [[ "${{ github.event_name }}" == "push" ]] && git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- | grep -qx '.github/atlas-authoring-preflight.txt'; then
            command="$(tr -d '\r\n' < .github/atlas-authoring-preflight.txt)"
            mode="preflight"
            manifest="$command"
            if [[ "$command" =~ ^(preflight|apply)[[:space:]]+(.+)$ ]]; then
              mode="${BASH_REMATCH[1]}"
              manifest="${BASH_REMATCH[2]}"
            fi
            [[ "$manifest" =~ ^authoring/requests/[A-Za-z0-9._-]+\.json$ ]] || { echo "Rejected bounded authoring manifest path: $manifest" >&2; exit 1; }
            if [[ "$mode" == "preflight" ]]; then
              preflight_only=true
            fi
            printf '%s\n' "$manifest" > /tmp/atlas-candidates.txt
            echo "Trusted ${mode}-only request selected: $manifest"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.audit_all_approved }}" == "true" ]]; then
            [[ "${{ inputs.bootstrap_only }}" != "true" ]] || { echo 'audit_all_approved and bootstrap_only are mutually exclusive' >&2; exit 1; }
            [[ -z "${{ inputs.manifest }}" ]] || { echo 'audit_all_approved does not accept a single manifest' >&2; exit 1; }
            audit_all_approved=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.bootstrap_only }}" == "true" ]]; then
            bootstrap_only=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            [[ -n "${{ inputs.manifest }}" ]] || { echo 'manifest is required unless bootstrap_only=true or audit_all_approved=true' >&2; exit 1; }
            printf '%s\n' "${{ inputs.manifest }}" > /tmp/atlas-candidates.txt
          else
            git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- 'authoring/requests/*.json' > /tmp/atlas-candidates.txt
            # A workflow-only main push is the bounded operator-safe path for re-running the read-only
            # completeness audit; its terminal workflow_run may then trigger the sealed Runtime compile.
            # This path is also the safe recompile trigger after Runtime compiler fixes or a public Runtime-read cutover.
            # Runtime exclusion target ledger rollout also uses this workflow-only sealed recompile path.
            # Greece identity cleanup 2026-09-20: refresh stale Runtime polity projection before orphan retirement.
            # Denmark identity cleanup 2026-09-20: refresh stale Runtime polity projection before orphan retirement.
            # Norway identity cleanup 2026-09-20: refresh stale Runtime polity projection before orphan retirement.
            # France identity cleanup 2026-09-21: refresh stale Runtime polity projection before orphan retirement.
            # Source provenance backfill 2026-09-24: refresh Runtime provenance snapshots after Correction Apply added normalized Activity sources.
            # Song Zhenzong registration 2026-09-24: refresh Runtime after committed Authoring write raced with a newer main deployment.
            # SSS+ Person batch 01 registration 2026-09-24: refresh Runtime after 8 committed Authoring Activities await Runtime projection.
            # It may also be used to record a no-content-change Runtime activation for activation-history verification.
            if [[ ! -s /tmp/atlas-candidates.txt ]] && git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- | grep -qx '.github/workflows/atlas-authoring-apply.yml'; then
              audit_all_approved=true
              echo 'Workflow-only change selected the trusted read-only completeness audit instead of replaying a historical batch.'
            fi
          fi

          while IFS= read -r manifest; do
            [[ -n "$manifest" ]] || continue
            [[ "$manifest" =~ ^authoring/requests/[A-Za-z0-9._-]+\.json$ ]] || { echo "Rejected manifest path: $manifest" >&2; exit 1; }
            schema="$(jq -r '.schema // ""' "$manifest")"
            if [[ "$schema" == "atlas-authoring-manifest/v2" ]]; then
              jq -e '
                .review_status == "approved"
                and (.person.life_status == "deceased")
                and (.person.life_status_checked_at | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))
                and (.person.life_status_basis | IN("documented_death","historical_certainty"))
                and (.activity.relation_type_id | type == "string")
                and (.activity.period_basis_id | type == "string")
                and (.activity.polity_binding.mode | IN("declared","existing"))
                and (.activity.role_binding.mode | IN("declared","existing","none"))
                and (
                  ((.activity.activity_start | type == "number")
                    and (.activity.activity_start_granularity | type == "string")
                    and (.activity.activity_start_certainty | type == "string")
                    and (.activity.activity_start_calendar | type == "string"))
                  or
                  (.activity.activity_start == null
                    and .activity.activity_start_month == null
                    and .activity.activity_start_day == null
                    and .activity.activity_start_granularity == null
                    and .activity.activity_start_certainty == null
                    and .activity.activity_start_calendar == null)
                )
                and (
                  ((.activity.activity_end | type == "number")
                    and (.activity.activity_end_granularity | type == "string")
                    and (.activity.activity_end_certainty | type == "string")
                    and (.activity.activity_end_calendar | type == "string"))
                  or
                  (.activity.activity_end == null
                    and .activity.activity_end_month == null
                    and .activity.activity_end_day == null
                    and .activity.activity_end_granularity == null
                    and .activity.activity_end_certainty == null
                    and .activity.activity_end_calendar == null
                    and (
                      .activity.chronology_status != "ongoing"
                      or (.activity.ongoing_as_of | type == "string")
                    ))
                )
                and (.activity.person_name == null)
                and (.activity.politic_name == null)
                and (.activity.polity_name == null)
                and (.activity.role == null)
                and (.activity.period_basis == null)
                and (.activity.relation_type == null)
              ' "$manifest" >/dev/null || { echo "Rejected non-native authoring manifest: $manifest" >&2; exit 1; }
            elif [[ "$schema" == "atlas-human-authoring/v1" ]]; then
              jq -e '
                .review_status == "approved"
                and ((.request_id == null) or (.request_id | type == "string" and length > 0))
                and ((.registration_candidate_id == null) or (.registration_candidate_id | type == "string" and length > 0))
                and (.person.canonical_name_en | type == "string" and length > 0)
                and (.person.life_status == "deceased")
                and (.person.life_status_checked_at | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))
                and (.person.life_status_basis | IN("documented_death","historical_certainty"))
                and (.polity.canonical_name_en | type == "string" and length > 0)
                and (.activity.relation_type | IN("rules","governs","serves","active_in","opposes","claims_rule"))
                and (.activity.period_basis | type == "string" and length > 0)
                and (
                  ((.activity.start_year | type == "number")
                    and (.activity.start_certainty | IN("exact","approximate","uncertain")))
                  or
                  (.activity.start_year == null
                    and .activity.start_month == null
                    and .activity.start_day == null
                    and .activity.start_certainty == null
                    and .activity.start_calendar == null)
                )
                and (
                  ((.activity.end_year | type == "number")
                    and (.activity.end_certainty | IN("exact","approximate","uncertain")))
                  or
                  (.activity.end_year == null
                    and .activity.end_month == null
                    and .activity.end_day == null
                    and .activity.end_certainty == null
                    and .activity.end_calendar == null
                    and (
                      .activity.chronology_status != "ongoing"
                      or (.activity.ongoing_as_of | type == "string")
                    ))
                )
                and (.activity.confidence | IN("well_established","likely","speculative","disputed","unknown"))
                and (.sources | type == "array" and length > 0)
                and ((.registration_candidate_id == null) or (.registration_candidate_id | type == "string" and length > 0))
              ' "$manifest" >/dev/null || { echo "Rejected human authoring request: $manifest" >&2; exit 1; }
            elif [[ "$schema" == "atlas-human-person-authoring/v1" ]]; then
              jq -e '
                .review_status == "approved"
                and ((.request_id == null) or (.request_id | type == "string" and length > 0))
                and ((.registration_candidate_id == null) or (.registration_candidate_id | type == "string" and length > 0))
                and (.person.canonical_name_en | type == "string" and length > 0)
                and (.person.display_name_ko | type == "string" and length > 0)
                and (.person.life_status == "deceased")
                and (.person.life_status_checked_at | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))
                and (.person.life_status_basis | IN("documented_death","historical_certainty"))
                and (.timeline_disposition.disposition | IN("chronology_unresolved","legendary","mythical","other_reviewed_exclusion"))
                and (.timeline_disposition.reason | type == "string" and length > 0)
                and (.representative_domain | IN("governance","military","science","technology","commerce","culture","religion","exploration"))
                and (.sources | type == "array" and length > 0)
                and (.external_references.namuwiki.status | IN("linked","not_found"))
                and ((.registration_candidate_id == null) or (.registration_candidate_id | type == "string" and length > 0))
              ' "$manifest" >/dev/null || { echo "Rejected person-only human authoring request: $manifest" >&2; exit 1; }
            else
              echo "Rejected unsupported authoring schema in $manifest: $schema" >&2
              exit 1
            fi
            printf '%s\n' "$manifest" >> /tmp/atlas-manifests.txt
          done < /tmp/atlas-candidates.txt

          sort -u -o /tmp/atlas-manifests.txt /tmp/atlas-manifests.txt
          cp /tmp/atlas-manifests.txt /tmp/atlas-authoring-evidence/manifests.txt
          echo "ATLAS_AUTHORING_BOOTSTRAP_ONLY=${bootstrap_only}" >> "$GITHUB_ENV"
          echo "ATLAS_AUTHORING_AUDIT_ALL_APPROVED=${audit_all_approved}" >> "$GITHUB_ENV"
          echo "ATLAS_AUTHORING_PREFLIGHT_ONLY=${preflight_only}" >> "$GITHUB_ENV"
          if [[ "$audit_all_approved" == "true" ]]; then
            echo 'ATLAS_AUTHORING_SELECTED=true' >> "$GITHUB_ENV"
            echo 'Trusted read-only completeness audit selected.'
          elif [[ "$bootstrap_only" == "true" || -s /tmp/atlas-manifests.txt ]]; then
            echo 'ATLAS_AUTHORING_SELECTED=true' >> "$GITHUB_ENV"
            if [[ "$bootstrap_only" == "true" ]]; then
              echo 'Authoring schema bootstrap-only run selected.'
            else
              cat /tmp/atlas-manifests.txt
            fi
          else
            echo 'ATLAS_AUTHORING_SELECTED=false' >> "$GITHUB_ENV"
            echo 'No approved authoring requests selected.'
          fi

      - name: Wait for exact Production Person Domain v2 cutover
        if: env.ATLAS_AUTHORING_SELECTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error --output /tmp/atlas-person-domain-v2-cutover.json --write-out '%{http_code}' "$ATLAS_PERSON_DOMAIN_V2_CUTOVER_ENDPOINT")"
            if [[ "$status" == "200" ]] && jq -e --arg sha "$GITHUB_SHA" '.ok==true and .runtime_sha==$sha and .state.cutover_complete==true' /tmp/atlas-person-domain-v2-cutover.json >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          cat /tmp/atlas-person-domain-v2-cutover.json >&2 || true
          echo "PERSON_DOMAIN_V2_CUTOVER_NOT_READY" >&2
          exit 1

      - name: Verify deployed authoring runtime readiness
        if: env.ATLAS_AUTHORING_SELECTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          runtime_ready=false
          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error \
              --output /tmp/atlas-authoring-evidence/readiness.json \
              --write-out '%{http_code}' \
              "$ATLAS_AUTHORING_ENDPOINT")"

            if [[ "$status" == "404" ]]; then
              if [[ "$attempt" == "60" ]]; then
                cat /tmp/atlas-authoring-evidence/readiness.json >&2 || true
                echo "Production authoring readiness route is not live yet after 60 attempts." >&2
                exit 1
              fi
              echo "Production authoring readiness route is not live yet (attempt ${attempt}/60); retrying in 5s."
              sleep 5
              continue
            fi

            if [[ "$status" != "200" ]]; then
              cat /tmp/atlas-authoring-evidence/readiness.json >&2 || true
              echo "Authoring readiness failed: HTTP ${status}" >&2
              exit 1
            fi

            jq -e --argjson version "$ATLAS_AUTHORING_TRANSPORT_VERSION" '
              .ok==true
              and .marker=="ATLAS_AUTHORING_TRANSPORT_V2"
              and .transport_version==$version
              and (.runtime_sha | test("^[0-9a-f]{40}$"))
              and .readiness.p5_ready==true
              and .readiness.core.base_tables_ready==true
              and .readiness.core.activity_columns_ready==true
              and .readiness.p9.old_index_present==false
              and .readiness.p9.new_index_present==true
              and .readiness.p9.duplicate_groups==0
              and .readiness.person_merge.required_person_merge_lifecycle_version=="p10-v2-revalidated"
              and (
                (.readiness.person_merge.person_merge_lifecycle_version=="pre-p10-blocked" and .readiness.person_merge.allowed==false)
                or
                (.readiness.person_merge.person_merge_lifecycle_version=="p10-v2-revalidated" and .readiness.person_merge.allowed==true)
              )
              and (.ready==true or .bootstrap_ready==true)
            ' /tmp/atlas-authoring-evidence/readiness.json >/dev/null

            runtime_sha="$(jq -er '.runtime_sha' /tmp/atlas-authoring-evidence/readiness.json)"
            if [[ "${ATLAS_AUTHORING_AUDIT_ALL_APPROVED:-false}" == "true" ]] && ! jq -e '.ready==true' /tmp/atlas-authoring-evidence/readiness.json >/dev/null; then
              echo 'Completeness audit is read-only and requires an already-ready Production authoring runtime.' >&2
              exit 1
            fi
            bootstrap_required="$(jq -er 'if .ready==true then "false" elif .bootstrap_ready==true then "true" else error("AUTHORING_NOT_BOOTSTRAPPABLE") end' /tmp/atlas-authoring-evidence/readiness.json)"
            if [[ "${ATLAS_AUTHORING_AUDIT_ALL_APPROVED:-false}" != "true" ]]; then
              if [[ "${ATLAS_AUTHORING_BOOTSTRAP_ONLY:-false}" == "true" ]]; then
                bootstrap_required=true
              elif ! jq -e '.readiness.core.ongoing_terms_ready==true' /tmp/atlas-authoring-evidence/readiness.json >/dev/null; then
                while IFS= read -r candidate; do
                  if jq -e '.activity.chronology_status=="ongoing"' "$candidate" >/dev/null; then
                    bootstrap_required=true
                    break
                  fi
                done < /tmp/atlas-manifests.txt
              fi
            fi
            if ! git cat-file -e "${runtime_sha}^{commit}" 2>/dev/null; then
              if [[ "${ATLAS_AUTHORING_AUDIT_ALL_APPROVED:-false}" == "true" ]]; then
                git fetch --no-tags --quiet origin main
              fi
            fi
            git cat-file -e "${runtime_sha}^{commit}" || { echo "Deployed runtime commit is unavailable in checkout: ${runtime_sha}" >&2; exit 1; }

            runtime_relation=""
            if git merge-base --is-ancestor "$runtime_sha" "$GITHUB_SHA"; then
              runtime_relation="runtime_ancestor"
              git diff --name-only --diff-filter=ACDMRTUXB "$runtime_sha" "$GITHUB_SHA" -- > /tmp/atlas-authoring-evidence/runtime-diff.txt
            elif [[ "${ATLAS_AUTHORING_AUDIT_ALL_APPROVED:-false}" == "true" ]] && git merge-base --is-ancestor "$GITHUB_SHA" "$runtime_sha"; then
              runtime_relation="runtime_descendant"
              git diff --name-only --diff-filter=ACDMRTUXB "$GITHUB_SHA" "$runtime_sha" -- > /tmp/atlas-authoring-evidence/runtime-diff.txt
            else
              echo "Deployed runtime and authoring commit are not on an allowed ancestry path." >&2
              exit 1
            fi

            set +e
            ATLAS_RUNTIME_RELATION="$runtime_relation" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { shouldBuildForChangedPaths } from './scripts/vercel-ignore-build.mjs';
          const text = fs.readFileSync('/tmp/atlas-authoring-evidence/runtime-diff.txt', 'utf8').trim();
          const paths = text ? text.split(/\r?\n/).filter(Boolean) : [];
          if (process.env.ATLAS_RUNTIME_RELATION === 'runtime_descendant') {
            const critical = paths.filter((path) =>
              path === '.github/workflows/atlas-authoring-apply.yml'
              || path.startsWith('authoring/requests/')
              || path.startsWith('server/')
              || path.startsWith('api/')
              || path === 'package.json'
              || path === 'package-lock.json'
              || path === 'vercel.json'
            );
            if (critical.length) {
              console.error('AUTHORING_COMPLETENESS_RUNTIME_AHEAD_UNSAFE');
              for (const path of critical) console.error(`  ${path}`);
              process.exit(1);
            }
            console.log(`Read-only completeness audit accepted a newer Production runtime with ${paths.length} audit-neutral path${paths.length === 1 ? '' : 's'}.`);
          } else {
            if (shouldBuildForChangedPaths(paths)) {
              console.error('AUTHORING_RUNTIME_CODE_DRIFT: deployment-relevant changes still exist after the deployed runtime SHA');
              for (const path of paths) console.error(`  ${path}`);
              process.exit(1);
            }
            console.log(`Authoring delta is deployment-safe (${paths.length} path${paths.length === 1 ? '' : 's'}).`);
          }
          NODE
            drift_status=$?
            set -e

            if [[ "$drift_status" == "0" ]]; then
              echo "ATLAS_RUNTIME_SHA=${runtime_sha}" >> "$GITHUB_ENV"
              echo "ATLAS_AUTHORING_BOOTSTRAP_REQUIRED=${bootstrap_required}" >> "$GITHUB_ENV"
              echo "Authoring runtime ${runtime_sha} is safe for GitHub authoring commit ${GITHUB_SHA}; bootstrap_required=${bootstrap_required}."
              runtime_ready=true
              break
            fi

            if [[ "$attempt" == "60" ]]; then
              echo "AUTHORING_RUNTIME_CODE_DRIFT remained after 60 attempts." >&2
              exit 1
            fi
            echo "Production runtime is still behind the authoring commit (attempt ${attempt}/60); retrying in 5s."
            sleep 5
          done

          [[ "$runtime_ready" == "true" ]] || { echo "Authoring runtime never became ready." >&2; exit 1; }

      - name: Bootstrap bounded authoring schema migrations
        if: env.ATLAS_AUTHORING_SELECTED == 'true' && env.ATLAS_AUTHORING_BOOTSTRAP_REQUIRED == 'true' && env.ATLAS_AUTHORING_AUDIT_ALL_APPROVED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ATLAS_AUTHORING_AUDIENCE}" | jq -er '.value')"
          payload="$(jq -cn \
            --argjson transport_version "$ATLAS_AUTHORING_TRANSPORT_VERSION" \
            --arg runtime_sha "$ATLAS_RUNTIME_SHA" \
            --arg authoring_sha "$GITHUB_SHA" \
            '{operation:"bootstrap",transport_version:$transport_version,runtime_sha:$runtime_sha,authoring_sha:$authoring_sha}')"
          response="/tmp/atlas-authoring-evidence/responses/bootstrap.json"
          status="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            -H 'content-type: application/json' \
            -H "authorization: Bearer ${oidc_token}" \
            --data "$payload" \
            "$ATLAS_AUTHORING_ENDPOINT")"
          if [[ "$status" != "200" ]]; then
            cat "$response" >&2 || true
            code="$(jq -r '.code // "UNKNOWN"' "$response" 2>/dev/null || printf 'UNKNOWN')"
            echo "Authoring bootstrap failed: HTTP ${status}, code ${code}" >&2
            exit 1
          fi
          jq -e \
            --arg runtime "$ATLAS_RUNTIME_SHA" \
            --arg authoring "$GITHUB_SHA" \
            --argjson version "$ATLAS_AUTHORING_TRANSPORT_VERSION" '
              .ok==true
              and .marker=="ATLAS_AUTHORING_TRANSPORT_V2"
              and .transport_version==$version
              and .operation=="bootstrap"
              and .runtime_sha==$runtime
              and .authoring_sha==$authoring
              and .bootstrap_complete==true
              and .ready==true
              and .readiness.ready==true
              and .readiness.core.ledger_table_ready==true
              and .readiness.core.ledger_columns_ready==true
            ' "$response" >/dev/null
          jq . "$response"

      - name: Verify canonical NamuWiki review reasons after bootstrap
        if: env.ATLAS_AUTHORING_SELECTED == 'true' && env.ATLAS_AUTHORING_BOOTSTRAP_ONLY == 'true' && env.ATLAS_AUTHORING_AUDIT_ALL_APPROVED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          readback="/tmp/atlas-authoring-evidence/namuwiki-review-readback.json"
          status="$(curl --silent --show-error \
            --output "$readback" \
            --write-out '%{http_code}' \
            "$ATLAS_PERSON_READ_ENDPOINT?__atlas_read_surface=person")"
          if [[ "$status" != "200" ]]; then
            cat "$readback" >&2 || true
            echo "NamuWiki review-state read-back failed: HTTP ${status}" >&2
            exit 1
          fi
          node <<'NODE'
          'use strict';
          const fs=require('node:fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/atlas-authoring-evidence/namuwiki-review-readback.json','utf8'));
          if (payload?.ok !== true || !Array.isArray(payload?.persons)) throw new Error('NAMUWIKI_REVIEW_READBACK_INVALID');
          const migration=fs.readFileSync('db/migrations/20260930_external_reference_decision_state.sql','utf8');
          const classified=[...migration.matchAll(/\('([0-9a-f-]{36})'::uuid,'(no_exact_document|related_or_derivative_only|exact_target_url_pending|exact_target_url_verified)'\)/g)]
            .map((match)=>({person_id:match[1],reason:match[2]}));
          if (classified.length < 600) throw new Error('NAMUWIKI_REASON_REGISTRY_PARSE_INCOMPLETE');
          const byId=new Map(payload.persons.map((person)=>[String(person?.id || '').toLowerCase(),person]));
          const current={};
          let present=0, linked=0, reviewedAbsent=0, missingPersons=0;
          const failures=[];
          for (const row of classified) {
            const person=byId.get(row.person_id);
            if (!person) { missingPersons += 1; continue; }
            present += 1;
            const ref=person?.external_references?.namuwiki;
            if (ref?.status === 'linked') { linked += 1; continue; }
            if (ref?.status !== 'not_found') {
              failures.push({person_id:row.person_id,expected:row.reason,actual_status:ref?.status || null,actual_state:ref?.review_state || null});
              continue;
            }
            if (ref?.review_state !== 'reviewed_absent' || ref?.absence_reason !== row.reason) {
              failures.push({person_id:row.person_id,expected:row.reason,actual_status:ref.status,actual_state:ref.review_state || null,actual_reason:ref.absence_reason || null});
              continue;
            }
            reviewedAbsent += 1;
            current[row.reason]=(current[row.reason] || 0) + 1;
          }
          const summary={classified:classified.length,present,missing_persons:missingPersons,linked,reviewed_absent:reviewedAbsent,current_reason_counts:current,failures:failures.slice(0,20)};
          fs.writeFileSync('/tmp/atlas-authoring-evidence/namuwiki-review-summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          if (failures.length) throw new Error(`NAMUWIKI_REVIEW_REASON_READBACK_MISMATCH:${failures.length}`);
          NODE

      - name: Build immutable approved human-authoring audit batches
        if: env.ATLAS_AUTHORING_AUDIT_ALL_APPROVED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="/tmp/atlas-authoring-evidence/completeness"
          mkdir -p "$audit_dir/batches" "$audit_dir/responses"
          node <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const path = require('node:path');
          const { withResolvedHumanRequestId } = require('./server/atlas-human-authoring-service.js');
          const { manifestHash } = require('./server/atlas-authoring-manifest-service.js');

          const root = 'authoring/requests';
          const out = '/tmp/atlas-authoring-evidence/completeness';
          const files = fs.readdirSync(root)
            .filter((name) => name.endsWith('.json'))
            .sort()
            .map((name) => path.posix.join(root, name));

          const rows = [];
          const invalid = [];
          for (const manifestPath of files) {
            let raw;
            try {
              raw = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            } catch (error) {
              invalid.push({ manifest_path: manifestPath, code: 'INVALID_JSON', detail: String(error.message || error) });
              continue;
            }
            if (!['atlas-human-authoring/v1','atlas-human-person-authoring/v1'].includes(raw?.schema) || raw?.review_status !== 'approved') continue;
            try {
              const resolved = withResolvedHumanRequestId(raw);
              rows.push({
                manifest_path: manifestPath,
                request_id: resolved.request_id,
                request_id_generated: resolved.generated === true,
                manifest_hash: manifestHash(resolved.request),
                request: resolved.request
              });
            } catch (error) {
              invalid.push({ manifest_path: manifestPath, code: String(error.message || 'HUMAN_AUTHORING_REQUEST_INVALID') });
            }
          }

          fs.writeFileSync(path.join(out, 'inventory.json'), JSON.stringify({
            schema: 'atlas-authoring-completeness-inventory/v1',
            approved_human_manifest_count: rows.length,
            invalid_manifest_count: invalid.length,
            invalid_manifests: invalid,
            manifests: rows.map(({ request, ...row }) => row)
          }, null, 2) + '\n');

          const byRequest = new Map();
          for (const row of rows) {
            const group = byRequest.get(row.request_id) || [];
            group.push(row);
            byRequest.set(row.request_id, group);
          }
          const collisions = [];
          for (const [requestId, group] of byRequest) {
            const hashes = [...new Set(group.map((row) => row.manifest_hash))];
            if (hashes.length > 1) {
              collisions.push({
                request_id: requestId,
                distinct_hash_count: hashes.length,
                manifests: group.map((row) => ({ manifest_path: row.manifest_path, manifest_hash: row.manifest_hash }))
              });
            }
          }
          fs.writeFileSync(path.join(out, 'request-id-collisions.json'), JSON.stringify(collisions, null, 2) + '\n');

          const limit = 40;
          const batches = [];
          for (const row of rows) {
            let batch = batches.find((candidate) =>
              candidate.items.length < limit && !candidate.requestIds.has(row.request_id)
            );
            if (!batch) {
              batch = { items: [], requestIds: new Set() };
              batches.push(batch);
            }
            batch.items.push(row);
            batch.requestIds.add(row.request_id);
          }

          for (let index = 0; index < batches.length; index += 1) {
            const batch = batches[index];
            fs.writeFileSync(
              path.join(out, 'batches', String(index).padStart(3, '0') + '.json'),
              JSON.stringify({
                schema: 'atlas-authoring-completeness-batch/v1',
                index,
                count: batch.items.length,
                manifest_paths: batch.items.map((row) => row.manifest_path),
                requests: batch.items.map((row) => row.request)
              }) + '\n'
            );
          }

          console.log(JSON.stringify({
            approved_human_manifest_count: rows.length,
            invalid_manifest_count: invalid.length,
            request_id_collision_groups: collisions.length,
            batch_count: batches.length
          }, null, 2));
          NODE

      - name: Preflight every approved human-authoring manifest read-only
        if: env.ATLAS_AUTHORING_AUDIT_ALL_APPROVED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="/tmp/atlas-authoring-evidence/completeness"
          : > "$audit_dir/results.jsonl"
          current_runtime_sha="$ATLAS_RUNTIME_SHA"
          parallel_width=4

          request_oidc() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ATLAS_AUTHORING_AUDIENCE}" | jq -er '.value'
          }

          refresh_runtime_sha() {
            local readiness status runtime_sha runtime_relation
            readiness="$audit_dir/readiness-refresh.json"
            status="$(curl --silent --show-error --output "$readiness" --write-out '%{http_code}' "$ATLAS_AUTHORING_ENDPOINT")"
            [[ "$status" == "200" ]] || {
              cat "$readiness" >&2 || true
              echo "Completeness runtime refresh failed: HTTP ${status}" >&2
              return 1
            }
            jq -e --argjson version "$ATLAS_AUTHORING_TRANSPORT_VERSION" '
              .ok==true
              and .marker=="ATLAS_AUTHORING_TRANSPORT_V2"
              and .transport_version==$version
              and (.runtime_sha | test("^[0-9a-f]{40}$"))
              and .ready==true
              and .readiness.p9.duplicate_groups==0
            ' "$readiness" >/dev/null
            runtime_sha="$(jq -er '.runtime_sha' "$readiness")"
            if ! git cat-file -e "${runtime_sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --quiet origin main
            fi
            git cat-file -e "${runtime_sha}^{commit}"

            runtime_relation=""
            if git merge-base --is-ancestor "$runtime_sha" "$GITHUB_SHA"; then
              runtime_relation="runtime_ancestor"
              git diff --name-only --diff-filter=ACDMRTUXB "$runtime_sha" "$GITHUB_SHA" -- > "$audit_dir/runtime-refresh-diff.txt"
            elif git merge-base --is-ancestor "$GITHUB_SHA" "$runtime_sha"; then
              runtime_relation="runtime_descendant"
              git diff --name-only --diff-filter=ACDMRTUXB "$GITHUB_SHA" "$runtime_sha" -- > "$audit_dir/runtime-refresh-diff.txt"
            else
              echo "Completeness runtime and audit commit diverged." >&2
              return 1
            fi

            ATLAS_RUNTIME_RELATION="$runtime_relation" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { shouldBuildForChangedPaths } from './scripts/vercel-ignore-build.mjs';
          const text = fs.readFileSync('/tmp/atlas-authoring-evidence/completeness/runtime-refresh-diff.txt', 'utf8').trim();
          const paths = text ? text.split(/\r?\n/).filter(Boolean) : [];
          if (process.env.ATLAS_RUNTIME_RELATION === 'runtime_descendant') {
            const critical = paths.filter((path) =>
              path === '.github/workflows/atlas-authoring-apply.yml'
              || path.startsWith('authoring/requests/')
              || path.startsWith('server/')
              || path.startsWith('api/')
              || path === 'package.json'
              || path === 'package-lock.json'
              || path === 'vercel.json'
            );
            if (critical.length) {
              console.error('AUTHORING_COMPLETENESS_RUNTIME_AHEAD_UNSAFE');
              for (const path of critical) console.error(`  ${path}`);
              process.exit(1);
            }
            console.log(`Completeness audit accepted newer runtime ${process.env.ATLAS_RUNTIME_RELATION} with ${paths.length} audit-neutral path${paths.length === 1 ? '' : 's'}.`);
          } else if (shouldBuildForChangedPaths(paths)) {
            console.error('AUTHORING_COMPLETENESS_RUNTIME_CODE_DRIFT');
            for (const path of paths) console.error(`  ${path}`);
            process.exit(1);
          }
          NODE
            current_runtime_sha="$runtime_sha"
            echo "Refreshed completeness runtime SHA: ${current_runtime_sha} (${runtime_relation})" >&2
          }

          batches=("$audit_dir"/batches/*.json)
          [[ -f "${batches[0]:-}" ]] || { echo 'No completeness batches were generated.' >&2; exit 1; }

          for ((wave_start=0; wave_start<${#batches[@]}; wave_start+=parallel_width)); do
            wave_completed=false
            for attempt in 1 2 3; do
              pids=()
              wave_indexes=()
              for ((offset=0; offset<parallel_width; offset+=1)); do
                batch_index=$((wave_start + offset))
                (( batch_index < ${#batches[@]} )) || break
                batch="${batches[$batch_index]}"
                response="$audit_dir/responses/$(printf '%03d' "$batch_index").json"
                status_file="$audit_dir/responses/$(printf '%03d' "$batch_index").status"
                oidc_token="$(request_oidc)"
                payload="$(jq -cn \
                  --argjson transport_version "$ATLAS_AUTHORING_TRANSPORT_VERSION" \
                  --arg runtime_sha "$current_runtime_sha" \
                  --arg authoring_sha "$GITHUB_SHA" \
                  --slurpfile batch "$batch" \
                  '{operation:"preflight_batch",transport_version:$transport_version,runtime_sha:$runtime_sha,authoring_sha:$authoring_sha,manifest_paths:$batch[0].manifest_paths,requests:$batch[0].requests}')"
                (
                  status="$(curl --silent --show-error \
                    --output "$response" \
                    --write-out '%{http_code}' \
                    --request POST \
                    -H 'content-type: application/json' \
                    -H "authorization: Bearer ${oidc_token}" \
                    --data "$payload" \
                    "$ATLAS_HUMAN_AUTHORING_ENDPOINT")"
                  printf '%s\n' "$status" > "$status_file"
                ) &
                pids+=("$!")
                wave_indexes+=("$batch_index")
              done

              worker_failed=false
              for pid in "${pids[@]}"; do
                wait "$pid" || worker_failed=true
              done
              [[ "$worker_failed" == "false" ]] || { echo "Completeness preflight worker failed in wave ${wave_start}." >&2; exit 1; }

              runtime_mismatch=false
              for batch_index in "${wave_indexes[@]}"; do
                response="$audit_dir/responses/$(printf '%03d' "$batch_index").json"
                status_file="$audit_dir/responses/$(printf '%03d' "$batch_index").status"
                status="$(cat "$status_file")"
                code="$(jq -r '.code // ""' "$response" 2>/dev/null || true)"
                if [[ "$status" == "400" && "$code" == "AUTHORING_RUNTIME_SHA_MISMATCH" ]]; then
                  runtime_mismatch=true
                  continue
                fi
                [[ "$status" == "200" ]] || {
                  cat "$response" >&2 || true
                  echo "Completeness preflight batch ${batch_index} failed: HTTP ${status}, code ${code:-UNKNOWN}" >&2
                  exit 1
                }
              done

              if [[ "$runtime_mismatch" == "true" ]]; then
                [[ "$attempt" -lt 3 ]] || { echo "Completeness preflight wave ${wave_start} exhausted runtime-race retries." >&2; exit 1; }
                echo "Production alias changed during completeness audit wave ${wave_start}; refreshing runtime SHA (attempt ${attempt}/3)." >&2
                refresh_runtime_sha
                continue
              fi

              wave_completed=true
              break
            done
            [[ "$wave_completed" == "true" ]] || { echo "Completeness preflight wave ${wave_start} did not complete." >&2; exit 1; }

            for batch_index in "${wave_indexes[@]}"; do
              response="$audit_dir/responses/$(printf '%03d' "$batch_index").json"
              jq -e '
                .ok==true
                and .marker=="ATLAS_HUMAN_AUTHORING_BATCH_V1"
                and .schema=="atlas-human-authoring-batch/v1"
                and .operation=="preflight_batch"
                and .committed==false
                and (.results | type=="array")
                and (.count == (.results | length))
                and all(.results[]; .status | IN("READY","ALREADY_PRESENT","BLOCKED"))
              ' "$response" >/dev/null
              jq -c --arg runtime_sha "$current_runtime_sha" '.results[] + {runtime_sha:$runtime_sha}' "$response" >> "$audit_dir/results.jsonl"
            done
          done
          echo "ATLAS_COMPLETENESS_RUNTIME_SHA=${current_runtime_sha}" >> "$GITHUB_ENV"
      - name: Classify trusted authoring completeness result
        if: env.ATLAS_AUTHORING_AUDIT_ALL_APPROVED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const out = '/tmp/atlas-authoring-evidence/completeness';
          const inventory = JSON.parse(fs.readFileSync(out + '/inventory.json', 'utf8'));
          const collisions = JSON.parse(fs.readFileSync(out + '/request-id-collisions.json', 'utf8'));
          const text = fs.readFileSync(out + '/results.jsonl', 'utf8').trim();
          const results = text ? text.split(/\r?\n/).filter(Boolean).map((line) => JSON.parse(line)) : [];
          const counts = { ALREADY_PRESENT: 0, READY: 0, BLOCKED: 0 };
          const blockedCodes = {};
          for (const row of results) {
            counts[row.status] = (counts[row.status] || 0) + 1;
            if (row.status === 'BLOCKED') {
              blockedCodes[row.code || 'UNKNOWN'] = (blockedCodes[row.code || 'UNKNOWN'] || 0) + 1;
            }
          }
          const ready = results.filter((row) => row.status === 'READY');
          const blocked = results.filter((row) => row.status === 'BLOCKED');
          const resultCountMismatch = results.length !== inventory.approved_human_manifest_count;
          const runtimeShas = [...new Set(results.map((row) => row.runtime_sha).filter(Boolean))].sort();
          const summary = {
            schema: 'atlas-authoring-completeness-audit/v1',
            authoring_sha: process.env.GITHUB_SHA,
            runtime_sha: process.env.ATLAS_COMPLETENESS_RUNTIME_SHA || process.env.ATLAS_RUNTIME_SHA,
            runtime_shas: runtimeShas,
            approved_human_manifest_count: inventory.approved_human_manifest_count,
            invalid_manifest_count: inventory.invalid_manifest_count,
            result_count: results.length,
            result_count_mismatch: resultCountMismatch,
            counts,
            blocked_codes: blockedCodes,
            request_id_collision_groups: collisions.length,
            data_level_missing_count: ready.length,
            complete: ready.length === 0 && inventory.invalid_manifest_count === 0 && !resultCountMismatch
          };
          fs.writeFileSync(out + '/summary.json', JSON.stringify(summary, null, 2) + '\n');
          fs.writeFileSync(out + '/ready.json', JSON.stringify(ready, null, 2) + '\n');
          fs.writeFileSync(out + '/blocked.json', JSON.stringify(blocked, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          if (ready.length) {
            console.error('Approved manifests that are READY against Production:');
            for (const row of ready) console.error(`  ${row.manifest_path} [${row.request_id}]`);
          }
          if (inventory.invalid_manifest_count) {
            console.error('Approved human manifests that could not be inventoried:');
            for (const row of inventory.invalid_manifests) console.error(`  ${row.manifest_path}: ${row.code}`);
          }
          if (resultCountMismatch) {
            console.error(`Completeness result count mismatch: expected ${inventory.approved_human_manifest_count}, got ${results.length}`);
          }
          if (ready.length > 0 || inventory.invalid_manifest_count > 0 || resultCountMismatch) process.exit(1);
          NODE

      - name: Apply manifests through deployed Vercel server
        if: env.ATLAS_AUTHORING_SELECTED == 'true' && env.ATLAS_AUTHORING_AUDIT_ALL_APPROVED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ATLAS_AUTHORING_BOOTSTRAP_ONLY:-false}" == "true" ]]; then
            echo 'Bootstrap-only run complete; no Person or Activity manifest will be applied.'
            exit 0
          fi

          request_oidc() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ATLAS_AUTHORING_AUDIENCE}" | jq -er '.value'
          }

          refresh_runtime_sha() {
            local readiness status runtime_sha
            readiness="/tmp/atlas-authoring-evidence/readiness-refresh.json"
            status="$(curl --silent --show-error \
              --output "$readiness" \
              --write-out '%{http_code}' \
              "$ATLAS_AUTHORING_ENDPOINT")"
            [[ "$status" == "200" ]] || {
              cat "$readiness" >&2 || true
              echo "Runtime refresh readiness failed: HTTP ${status}" >&2
              return 1
            }
            jq -e --argjson version "$ATLAS_AUTHORING_TRANSPORT_VERSION" '
              .ok==true
              and .marker=="ATLAS_AUTHORING_TRANSPORT_V2"
              and .transport_version==$version
              and (.runtime_sha | test("^[0-9a-f]{40}$"))
              and .readiness.p5_ready==true
              and .readiness.core.base_tables_ready==true
              and .readiness.core.activity_columns_ready==true
              and .readiness.p9.old_index_present==false
              and .readiness.p9.new_index_present==true
              and .readiness.p9.duplicate_groups==0
              and (.ready==true or .bootstrap_ready==true)
            ' "$readiness" >/dev/null
            runtime_sha="$(jq -er '.runtime_sha' "$readiness")"
            git cat-file -e "${runtime_sha}^{commit}" || {
              echo "Refreshed runtime commit is unavailable in checkout: ${runtime_sha}" >&2
              return 1
            }
            git merge-base --is-ancestor "$runtime_sha" "$GITHUB_SHA" || {
              echo "Refreshed runtime is not an ancestor of authoring commit." >&2
              return 1
            }
            git diff --name-only --diff-filter=ACDMRTUXB "$runtime_sha" "$GITHUB_SHA" -- > /tmp/atlas-authoring-evidence/runtime-refresh-diff.txt
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { shouldBuildForChangedPaths } from './scripts/vercel-ignore-build.mjs';
          const text = fs.readFileSync('/tmp/atlas-authoring-evidence/runtime-refresh-diff.txt', 'utf8').trim();
          const paths = text ? text.split(/\r?\n/).filter(Boolean) : [];
          if (shouldBuildForChangedPaths(paths)) {
            console.error('AUTHORING_RUNTIME_CODE_DRIFT after runtime refresh');
            for (const path of paths) console.error(`  ${path}`);
            process.exit(1);
          }
          NODE
            export ATLAS_RUNTIME_SHA="$runtime_sha"
            echo "Refreshed Authoring runtime SHA: ${ATLAS_RUNTIME_SHA}" >&2
          }

          post_human_batch() {
            local operation="$1"
            local paths_json="$2"
            local requests_json="$3"
            local candidate_ids_json="$4"
            local response="$5"
            local status code oidc_token payload
            for attempt in 1 2 3; do
              oidc_token="$(request_oidc)"
              payload="$(jq -cn \
                --arg operation "$operation" \
                --argjson transport_version "$ATLAS_AUTHORING_TRANSPORT_VERSION" \
                --arg runtime_sha "$ATLAS_RUNTIME_SHA" \
                --arg authoring_sha "$GITHUB_SHA" \
                --argjson manifest_paths "$paths_json" \
                --argjson requests "$requests_json" \
                --argjson candidate_ids "$candidate_ids_json" \
                '{operation:$operation,transport_version:$transport_version,runtime_sha:$runtime_sha,authoring_sha:$authoring_sha,manifest_paths:$manifest_paths,requests:$requests,candidate_ids:$candidate_ids}')"
              status="$(curl --silent --show-error \
                --output "$response" \
                --write-out '%{http_code}' \
                --request POST \
                -H 'content-type: application/json' \
                -H "authorization: Bearer ${oidc_token}" \
                --data "$payload" \
                "$ATLAS_HUMAN_AUTHORING_ENDPOINT")"
              code="$(jq -r '.code // ""' "$response" 2>/dev/null || true)"
              if [[ "$status" == "400" && "$code" == "AUTHORING_RUNTIME_SHA_MISMATCH" && "$attempt" -lt 3 ]]; then
                echo "Production alias changed between Authoring phases; refreshing runtime SHA and retrying immutable ${operation} (attempt ${attempt}/3)." >&2
                refresh_runtime_sha
                continue
              fi
              printf '%s' "$status"
              return 0
            done
            return 1
          }

          mapfile -t manifests < /tmp/atlas-manifests.txt
          all_human=true
          for manifest in "${manifests[@]}"; do
            schema="$(jq -r '.schema' "$manifest")"
            [[ "$schema" == "atlas-human-authoring/v1" || "$schema" == "atlas-human-person-authoring/v1" ]] || {
              all_human=false
              break
            }
          done

          if [[ "$all_human" == "true" && "${#manifests[@]}" -gt 0 ]]; then
            manifest_paths="$(printf '%s\n' "${manifests[@]}" | jq -R . | jq -s .)"
            requests="$(jq -s '.' "${manifests[@]}")"
            candidate_ids="$(jq -s '[.[] | (.registration_candidate_id // null)]' "${manifests[@]}")"

            preflight_response="/tmp/atlas-authoring-evidence/responses/human-authoring-preflight.json"
            preflight_status="$(post_human_batch "preflight_batch" "$manifest_paths" "$requests" "$candidate_ids" "$preflight_response")"
            if [[ "$preflight_status" != "200" ]]; then
              cat "$preflight_response" >&2 || true
              echo "Human authoring preflight failed: HTTP ${preflight_status}" >&2
              exit 1
            fi
            jq -e --argjson count "${#manifests[@]}" '
              .ok==true
              and .auth_method=="github_oidc"
              and .marker=="ATLAS_HUMAN_AUTHORING_BATCH_V1"
              and .schema=="atlas-human-authoring-batch/v1"
              and .operation=="preflight_batch"
              and .committed==false
              and .count==$count
              and (.results | type=="array" and length==$count)
              and all(.results[]; .status | IN("READY","ALREADY_PRESENT","BLOCKED"))
            ' "$preflight_response" >/dev/null
            jq . "$preflight_response"

            blocked_count="$(jq -r '.blocked_count' "$preflight_response")"
            ready_count="$(jq -r '.ready_count' "$preflight_response")"
            already_present_count="$(jq -r '.already_present_count' "$preflight_response")"

            if [[ "${ATLAS_AUTHORING_PREFLIGHT_ONLY:-false}" == "true" ]]; then
              echo "Human Authoring preflight-only summary: READY=${ready_count}, ALREADY_PRESENT=${already_present_count}, BLOCKED=${blocked_count}"
              echo 'Preflight-only mode complete; no Person or Activity manifest will be applied.'
              exit 0
            fi

            ready_indexes="$(jq -c '[.results[] | select(.status=="READY") | .index]' "$preflight_response")"
            ready_paths="$(jq -cn --argjson all "$manifest_paths" --argjson indexes "$ready_indexes" '$indexes | map($all[.])')"
            ready_requests="$(jq -cn --argjson all "$requests" --argjson indexes "$ready_indexes" '$indexes | map($all[.])')"
            ready_candidate_ids="$(jq -cn --argjson all "$candidate_ids" --argjson indexes "$ready_indexes" '$indexes | map($all[.])')"

            verify_queue="/tmp/atlas-authoring-evidence/verify-queue.jsonl"
            : > "$verify_queue"
            jq -c '.results[]
              | select(.status=="ALREADY_PRESENT")
              | {
                  manifest_path,
                  request_id,
                  person_id,
                  relationship_id,
                  source:"preflight_replay"
                }' "$preflight_response" >> "$verify_queue"

            apply_failed=false
            if [[ "$ready_count" -gt 0 ]]; then
              response="/tmp/atlas-authoring-evidence/responses/human-authoring-batch.json"
              status="$(post_human_batch "apply_batch" "$ready_paths" "$ready_requests" "$ready_candidate_ids" "$response")"

              if [[ "$status" == "200" ]]; then
                jq -e --argjson count "$ready_count" '
                  .ok==true
                  and .auth_method=="github_oidc"
                  and .marker=="ATLAS_HUMAN_AUTHORING_BATCH_V1"
                  and .schema=="atlas-human-authoring-batch/v1"
                  and .operation=="apply_batch"
                  and .committed==true
                  and .partial_commit==false
                  and .succeeded_count==$count
                  and .failed_count==0
                  and (.results | type=="array" and length==$count)
                  and all(.results[];
                    .marker=="ATLAS_HUMAN_AUTHORING_V1"
                    and .committed==true
                    and (
                      (.schema=="atlas-human-authoring/v1" and .result.semantic_version=="v2-relation-full-temporal")
                      or
                      (.schema=="atlas-human-person-authoring/v1" and .result.semantic_version=="person-only-canonical-v1")
                    )
                  )
                ' "$response" >/dev/null
              elif [[ "$status" == "409" ]]; then
                jq -e '
                  .ok==false
                  and .code=="HUMAN_AUTHORING_BATCH_PARTIAL_FAILURE"
                  and (.results | type=="array")
                  and (.failures | type=="array" and length>0)
                ' "$response" >/dev/null
                apply_failed=true
              else
                cat "$response" >&2 || true
                code="$(jq -r '.code // "UNKNOWN"' "$response" 2>/dev/null || printf 'UNKNOWN')"
                echo "Human authoring batch apply failed: HTTP ${status}, code ${code}" >&2
                exit 1
              fi
              jq . "$response"

              jq -c --slurpfile preflight "$preflight_response" '
                .results[] as $result
                | ($preflight[0].results[] | select(.request_id==$result.request_id)) as $pf
                | {
                    manifest_path:$pf.manifest_path,
                    request_id:$result.request_id,
                    person_id:$result.person_id,
                    relationship_id:$result.relationship_id,
                    source:"apply"
                  }
              ' "$response" >> "$verify_queue"
            fi

            verify_failed=false
            while IFS= read -r item; do
              [[ -n "$item" ]] || continue
              manifest_path="$(jq -r '.manifest_path' <<<"$item")"
              person_id="$(jq -r '.person_id' <<<"$item")"
              relationship_id="$(jq -r '.relationship_id' <<<"$item")"
              request_id="$(jq -r '.request_id' <<<"$item")"
              readback="/tmp/atlas-authoring-evidence/responses/readback-${request_id//[:\/]/_}.json"
              read_status="$(curl --silent --show-error \
                --output "$readback" \
                --write-out '%{http_code}' \
                "${ATLAS_PERSON_READ_ENDPOINT}?__atlas_read_surface=person&person_id=${person_id}")"
              if [[ "$read_status" != "200" ]]; then
                echo "Production read-back failed for ${request_id}: HTTP ${read_status}" >&2
                verify_failed=true
                continue
              fi
              manifest_schema="$(jq -r '.schema' "$manifest_path")"
              if [[ "$manifest_schema" == "atlas-human-person-authoring/v1" ]]; then
                if ! jq -e \
                  --slurpfile manifest "$manifest_path" \
                  --arg person_id "$person_id" '
                    $manifest[0] as $m
                    | .ok==true
                    and .mode=="detail"
                    and .person.id==$person_id
                    and .person.activity_count==0
                    and (.person.representative_domain // null)==$m.representative_domain
                    and (.person.timeline_disposition.disposition // null)==$m.timeline_disposition.disposition
                    and (.person.timeline_disposition.reason // null)==$m.timeline_disposition.reason
                    and (.person.timeline_disposition.basis_code // null)==($m.timeline_disposition.basis_code // null)
                    and (
                      (.person.external_references.namuwiki.status // null)==($m.external_references.namuwiki.status // null)
                      and (.person.external_references.namuwiki.document_title // null)==($m.external_references.namuwiki.document_title // null)
                      and (.person.external_references.namuwiki.url // null)==($m.external_references.namuwiki.url // null)
                    )
                    and . as $read
                    | all($m.sources[];
                      . as $s
                      | any($read.person.sources[]; (.canonical_url // null)==($s.canonical_url // null) and (.title // null)==($s.title // null))
                    )
                  ' "$readback" >/dev/null; then
                  echo "Production person-only read-back mismatch for ${request_id}" >&2
                  cat "$readback" >&2 || true
                  verify_failed=true
                  continue
                fi
              else
                  if ! jq -e \
                  --slurpfile manifest "$manifest_path" \
                  --arg person_id "$person_id" \
                  --arg relationship_id "$relationship_id" '
                    $manifest[0] as $m
                    | .ok==true
                    and .mode=="detail"
                    and .person.id==$person_id
                    and any(.person.activities[];
                      .id==$relationship_id
                      and (.polity.canonical_name_en // null)==($m.polity.canonical_name_en // null)
                      and (.relation.code // null)==($m.activity.relation_type // null)
                      and (.period_basis.code // null)==($m.activity.period_basis // null)
                      and (
                        if $m.activity.start_year == null then
                          .start.year==null
                          and (.start.month // null)==null
                          and (.start.day // null)==null
                          and (.start.certainty // null)==null
                          and (.start.calendar // null)==null
                        else
                          .start.year==$m.activity.start_year
                          and (.start.month // null)==($m.activity.start_month // null)
                          and (.start.day // null)==($m.activity.start_day // null)
                          and (.start.certainty // null)==($m.activity.start_certainty // null)
                          and (.start.calendar // null)==($m.activity.start_calendar // "unspecified_historical")
                        end
                      )
                      and (
                        if $m.activity.chronology_status=="ongoing" then
                          .end.year==null
                          and (.end.month // null)==null
                          and (.end.day // null)==null
                          and (.end.certainty // null)==null
                          and (.end.calendar // null)==null
                          and .end.status=="ongoing"
                          and .end.as_of==$m.activity.ongoing_as_of
                        elif $m.activity.end_year == null then
                          .end.year==null
                          and (.end.month // null)==null
                          and (.end.day // null)==null
                          and (.end.certainty // null)==null
                          and (.end.calendar // null)==null
                          and (.end.status // null)!="ongoing"
                        else
                          .end.year==$m.activity.end_year
                          and (.end.month // null)==($m.activity.end_month // null)
                          and (.end.day // null)==($m.activity.end_day // null)
                          and (.end.certainty // null)==($m.activity.end_certainty // null)
                          and (.end.calendar // null)==($m.activity.end_calendar // "unspecified_historical")
                        end
                      )
                      and (
                        if ($m.activity.role // null)==null then .role==null
                        else
                          ((.role.source_label // .role.canonical_name_en // "") | ascii_downcase | gsub("[^a-z0-9]"; ""))
                          == (($m.activity.role // "") | ascii_downcase | gsub("[^a-z0-9]"; ""))
                        end
                      )
                    )
                    and (
                      (.person.external_references.namuwiki.status // null)==($m.external_references.namuwiki.status // null)
                      and (.person.external_references.namuwiki.document_title // null)==($m.external_references.namuwiki.document_title // null)
                      and (.person.external_references.namuwiki.url // null)==($m.external_references.namuwiki.url // null)
                    )
                  ' "$readback" >/dev/null; then
                  echo "Production read-back mismatch for ${request_id}" >&2
                  cat "$readback" >&2 || true
                  verify_failed=true
                  continue
                fi

              fi
              echo "Production read-back VERIFIED: ${request_id}"
            done < "$verify_queue"

            final_failed=false
            if [[ "$blocked_count" -gt 0 ]]; then
              echo "Preflight blocked ${blocked_count} request(s); READY/ALREADY_PRESENT items were still completed and verified." >&2
              jq -c '.results[] | select(.status=="BLOCKED")' "$preflight_response" >&2
              final_failed=true
            fi
            if [[ "$apply_failed" == "true" ]]; then
              echo 'One or more READY requests failed during isolated apply; successful items were retained and verified.' >&2
              final_failed=true
            fi
            if [[ "$verify_failed" == "true" ]]; then
              echo 'One or more Production read-back checks failed.' >&2
              final_failed=true
            fi

            echo "Human Authoring v6.1 summary: READY=${ready_count}, ALREADY_PRESENT=${already_present_count}, BLOCKED=${blocked_count}"
            [[ "$final_failed" == "false" ]] || exit 1
            exit 0
          fi

          while IFS= read -r manifest; do
            [[ -n "$manifest" ]] || continue
            schema="$(jq -r '.schema' "$manifest")"
            oidc_token="$(request_oidc)"
            response="/tmp/atlas-authoring-evidence/responses/$(basename "$manifest" .json).json"
            if [[ "$schema" == "atlas-human-authoring/v1" || "$schema" == "atlas-human-person-authoring/v1" ]]; then
              payload="$(jq -cn \
                --argjson transport_version "$ATLAS_AUTHORING_TRANSPORT_VERSION" \
                --arg runtime_sha "$ATLAS_RUNTIME_SHA" \
                --arg authoring_sha "$GITHUB_SHA" \
                --arg manifest_path "$manifest" \
                --slurpfile request "$manifest" \
                '{transport_version:$transport_version,runtime_sha:$runtime_sha,authoring_sha:$authoring_sha,manifest_path:$manifest_path,request:$request[0]}')"
              status="$(curl --silent --show-error \
                --output "$response" \
                --write-out '%{http_code}' \
                --request POST \
                -H 'content-type: application/json' \
                -H "authorization: Bearer ${oidc_token}" \
                --data "$payload" \
                "$ATLAS_HUMAN_AUTHORING_ENDPOINT")"
              if [[ "$status" != "200" ]]; then
                cat "$response" >&2 || true
                echo "Human authoring apply failed: HTTP ${status}" >&2
                exit 1
              fi
              jq -e '
                .ok==true
                and .auth_method=="github_oidc"
                and .marker=="ATLAS_HUMAN_AUTHORING_V1"
                and .committed==true
                and (
                  (.schema=="atlas-human-authoring/v1" and .result.semantic_version=="v2-relation-full-temporal")
                  or
                  (.schema=="atlas-human-person-authoring/v1" and .result.semantic_version=="person-only-canonical-v1")
                )
              ' "$response" >/dev/null
            else
              payload="$(jq -cn \
                --argjson transport_version "$ATLAS_AUTHORING_TRANSPORT_VERSION" \
                --arg runtime_sha "$ATLAS_RUNTIME_SHA" \
                --arg authoring_sha "$GITHUB_SHA" \
                --arg manifest_path "$manifest" \
                --slurpfile manifest "$manifest" \
                '{operation:"apply_manifest",transport_version:$transport_version,runtime_sha:$runtime_sha,authoring_sha:$authoring_sha,manifest_path:$manifest_path,manifest:$manifest[0]}')"
              status="$(curl --silent --show-error \
                --output "$response" \
                --write-out '%{http_code}' \
                --request POST \
                -H 'content-type: application/json' \
                -H "authorization: Bearer ${oidc_token}" \
                --data "$payload" \
                "$ATLAS_AUTHORING_ENDPOINT")"
              if [[ "$status" != "200" ]]; then
                cat "$response" >&2 || true
                code="$(jq -r '.code // "UNKNOWN"' "$response" 2>/dev/null || printf 'UNKNOWN')"
                echo "Authoring apply failed: HTTP ${status}, code ${code}" >&2
                exit 1
              fi
              jq -e \
                --arg runtime "$ATLAS_RUNTIME_SHA" \
                --arg authoring "$GITHUB_SHA" \
                --arg path "$manifest" \
                --argjson version "$ATLAS_AUTHORING_TRANSPORT_VERSION" '
                  .ok==true
                  and .transport_marker=="ATLAS_AUTHORING_TRANSPORT_V2"
                  and .transport_version==$version
                  and .runtime_sha==$runtime
                  and .authoring_sha==$authoring
                  and .manifest_path==$path
                  and .committed==true
                  and .marker=="ATLAS_AUTHORING_MANIFEST_V2_STAGE2_NATIVE"
                  and .result.version==2
                  and .result.semantic_version=="v2-relation-full-temporal"
                ' "$response" >/dev/null
            fi
            jq . "$response"
          done < /tmp/atlas-manifests.txt

      - name: Upload immutable authoring evidence
        if: always() && env.ATLAS_AUTHORING_SELECTED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-authoring-${{ github.sha }}
          path: /tmp/atlas-authoring-evidence/
          if-no-files-found: error
          retention-days: 90
