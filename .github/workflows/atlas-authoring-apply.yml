name: ATLAS Authoring Apply

on:
  push:
    branches:
      - main
    paths:
      - 'authoring/requests/*.json'
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Path under authoring/requests/'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-authoring-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      ATLAS_AUTHORING_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-authoring-apply
      ATLAS_AUTHORING_AUDIENCE: atlas-person-db-authoring
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve reviewed manifests
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            printf '%s\n' "${{ inputs.manifest }}" > /tmp/atlas-manifests.txt
          else
            git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- 'authoring/requests/*.json' > /tmp/atlas-manifests.txt
          fi
          if [[ ! -s /tmp/atlas-manifests.txt ]]; then
            echo 'No authoring manifests selected.'
            exit 0
          fi
          while IFS= read -r manifest; do
            [[ "$manifest" =~ ^authoring/requests/[A-Za-z0-9._-]+\.json$ ]] || { echo "Rejected manifest path: $manifest"; exit 1; }
            jq -e '.schema == "atlas-authoring-manifest/v1" and .review_status == "approved"' "$manifest" >/dev/null || { echo "Manifest is not explicitly approved: $manifest"; exit 1; }
          done < /tmp/atlas-manifests.txt
          cat /tmp/atlas-manifests.txt

      - name: Apply manifests through deployed Vercel server
        shell: bash
        run: |
          set -euo pipefail

          request_oidc() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ATLAS_AUTHORING_AUDIENCE}" | jq -er '.value'
          }

          while IFS= read -r manifest; do
            [[ -n "$manifest" ]] || continue
            payload="$(jq -cn \
              --arg deployment_sha "${GITHUB_SHA}" \
              --arg manifest_path "$manifest" \
              --slurpfile manifest "$manifest" \
              '{deployment_sha:$deployment_sha,manifest_path:$manifest_path,manifest:$manifest[0]}')"

            applied=false
            for attempt in $(seq 1 60); do
              oidc_token="$(request_oidc)"
              status="$(curl --silent --show-error \
                --output /tmp/atlas-authoring-response.json \
                --write-out '%{http_code}' \
                --request POST \
                -H 'content-type: application/json' \
                -H "authorization: Bearer ${oidc_token}" \
                --data "$payload" \
                "$ATLAS_AUTHORING_ENDPOINT")"

              if [[ "$status" == "200" ]]; then
                jq . /tmp/atlas-authoring-response.json
                applied=true
                break
              fi

              code="$(jq -r '.code // "UNKNOWN"' /tmp/atlas-authoring-response.json 2>/dev/null || printf 'UNKNOWN')"
              if [[ "$status" == "409" && "$code" == "DEPLOYMENT_SHA_MISMATCH" ]]; then
                echo "Production deployment has not reached ${GITHUB_SHA} yet (attempt ${attempt}/60); retrying."
                sleep 10
                continue
              fi

              cat /tmp/atlas-authoring-response.json >&2 || true
              echo "Authoring apply failed: HTTP ${status}, code ${code}" >&2
              exit 1
            done

            [[ "$applied" == "true" ]] || { echo "Production deployment did not reach ${GITHUB_SHA} within retry window" >&2; exit 1; }
          done < /tmp/atlas-manifests.txt
