name: TEMP France Spatial Compile

on:
  push:
    branches:
      - noncore/spatial-france-live-debt-20260908
    paths:
      - '.github/workflows/tmp-france-spatial-compile.yml'

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: noncore/spatial-france-live-debt-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile reviewed spatial bindings and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          node scripts/compile-spatial-bindings.mjs
          node scripts/compile-spatial-bindings.mjs --check
          git rm .github/workflows/tmp-france-spatial-compile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas-polity-spatial-index.json spatial/reviewed-bindings/shards/live-debt-france-20260908.bindings.json
          git diff --cached --check
          git commit -m 'Compile France spatial binding'
          git push origin HEAD:noncore/spatial-france-live-debt-20260908
