name: Phase 8C C2 Postgres Adapter

on:
  pull_request:
    paths:
      - "atlas-v2-postgres-transaction-adapter.js"
      - "tests/atlas-v2-postgres-transaction-adapter.test.mjs"
      - ".github/workflows/phase-8c-c2-postgres-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run transaction adapter tests
        run: node --test tests/atlas-v2-postgres-transaction-adapter.test.mjs
      - name: Verify production isolation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'atlas-v2-postgres-transaction-adapter.js' index.html
          ! grep -Fq 'atlas-v2-postgres-transaction-adapter.js' admin.html
          ! grep -Fq 'public.person_politics' atlas-v2-postgres-transaction-adapter.js
          grep -Fq 'atlas_v2.person_politics_v2' atlas-v2-postgres-transaction-adapter.js
          mkdir -p migration/phase-8/tmp/phase8c-c2-postgres-adapter
          printf '{"marker":"PHASE_8C_C2_POSTGRES_ADAPTER","production_loaded":false,"legacy_target":false,"v2_target":true,"live_execution":false,"pass":true}\n' > migration/phase-8/tmp/phase8c-c2-postgres-adapter/verification.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-8c-c2-postgres-adapter-${{ github.sha }}
          path: migration/phase-8/tmp/phase8c-c2-postgres-adapter
          if-no-files-found: error
          retention-days: 90
