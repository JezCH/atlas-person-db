name: Phase 9 Production Read Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/phase9-production-read-diagnostic.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production server endpoints
        shell: bash
        run: |
          set -uo pipefail
          base="https://atlas-person-db.vercel.app"

          read_code=$(curl -sS -o /tmp/read.txt -w '%{http_code}' --max-time 20 "$base/api/atlas-read" || true)
          echo "[read] GET /api/atlas-read -> HTTP $read_code"
          cat /tmp/read.txt 2>/dev/null || true
          echo

          session_code=$(curl -sS -o /tmp/session.txt -w '%{http_code}' --max-time 20 "$base/api/atlas-session" || true)
          echo "[session] GET /api/atlas-session -> HTTP $session_code"
          cat /tmp/session.txt 2>/dev/null || true
          echo

          mutate_code=$(curl -sS -X POST -H 'content-type: application/json' -d '{}' -o /tmp/mutate.txt -w '%{http_code}' --max-time 20 "$base/api/atlas-mutate" || true)
          echo "[mutate] POST /api/atlas-mutate -> HTTP $mutate_code"
          cat /tmp/mutate.txt 2>/dev/null || true
          echo

          echo "SUMMARY read=$read_code session=$session_code mutate=$mutate_code"
          test "$read_code" = "200"
          test "$session_code" = "200"
          test "$mutate_code" = "401"
