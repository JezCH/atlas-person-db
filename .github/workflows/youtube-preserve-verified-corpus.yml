name: Preserve verified YouTube original corpus
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: atlas-youtube-source-archive-preservation
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    env:
      SUPABASE_URL: https://wfrbxltvpmlprgwfysxq.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SOURCE_ARTIFACT_ID: '11548326100'
      SOURCE_ARTIFACT_DIGEST: sha256:b40f8efdccfacce194afb44cc7cca3e93a4ab12a2153c5a19b70ceb3f56b0b1f
      SOURCE_ARTIFACT_SIZE: '57840666'
      SOURCE_MEMBER_COUNT: '6044'
      SOURCE_MEMBER_BYTES: '57747470'
      SOURCE_CATALOG_COUNT: '6021'
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact source artifact metadata before download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" > /tmp/source-artifact.json
          jq -e             --argjson id "${SOURCE_ARTIFACT_ID}"             --arg digest "${SOURCE_ARTIFACT_DIGEST}"             --argjson size "${SOURCE_ARTIFACT_SIZE}" '
              .id==$id
              and .name=="youtube-cumulative-batch017-validated"
              and .expired==false
              and .digest==$digest
              and .size_in_bytes==$size
            ' /tmp/source-artifact.json >/dev/null

      - uses: actions/download-artifact@v4
        with:
          name: youtube-cumulative-batch017-validated
          run-id: "37771318676"
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: corpus

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify idempotent upload, catalog and remote restore behavior
        run: python -m unittest discover -s tests -p test_youtube_source_upload.py -v

      - name: Pin complete 6,044-member local inventory before remote writes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/youtube-preserve-verified-corpus.py             --root corpus             --output /tmp/youtube-inventory.json             --dry-run             --expected-total-files "${SOURCE_MEMBER_COUNT}"             --expected-total-bytes "${SOURCE_MEMBER_BYTES}"
          jq -e             --argjson files "${SOURCE_MEMBER_COUNT}"             --argjson bytes "${SOURCE_MEMBER_BYTES}"             --argjson catalog "${SOURCE_CATALOG_COUNT}" '
              .schema=="atlas-youtube-source-verified-upload/v2"
              and .total_files_discovered==$files
              and .total_bytes_discovered==$bytes
              and .files_verified==$files
              and .bytes_verified==$bytes
              and .catalog_expected==$catalog
              and .metadata_objects==23
              and .uploaded==false
            ' /tmp/youtube-inventory.json >/dev/null

      - name: Validate authoritative source census before any upload
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pycountry
          python scripts/youtube-build-person-signal-snapshot.py             --root corpus             --output /tmp/youtube-source-preflight.json             --artifact-id "${SOURCE_ARTIFACT_ID}"             --artifact-digest "${SOURCE_ARTIFACT_DIGEST}"
          jq -e '
            .snapshot.channel_count==6011
            and .snapshot.video_count==1536512
            and (.channels|length)==6770
            and .snapshot.source_state.next_batch=="batch018"
            and .snapshot.source_state.channel_ids_persisted==true
          ' /tmp/youtube-source-preflight.json >/dev/null

      - name: Fail closed if production upload credentials are unavailable
        env:
          SOURCE_TOKEN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOURCE_TOKEN}" || { echo "SUPABASE_SERVICE_ROLE_KEY not configured"; exit 1; }

      - name: Controlled remote stop after first 1,000 immutable objects
        shell: bash
        run: |
          set -euo pipefail
          python scripts/youtube-preserve-verified-corpus.py             --root corpus             --output /tmp/youtube-remote-pass1.json             --max-files 1000             --expected-total-files "${SOURCE_MEMBER_COUNT}"             --expected-total-bytes "${SOURCE_MEMBER_BYTES}"
          jq -e '.files_verified==1000 and .uploaded==true and ((.new_objects + .existing_objects)==1000)'             /tmp/youtube-remote-pass1.json >/dev/null

      - name: Restart from beginning and complete all 6,044 immutable objects
        shell: bash
        run: |
          set -euo pipefail
          python scripts/youtube-preserve-verified-corpus.py             --root corpus             --output /tmp/youtube-remote-pass2.json             --expected-total-files "${SOURCE_MEMBER_COUNT}"             --expected-total-bytes "${SOURCE_MEMBER_BYTES}"
          jq -e             --argjson files "${SOURCE_MEMBER_COUNT}"             --argjson bytes "${SOURCE_MEMBER_BYTES}"             --argjson catalog "${SOURCE_CATALOG_COUNT}" '
              .files_verified==$files
              and .bytes_verified==$bytes
              and ((.new_objects + .existing_objects)==$files)
              and .catalog_expected==$catalog
              and ((.catalog_inserted + .catalog_existing)==$catalog)
              and .metadata_objects==23
            ' /tmp/youtube-remote-pass2.json >/dev/null

      - name: Prove third pass is idempotent and restore only from remote objects
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/youtube-remote-restore
          python scripts/youtube-preserve-verified-corpus.py             --root corpus             --output /tmp/youtube-remote-final.json             --restore-dir /tmp/youtube-remote-restore             --expected-total-files "${SOURCE_MEMBER_COUNT}"             --expected-total-bytes "${SOURCE_MEMBER_BYTES}"
          jq -e             --argjson files "${SOURCE_MEMBER_COUNT}"             --argjson bytes "${SOURCE_MEMBER_BYTES}"             --argjson catalog "${SOURCE_CATALOG_COUNT}" '
              .files_verified==$files
              and .new_objects==0
              and .existing_objects==$files
              and .catalog_inserted==0
              and .catalog_existing==$catalog
              and .restore.files==$files
              and .restore.bytes==$bytes
            ' /tmp/youtube-remote-final.json >/dev/null

      - name: Rebuild authoritative census from remote-restored files only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/youtube-build-person-signal-snapshot.py             --root /tmp/youtube-remote-restore             --output /tmp/youtube-remote-restore-census.json             --artifact-id "${SOURCE_ARTIFACT_ID}"             --artifact-digest "${SOURCE_ARTIFACT_DIGEST}"
          jq -e '
            .snapshot.channel_count==6011
            and .snapshot.video_count==1536512
            and (.channels|length)==6770
            and .snapshot.source_state.next_batch=="batch018"
            and .snapshot.source_state.channel_ids_persisted==true
          ' /tmp/youtube-remote-restore-census.json >/dev/null

      - name: Publish sanitized durable-recovery receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/youtube-source-storage-verification
          cp /tmp/source-artifact.json /tmp/youtube-source-storage-verification/source-artifact.json
          cp /tmp/youtube-inventory.json /tmp/youtube-source-storage-verification/local-inventory.json
          cp /tmp/youtube-remote-pass1.json /tmp/youtube-source-storage-verification/remote-pass1.json
          cp /tmp/youtube-remote-pass2.json /tmp/youtube-source-storage-verification/remote-pass2.json
          cp /tmp/youtube-remote-final.json /tmp/youtube-source-storage-verification/remote-final.json
          cp /tmp/youtube-remote-restore-census.json /tmp/youtube-source-storage-verification/remote-restore-census.json
          jq '{
            schema:"atlas-youtube-durable-recovery-receipt/v1",
            source_artifact_id:.source_artifact_id,
            object_count:.files_verified,
            member_bytes:.bytes_verified,
            storage_existing:.existing_objects,
            storage_new:.new_objects,
            catalog_verified:(.catalog_inserted + .catalog_existing),
            catalog_inserted:.catalog_inserted,
            catalog_existing:.catalog_existing,
            metadata_objects:.metadata_objects,
            restore:.restore
          }' /tmp/youtube-remote-final.json             > /tmp/youtube-source-storage-verification/summary.json

      - name: Upload durable-recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: youtube-source-storage-verification
          path: /tmp/youtube-source-storage-verification
          retention-days: 90
