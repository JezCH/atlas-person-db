name: Preserve verified YouTube original corpus
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: atlas-youtube-source-archive-preservation
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      SUPABASE_URL: https://wfrbxltvpmlprgwfysxq.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: youtube-cumulative-batch017-validated
          run-id: "37771318676"
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: corpus
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify idempotent upload and checksum failure behavior
        run: python -m unittest discover -s tests -p test_youtube_source_upload.py -v
      - name: Inventory original files without writes
        run: |
          python scripts/youtube-preserve-verified-corpus.py \
            --root corpus --output /tmp/youtube-inventory.json --dry-run
      - name: Validate entire source corpus before any upload
        run: |
          python -m pip install --disable-pip-version-check pycountry
          python scripts/youtube-build-person-signal-snapshot.py \
            --root corpus --output /tmp/youtube-source-preflight.json \
            --artifact-id 11548326100 \
            --artifact-digest sha256:b40f8efdccfacce194afb44cc7cca3e93a4ab12a2153c5a19b70ceb3f56b0b1f
          jq -e '
            .snapshot.channel_count==6011
            and .snapshot.video_count==1536512
            and (.channels|length)==6770
            and .snapshot.source_state.next_batch=="batch018"
            and .snapshot.source_state.channel_ids_persisted==true
          ' /tmp/youtube-source-preflight.json >/dev/null
      - name: Fail closed if upload credentials unavailable
        env:
          SOURCE_TOKEN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SOURCE_TOKEN" || { echo "SUPABASE_SERVICE_ROLE_KEY not configured"; exit 1; }
      - name: Upload idempotently and verify each object by independent readback
        run: |
          python scripts/youtube-preserve-verified-corpus.py \
            --root corpus --output /tmp/youtube-verified-upload.json
      - name: Publish evidence manifest (not a Production DB publication)
        uses: actions/upload-artifact@v4
        with:
          name: youtube-source-storage-verification
          path: /tmp/youtube-verified-upload.json
          retention-days: 90
