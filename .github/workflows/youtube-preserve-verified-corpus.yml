name: Preserve verified YouTube original corpus
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'storage_only backs up private objects and verifies restore; catalog_full requires current deployed runtime'
        required: true
        type: choice
        default: storage_only
        options:
          - storage_only
          - catalog_full
      source_batch:
        description: 'Pinned verified archive; B024 is storage-only until production catalog authority exists'
        required: true
        type: choice
        default: '024'
        options:
          - '017'
          - '024'

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: atlas-youtube-source-archive-preservation
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    env:
      SUPABASE_URL: https://wfrbxltvpmlprgwfysxq.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CATALOG_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-authoring-apply?__atlas_authoring_apply_surface=youtube-source-archive-catalog
      RUNTIME_IDENTITY_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-read?__atlas_read_surface=runtime-identity
      CATALOG_AUDIENCE: atlas-person-db-youtube-source-archive
      SOURCE_BATCH: ${{ inputs.source_batch }}
      SOURCE_ARTIFACT_NAME: ${{ inputs.source_batch == '024' && 'youtube-cumulative-batch024-validated' || 'youtube-cumulative-batch017-validated' }}
      SOURCE_ARTIFACT_RUN_ID: ${{ inputs.source_batch == '024' && '37921755392' || '37771318676' }}
      SOURCE_ARTIFACT_ID: ${{ inputs.source_batch == '024' && '11613130249' || '11548326100' }}
      SOURCE_ARTIFACT_DIGEST: ${{ inputs.source_batch == '024' && 'sha256:8f3ca335012fe82c94848f63b9126b1aeec7b48c935b403605dd7752ce713946' || 'sha256:b40f8efdccfacce194afb44cc7cca3e93a4ab12a2153c5a19b70ceb3f56b0b1f' }}
      SOURCE_ARTIFACT_SIZE: ${{ inputs.source_batch == '024' && '85284047' || '57840666' }}
      SOURCE_MEMBER_COUNT: ${{ inputs.source_batch == '024' && '10186' || '6044' }}
      SOURCE_MEMBER_BYTES: ${{ inputs.source_batch == '024' && '85683343' || '57747470' }}
      SOURCE_CATALOG_COUNT: ${{ inputs.source_batch == '024' && '10186' || '6044' }}
      SOURCE_SOURCE_COUNT: ${{ inputs.source_batch == '024' && '10144' || '6021' }}
      SOURCE_METADATA_COUNT: ${{ inputs.source_batch == '024' && '42' || '23' }}
      SOURCE_OK_CHANNEL_COUNT: ${{ inputs.source_batch == '024' && '10127' || '6011' }}
      SOURCE_SELECTED_CHANNEL_COUNT: ${{ inputs.source_batch == '024' && '10890' || '6770' }}
      SOURCE_VIDEO_ROWS: ${{ inputs.source_batch == '024' && '2230031' || '1536512' }}
      SOURCE_NEXT_BATCH: ${{ inputs.source_batch == '024' && 'batch025' || 'batch018' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact source artifact metadata before download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" > /tmp/source-artifact.json
          jq -e --argjson id "${SOURCE_ARTIFACT_ID}" --arg name "${SOURCE_ARTIFACT_NAME}" --arg digest "${SOURCE_ARTIFACT_DIGEST}" --argjson size "${SOURCE_ARTIFACT_SIZE}" '
            .id==$id
            and .name==$name
            and .expired==false
            and .digest==$digest
            and .size_in_bytes==$size
          ' /tmp/source-artifact.json >/dev/null

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          run-id: ${{ env.SOURCE_ARTIFACT_RUN_ID }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: corpus

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bind the original uploader to the exact selected archive identity
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/atlas-original-source-uploader.py <<'PY'
          import os
          import runpy
          approved = {
              "017": ("11548326100", "validated-batch017/sha256/"),
              "024": ("11613130249", "validated-batch024/sha256/"),
          }
          batch = os.environ.get("SOURCE_BATCH")
          artifact_id = os.environ.get("SOURCE_ARTIFACT_ID")
          if batch not in approved or artifact_id != approved[batch][0]:
              raise RuntimeError("UNAPPROVED_ORIGINAL_SOURCE_ARCHIVE_NAMESPACE")
          # One existing uploader/storage bucket; only the source provenance
          # and content-addressed key namespace are selected at runtime.
          mod = runpy.run_path("scripts/youtube-preserve-verified-corpus.py",
                               run_name="archived_source_identity_loader")
          fn = mod["main"]
          fn.__globals__["SOURCE_ARTIFACT_ID"] = int(artifact_id)
          fn.__globals__["KEY_PREFIX"] = approved[batch][1]
          fn()
          PY

      - name: Verify storage resume and remote restore behavior
        run: python -m unittest discover -s tests -p test_youtube_source_upload.py -v

      - name: Pin complete 6,044-member inventory before any remote write
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/atlas-original-source-uploader.py             --root corpus             --output /tmp/youtube-inventory.json             --dry-run             --expected-total-files "${SOURCE_MEMBER_COUNT}"             --expected-total-bytes "${SOURCE_MEMBER_BYTES}"
          jq -e --argjson files "${SOURCE_MEMBER_COUNT}" --argjson bytes "${SOURCE_MEMBER_BYTES}" --argjson catalog "${SOURCE_CATALOG_COUNT}" --argjson sources "${SOURCE_SOURCE_COUNT}" --argjson metadata "${SOURCE_METADATA_COUNT}" --argjson videos "${SOURCE_VIDEO_ROWS}" '
            .schema=="atlas-youtube-source-storage-verification/v2"
            and .total_files_discovered==$files
            and .total_bytes_discovered==$bytes
            and .files_verified==$files
            and .bytes_verified==$bytes
            and .source_records==$sources
            and .metadata_objects==$metadata
            and ((.source_records + .metadata_objects)==$catalog)
            and .uploaded==false
            and ([.records[] | select(.source_kind=="channel_videos") | .video_rows] | add)==$videos
          ' /tmp/youtube-inventory.json >/dev/null

      - name: Validate authoritative source census before any upload
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pycountry
          python scripts/youtube-build-person-signal-snapshot.py             --root corpus             --output /tmp/youtube-source-preflight.json             --artifact-id "${SOURCE_ARTIFACT_ID}"             --artifact-digest "${SOURCE_ARTIFACT_DIGEST}"
          jq -e --argjson okchannels "${SOURCE_OK_CHANNEL_COUNT}" --argjson videos "${SOURCE_VIDEO_ROWS}" --argjson selected "${SOURCE_SELECTED_CHANNEL_COUNT}" --arg next "${SOURCE_NEXT_BATCH}" '
            .snapshot.channel_count==$okchannels
            and .snapshot.video_count==$videos
            and (.channels|length)==$selected
            and .snapshot.source_state.next_batch==$next
            and .snapshot.source_state.channel_ids_persisted==true
          ' /tmp/youtube-source-preflight.json >/dev/null

      - name: Do not publish Batch024 through the Batch017 canonical catalog contract
        if: ${{ inputs.phase == 'catalog_full' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_BATCH" == "017" ]] || {
            echo "BATCH024_CANONICAL_CATALOG_NOT_AUTHORIZED: use storage_only" >&2
            exit 1
          }

      - name: Gate catalog_full on exact deployed main BEFORE Storage writes
        if: ${{ inputs.phase == 'catalog_full' }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --max-time 20 --silent --show-error --output /tmp/source-preflight.json --write-out '%{http_code}' "$RUNTIME_IDENTITY_ENDPOINT" || true)"
          if [[ "$status" == "402" ]]; then
            echo "DEPLOYMENT_DISABLED_OR_PAYMENT_REQUIRED: no Storage/catalog writes in catalog_full" >&2
            exit 1
          fi
          [[ "$status" == "200" ]] || { echo "SOURCE_CATALOG_RUNTIME_NOT_READY: $status" >&2; exit 1; }
          sha="$(jq -r '.identity.git_commit_sha // ""' /tmp/source-preflight.json)"
          ref="$(jq -r '.identity.git_commit_ref // ""' /tmp/source-preflight.json)"
          [[ "$sha" == "$GITHUB_SHA" && "$ref" == "main" ]] || {
            echo "SOURCE_CATALOG_MAIN_SHA_UNDEPLOYED" >&2
            exit 1
          }

      - name: Fail closed if private Storage credentials are unavailable
        env:
          SOURCE_TOKEN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOURCE_TOKEN}" || { echo "SUPABASE_SERVICE_ROLE_KEY not configured"; exit 1; }

      - name: Controlled remote stop after first 1,000 immutable objects
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/atlas-original-source-uploader.py             --root corpus             --output /tmp/youtube-remote-pass1.json             --max-files 1000             --expected-total-files "${SOURCE_MEMBER_COUNT}"             --expected-total-bytes "${SOURCE_MEMBER_BYTES}"
          jq -e '.files_verified==1000 and .uploaded==true and ((.new_objects + .existing_objects)==1000)'             /tmp/youtube-remote-pass1.json >/dev/null

      - name: Restart from beginning and complete all 6,044 immutable objects
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/atlas-original-source-uploader.py             --root corpus             --output /tmp/youtube-remote-pass2.json             --expected-total-files "${SOURCE_MEMBER_COUNT}"             --expected-total-bytes "${SOURCE_MEMBER_BYTES}"
          jq -e --argjson files "${SOURCE_MEMBER_COUNT}" --argjson bytes "${SOURCE_MEMBER_BYTES}" --argjson catalog "${SOURCE_CATALOG_COUNT}" --argjson sources "${SOURCE_SOURCE_COUNT}" --argjson metadata "${SOURCE_METADATA_COUNT}" --argjson videos "${SOURCE_VIDEO_ROWS}" '
            .files_verified==$files
            and .bytes_verified==$bytes
            and ((.new_objects + .existing_objects)==$files)
            and .source_records==$sources
            and .metadata_objects==$metadata
            and ((.source_records + .metadata_objects)==$catalog)
          ' /tmp/youtube-remote-pass2.json >/dev/null

      - name: Reconfirm current deployed main SHA before canonical catalog write
        if: ${{ inputs.phase == 'catalog_full' }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --max-time 20 --silent --show-error --output /tmp/source-catalog-final-runtime.json --write-out '%{http_code}' "$RUNTIME_IDENTITY_ENDPOINT" || true)"
          if [[ "$status" == "402" ]]; then
            echo "DEPLOYMENT_DISABLED_OR_PAYMENT_REQUIRED: DB catalog blocked; private objects retained" >&2
            exit 1
          fi
          [[ "$status" == "200" ]] || { echo "SOURCE_CATALOG_RUNTIME_NOT_READY: $status" >&2; exit 1; }
          sha="$(jq -r '.identity.git_commit_sha // ""' /tmp/source-catalog-final-runtime.json)"
          ref="$(jq -r '.identity.git_commit_ref // ""' /tmp/source-catalog-final-runtime.json)"
          [[ "$sha" == "$GITHUB_SHA" && "$ref" == "main" ]] || {
            echo "SOURCE_CATALOG_MAIN_SHA_CHANGED" >&2
            exit 1
          }
          echo "ATLAS_YOUTUBE_ARCHIVE_RUNTIME_SHA=$sha" >> "$GITHUB_ENV"

      - name: Restore and prove all 6,044 private Storage objects independently of Production
        if: ${{ inputs.phase == 'storage_only' }}
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/atlas-original-source-uploader.py \
            --root corpus \
            --output /tmp/storage-only-pass3.json \
            --expected-total-files "$SOURCE_MEMBER_COUNT" \
            --expected-total-bytes "$SOURCE_MEMBER_BYTES"
          jq -e --argjson files "$SOURCE_MEMBER_COUNT" --argjson bytes "$SOURCE_MEMBER_BYTES" '
            .uploaded==true and .files_verified==$files and .bytes_verified==$bytes
            and .new_objects==0 and .existing_objects==$files
          ' /tmp/storage-only-pass3.json >/dev/null
          # This is an upload receipt / local inventory, NOT a committed
          # canonical atlas_v2 catalog. No Production API request is permitted.
          jq '[.records[] | {object_key,sha256,byte_count,source_artifact_id,batch_label,source_kind,source_path,channel_id,video_rows}]' \
            /tmp/storage-only-pass3.json > /tmp/storage-only-inventory.json
          python /tmp/atlas-original-source-uploader.py \
            --catalog /tmp/storage-only-inventory.json \
            --output /tmp/storage-only-remote-restore.json \
            --restore-dir /tmp/storage-only-independent-restore
          jq -e --argjson files "$SOURCE_MEMBER_COUNT" --argjson bytes "$SOURCE_MEMBER_BYTES" '
            .catalog_records==$files and .restore.files==$files and .restore.bytes==$bytes
          ' /tmp/storage-only-remote-restore.json >/dev/null
          python scripts/youtube-build-person-signal-snapshot.py \
            --root /tmp/storage-only-independent-restore \
            --output /tmp/storage-only-census.json \
            --artifact-id "$SOURCE_ARTIFACT_ID" \
            --artifact-digest "$SOURCE_ARTIFACT_DIGEST"
          jq -e --argjson okchannels "${SOURCE_OK_CHANNEL_COUNT}" --argjson videos "${SOURCE_VIDEO_ROWS}" --argjson selected "${SOURCE_SELECTED_CHANNEL_COUNT}" --arg next "${SOURCE_NEXT_BATCH}" '
            .snapshot.channel_count==$okchannels and .snapshot.video_count==$videos
            and (.channels|length)==$selected
            and .snapshot.source_state.next_batch==$next
          ' /tmp/storage-only-census.json >/dev/null
          mkdir -p /tmp/storage-only-receipt
          jq -n --argjson artifact "$SOURCE_ARTIFACT_ID" --argjson videos "$SOURCE_VIDEO_ROWS" --argjson files "$SOURCE_MEMBER_COUNT" \
            --argjson bytes "$SOURCE_MEMBER_BYTES" '{
              schema:"atlas-youtube-private-storage-only-proof/v1",
              source_artifact_id:$artifact,
              private_storage_objects_verified:$files,
              bytes_restored_from_private_storage:$bytes,
              verified_video_rows:$videos,
              source_archive_restore_verified:true,
              canonical_db_catalog_written:false,
              canonical_db_catalog_verified:false,
              full_g04_durable_migration_accepted:false
            }' > /tmp/storage-only-receipt/summary.json
          cp /tmp/storage-only-remote-restore.json /tmp/storage-only-receipt/restore.json
          cp /tmp/storage-only-census.json /tmp/storage-only-receipt/census.json

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.phase == 'storage_only' }}
        with:
          name: youtube-source-private-storage-only-proof
          path: /tmp/storage-only-receipt/
          retention-days: 90

      - name: Publish exact 6,044 verified artifact members to canonical DB catalog
        if: ${{ inputs.phase == 'catalog_full' }}
        shell: bash
        run: |
          set -euo pipefail
          jq             --arg runtime "${ATLAS_YOUTUBE_ARCHIVE_RUNTIME_SHA}"             --arg publication "${GITHUB_SHA}"             '{
              runtime_sha:$runtime,
              publication_sha:$publication,
              records:[
                .records[]
                | {
                    object_key,sha256,byte_count,source_artifact_id,batch_label,
                    source_kind,channel_id,video_rows
                  }
              ]
            }' /tmp/youtube-remote-pass2.json > /tmp/youtube-catalog-request.json
          jq -e --argjson expected "${SOURCE_CATALOG_COUNT}" --argjson metadata "${SOURCE_METADATA_COUNT}" --argjson videos "${SOURCE_VIDEO_ROWS}" '
            (.records|length)==$expected
            and ([.records[]|select(.source_kind=="channel_videos")|.video_rows]|add)==$videos
            and ([.records[]|select(.source_kind=="metadata")]|length)==$metadata
          ' /tmp/youtube-catalog-request.json >/dev/null
          oidc_token="$(curl --fail-with-body --silent --show-error             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${CATALOG_AUDIENCE}" | jq -er '.value')"
          status="$(curl --silent --show-error             --output /tmp/youtube-catalog-pass1.json             --write-out '%{http_code}'             --request POST             -H 'content-type: application/json'             -H "authorization: Bearer ${oidc_token}"             --data-binary @/tmp/youtube-catalog-request.json             "${CATALOG_ENDPOINT}")"
          [[ "${status}" == "200" ]] || { cat /tmp/youtube-catalog-pass1.json >&2 || true; exit 1; }
          jq -e --argjson expected "${SOURCE_CATALOG_COUNT}" --argjson metadata "${SOURCE_METADATA_COUNT}" --argjson videos "${SOURCE_VIDEO_ROWS}" '
            .ok==true
            and .marker=="ATLAS_YOUTUBE_SOURCE_ARCHIVE_CATALOG_V1"
            and .migration.applied==[
              "20261009_youtube_durable_source_catalog.sql",
              "20261011_youtube_durable_source_complete_catalog.sql"
            ]
            and .outcome.verified_count==$expected
            and ((.outcome.inserted_count + .outcome.existing_count)==$expected)
          ' /tmp/youtube-catalog-pass1.json >/dev/null

      - name: Prove third Storage pass is zero-new
        if: ${{ inputs.phase == 'catalog_full' }}
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/atlas-original-source-uploader.py             --root corpus             --output /tmp/youtube-remote-final.json             --expected-total-files "${SOURCE_MEMBER_COUNT}"             --expected-total-bytes "${SOURCE_MEMBER_BYTES}"
          jq -e --argjson files "${SOURCE_MEMBER_COUNT}" --argjson bytes "${SOURCE_MEMBER_BYTES}" '
            .files_verified==$files
            and .bytes_verified==$bytes
            and .new_objects==0
            and .existing_objects==$files
          ' /tmp/youtube-remote-final.json >/dev/null

      - name: Prove canonical DB catalog replay is idempotent
        if: ${{ inputs.phase == 'catalog_full' }}
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$(curl --fail-with-body --silent --show-error             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${CATALOG_AUDIENCE}" | jq -er '.value')"
          status="$(curl --silent --show-error             --output /tmp/youtube-catalog-final.json             --write-out '%{http_code}'             --request POST             -H 'content-type: application/json'             -H "authorization: Bearer ${oidc_token}"             --data-binary @/tmp/youtube-catalog-request.json             "${CATALOG_ENDPOINT}")"
          [[ "${status}" == "200" ]] || { cat /tmp/youtube-catalog-final.json >&2 || true; exit 1; }
          jq -e --argjson expected "${SOURCE_CATALOG_COUNT}" --argjson metadata "${SOURCE_METADATA_COUNT}" --argjson videos "${SOURCE_VIDEO_ROWS}" '
            .ok==true
            and .outcome.idempotent==true
            and .outcome.committed==false
            and .outcome.verified_count==$expected
            and .outcome.inserted_count==0
            and .outcome.existing_count==$expected
          ' /tmp/youtube-catalog-final.json >/dev/null

      - name: Read complete catalog back from Production without local manifest input
        if: ${{ inputs.phase == 'catalog_full' }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n             --arg runtime "${ATLAS_YOUTUBE_ARCHIVE_RUNTIME_SHA}"             --arg publication "${GITHUB_SHA}"             --argjson artifact "${SOURCE_ARTIFACT_ID}"             '{operation:"read_catalog",runtime_sha:$runtime,publication_sha:$publication,source_artifact_id:$artifact}'             > /tmp/youtube-catalog-read-request.json
          oidc_token="$(curl --fail-with-body --silent --show-error             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${CATALOG_AUDIENCE}" | jq -er '.value')"
          status="$(curl --silent --show-error             --output /tmp/youtube-catalog-readback.json             --write-out '%{http_code}'             --request POST             -H 'content-type: application/json'             -H "authorization: Bearer ${oidc_token}"             --data-binary @/tmp/youtube-catalog-read-request.json             "${CATALOG_ENDPOINT}")"
          [[ "${status}" == "200" ]] || { cat /tmp/youtube-catalog-readback.json >&2 || true; exit 1; }
          jq -e --argjson files "${SOURCE_MEMBER_COUNT}" --argjson bytes "${SOURCE_MEMBER_BYTES}" --argjson sources "${SOURCE_SOURCE_COUNT}" --argjson metadata "${SOURCE_METADATA_COUNT}" --argjson videos "${SOURCE_VIDEO_ROWS}" '
            .ok==true
            and .operation=="read_catalog"
            and .outcome.record_count==$files
            and ([.outcome.records[].byte_count]|add)==$bytes
            and ([.outcome.records[]|select(.source_kind!="metadata")]|length)==$sources
            and ([.outcome.records[]|select(.source_kind=="metadata")]|length)==$metadata
            and ([.outcome.records[]|select(.source_kind=="channel_videos")|.video_rows]|add)==$videos
            and (([.outcome.records[].object_key]|unique|length)==$files)
          ' /tmp/youtube-catalog-readback.json >/dev/null
          jq '.outcome.records' /tmp/youtube-catalog-readback.json > /tmp/youtube-catalog-records.json

      - name: Delete local corpus and restore all 6,044 members from DB catalog plus private Storage only
        if: ${{ inputs.phase == 'catalog_full' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf corpus /tmp/youtube-remote-restore
          python /tmp/atlas-original-source-uploader.py             --catalog /tmp/youtube-catalog-records.json             --output /tmp/youtube-remote-restore.json             --restore-dir /tmp/youtube-remote-restore
          jq -e --argjson files "${SOURCE_MEMBER_COUNT}" --argjson bytes "${SOURCE_MEMBER_BYTES}" '
            .schema=="atlas-youtube-source-remote-restore/v1"
            and .catalog_records==$files
            and .restore.files==$files
            and .restore.bytes==$bytes
          ' /tmp/youtube-remote-restore.json >/dev/null

      - name: Rebuild authoritative census from remote-restored files only
        if: ${{ inputs.phase == 'catalog_full' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/youtube-build-person-signal-snapshot.py             --root /tmp/youtube-remote-restore             --output /tmp/youtube-remote-restore-census.json             --artifact-id "${SOURCE_ARTIFACT_ID}"             --artifact-digest "${SOURCE_ARTIFACT_DIGEST}"
          jq -e --argjson okchannels "${SOURCE_OK_CHANNEL_COUNT}" --argjson videos "${SOURCE_VIDEO_ROWS}" --argjson selected "${SOURCE_SELECTED_CHANNEL_COUNT}" --arg next "${SOURCE_NEXT_BATCH}" '
            .snapshot.channel_count==$okchannels
            and .snapshot.video_count==$videos
            and (.channels|length)==$selected
            and .snapshot.source_state.next_batch==$next
            and .snapshot.source_state.channel_ids_persisted==true
          ' /tmp/youtube-remote-restore-census.json >/dev/null

      - name: Publish sanitized durable-recovery receipts
        if: ${{ inputs.phase == 'catalog_full' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/youtube-source-storage-verification
          cp /tmp/source-artifact.json /tmp/youtube-source-storage-verification/source-artifact.json
          cp /tmp/youtube-inventory.json /tmp/youtube-source-storage-verification/local-inventory.json
          cp /tmp/youtube-remote-pass1.json /tmp/youtube-source-storage-verification/remote-pass1.json
          cp /tmp/youtube-remote-pass2.json /tmp/youtube-source-storage-verification/remote-pass2.json
          cp /tmp/youtube-catalog-pass1.json /tmp/youtube-source-storage-verification/catalog-pass1.json
          cp /tmp/youtube-remote-final.json /tmp/youtube-source-storage-verification/remote-final.json
          cp /tmp/youtube-catalog-final.json /tmp/youtube-source-storage-verification/catalog-final.json
          cp /tmp/youtube-catalog-readback.json /tmp/youtube-source-storage-verification/catalog-readback.json
          cp /tmp/youtube-remote-restore.json /tmp/youtube-source-storage-verification/remote-restore.json
          cp /tmp/youtube-remote-restore-census.json /tmp/youtube-source-storage-verification/remote-restore-census.json
          jq --slurpfile catalog /tmp/youtube-catalog-final.json --slurpfile restore /tmp/youtube-remote-restore.json '{
            schema:"atlas-youtube-durable-recovery-receipt/v1",
            source_artifact_id:.source_artifact_id,
            object_count:.files_verified,
            member_bytes:.bytes_verified,
            storage_existing:.existing_objects,
            storage_new:.new_objects,
            source_records:.source_records,
            metadata_objects:.metadata_objects,
            catalog:$catalog[0].outcome,
            restore:$restore[0].restore
          }' /tmp/youtube-remote-final.json             > /tmp/youtube-source-storage-verification/summary.json

      - name: Upload durable-recovery evidence
        if: ${{ inputs.phase == 'catalog_full' }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-source-storage-verification
          path: /tmp/youtube-source-storage-verification
          retention-days: 90
