name: TEMP Spatial B46-B51 Apply

on:
  push:
    branches:
      - ops/spatial-backfill-b46-b51
    paths:
      - scripts/temp-apply-spatial-b46-b51.mjs
      - .github/workflows/temp-spatial-b46-b51-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/spatial-backfill-b46-b51
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed B46-B51 mappings
        run: node scripts/temp-apply-spatial-b46-b51.mjs
      - name: Run focused spatial regression tests
        run: node --test tests/person-spacetime-spatial-index-coverage.test.mjs tests/spacetime-taxonomy-migration.test.mjs
      - name: Commit clean three-file delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/temp-apply-spatial-b46-b51.mjs .github/workflows/temp-spatial-b46-b51-apply.yml
          git add atlas-polity-spatial-index.json tests/person-spacetime-spatial-index-coverage.test.mjs tests/spacetime-taxonomy-migration.test.mjs
          git commit -m 'Backfill spacetime polity placements batches 46-51'
          git push origin HEAD:ops/spatial-backfill-b46-b51
