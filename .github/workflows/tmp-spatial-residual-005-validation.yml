name: Temporary Spatial Residual 005 Validation

on:
  push:
    branches:
      - agent/spatial-reviewed-residual-005

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/compile-spatial-bindings.mjs --validate-only
