name: ATLAS Batch 28 Spatial Apply

on:
  push:
    branches:
      - agent/spacetime-polity-placement-batch-28

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed batch 28 spatial placements
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const indexPath = 'atlas-polity-spatial-index.json';
          const testPath = 'tests/person-spacetime-spatial-index-coverage.test.mjs';
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          const additions = [
            ['8b7ad57e-7d39-4c6d-b8e7-2f56042e8504', 'africa', 'central-africa'],
            ['8cb306f1-0c0a-4d4e-9f10-6cb463560620', 'africa', 'west-africa'],
            ['88688560-e9bf-4a0c-bb9c-1bfe13b63270', 'africa', 'east-africa-horn'],
            ['c9c9ed4f-17ff-496a-a2b3-d949c631eb22', 'europe', 'balkans'],
            ['205a2743-4f5a-48fe-82ad-7b94ce6069eb', 'americas', 'south-america'],
            ['43a5b3df-4e3b-47a4-903e-d6d88d418109', 'europe', 'balkans'],
            ['119a310f-39e4-42e5-bf37-5743816636ca', 'europe', 'britain-ireland'],
            ['73e2c4b6-c071-4ca0-8309-9a866a60b8c2', 'oceania', 'pacific-islands'],
            ['645bd693-a323-4a2c-a5c0-71d72cc0b4e8', 'europe', 'britain-ireland'],
            ['70956451-95ae-495a-9297-b8e2a8cfca06', 'europe', 'iberia']
          ];
          for (const [id, region, subregion] of additions) {
            if (index.polity_geography[id] || index.polity_subregions[id]) {
              throw new Error(`Batch 28 polity already mapped: ${id}`);
            }
            index.polity_geography[id] = region;
            index.polity_subregions[id] = subregion;
          }
          index.polity_geography = Object.fromEntries(Object.entries(index.polity_geography).sort(([a],[b]) => a.localeCompare(b)));
          index.polity_subregions = Object.fromEntries(Object.entries(index.polity_subregions).sort(([a],[b]) => a.localeCompare(b)));
          index.generated_at = new Date().toISOString();
          fs.writeFileSync(indexPath, JSON.stringify(index, null, 2) + '\n');

          let test = fs.readFileSync(testPath, 'utf8');
          if (!test.includes('Object.keys(index.polity_geography).length, 590')) throw new Error('Expected geography baseline 590 not found');
          if (!test.includes('Object.keys(index.polity_subregions).length, 564')) throw new Error('Expected subregion baseline 564 not found');
          test = test.replace('Object.keys(index.polity_geography).length, 590', 'Object.keys(index.polity_geography).length, 600');
          test = test.replace('Object.keys(index.polity_subregions).length, 564', 'Object.keys(index.polity_subregions).length, 574');
          fs.writeFileSync(testPath, test);
          NODE
      - name: Commit batch 28 and remove temporary artifacts
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/atlas-batch28-apply.yml
          rm -f tmp/batch28-unmapped.json
          git add atlas-polity-spatial-index.json tests/person-spacetime-spatial-index-coverage.test.mjs tmp/batch28-unmapped.json || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Backfill clear spacetime polity placements batch 28'
          git push origin HEAD:agent/spacetime-polity-placement-batch-28
