name: YouTube B024 three original-ID official snippet evidence (manual, read-only)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/youtube-b024-first3-official-metadata.yml'
      - 'scripts/youtube-b024-first3-official-metadata.py'
      - 'scripts/youtube-b024-first3-public-player-probe.py'
      - 'tests/test_youtube_b024_first3_public_player_probe.py'
      - 'tests/atlas-youtube-b024-first3-public-player-probe.test.mjs'
      - 'scripts/youtube-b024-verify-first-12-original-zip.py'
      - 'scripts/youtube-source-video-description-enrich.py'
      - 'audits/youtube-b024-first-12-original-zip-direct-replay-20261018.json'
      - 'audits/youtube-b024-first-12-original-title-triage-20261016.json'
      - 'audits/youtube-b024-first-12-metadata-review-request.json'
      - 'tests/test_youtube_b024_first3_official_metadata.py'
      - 'tests/atlas-youtube-b024-first3-official-metadata.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-b024-official-original-three-snippets
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline verified-source and one-batch API-contract tests
        run: |
          python3 -m unittest discover -s tests -p test_youtube_b024_first12_original_zip_replay.py -v
          python3 -m unittest discover -s tests -p test_youtube_b024_first3_official_metadata.py -v
          node --test tests/atlas-youtube-b024-first3-official-metadata.test.mjs
      - name: Offline preflight — ZERO external requests
        run: |
          python3 scripts/youtube-b024-first3-official-metadata.py \
            --output /tmp/yt-b024-first3-preflight.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/yt-b024-first3-preflight.json',encoding='utf8'))
          assert x['official_youtube_api_calls']==0
          assert x['current_channel_ids_verified']==0
          assert x['actual_video_playback_or_transcript_certified']==0
          assert x['publication_authorized'] is False
          assert x['original_video_ids']==['-13y_Jm-pzI','-1CalygxBrM','-5Lg5mk74NA']
          PY

  metadata:
    # workflow_dispatch only becomes available after this file exists on main.
    # The workflow never merges code, writes ATLAS or calls Vercel.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable source and exact three-video request
        run: |
          python3 -m unittest discover -s tests -p test_youtube_b024_first12_original_zip_replay.py -v
          python3 -m unittest discover -s tests -p test_youtube_b024_first3_official_metadata.py -v
          python3 scripts/youtube-b024-first3-official-metadata.py \
            --output /tmp/yt-b024-first3-preflight.json
      - name: One explicit official snippet batch for three exact original Video IDs
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$YOUTUBE_DATA_API_KEY" ]; then
            echo 'YOUTUBE_DATA_API_KEY_NOT_CONFIGURED_NO_EXTERNAL_QUERY'
            exit 1
          fi
          mkdir -p /tmp/yt-b024-official-first3
          python3 scripts/youtube-b024-first3-official-metadata.py \
            --fetch \
            --output /tmp/yt-b024-official-first3/channel-status.json \
            --metadata-output /tmp/yt-b024-official-first3/official-snippets.json
      - name: Summarize real source status — NOT biography certification
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('/tmp/yt-b024-official-first3/channel-status.json')
          result=json.loads(p.read_text(encoding='utf8'))
          assert result['official_youtube_videos_list_batches']==1
          assert result['official_requested_original_video_ids']==3
          assert result['official_metadata_rows_processed']==3
          assert sum(result[key] for key in (
            'source_video_channel_id_matches',
            'source_video_channel_id_mismatches',
            'source_video_not_found_or_unavailable'))==3
          assert result['actual_video_playback_or_timestamped_transcript_reviews']==0
          assert result['person_primary_content_certifications']==0
          assert result['latest_registered_person_screen_complete'] is False
          assert result['production_writes']==0
          assert result['publication_authorized'] is False
          lines=[
            '## B024 original three-video official snippet results — NOT content certification',
            '- YouTube videos.list(snippet) API batches: 1',
            '- Exact original Video IDs requested: 3',
            f"- Channel IDs matching archived originals: {result['source_video_channel_id_matches']}",
            f"- Channel mismatch HOLDs: {result['source_video_channel_id_mismatches']}",
            f"- Unavailable HOLDs: {result['source_video_not_found_or_unavailable']}",
            '- Watched or timestamped transcript approvals: 0',
            '- Registered Person exclusion: NOT EXECUTED',
            '- ATLAS/Production writes: 0',
            '',
            '| Original Video ID | Official source-channel check |',
            '|---|---|'
          ]
          lines += [f"| {r['video_id']} | {r['review_stage']} |"
                    for r in result['records']]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as f:
            f.write('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-b024-first3-original-official-snippets-${{ github.run_id }}
          path: /tmp/yt-b024-official-first3/
          retention-days: 14
          if-no-files-found: error

  public_player_probe:
    # Public YouTube player metadata is weaker than official videos.list
    # and proves neither real captions nor biography centrality. NO secrets.
    # Runs for the three fixed B024 original IDs ONLY on this PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline original-source spoofing and nonpublication regressions
        run: |
          python3 -m unittest discover -s tests -p test_youtube_b024_first3_public_player_probe.py -v
      - name: Install EXISTING corpus extractor dependency (no credentials)
        run: python3 -m pip install --disable-pip-version-check yt-dlp
      - name: Read ONLY three original public-player metadata records
        run: |
          python3 scripts/youtube-b024-first3-public-player-probe.py \
            --fetch-public-player \
            --output /tmp/yt-b024-first3-player-status.json
      - name: Show only statuses and caption TRACK availability, not proof
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path('/tmp/yt-b024-first3-player-status.json').read_text())
          assert x['source_original_video_count']==3
          assert x['public_player_queries_attempted']==3
          assert x['person_primary_content_certifications']==0
          assert x['original_video_watched_or_transcript_bytes_verified']==0
          assert x['publication_authorized'] is False and x['production_writes']==0
          lines=[
            '## Exact original B024 public-player access probe — NOT YouTube API / watched proof',
            '- Three source-bound URLs requested, no API key and zero ATLAS/Production writes',
            '- Public player channel match is **not official videos.list(snippet) verification**',
            '- Subtitle language availability is **not downloaded transcript bytes**',
            '',
            '| Original Video ID | Public player status | Manual track languages | Automatic track languages |',
            '|---|---|---|---|'
          ]
          for r in x['records']:
            langs=lambda k:', '.join(r[k]['languages']) or 'none shown'
            lines.append(f"| {r['video_id']} | {r['public_player_status']} | {langs('player_subtitle_tracks')} | {langs('player_automatic_caption_tracks')} |")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as f:
            f.write('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-b024-first3-public-player-status-${{ github.run_id }}
          path: /tmp/yt-b024-first3-player-status.json
          retention-days: 14
          if-no-files-found: error
