name: ATLAS Spatial Branch Compile

on:
  push:
    branches:
      - agent/spatial-live-unplaced-review-20260907

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spatial-live-unplaced-review-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile canonical Spatial index
        shell: bash
        run: |
          set -euo pipefail
          node scripts/compile-spatial-bindings.mjs
          git diff --check
          if git diff --quiet -- atlas-polity-spatial-index.json; then
            echo 'Canonical Spatial index already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas-polity-spatial-index.json
          git commit -m 'Compile reviewed Spatial index'
          git push origin HEAD:agent/spatial-live-unplaced-review-20260907
