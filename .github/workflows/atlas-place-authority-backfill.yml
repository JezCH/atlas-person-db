name: ATLAS Place Authority Backfill

on:
  push:
    branches:
      - main
    paths:
      - 'data/core/polity-place-function-authority-backfill.v1.json'
      - 'db/migrations/20261001_polity_place_function_authority.sql'
      - 'server/atlas-polity-place-function-authority-backfill.js'
      - 'server/atlas-polity-place-function-service.js'
      - 'server/atlas-authoring-apply-handler.js'
      - '.github/workflows/atlas-place-authority-backfill.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-authoring-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      ATLAS_AUTHORING_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-authoring-apply
      ATLAS_AUTHORING_AUDIENCE: atlas-person-db-authoring
      ATLAS_AUTHORING_TRANSPORT_VERSION: '2'
    steps:
      - uses: actions/checkout@v4

      - name: Wait for exact Production runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error --output /tmp/readiness.json --write-out '%{http_code}' "$ATLAS_AUTHORING_ENDPOINT")"
            if [[ "$status" == "200" ]]; then
              runtime_sha="$(jq -r '.runtime_sha // ""' /tmp/readiness.json)"
              if [[ "$runtime_sha" == "$GITHUB_SHA" ]]; then
                echo "Exact Production runtime ready: $runtime_sha"
                exit 0
              fi
            fi
            sleep 5
          done
          cat /tmp/readiness.json >&2 || true
          echo "PLACE_AUTHORITY_PRODUCTION_RUNTIME_NOT_EXACT:$GITHUB_SHA" >&2
          exit 1

      - name: Apply canonical Place authority backfill
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ATLAS_AUTHORING_AUDIENCE}" | jq -er '.value')"
          payload="$(jq -cn \
            --argjson transport_version "$ATLAS_AUTHORING_TRANSPORT_VERSION" \
            --arg runtime_sha "$GITHUB_SHA" \
            --arg authoring_sha "$GITHUB_SHA" \
            '{operation:"backfill_polity_place_function_authority",transport_version:$transport_version,runtime_sha:$runtime_sha,authoring_sha:$authoring_sha}')"
          status="$(curl --silent --show-error \
            --output /tmp/backfill.json \
            --write-out '%{http_code}' \
            --request POST \
            -H 'content-type: application/json' \
            -H "authorization: Bearer ${oidc_token}" \
            --data "$payload" \
            "$ATLAS_AUTHORING_ENDPOINT")"
          if [[ "$status" != "200" ]]; then
            cat /tmp/backfill.json >&2 || true
            echo "PLACE_AUTHORITY_BACKFILL_FAILED:HTTP_$status" >&2
            exit 1
          fi
          jq -e --arg sha "$GITHUB_SHA" '
            .ok==true
            and .marker=="ATLAS_POLITY_PLACE_FUNCTION_AUTHORITY_BACKFILL_V1"
            and .operation=="backfill_polity_place_function_authority"
            and .runtime_sha==$sha
            and .authoring_sha==$sha
            and .committed==true
            and .counts.polities==13
            and .counts.places==20
            and .counts.sources==27
            and .counts.facts==23
            and .counts.source_links>=27
          ' /tmp/backfill.json >/dev/null
          jq . /tmp/backfill.json
