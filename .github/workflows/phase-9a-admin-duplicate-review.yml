name: Phase 9A Admin Duplicate Review V2

on:
  pull_request:
    paths:
      - "api/atlas-duplicate-review.js"
      - "server/atlas-duplicate-*.js"
      - "atlas-admin-duplicate-review.js"
      - "admin.*"
      - "migration/phase-9/**"
      - "tests/atlas-duplicate-detector.test.mjs"
      - "tests/phase9a-admin-duplicate-review-contract.test.mjs"
      - ".github/workflows/phase-9a-admin-duplicate-review.yml"
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact current main SHA approved for Phase 9A review schema apply
        required: true
        type: string
      confirm:
        description: Type PHASE9A_APPLY_DUPLICATE_REVIEW_SCHEMA
        required: true
        type: string

permissions:
  contents: read

jobs:
  static-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Phase 9A review contracts
        run: node --test tests/atlas-duplicate-detector.test.mjs tests/phase9a-admin-duplicate-review-contract.test.mjs

  protected-schema-apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: phase-5-shadow
    steps:
      - name: Guard exact main SHA and confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref }}" = "refs/heads/main"
          test "${{ inputs.approved_sha }}" = "${{ github.sha }}"
          test "${{ inputs.confirm }}" = "PHASE9A_APPLY_DUPLICATE_REVIEW_SCHEMA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Re-run static contract before DB connection
        run: node --test tests/atlas-duplicate-detector.test.mjs tests/phase9a-admin-duplicate-review-contract.test.mjs
      - name: Apply normalized review schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PHASE9A_OUTPUT_DIR: migration/phase-9/tmp/schema-apply
        run: node migration/phase-9/scripts/phase9a-apply-duplicate-review-schema.mjs
      - name: Upload schema evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9a-admin-duplicate-review-${{ inputs.approved_sha }}
          path: migration/phase-9/tmp/schema-apply
          if-no-files-found: error
          retention-days: 90
