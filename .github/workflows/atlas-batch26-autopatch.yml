name: ATLAS Batch 26 Autopatch

on:
  push:
    branches:
      - agent/spacetime-polity-placement-batch-25

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply batch 26 spatial bindings
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const indexPath = 'atlas-polity-spatial-index.json';
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          const additions = [
            ['02e66261-7798-4144-b298-9bc41ee2215b','europe','central-europe'],
            ['10563573-5f40-450e-a1ee-7694298e9d85','southeast-asia','maritime-southeast-asia'],
            ['a059470d-3985-4a0c-a3b0-e1de2f47e2f6','americas','south-america'],
            ['4895425d-17de-4353-a36f-53e9d7f34a9a','europe','italy'],
            ['50c107ff-1816-45df-9006-fa0cc07735f0','americas','mesoamerica'],
            ['2ca2fd4c-1d68-4771-beb7-706e4f53370b','africa','west-africa'],
            ['595a1d18-0afc-4940-aa16-3f33ae2e38bb','europe','balkans'],
            ['31f3241a-d772-4fe4-a1d1-870c60470dff','europe','balkans'],
            ['12f586f7-472f-4c27-8c65-878329e01c81','africa','west-africa'],
            ['4d6cea58-b611-47ba-96c4-b51c7bed1400','southeast-asia','mainland-southeast-asia']
          ];
          for (const [id, macro, sub] of additions) {
            if (index.polity_geography[id] || index.polity_subregions[id]) throw new Error(`already mapped: ${id}`);
            index.polity_geography[id] = macro;
            index.polity_subregions[id] = sub;
          }
          const sorted = (obj) => Object.fromEntries(Object.entries(obj).sort(([a],[b]) => a.localeCompare(b)));
          index.polity_geography = sorted(index.polity_geography);
          index.polity_subregions = sorted(index.polity_subregions);
          index.generated_at = '2026-09-04T17:19:00+09:00';
          fs.writeFileSync(indexPath, JSON.stringify(index, null, 2) + '\n');
          function replaceExact(path, before, after) {
            let text = fs.readFileSync(path, 'utf8');
            if (!text.includes(before)) throw new Error(`${path}: missing expected text ${before}`);
            text = text.replace(before, after);
            fs.writeFileSync(path, text);
          }
          replaceExact('tests/person-spacetime-spatial-index-coverage.test.mjs','assert.equal(Object.keys(index.polity_geography).length, 570);','assert.equal(Object.keys(index.polity_geography).length, 580);');
          replaceExact('tests/person-spacetime-spatial-index-coverage.test.mjs','assert.equal(Object.keys(index.polity_subregions).length, 544);','assert.equal(Object.keys(index.polity_subregions).length, 554);');
          replaceExact('tests/spacetime-taxonomy-migration.test.mjs','  mesoamerica: 16,','  mesoamerica: 17,');
          replaceExact('tests/spacetime-taxonomy-migration.test.mjs','assert.equal(Object.keys(index.polity_subregions).length, 544);','assert.equal(Object.keys(index.polity_subregions).length, 554);');
          NODE
      - name: Commit clean batch 26 diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/atlas-batch26-autopatch.yml
          git add atlas-polity-spatial-index.json tests/person-spacetime-spatial-index-coverage.test.mjs tests/spacetime-taxonomy-migration.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Backfill clear spacetime polity placements batch 26'
          git push origin HEAD:agent/spacetime-polity-placement-batch-25
