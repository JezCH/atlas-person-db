name: ATLAS Batch 21 Autopatch

on:
  push:
    branches:
      - agent/spacetime-polity-placement-batch-21-r2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply batch 21 spatial bindings
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const indexPath = 'atlas-polity-spatial-index.json';
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          const additions = [
            ['3ffddcfc-3b59-4018-897b-01f231d48e10','africa','maghreb-north-africa'],
            ['c20b5ee3-dc77-436c-b9b3-f59e81bd9010','americas','north-america'],
            ['3050d178-7fea-43e8-ac6a-62e147b47dbb','east-asia','japan'],
            ['add09a6e-b1e5-4bb9-a30f-4716858d6958','east-asia','japan'],
            ['37901a60-0465-485e-aced-bf92814d0c93','europe','northern-europe'],
            ['92bfddd6-90ab-4544-9250-3dd10d6d0326','central-asia','western-central-asia'],
            ['45b5c3f2-f28b-42ea-857d-2d3450132dbe','east-asia','japan'],
            ['34be68d6-2b96-4eac-a19c-a96b8ecf605c','europe','western-europe'],
            ['37374f6c-6f86-4fd2-97c8-df1ef1bffba6','southeast-asia','mainland-southeast-asia'],
            ['0e0d2c95-6ffb-40f2-8e2f-e98ab15c6f5a','africa','central-africa']
          ];
          for (const [id, macro, sub] of additions) {
            if (index.polity_geography[id] || index.polity_subregions[id]) throw new Error(`already mapped: ${id}`);
            index.polity_geography[id] = macro;
            index.polity_subregions[id] = sub;
          }
          const sorted = (obj) => Object.fromEntries(Object.entries(obj).sort(([a],[b]) => a.localeCompare(b)));
          index.polity_geography = sorted(index.polity_geography);
          index.polity_subregions = sorted(index.polity_subregions);
          index.generated_at = '2026-09-04T14:46:00+09:00';
          fs.writeFileSync(indexPath, JSON.stringify(index, null, 2) + '\n');

          function replaceExact(path, before, after) {
            let text = fs.readFileSync(path, 'utf8');
            if (!text.includes(before)) throw new Error(`${path}: missing expected text ${before}`);
            text = text.replace(before, after);
            fs.writeFileSync(path, text);
          }
          replaceExact('tests/person-spacetime-spatial-index-coverage.test.mjs',
            'assert.equal(Object.keys(index.polity_geography).length, 525);',
            'assert.equal(Object.keys(index.polity_geography).length, 535);');
          replaceExact('tests/person-spacetime-spatial-index-coverage.test.mjs',
            'assert.equal(Object.keys(index.polity_subregions).length, 499);',
            'assert.equal(Object.keys(index.polity_subregions).length, 509);');
          replaceExact('tests/spacetime-taxonomy-migration.test.mjs',
            '  "maghreb-north-africa": 9,',
            '  "maghreb-north-africa": 10,');
          replaceExact('tests/spacetime-taxonomy-migration.test.mjs',
            'assert.equal(Object.keys(index.polity_subregions).length, 499);',
            'assert.equal(Object.keys(index.polity_subregions).length, 509);');
          NODE
      - name: Commit clean batch 21 diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/atlas-batch21-autopatch.yml
          git add atlas-polity-spatial-index.json tests/person-spacetime-spatial-index-coverage.test.mjs tests/spacetime-taxonomy-migration.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Backfill clear spacetime polity placements batch 21'
          git push origin HEAD:agent/spacetime-polity-placement-batch-21-r2
