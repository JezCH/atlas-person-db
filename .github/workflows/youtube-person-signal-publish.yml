name: YouTube Person Signal Publish

on:
  # Publish only explicitly specified validated artifacts.
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Workflow run containing the cumulative YouTube artifact"
        required: true
        type: string
      artifact_name:
        description: "Cumulative artifact name"
        required: true
        type: string
      artifact_id:
        description: "Artifact numeric ID for provenance"
        required: true
        type: string
      artifact_digest:
        description: "Artifact SHA-256 digest"
        required: true
        type: string
  workflow_call:
    inputs:
      artifact_run_id:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
      artifact_digest:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: write
  id-token: write

concurrency:
  group: atlas-youtube-person-signal-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      PUBLISH_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-authoring-apply?__atlas_authoring_apply_surface=youtube-person-signal-publish
      RUNTIME_IDENTITY_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-read?__atlas_read_surface=runtime-identity
      PUBLISH_AUDIENCE: atlas-person-db-youtube-signal-publish
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify multilingual names and reviewed spelling variants before production reads
        run: node --test tests/atlas-youtube-incremental-review.test.mjs

      - name: Verify source artifact immutable GitHub digest and identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" |
            jq -e --arg digest "$ARTIFACT_DIGEST" --arg name "$ARTIFACT_NAME" \
              --argjson id "$ARTIFACT_ID" \
              '.id==$id and .name==$name and .digest==$digest and .expired==false' >/dev/null

      - name: Download cumulative discovery artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: corpus
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify bounded Production reads offline
        run: python -m unittest discover -s tests -p test_youtube_read_budget.py -v

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check pycountry

      - name: Verify v5 contextual original-video-ID extraction
        run: python -m unittest discover -s tests -p test_youtube_v5_contextual_source_publisher.py -v

      # All Production reads must remain strictly bounded; an HTTP 402 is terminal.
      - name: Snapshot active Production before publication
        shell: bash
        run: |
          set -euo pipefail
          python scripts/youtube-fetch-previous-signals.py \
            --endpoint 'https://atlas-person-db.vercel.app/api/atlas-read?__atlas_read_surface=youtube-person-signals' \
            --output /tmp/atlas-youtube-publication/previous.json


      # The public discovery read filters out registered and other raw names.
      # It must NEVER be used as the complete raw publication baseline.
      # The OIDC-only database publisher now performs the full prior-label and
      # Channel-ID non-regression check atomically from the prior raw tables.
      - name: Build exact reconstructable snapshot
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/youtube-build-person-signal-snapshot.py
          mkdir -p /tmp/atlas-youtube-publication
          python scripts/youtube-build-person-signal-snapshot.py             --root corpus             --output /tmp/atlas-youtube-publication/snapshot.json             --artifact-id "$ARTIFACT_ID"             --artifact-digest "$ARTIFACT_DIGEST" --reviewed-source-aliases audits/youtube-b024-v5-reviewed-alias-nameforms.json             
          jq -e '
            .snapshot.channel_count>=8508
            and .snapshot.video_count>=1950864
            and (.channels|length)>=9270
            and .snapshot.source_state.channel_ids_persisted==true
            and (.channels|length)>=6770
            and (.channels|length)>=.snapshot.channel_count
            and ((.signals|length)==(.snapshot.threshold_counts["3"]))
            and .snapshot.parser_version=="yt-title-person-reviewed-v5"
            and .snapshot.source_state.additional_title_context_extraction==true
            and .snapshot.source_state.source_name_generation_independent_of_registered_persons==true
            and .snapshot.source_state.title_context_personhood=="source_title_review_candidate_not_verified_person"
            and (.snapshot.source_state.quality_counters.accepted_context_cue_video_name_ids>0)
            and .snapshot.source_state.reviewed_source_unions_count==5
            and (.snapshot.source_state.reviewed_source_unions|length)==5
            and .snapshot.source_state.reviewed_source_unions_nameform_only_not_biography==true
            and .snapshot.source_state.quality_rules_version=="reviewed-20261008-v2"
            and (.snapshot.source_state.quality_counters.reviewed_non_person>0)
            and (.snapshot.source_state.quality_counters.numbered_title_metadata>0)
            and (.signals | length)>0
            and ([.signals[].raw_name | ascii_downcase] | index("covid-19")==null)
            and ([.signals[].raw_name | ascii_downcase] | index("exclusive")==null)
            and ([.signals[].raw_name | ascii_downcase] | index("pompeii")==null)
            and ([.signals[].raw_name | ascii_downcase] | index("preview")==null)
            and ([.signals[].raw_name | ascii_downcase] | index("knights templar")==null)
            and ([.signals[].raw_name | ascii_downcase] | index("the holocaust")==null)
            and ([.signals[].raw_name | ascii_downcase] | index("abraham lincoln biography")==null)
            and ([.signals[].raw_name | ascii_downcase] | index("avicenna")==null)
            and ([.signals[].raw_name | ascii_downcase] | index("ibn sina")!=null)
            and (.snapshot.source_state.next_batch | test("^batch[0-9]{3,}$"))
          ' /tmp/atlas-youtube-publication/snapshot.json >/dev/null
          jq '{snapshot:.snapshot, publication_fingerprint, channel_rows:(.channels|length), signal_rows:(.signals|length)}'             /tmp/atlas-youtube-publication/snapshot.json

      - name: Wait for publication route and resolve deployed runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            route_status="$(curl --silent --show-error --output /tmp/atlas-youtube-publication/route.json --write-out '%{http_code}' "$PUBLISH_ENDPOINT")"
            if [[ "$route_status" == "405" ]]; then
              identity_status="$(curl --silent --show-error --output /tmp/atlas-youtube-publication/runtime.json --write-out '%{http_code}' "$RUNTIME_IDENTITY_ENDPOINT")"
              if [[ "$identity_status" == "200" ]]; then
                runtime_sha="$(jq -r '.identity.git_commit_sha // ""' /tmp/atlas-youtube-publication/runtime.json)"
                runtime_ref="$(jq -r '.identity.git_commit_ref // ""' /tmp/atlas-youtube-publication/runtime.json)"
                if [[ "$runtime_sha" =~ ^[0-9a-f]{40}$ && "$runtime_ref" == "main" ]]; then
                  echo "ATLAS_YOUTUBE_RUNTIME_SHA=$runtime_sha" >> "$GITHUB_ENV"
                  echo "Publication route live on runtime $runtime_sha"
                  exit 0
                fi
              fi
            fi
            echo "Publication route/runtime not ready (attempt $attempt/90); retrying in 5s."
            sleep 5
          done
          cat /tmp/atlas-youtube-publication/route.json >&2 || true
          cat /tmp/atlas-youtube-publication/runtime.json >&2 || true
          echo "YOUTUBE_PUBLICATION_RUNTIME_NOT_READY" >&2
          exit 1


      - name: Read current canonical Person identities
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 1 --max-filesize 2097152 --max-time 45 \
            -H 'accept: application/json' \
            'https://atlas-person-db.vercel.app/api/atlas-person-read?view=identity' \
            --output /tmp/atlas-youtube-current-persons.json
          jq -e '.ok==true and .mode=="list" and .projection=="identity" and (.persons | length)>=2000' \
            /tmp/atlas-youtube-current-persons.json >/dev/null

      - name: Generate automatic incremental Person audit
        shell: bash
        run: |
          set -euo pipefail
          jq -e --slurpfile prev /tmp/atlas-youtube-publication/previous.json '
            .snapshot.channel_count >= $prev[0].snapshot.channel_count
            and .snapshot.video_count >= $prev[0].snapshot.video_count
            and (.channels|length) >= $prev[0].snapshot.channel_count
          ' /tmp/atlas-youtube-publication/snapshot.json >/dev/null
          node scripts/youtube-incremental-review.mjs \
            --current /tmp/atlas-youtube-publication/snapshot.json \
            --previous /tmp/atlas-youtube-publication/previous.json \
            --persons /tmp/atlas-youtube-current-persons.json \
            --decisions audits/youtube-reviewed-dispositions.json \
            --output /tmp/atlas-youtube-publication/audit
          jq -r '
            "### YouTube Person incremental review\n" +
            "- Previous: " + .summary.previous_snapshot + "\n" +
            "- Current: " + .summary.current_snapshot + "\n" +
            "- Newly surfaced names: " + (.summary.new_raw_names|tostring) + "\n" +
            "- Newly needing evidence: " + (.summary.attention_total|tostring) + "\n" +
            "- P0/P1/P2: " + (.summary.attention_p0|tostring) + "/" +
              (.summary.attention_p1|tostring) + "/" + (.summary.attention_p2|tostring)
          ' /tmp/atlas-youtube-publication/audit/audit.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish append-only snapshot
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$(curl --fail-with-body --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$PUBLISH_AUDIENCE" | jq -er '.value')"

          jq             --arg runtime "$ATLAS_YOUTUBE_RUNTIME_SHA"             --arg publication "$GITHUB_SHA"             '. + {runtime_sha:$runtime, publication_sha:$publication}'             /tmp/atlas-youtube-publication/snapshot.json             > /tmp/atlas-youtube-publication/request.json

          status="$(curl --silent --show-error             --output /tmp/atlas-youtube-publication/response.json             --write-out '%{http_code}'             --request POST             -H 'content-type: application/json'             -H "authorization: Bearer $oidc_token"             --data-binary @/tmp/atlas-youtube-publication/request.json             "$PUBLISH_ENDPOINT")"
          [[ "$status" == "200" ]] || {
            cat /tmp/atlas-youtube-publication/response.json >&2 || true
            echo "YouTube publication failed: HTTP $status" >&2
            exit 1
          }
          jq -e '
            .ok==true
            and .marker=="ATLAS_YOUTUBE_PERSON_SIGNAL_PUBLICATION_V2"
            and (.outcome.committed==true or .outcome.idempotent==true)
            and (.outcome.snapshot_id | type=="string")
          ' /tmp/atlas-youtube-publication/response.json >/dev/null
          jq . /tmp/atlas-youtube-publication/response.json

      - name: Verify Production read model switched to published snapshot
        shell: bash
        run: |
          set -euo pipefail
          snapshot_id="$(jq -r '.snapshot.snapshot_id' /tmp/atlas-youtube-publication/snapshot.json)"
          expected_channels="$(jq -r '.snapshot.channel_count' /tmp/atlas-youtube-publication/snapshot.json)"
          expected_videos="$(jq -r '.snapshot.video_count' /tmp/atlas-youtube-publication/snapshot.json)"
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error               --output /tmp/atlas-youtube-publication/verify.json               --write-out '%{http_code}'               'https://atlas-person-db.vercel.app/api/atlas-read?__atlas_read_surface=youtube-person-signals&min_channels=3&limit=5')"
            if [[ "$status" == "200" ]] && jq -e               --arg id "$snapshot_id"               --argjson channels "$expected_channels"               --argjson videos "$expected_videos" '
                .ok==true
                and .snapshot.snapshot_id==$id
                and .snapshot.channel_count==$channels
                and .snapshot.video_count==$videos
                and .snapshot.source_state.channel_ids_persisted==true
                and .snapshot.snapshot_scope=="global_reconciled"
              ' /tmp/atlas-youtube-publication/verify.json >/dev/null; then
              jq . /tmp/atlas-youtube-publication/verify.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/atlas-youtube-publication/verify.json >&2 || true
          echo "YOUTUBE_PUBLICATION_READBACK_MISMATCH" >&2
          exit 1

      - name: Notify existing full-review backlog of new high-priority names
        # GitHub Issue posting is advisory. A permission failure must never
        # roll back a successfully published immutable signal snapshot.
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(jq -r '.summary.attention_total' /tmp/atlas-youtube-publication/audit/audit.json)"
          if [[ "$count" -gt 0 ]]; then
            jq -r \
              --arg run "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '
              "### 새 스냅샷 증분 인물 검토 대기열\n" +
              "- Snapshot: `" + .summary.current_snapshot + "`\n" +
              "- 신규 표시명: " + (.summary.new_raw_names|tostring) + "\n" +
              "- 검토가 필요한 신규/등급 상승: " + (.summary.attention_total|tostring) + "\n" +
              "- P0/P1/P2: " + (.summary.attention_p0|tostring) + "/" +
                  (.summary.attention_p1|tostring) + "/" + (.summary.attention_p2|tostring) + "\n" +
              "- 검토용 CSV와 JSON 아티팩트: " + $run + "\n" +
              "- 기존 #2216 검토 누적 건수는 재계산하기 전까지 종결하지 않음."
            ' /tmp/atlas-youtube-publication/audit/audit.json \
              > /tmp/atlas-youtube-publication/audit/issue-update.md
            gh issue comment 2216 --repo "$GITHUB_REPOSITORY" \
              --body-file /tmp/atlas-youtube-publication/audit/issue-update.md
          fi

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-person-signal-publication-${{ github.sha }}
          path: /tmp/atlas-youtube-publication/
          if-no-files-found: error
          retention-days: 90
