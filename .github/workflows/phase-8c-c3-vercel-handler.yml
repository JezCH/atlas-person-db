name: Phase 8C C3 Vercel Handler

on:
  pull_request:
    paths:
      - "server/atlas-vercel-mutation-handler.js"
      - "tests/atlas-vercel-mutation-handler.test.mjs"
      - ".github/workflows/phase-8c-c3-vercel-handler.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run handler boundary tests
        run: node --test tests/atlas-vercel-mutation-handler.test.mjs
      - name: Verify browser secret boundary
        run: |
          set -euo pipefail
          ! grep -q "atlas-vercel-mutation-handler.js" index.html admin.html
          ! grep -R "ATLAS_MUTATION_TOKEN\|SUPABASE_DB_URL\|postgres://\|postgresql://\|service_role" index.html admin.html app.js admin.js
