name: ATLAS Human Authoring Operational Parity

on:
  pull_request:
    paths:
      - '.github/workflows/atlas-human-authoring-operational-parity.yml'
      - 'scripts/rehearse-human-authoring-operational-parity.mjs'
      - 'server/atlas-human-authoring-service.js'
      - 'server/atlas-authoring-*.js'
      - 'server/atlas-correction-migrations.js'
      - 'server/atlas-stage2-schema-release.js'
      - 'server/atlas-stage2-p9-db-cutover.js'
      - 'server/atlas-identity-service.js'
      - 'server/atlas-stage2-native-activity-service.js'
      - 'db/schema/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/atlas-human-authoring-operational-parity.yml'
      - 'scripts/rehearse-human-authoring-operational-parity.mjs'
      - 'server/atlas-human-authoring-service.js'
      - 'server/atlas-authoring-*.js'
      - 'server/atlas-correction-migrations.js'
      - 'server/atlas-stage2-schema-release.js'
      - 'server/atlas-stage2-p9-db-cutover.js'
      - 'server/atlas-identity-service.js'
      - 'server/atlas-stage2-native-activity-service.js'
      - 'db/schema/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

# This workflow is read-only validation. Newer commits supersede older results.
concurrency:
  group: atlas-validation-human-authoring-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_human_authoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_human_authoring"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atlas_human_authoring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rehearse human authoring operational parity
        run: node scripts/rehearse-human-authoring-operational-parity.mjs
