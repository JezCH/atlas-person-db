name: ATLAS Human Authoring Operational Parity

on:
  pull_request:
    paths-ignore:
      - 'authoring/requests/*.json'
  push:
    branches:
      - main
    paths-ignore:
      - 'authoring/requests/*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_human_authoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_human_authoring"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atlas_human_authoring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rehearse human authoring operational parity
        run: node scripts/rehearse-human-authoring-operational-parity.mjs
