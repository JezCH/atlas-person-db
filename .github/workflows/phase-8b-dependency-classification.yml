name: Phase 8B Dependency Classification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-phase-8b-dependency-classification
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: phase-5-shadow
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify database secret
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Build fresh Phase 8A repository inventory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf migration/phase-8/tmp/phase8a migration/phase-8/tmp/phase8b
          mkdir -p migration/phase-8/tmp/phase8a migration/phase-8/tmp/phase8b
          node migration/phase-8/scripts/phase8a-repository-inventory.mjs migration/phase-8/tmp/phase8a/repository-inventory.json

      - name: Export fresh live database inventory read-only
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --no-psqlrc --file migration/phase-8/scripts/export-phase8a-db-inventory.sql > migration/phase-8/tmp/phase8b/database-export.log 2>&1
          node migration/phase-8/scripts/phase8a-db-inventory.mjs migration/phase-8/tmp/phase8a/database-inventory.json migration/phase-8/tmp/phase8b/database-inventory-report.json

      - name: Classify dependencies and writer candidates
        shell: bash
        run: |
          set -euo pipefail
          node migration/phase-8/scripts/phase8b-classify-dependencies.mjs \
            migration/phase-8/tmp/phase8a/repository-inventory.json \
            migration/phase-8/tmp/phase8a/database-inventory.json \
            migration/phase-8/tmp/phase8b
          printf 'PHASE_8B_DEPENDENCY_CLASSIFICATION\n' > migration/phase-8/tmp/phase8b/marker.txt

      - name: Upload Phase 8B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-8b-dependency-classification-${{ github.sha }}
          path: migration/phase-8/tmp/phase8b
          if-no-files-found: error
          retention-days: 90
