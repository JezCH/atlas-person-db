name: Agent Person Profile Finalize

on:
  push:
    branches:
      - agent/person-profile-editing-final

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'Apply Person profile lifecycle integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/person-profile-editing-final
      - name: Patch lifecycle integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              return text.replace(old, new, 1)

          merge_path = Path('server/atlas-person-merge-service.js')
          merge = merge_path.read_text()
          merge = replace_once(
              merge,
              'const { assertPersonMergeExecutionAllowed } = require("./atlas-person-merge-interlock.js");\n',
              'const { assertPersonMergeExecutionAllowed } = require("./atlas-person-merge-interlock.js");\nconst { reconcilePersonExternalReferences } = require("./atlas-person-external-reference-lifecycle.js");\n',
              'merge lifecycle import'
          )
          merge = replace_once(
              merge,
              '  const descriptions = await client.query(`select id,locale,content from atlas_v2.person_descriptions where person_id=$1 order by locale,id`, [personId]);\n',
              '  const descriptions = await client.query(`select id,locale,content from atlas_v2.person_descriptions where person_id=$1 order by locale,id`, [personId]);\n  const externalReferences = await client.query(`select provider,status,checked_at::text,document_title,url from atlas_v2.person_external_references where person_id=$1 order by provider`, [personId]);\n',
              'merge snapshot external refs query'
          )
          merge = replace_once(
              merge,
              '    descriptions: descriptions.rows,\n    relationships: relationships.rows,',
              '    descriptions: descriptions.rows,\n    external_references: externalReferences.rows,\n    relationships: relationships.rows,',
              'merge snapshot external refs return'
          )
          merge = replace_once(
              merge,
              '    (select count(*)::int from atlas_v2.person_event_participation_sources) as event_participation_sources`);',
              '    (select count(*)::int from atlas_v2.person_event_participation_sources) as event_participation_sources,\n    (select count(*)::int from atlas_v2.person_external_references) as external_references`);',
              'merge global external refs count'
          )
          merge = replace_once(
              merge,
              '    const sources = await moveSources(client, sides.source_person_id, sides.survivor_person_id);\n    const descriptions = await client.query',
              '    const sources = await moveSources(client, sides.source_person_id, sides.survivor_person_id);\n    const externalReferences = await reconcilePersonExternalReferences(client, sides.source_person_id, sides.survivor_person_id);\n    const descriptions = await client.query',
              'merge reconcile external refs'
          )
          merge = replace_once(
              merge,
              '      (select count(*)::int from atlas_v2.person_event_participations where person_id=$1) as event_participations,\n      (select count(*)::int from atlas_v2.authoring_manifest_runs where person_id=$1) as authoring_person_pointers,',
              '      (select count(*)::int from atlas_v2.person_event_participations where person_id=$1) as event_participations,\n      (select count(*)::int from atlas_v2.person_external_references where person_id=$1) as external_references,\n      (select count(*)::int from atlas_v2.authoring_manifest_runs where person_id=$1) as authoring_person_pointers,',
              'merge remaining external refs'
          )
          merge = replace_once(
              merge,
              '    if (afterCounts.event_participation_sources !== beforeCounts.event_participation_sources) throw new Error("event participation provenance count changed during person merge");\n',
              '    if (afterCounts.event_participation_sources !== beforeCounts.event_participation_sources) throw new Error("event participation provenance count changed during person merge");\n    if (afterCounts.external_references !== beforeCounts.external_references - externalReferences.collapsed) throw new Error("external reference count changed outside deterministic reference collapse");\n',
              'merge external refs invariant'
          )
          merge = replace_once(
              merge,
              '      sources,\n      descriptions_moved: descriptions.rowCount,',
              '      sources,\n      external_references: externalReferences,\n      descriptions_moved: descriptions.rowCount,',
              'merge summary external refs'
          )
          merge_path.write_text(merge)

          delete_path = Path('server/atlas-person-delete-service.js')
          delete = delete_path.read_text()
          delete = replace_once(
              delete,
              'const { lockPersonDuplicateFrontier } = require("./atlas-person-duplicate-frontier-lock.js");\n',
              'const { lockPersonDuplicateFrontier } = require("./atlas-person-duplicate-frontier-lock.js");\nconst { deletePersonExternalReferences } = require("./atlas-person-external-reference-lifecycle.js");\n',
              'delete lifecycle import'
          )
          delete = replace_once(
              delete,
              '      (select count(*)::int from atlas_v2.person_descriptions where person_id=$1) as person_descriptions,\n      (select count(*)::int from atlas_v2.person_politics_v2 where person_id=$1) as activities,',
              '      (select count(*)::int from atlas_v2.person_descriptions where person_id=$1) as person_descriptions,\n      (select count(*)::int from atlas_v2.person_external_references where person_id=$1) as external_references,\n      (select count(*)::int from atlas_v2.person_politics_v2 where person_id=$1) as activities,',
              'delete verification external refs'
          )
          delete = replace_once(
              delete,
              '      deleted.person_descriptions = (await client.query(`delete from atlas_v2.person_descriptions where person_id=$1 returning id`, [personId])).rowCount;\n      deleted.person_names =',
              '      deleted.person_descriptions = (await client.query(`delete from atlas_v2.person_descriptions where person_id=$1 returning id`, [personId])).rowCount;\n      deleted.external_references = await deletePersonExternalReferences(client, personId);\n      deleted.person_names =',
              'delete normalized external refs'
          )
          delete_path.write_text(delete)

          test_path = Path('tests/atlas-person-hard-delete.test.mjs')
          test = test_path.read_text()
          test = replace_once(
              test,
              '    person_descriptions: 0,\n    activities: 0,',
              '    person_descriptions: 0,\n    external_references: 0,\n    activities: 0,',
              'delete test verification row'
          )
          test = replace_once(
              test,
              "    'delete from atlas_v2.person_descriptions',\n    'delete from atlas_v2.person_names',",
              "    'delete from atlas_v2.person_descriptions',\n    'delete from atlas_v2.person_external_references',\n    'delete from atlas_v2.person_names',",
              'delete test expected SQL'
          )
          test = replace_once(
              test,
              '  assert.match(index, /atlas-server-write-adapter\\.js\\?v=20260816-person-hard-delete-v4/);',
              '  assert.match(index, /atlas-server-write-adapter\\.js\\?v=20260821-person-profile-v1/);',
              'delete test cache key'
          )
          test_path.write_text(test)

          contract = Path('tests/atlas-person-profile-lifecycle-contract.test.mjs')
          contract.write_text("""import assert from 'node:assert/strict';\nimport test from 'node:test';\nimport fs from 'node:fs';\n\ntest('Person merge and hard-delete explicitly own normalized external-reference lifecycle', () => {\n  const merge = fs.readFileSync(new URL('../server/atlas-person-merge-service.js', import.meta.url), 'utf8');\n  const deletion = fs.readFileSync(new URL('../server/atlas-person-delete-service.js', import.meta.url), 'utf8');\n  assert.match(merge, /reconcilePersonExternalReferences/);\n  assert.match(merge, /external reference count changed outside deterministic reference collapse/);\n  assert.match(merge, /person_external_references where person_id=\\$1/);\n  assert.match(deletion, /deletePersonExternalReferences/);\n  assert.match(deletion, /person_external_references where person_id=\\$1/);\n});\n""")
          PY
      - name: Run focused lifecycle tests
        run: node --test tests/atlas-person-profile-service.test.mjs tests/atlas-person-external-reference-lifecycle.test.mjs tests/atlas-person-profile-lifecycle-contract.test.mjs tests/atlas-person-hard-delete.test.mjs
      - name: Commit lifecycle integration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- server/atlas-person-merge-service.js server/atlas-person-delete-service.js tests/atlas-person-hard-delete.test.mjs tests/atlas-person-profile-lifecycle-contract.test.mjs
          git diff --cached --check
          git commit -m 'Apply Person profile lifecycle integration'
          git push origin HEAD:agent/person-profile-editing-final
