name: ATLAS Correction Apply

on:
  push:
    branches:
      - main
    paths:
      - 'corrections/requests/*.json'
      - 'corrections/intents/*.json'
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Path under corrections/requests/ or corrections/intents/'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-correction-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      ATLAS_CORRECTION_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-correction-apply
      ATLAS_CORRECTION_AUDIENCE: atlas-person-db-correction-apply
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve reviewed correction release plan
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/atlas-correction-candidates.txt
          : > /tmp/atlas-correction-plan.tsv

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            printf '%s\n' "${{ inputs.manifest }}" > /tmp/atlas-correction-candidates.txt
          else
            git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- \
              'corrections/requests/*.json' 'corrections/intents/*.json' > /tmp/atlas-correction-candidates.txt
          fi

          while IFS= read -r source_path; do
            [[ -n "$source_path" ]] || continue
            if [[ "$source_path" =~ ^corrections/requests/[A-Za-z0-9._-]+\.json$ ]]; then
              jq -e '
                (.schema == "atlas-correction-manifest/v1" or .schema == "atlas-correction-manifest/v1.1") and
                .review_status == "approved" and
                ((.release_order // 500) | type == "number") and
                ((.release_order // 500) | floor == .)
              ' "$source_path" >/dev/null
              order="$(jq -er '.release_order // 500' "$source_path")"
              kind="request"
            elif [[ "$source_path" =~ ^corrections/intents/[A-Za-z0-9._-]+\.json$ ]]; then
              jq -e '
                .schema == "atlas-correction-intent/v1" and
                .review_status == "approved" and
                (.request_id | type == "string" and length > 0) and
                ((.release_order // 500) | type == "number") and
                ((.release_order // 500) | floor == .) and
                (.operation | type == "object") and
                (.operation.type == "retire_activity" or .operation.type == "update_activity_interval") and
                (.operation.relationship_id | test("^[0-9a-fA-F-]{36}$")) and
                (if .operation.type == "update_activity_interval" then
                   (.operation.after.activity_start | type == "number") and
                   (.operation.after.activity_end | type == "number") and
                   (.operation.after.activity_start | floor == .) and
                   (.operation.after.activity_end | floor == .) and
                   (.operation.after.activity_end >= .operation.after.activity_start)
                 else true end)
              ' "$source_path" >/dev/null
              order="$(jq -er '.release_order // 500' "$source_path")"
              kind="intent"
            else
              echo "Rejected correction source path: $source_path" >&2
              exit 1
            fi
            printf '%09d\t%s\t%s\n' "$order" "$kind" "$source_path" >> /tmp/atlas-correction-plan.tsv
          done < /tmp/atlas-correction-candidates.txt

          sort -n -k1,1 -k3,3 -o /tmp/atlas-correction-plan.tsv /tmp/atlas-correction-plan.tsv
          [[ -s /tmp/atlas-correction-plan.tsv ]] || { echo 'No reviewed correction inputs selected.'; exit 0; }
          cat /tmp/atlas-correction-plan.tsv

      - name: Snapshot exact targets, dry-run, apply, then capture Baseline A on the same Production SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas-correction-evidence/snapshots \
                   /tmp/atlas-correction-evidence/generated-manifests \
                   /tmp/atlas-correction-evidence/responses
          : > /tmp/atlas-correction-results.jsonl

          request_oidc() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ATLAS_CORRECTION_AUDIENCE}" | jq -er '.value'
          }

          safe_name() {
            basename "$1" .json | tr -c 'A-Za-z0-9._-' '_'
          }

          post_with_deployment_retry() {
            local payload="$1"
            local response="$2"
            local label="$3"
            for attempt in $(seq 1 60); do
              local oidc_token status code
              oidc_token="$(request_oidc)"
              status="$(curl --silent --show-error \
                --output "$response" \
                --write-out '%{http_code}' \
                --request POST \
                -H 'content-type: application/json' \
                -H "authorization: Bearer ${oidc_token}" \
                --data "$payload" \
                "$ATLAS_CORRECTION_ENDPOINT")"
              if [[ "$status" == "200" ]]; then return 0; fi
              code="$(jq -r '.code // "UNKNOWN"' "$response" 2>/dev/null || printf 'UNKNOWN')"
              if [[ "$status" == "404" || ( "$status" == "409" && "$code" == "DEPLOYMENT_SHA_MISMATCH" ) ]]; then
                echo "Production ${label} route has not reached ${GITHUB_SHA} (attempt ${attempt}/60); retrying."
                sleep 10
                continue
              fi
              cat "$response" >&2 || true
              echo "${label} failed: HTTP ${status}, code ${code}" >&2
              return 1
            done
            echo "Production deployment did not reach ${GITHUB_SHA} for ${label} within retry window" >&2
            return 1
          }

          expected_marker() {
            local manifest="$1"
            case "$(jq -r '.schema' "$manifest")" in
              atlas-correction-manifest/v1) printf '%s' 'ATLAS_CORRECTION_MANIFEST_V1' ;;
              atlas-correction-manifest/v1.1) printf '%s' 'ATLAS_CORRECTION_MANIFEST_V1_1' ;;
              *) echo "Unsupported correction manifest schema in $manifest" >&2; return 1 ;;
            esac
          }

          snapshot_intent_target() {
            local intent="$1"
            local output="$2"
            local relationship_id payload
            relationship_id="$(jq -er '.operation.relationship_id' "$intent")"
            payload="$(jq -cn \
              --arg deployment_sha "${GITHUB_SHA}" \
              --arg intent_path "$intent" \
              --arg relationship_id "$relationship_id" \
              '{deployment_sha:$deployment_sha,intent_path:$intent_path,mode:"snapshot",activity_ids:[$relationship_id]}')"
            post_with_deployment_retry "$payload" "$output" "correction snapshot"
            jq -e --arg relationship_id "$relationship_id" '
              .ok == true and
              .marker == "ATLAS_CORRECTION_SNAPSHOT_V1" and
              .mode == "snapshot" and
              .read_only == true and
              .committed == false and
              .requested_count == 1 and .row_count == 1 and
              (.snapshots[0].relationship.id | ascii_downcase) == ($relationship_id | ascii_downcase)
            ' "$output" >/dev/null
          }

          synthesize_intent_manifest() {
            local intent="$1"
            local snapshot="$2"
            local output="$3"
            jq -n \
              --slurpfile intent "$intent" \
              --slurpfile snapshot "$snapshot" '
                $intent[0] as $i |
                $snapshot[0].snapshots[0].relationship as $r |
                def before:
                  {
                    person_id: ($r.person_id | ascii_downcase),
                    polity_id: ($r.polity_id | ascii_downcase),
                    role_id: (if $r.role_id == null then null else ($r.role_id | ascii_downcase) end),
                    period_basis_id: ($r.period_basis_id | ascii_downcase),
                    activity_start: $r.activity_start,
                    activity_end: $r.activity_end,
                    notes: $r.notes,
                    legacy_source_key: $r.legacy_source_key
                  };
                {
                  schema: "atlas-correction-manifest/v1.1",
                  request_id: $i.request_id,
                  review_status: "approved",
                  release_order: ($i.release_order // 500),
                  evidence: {
                    reviewed_intent: $i,
                    exact_snapshot_deployment_sha: $snapshot[0].deployment_sha,
                    exact_snapshot_source_path: $snapshot[0].source_path
                  },
                  operations: [
                    if $i.operation.type == "retire_activity" then
                      {
                        type: "retire_activity",
                        relationship_id: ($i.operation.relationship_id | ascii_downcase),
                        expected: before
                      }
                    elif $i.operation.type == "update_activity_interval" then
                      {
                        type: "update_activity_interval",
                        relationship_id: ($i.operation.relationship_id | ascii_downcase),
                        expected_before: before,
                        expected_after: (before + {
                          activity_start: $i.operation.after.activity_start,
                          activity_end: $i.operation.after.activity_end
                        })
                      }
                    else error("unsupported intent operation") end
                  ]
                }
              ' > "$output"
            jq -e '.schema == "atlas-correction-manifest/v1.1" and .review_status == "approved" and (.operations | length == 1)' "$output" >/dev/null
          }

          call_correction() {
            local manifest="$1"
            local source_path="$2"
            local mode="$3"
            local safe marker response payload
            safe="$(safe_name "$source_path")"
            marker="$(expected_marker "$manifest")"
            response="/tmp/atlas-correction-evidence/responses/${safe}-${mode}.json"
            payload="$(jq -cn \
              --arg deployment_sha "${GITHUB_SHA}" \
              --arg manifest_path "$source_path" \
              --arg mode "$mode" \
              --slurpfile manifest "$manifest" \
              '{deployment_sha:$deployment_sha,manifest_path:$manifest_path,mode:$mode,manifest:$manifest[0]}')"
            post_with_deployment_retry "$payload" "$response" "correction ${mode}"
            if [[ "$mode" == "dry_run" ]]; then
              jq -e --arg marker "$marker" '.ok == true and .marker == $marker and .dry_run == true and .committed == false' "$response" >/dev/null
            else
              jq -e --arg marker "$marker" '.ok == true and .marker == $marker and .dry_run == false and .committed == true' "$response" >/dev/null
            fi
            jq -c --arg source_path "$source_path" --arg mode "$mode" '. + {workflow_source:$source_path,workflow_mode:$mode}' "$response" >> /tmp/atlas-correction-results.jsonl
          }

          while IFS=$'\t' read -r order kind source_path; do
            [[ -n "$source_path" ]] || continue
            manifest="$source_path"
            if [[ "$kind" == "intent" ]]; then
              safe="$(safe_name "$source_path")"
              snapshot="/tmp/atlas-correction-evidence/snapshots/${safe}.json"
              manifest="/tmp/atlas-correction-evidence/generated-manifests/${safe}.manifest.json"
              snapshot_intent_target "$source_path" "$snapshot"
              synthesize_intent_manifest "$source_path" "$snapshot" "$manifest"
            fi
            call_correction "$manifest" "$source_path" dry_run
            call_correction "$manifest" "$source_path" apply
          done < /tmp/atlas-correction-plan.tsv

          baseline_response="/tmp/atlas-correction-evidence/baseline-a.json"
          baseline_payload="$(jq -cn --arg deployment_sha "${GITHUB_SHA}" '{deployment_sha:$deployment_sha,mode:"full_activity_baseline"}')"
          post_with_deployment_retry "$baseline_payload" "$baseline_response" "Baseline A capture"
          jq -e '
            .ok == true and
            .marker == "ATLAS_CORRECTION_BASELINE_A_V1" and
            .mode == "full_activity_baseline" and
            .read_only == true and
            .committed == false and
            (.row_count == .counts.activities) and
            (.baseline_digest | test("^sha256:[0-9a-f]{64}$"))
          ' "$baseline_response" >/dev/null
          jq '{marker,mode,read_only,committed,deployment_sha,row_count,counts,baseline_digest}' "$baseline_response" \
            > /tmp/atlas-correction-evidence/baseline-a-summary.json
          jq '.rows | map(.activity_id) | sort' "$baseline_response" \
            > /tmp/atlas-correction-evidence/baseline-a-activity-uuids.json

          jq -s --slurpfile baseline "$baseline_response" \
            '{deployment_sha:env.GITHUB_SHA,results:.,baseline_a:{row_count:$baseline[0].row_count,counts:$baseline[0].counts,baseline_digest:$baseline[0].baseline_digest}}' \
            /tmp/atlas-correction-results.jsonl > /tmp/atlas-correction-results.json
          jq . /tmp/atlas-correction-results.json

      - name: Upload correction and Baseline A evidence
        uses: actions/upload-artifact@v4
        with:
          name: atlas-correction-results-${{ github.sha }}
          path: |
            /tmp/atlas-correction-results.json
            /tmp/atlas-correction-plan.tsv
            /tmp/atlas-correction-evidence/
          if-no-files-found: error
          retention-days: 90
