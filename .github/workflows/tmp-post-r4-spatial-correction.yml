name: Temporary post-r4 spatial correction compile

on:
  push:
    branches:
      - codex/spatial-post-r4-temporal-cleanup-20260918

permissions:
  contents: write

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Syntax checks
        run: |
          node --check scripts/compile-spatial-bindings.mjs
          node --check scripts/compile-spatial-bindings-r4.mjs
      - name: Regenerate canonical spatial index
        run: node scripts/compile-spatial-bindings-r4.mjs
      - name: Deterministic compiler check
        run: node scripts/compile-spatial-bindings-r4.mjs --check
      - name: Focused spatial regression
        run: |
          node --test \
            tests/spatial-binding-compiler.test.mjs \
            tests/spatial-taxonomy-r4-compiler.test.mjs \
            tests/spatial-reviewed-corrections.test.mjs \
            tests/spacetime-place-subregion.test.mjs \
            tests/spacetime-taxonomy-migration.test.mjs
      - name: Diff sanity
        run: git diff --check
      - name: Commit generated canonical index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas-polity-spatial-index.json
          git diff --cached --quiet && { echo 'canonical index did not change'; exit 1; }
          git commit -m 'spatial: compile post-r4 reviewed corrections'
          git push origin HEAD:${GITHUB_REF_NAME}
