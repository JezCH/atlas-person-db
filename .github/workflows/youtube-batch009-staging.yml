name: YouTube Batch009 Staging

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/youtube-batch009-staging.yml"
      - "scripts/youtube-batch009-staging.py"

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download batch008 denylist artifact
        uses: actions/download-artifact@v4
        with:
          name: youtube-batch008-staging
          path: prior/batch008
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37575099033
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Collect staging batch
        run: python scripts/youtube-batch009-staging.py
      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-batch009-staging
          path: out/youtube-batch009
          if-no-files-found: error
          retention-days: 3
