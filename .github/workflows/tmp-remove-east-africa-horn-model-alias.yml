name: Temporary retire east-africa-horn model alias

on:
  push:
    branches:
      - codex/spatial-r4-remove-east-africa-horn-alias-20260917

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove retired model alias and update focused invariant
        shell: python
        run: |
          from pathlib import Path

          model_path = Path('atlas-person-spacetime-model.js')
          model = model_path.read_text()
          model_needle = '    "east-africa-horn": "africa",\n'
          if model.count(model_needle) != 1:
              raise SystemExit(f'expected exactly one model alias, found {model.count(model_needle)}')
          model_path.write_text(model.replace(model_needle, ''))

          test_path = Path('tests/spacetime-place-subregion.test.mjs')
          source = test_path.read_text()
          replacements = [
            ('test("Phase-2 r4 model recognizes active leaves while preserving the deprecated Africa compatibility alias", () => {',
             'test("Phase-2 r4 model recognizes only active leaves after Africa alias retirement", () => {'),
            ('  assert.equal(model.SUBREGION_PARENT["east-africa-horn"], "africa");',
             '  assert.equal(model.SUBREGION_PARENT["east-africa-horn"], undefined);'),
            ('  assert.equal(continuum.bandForCode("east-africa-horn").legacy_alias, true);',
             '  assert.equal(continuum.bandForCode("east-africa-horn"), null);'),
            ('    if (subregionCode === "east-africa-horn") continue;\n', '')
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'expected exactly one test fragment: {old!r}, found {source.count(old)}')
              source = source.replace(old, new, 1)
          test_path.write_text(source)
      - name: Run focused taxonomy/model tests
        run: node --test tests/spacetime-place-subregion.test.mjs tests/spacetime-taxonomy-migration.test.mjs
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas-person-spacetime-model.js tests/spacetime-place-subregion.test.mjs
          git commit -m 'spatial: remove retired Africa alias from model contract'
          git push origin HEAD:${GITHUB_REF_NAME}
