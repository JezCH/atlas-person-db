name: Phase 7A Control Plane

on:
  pull_request:
    paths:
      - "atlas-production-source.js"
      - "atlas-source-control.js"
      - "atlas-reader.js"
      - "app.js"
      - "index.html"
      - "migration/phase-7/scripts/phase7a-contract.mjs"
      - "tests/phase8c-c6-direct-normalized-read-activation.test.mjs"
      - ".github/workflows/phase-7a-control-plane.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run source-control contract or C6 successor contract
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'ATLAS_READER_V2_DIRECT' atlas-reader.js; then
            node --test tests/phase8c-c6-direct-normalized-read-activation.test.mjs
          else
            node migration/phase-7/scripts/phase7a-contract.mjs
          fi
