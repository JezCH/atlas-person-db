name: ATLAS Batch 28 Sync Main

on:
  push:
    branches:
      - agent/spacetime-polity-placement-batch-28

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest main and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit origin/main
          git rm .github/workflows/atlas-batch28-sync-main.yml
          git commit -m 'Sync batch 28 with latest main'
          git push origin HEAD:agent/spacetime-polity-placement-batch-28
