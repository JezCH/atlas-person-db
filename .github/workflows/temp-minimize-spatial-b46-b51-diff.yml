name: TEMP Minimize Spatial B46-B51 Diff

on:
  push:
    branches:
      - ops/spatial-backfill-b46-b51
    paths:
      - scripts/temp-minimize-spatial-b46-b51-diff.mjs
      - .github/workflows/temp-minimize-spatial-b46-b51-diff.yml

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/spatial-backfill-b46-b51
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore base ordering and keep only reviewed additions
        run: node scripts/temp-minimize-spatial-b46-b51-diff.mjs
      - name: Re-run focused spatial tests
        run: node --test tests/person-spacetime-spatial-index-coverage.test.mjs tests/spacetime-taxonomy-migration.test.mjs
      - name: Commit clean minimal delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/temp-minimize-spatial-b46-b51-diff.mjs .github/workflows/temp-minimize-spatial-b46-b51-diff.yml
          git add atlas-polity-spatial-index.json
          git commit -m 'Minimize spatial B46-B51 JSON delta'
          git push origin HEAD:ops/spatial-backfill-b46-b51
