name: Temporary Spatial Residual 009 Validation

on:
  push:
    branches:
      - agent/spatial-reviewed-residual-009

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reviewed spatial bindings
        run: node scripts/compile-spatial-bindings.mjs --validate-only
