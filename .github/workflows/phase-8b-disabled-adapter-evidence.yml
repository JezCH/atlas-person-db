name: Phase 8B Disabled Adapter Evidence

on:
  pull_request:
    paths:
      - "atlas-write-mode.js"
      - "atlas-write-adapter.js"
      - "tests/atlas-write-adapter.test.mjs"
      - "migration/phase-8/scripts/verify-phase8b-disabled-adapter.mjs"
      - ".github/workflows/phase-8b-disabled-adapter-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-phase-8b-disabled-adapter-evidence
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run adapter unit tests
        run: |
          set -euo pipefail
          node --test tests/atlas-write-adapter.test.mjs

      - name: Verify adapter remains unloaded and disabled
        run: |
          set -euo pipefail
          rm -rf migration/phase-8/tmp/phase8b-adapter
          node migration/phase-8/scripts/verify-phase8b-disabled-adapter.mjs \
            migration/phase-8/tmp/phase8b-adapter/verification.json
          printf 'PHASE_8B_DISABLED_ADAPTER_EVIDENCE\n' > migration/phase-8/tmp/phase8b-adapter/marker.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-8b-disabled-adapter-${{ github.sha }}
          path: migration/phase-8/tmp/phase8b-adapter
          if-no-files-found: error
          retention-days: 90
