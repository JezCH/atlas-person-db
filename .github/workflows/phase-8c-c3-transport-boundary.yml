name: Phase 8C C3 Transport Boundary

on:
  pull_request:
    paths:
      - "server/atlas-mutation-transport.js"
      - "tests/atlas-mutation-transport.test.mjs"
      - ".github/workflows/phase-8c-c3-transport-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run transport tests
        run: node --test tests/atlas-mutation-transport.test.mjs

      - name: Verify server-only boundary
        run: |
          set -euo pipefail
          ! grep -q "atlas-mutation-transport.js" index.html
          ! grep -q "atlas-mutation-transport.js" admin.html
          ! grep -q "SUPABASE_DB_URL\|SERVICE_ROLE\|postgres://\|postgresql://" index.html admin.html app.js admin.js
