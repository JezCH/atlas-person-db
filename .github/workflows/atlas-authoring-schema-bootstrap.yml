name: ATLAS Authoring Schema Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - 'db/migrations/*.sql'
      - 'server/atlas-authoring-migrations.js'
      - 'server/atlas-authoring-readiness.js'
      - '.github/workflows/atlas-authoring-schema-bootstrap.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: atlas-authoring-schema-bootstrap
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATLAS_AUTHORING_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-authoring-apply
      ATLAS_PERSON_DOMAIN_V2_CUTOVER_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-person-domain-v2-cutover
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for exact Production Person Domain v2 cutover
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error --output /tmp/atlas-person-domain-v2-cutover.json --write-out '%{http_code}' "$ATLAS_PERSON_DOMAIN_V2_CUTOVER_ENDPOINT")"
            if [[ "$status" == "200" ]] && jq -e --arg sha "$GITHUB_SHA" '.ok==true and .runtime_sha==$sha and .state.cutover_complete==true' /tmp/atlas-person-domain-v2-cutover.json >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          cat /tmp/atlas-person-domain-v2-cutover.json >&2 || true
          echo "PERSON_DOMAIN_V2_CUTOVER_NOT_READY" >&2
          exit 1


      - name: Wait for exact Production runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error \
              --output /tmp/atlas-authoring-readiness.json \
              --write-out '%{http_code}' \
              "$ATLAS_AUTHORING_ENDPOINT")"
            if [[ "$status" == "200" ]]; then
              runtime_sha="$(jq -r '.runtime_sha // ""' /tmp/atlas-authoring-readiness.json)"
              if [[ "$runtime_sha" == "$GITHUB_SHA" ]]; then
                echo "Production runtime is exact target ${GITHUB_SHA}."
                exit 0
              fi
              echo "Production runtime ${runtime_sha:-unknown} is not target ${GITHUB_SHA} yet (attempt ${attempt}/60)."
            else
              echo "Production readiness returned HTTP ${status} (attempt ${attempt}/60)."
            fi
            sleep 10
          done
          cat /tmp/atlas-authoring-readiness.json >&2 || true
          echo "PRODUCTION_RUNTIME_NOT_AT_SCHEMA_BOOTSTRAP_SHA:${GITHUB_SHA}" >&2
          exit 1

      - name: Dispatch bounded schema bootstrap and require child success
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          dispatch_sha="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$GITHUB_SHA" "$dispatch_sha" || {
            echo "SCHEMA_BOOTSTRAP_MAIN_DIVERGED: parent ${GITHUB_SHA}, dispatch ${dispatch_sha}" >&2
            exit 1
          }

          before_json="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow atlas-authoring-apply.yml \
            --branch main \
            --event workflow_dispatch \
            --limit 30 \
            --json databaseId,headSha,createdAt,status,conclusion)"
          before_ids="$(jq -c '[.[].databaseId]' <<<"$before_json")"

          gh workflow run atlas-authoring-apply.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f bootstrap_only=true
          echo "Dispatched ATLAS Authoring Apply bootstrap-only from parent ${GITHUB_SHA}; main at dispatch ${dispatch_sha}."

          child_run_id=""
          for attempt in $(seq 1 30); do
            runs_json="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow atlas-authoring-apply.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,headSha,createdAt,status,conclusion)"
            mapfile -t candidates < <(jq -r --argjson before "$before_ids" '
              [.[] | select((.databaseId as $id | ($before | index($id)) == null))]
              | sort_by(.createdAt) | .[]
              | "\(.databaseId) \(.headSha)"
            ' <<<"$runs_json")
            for candidate in "${candidates[@]}"; do
              candidate_id="${candidate%% *}"
              candidate_sha="${candidate#* }"
              if ! git cat-file -e "${candidate_sha}^{commit}" 2>/dev/null; then
                git fetch --no-tags --quiet origin "$candidate_sha" || true
              fi
              if git cat-file -e "${candidate_sha}^{commit}" 2>/dev/null \
                 && git merge-base --is-ancestor "$GITHUB_SHA" "$candidate_sha"; then
                child_run_id="$candidate_id"
                echo "Bootstrap child run: ${child_run_id} at ${candidate_sha}"
                break 2
              fi
            done
            sleep 2
          done
          [[ -n "$child_run_id" ]] || { echo "AUTHORING_BOOTSTRAP_CHILD_RUN_NOT_FOUND" >&2; exit 1; }

          gh run watch "$child_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status
