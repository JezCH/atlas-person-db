name: Phase 5 Shadow Schema Apply

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch or commit to apply
        required: true
        default: agent/phase5-shadow-schema
        type: string
      expected_commit_sha:
        description: Exact approved commit SHA
        required: true
        default: f1cc2a495c883367dd879befeaa00fd1f8c47be6
        type: string
      expected_artifact_digest:
        description: Exact dry artifact digest
        required: true
        default: sha256:a7f88cf80e2f4308bb90a8f527d2d09443feb5a3cb30c346f2f662c9fcea8835
        type: string
      confirmation_token:
        description: Type APPLY_ATLAS_V2_PHASE_5
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase-5-shadow-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    environment: phase-5-shadow
    steps:
      - name: Checkout approved target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate authorization inputs
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "${{ inputs.target_ref }}" = "agent/phase5-shadow-schema"
          test "$ACTUAL_SHA" = "${{ inputs.expected_commit_sha }}"
          test "${{ inputs.expected_commit_sha }}" = "f1cc2a495c883367dd879befeaa00fd1f8c47be6"
          test "${{ inputs.expected_artifact_digest }}" = "sha256:a7f88cf80e2f4308bb90a8f527d2d09443feb5a3cb30c346f2f662c9fcea8835"
          test "${{ inputs.confirmation_token }}" = "APPLY_ATLAS_V2_PHASE_5"
          echo "APPROVED_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"

      - name: Verify database secret exists
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          case "$SUPABASE_DB_URL" in
            postgresql://*|postgres://*) ;;
            *) echo "SUPABASE_DB_URL must be a PostgreSQL URI" >&2; exit 41 ;;
          esac

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Rebuild verified Phase 4 outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf migration/phase-4/output
          node migration/phase-4/scripts/compile-all.mjs \
            --root . \
            --output migration/phase-4/output \
            --branch agent/phase5-shadow-schema \
            --commit "$APPROVED_SHA"

      - name: Build and validate deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf migration/phase-5/tmp
          mkdir -p migration/phase-5/tmp/apply
          node migration/phase-5/scripts/build-shadow-bundle.mjs \
            . \
            migration/phase-5/tmp/apply
          node migration/phase-5/scripts/validate-shadow-bundle.mjs \
            . \
            migration/phase-5/tmp/apply

          grep -Fq -- "-- PHASE 5 FULL SHADOW LOAD BUNDLE" migration/phase-5/tmp/apply/phase-5-deployment.sql
          grep -Fq -- "insert into atlas_v2.persons" migration/phase-5/tmp/apply/phase-5-deployment.sql
          grep -Fq -- "insert into atlas_v2.person_politics_v2" migration/phase-5/tmp/apply/phase-5-deployment.sql

      - name: Apply shadow schema transaction
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" \
            --set=ON_ERROR_STOP=1 \
            --no-psqlrc \
            --file migration/phase-5/tmp/apply/phase-5-deployment.sql \
            > migration/phase-5/tmp/apply/phase-5-apply.log 2>&1

      - name: Verify shadow schema and legacy integrity
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" \
            --set=ON_ERROR_STOP=1 \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --command "select jsonb_build_object(
              'schema_exists', exists(select 1 from information_schema.schemata where schema_name='atlas_v2'),
              'persons', (select count(*) from atlas_v2.persons),
              'polities', (select count(*) from atlas_v2.polities),
              'relationships', (select count(*) from atlas_v2.person_politics_v2),
              'legacy_source_keys', (select count(distinct legacy_source_key) from atlas_v2.person_politics_v2),
              'legacy_source_key_nulls', (select count(*) from atlas_v2.person_politics_v2 where legacy_source_key is null),
              'person_names', (select count(*) from atlas_v2.person_names),
              'polity_names', (select count(*) from atlas_v2.polity_names),
              'roles', (select count(*) from atlas_v2.roles),
              'sources', (select count(*) from atlas_v2.sources),
              'legacy_rows', (select count(*) from public.person_politics)
            );" \
            > migration/phase-5/tmp/apply/phase-5-validation.json

          node -e '
            const fs = require("fs");
            const p = "migration/phase-5/tmp/apply/phase-5-validation.json";
            const data = JSON.parse(fs.readFileSync(p, "utf8"));
            const expected = {
              schema_exists: true,
              persons: 303,
              polities: 211,
              relationships: 349,
              legacy_source_keys: 349,
              legacy_source_key_nulls: 0,
              person_names: 599,
              polity_names: 407,
              roles: 149,
              sources: 20
            };
            for (const [k,v] of Object.entries(expected)) {
              if (data[k] !== v) throw new Error(`${k}: expected ${v}, got ${data[k]}`);
            }
          '

      - name: Upload apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-5-shadow-apply-${{ env.APPROVED_SHA || github.sha }}
          path: migration/phase-5/tmp/apply
          if-no-files-found: warn
          retention-days: 90
