name: Phase 8B Reconciliation Parity

on:
  pull_request:
    paths:
      - "atlas-reconciliation-planner.js"
      - "ingest.js"
      - "tests/phase8b-reconciliation-parity.test.mjs"
      - "migration/phase-8/PHASE_8B_RECONCILIATION_PARITY_GATE.md"
      - ".github/workflows/phase-8b-reconciliation-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-phase-8b-reconciliation-parity
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run bounded parity suite
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/phase8b-reconciliation-parity.test.mjs

      - name: Emit evidence marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p migration/phase-8/tmp/phase8b-parity
          printf '{"marker":"PHASE_8B_RECONCILIATION_PARITY","commit":false,"database_writes":0,"scope":"bounded-fixture-parity"}\n' > migration/phase-8/tmp/phase8b-parity/verification.json

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-8b-reconciliation-parity-${{ github.sha }}
          path: migration/phase-8/tmp/phase8b-parity
          if-no-files-found: error
          retention-days: 90
