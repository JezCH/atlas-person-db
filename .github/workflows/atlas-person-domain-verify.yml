name: ATLAS Person Domain Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-person-domain-verify.yml'
      - 'server/atlas-person-domain-handler.js'
      - 'server/atlas-person-domain-service.js'
      - 'scripts/verify-person-domain-v2.mjs'
      - 'contracts/person-domain-taxonomy.v2.json'
      - 'atlas-person-domain-registry.js'
      - 'atlas-person-domain-palette.css'
      - 'atlas-person-spacetime-domain-colors.css'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-person-domain-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATLAS_PERSON_DOMAIN_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-person-domain
      ATLAS_RUNTIME_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-read?__atlas_read_surface=runtime-identity
      ATLAS_EVIDENCE_DIR: artifacts/person-domain-v2-verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for exact Production runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ATLAS_EVIDENCE_DIR"
          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error --output "$ATLAS_EVIDENCE_DIR/runtime-readiness.json" --write-out '%{http_code}' "$ATLAS_RUNTIME_ENDPOINT")"
            if [[ "$status" == "200" ]] && jq -e --arg sha "$GITHUB_SHA" '.identity.git_commit_sha==$sha and .identity.environment=="production"' "$ATLAS_EVIDENCE_DIR/runtime-readiness.json" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          cat "$ATLAS_EVIDENCE_DIR/runtime-readiness.json" >&2 || true
          exit 1
      - name: Verify active v2 contract and immutable review ledger
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/verify-person-domain-v2.mjs
          node --test tests/atlas-person-domain-service.test.mjs tests/atlas-person-domain-historical-ledger.test.mjs tests/atlas-person-domain-standard-v2-contract.test.mjs tests/spacetime-person-domain-colors.test.mjs
          node scripts/verify-person-domain-v2.mjs | tee "$ATLAS_EVIDENCE_DIR/verify.jsonl"
          curl --fail-with-body --silent --show-error "$ATLAS_RUNTIME_ENDPOINT" | jq . > "$ATLAS_EVIDENCE_DIR/runtime.json"
          jq -e --arg sha "$GITHUB_SHA" '.identity.git_commit_sha==$sha and .identity.environment=="production"' "$ATLAS_EVIDENCE_DIR/runtime.json" >/dev/null
      - name: Upload immutable v2 verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-person-domain-v2-verify-${{ github.sha }}
          path: artifacts/person-domain-v2-verify
          if-no-files-found: error
          retention-days: 30
