name: TEMP Global-S Geneva Spatial Compile

on:
  push:
    branches:
      - noncore/global-s-geneva-spatial
    paths:
      - '.github/workflows/tmp-global-s-geneva-spatial-compile.yml'

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: noncore/global-s-geneva-spatial
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile reviewed spatial bindings and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          node scripts/compile-spatial-bindings.mjs
          node scripts/compile-spatial-bindings.mjs --check
          git rm .github/workflows/tmp-global-s-geneva-spatial-compile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas-polity-spatial-index.json spatial/reviewed-bindings/shards/global-s-republic-of-geneva-20260908.bindings.json
          git diff --cached --check
          git commit -m 'Compile Republic of Geneva spatial binding'
          git push origin HEAD:noncore/global-s-geneva-spatial
