name: ATLAS VIS3-05T-B Real Chrome Status Review

on:
  pull_request:
    paths:
      - "atlas-ui-visual-foundation.css"
      - "scripts/verify-vis3-05t-b-status-browser.mjs"
      - ".github/workflows/atlas-vis3-05t-b-status-browser.yml"
permissions:
  contents: read
jobs:
  check_status_same_dom:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ATLAS_PRODUCTION_ORIGIN: https://atlas-person-db.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9225 --user-data-dir=/tmp/atlas-vis3-05t-b-chrome \
            about:blank >/tmp/atlas-vis3-05t-b-chrome.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9225/json/version >/dev/null; then exit 0; fi
            sleep .3
          done
          cat /tmp/atlas-vis3-05t-b-chrome.log
          exit 1
      - name: Check hidden and computed display in live browser
        run: |
          node --check scripts/verify-vis3-05t-b-status-browser.mjs
          node scripts/verify-vis3-05t-b-status-browser.mjs
      - name: Retain before and after screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vis3-05t-b-live-status-proof-${{ github.event.pull_request.head.sha }}
          path: artifacts/vis3-05t-b-status
          if-no-files-found: warn
          retention-days: 21
