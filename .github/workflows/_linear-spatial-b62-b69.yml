            ['6d630388-90c9-44c2-84f0-b84ee305b1fa','europe','central-europe'],
            ['d6542085-d0fd-4928-940f-e3f474880bca','europe','central-europe'],
            ['907319e4-3e71-4717-809f-8a66fee0730d','europe','northern-europe'],
            ['836a0b3b-41de-43db-8f3f-9542871e3f48','europe','northern-europe'],
            ['f307d9de-a73d-4dbd-966a-d31740c0dcec','europe','eastern-europe'],
            ['5834a865-03e3-48a1-b49a-12c1d9a35ab4','europe','central-europe'],
            ['8adee0a1-2edf-4bcc-a7a3-8b246a6636bb','europe','britain-ireland'],
            ['cbbf9cc8-1045-413c-98fc-ad95e28f9073','europe','central-europe'],
            ['9f43ac5f-c96e-448c-81f8-112e2f6e8424','europe','britain-ireland'],
            ['4962a47d-91e7-469f-96c0-bd739fda4c19','europe','western-europe'],

            ['4aeceb7e-5001-4f91-84ab-2e56e8d6a916','africa','southern-africa'],
            ['0b8f547f-8bdf-49c8-96ea-9c57694fc168','europe','central-europe'],
            ['aa38d04d-532d-4851-8e05-27d0614fb9c0','west-asia','arabia'],
            ['d432e921-c0b8-4d9f-bb96-dd9903eeef5c','central-asia','western-central-asia'],
            ['0efc70ac-2bb4-4c2c-a765-f6c3a0607d56','africa','east-africa-horn'],
            ['a6492720-5e09-4840-a12c-6226b865fba0','europe','eastern-europe'],
            ['6919b8ca-ea86-4e25-a538-3dd56498b255','west-asia','arabia'],
            ['31062c39-be42-400b-87f5-ee06c8c86ad3','africa','east-africa-horn'],
            ['750bf6be-49e9-4215-95ff-a356ba1831cd','americas','south-america'],
            ['a0e85099-3cb0-4b9d-94bb-234ae8fcb232','southeast-asia','maritime-southeast-asia'],

            ['172d7980-5313-460e-bcd7-748787fc598a','central-asia','western-central-asia'],
            ['f0037b7d-4982-444e-927c-3043b130f98f','africa','southern-africa'],
            ['b5c8227b-b391-43f8-9168-ad9a05e62e1d','africa','east-africa-horn'],
            ['e2fb0fd2-ed41-47b0-bcbe-92d3451dea35','americas','south-america'],
            ['42fd4527-37ce-4928-93ce-40a507750a2b','south-asia','deccan-south-india'],
            ['2319a4f2-d337-48d9-8752-bcf28c184399','europe','russia-volga'],
            ['04510bb0-829b-470b-828d-de401d011c38','europe','russia-volga'],
            ['79349302-6b2f-4be0-b949-ad40f3e4660e','europe','russia-volga'],
            ['77ee4f18-ba76-4e89-a925-431d00b1d214','east-asia','china'],
            ['3df30c69-5adc-49bb-b5ed-70b1bcbb9a86','east-asia','china'],

            ['2e52f532-31c1-41e8-aca6-07c40d2a319a','africa','east-africa-horn'],
            ['cb4a8b76-f2b5-417f-8276-76db43efebea','europe','eastern-europe'],
            ['669833d5-7b55-422f-ad4a-3d0e75813396','americas','mesoamerica'],
            ['ad52a3f6-dca4-4b0d-9549-641be2e00816','americas','mesoamerica'],
            ['2b1b868c-d5af-4fd5-99f7-50e7a04f0bf5','americas','mesoamerica'],
            ['7840e523-aab2-44ac-ac94-7f448115c397','americas','mesoamerica'],
            ['fb32c6b3-eb92-4e08-9fda-eee608ed9eb1','americas','caribbean'],
            ['519ae002-2f1d-4e1c-aadb-52027d428d5b','americas','caribbean'],
            ['9c5fc1af-5a18-471f-941a-718cd6ad562e','americas','caribbean'],
            ['5b27cb25-51aa-43e3-8089-e831a97316f3','americas','north-america'],
          ];

          if (exact.length !== 79 || new Set(exact.map(([id]) => id)).size !== 79) throw new Error('B62-B69 reconciled payload identity mismatch');
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          if (Object.keys(index.polity_geography).length !== 947 || Object.keys(index.polity_subregions).length !== 921) throw new Error(`unexpected baseline ${Object.keys(index.polity_geography).length}/${Object.keys(index.polity_subregions).length}`);
          const spanishReview = (index.review_queue || []).filter((entry) => entry.polity_id === spanishEmpireId);
          if (spanishReview.length !== 1 || spanishReview[0].reason !== 'transregional_empire_requires_activity_period_capital_review') throw new Error('Spanish Empire review_queue contract changed');
          if (Object.hasOwn(index.polity_geography, spanishEmpireId) || Object.hasOwn(index.polity_subregions, spanishEmpireId)) throw new Error('Spanish Empire unexpectedly statically resolved');
          for (const [id, region, subregion] of exact) {
            if ((index.review_queue || []).some((entry) => entry.polity_id === id)) throw new Error(`reconciled payload still intersects review_queue: ${id}`);
            if (Object.hasOwn(index.polity_geography, id) || Object.hasOwn(index.polity_subregions, id)) throw new Error(`payload UUID already present: ${id}`);
            index.polity_geography[id] = region;
            index.polity_subregions[id] = subregion;
          }
          if (Object.keys(index.polity_geography).length !== 1026 || Object.keys(index.polity_subregions).length !== 1000) throw new Error('post-apply count mismatch');
          fs.writeFileSync(indexPath, JSON.stringify(index, null, 2) + '\n');

          let coverage = fs.readFileSync(coveragePath, 'utf8');
          if (!coverage.includes('assert.equal(Object.keys(index.polity_geography).length, 947);') || !coverage.includes('assert.equal(Object.keys(index.polity_subregions).length, 921);')) throw new Error('coverage baseline locks missing');
          coverage = coverage.replace('assert.equal(Object.keys(index.polity_geography).length, 947);', 'assert.equal(Object.keys(index.polity_geography).length, 1026);');
          coverage = coverage.replace('assert.equal(Object.keys(index.polity_subregions).length, 921);', 'assert.equal(Object.keys(index.polity_subregions).length, 1000);');
          fs.writeFileSync(coveragePath, coverage);

          let taxonomy = fs.readFileSync(taxonomyPath, 'utf8');
          const replacements = [
            ['  mesoamerica: 25,','  mesoamerica: 30,'],
            ['  caribbean: 9,','  caribbean: 14,'],
            ['  "eastern-europe": 16,','  "eastern-europe": 20,'],
            ['  "russia-volga": 15,','  "russia-volga": 18,'],
            ['  "maghreb-north-africa": 23,','  "maghreb-north-africa": 24,'],
            ['  "nile-valley": 15,','  "nile-valley": 16,'],
            ['  anatolia: 9,','  anatolia: 10,'],
            ['  caucasus: 8,','  caucasus: 9,'],
            ['assert.equal(Object.keys(index.polity_subregions).length, 921);','assert.equal(Object.keys(index.polity_subregions).length, 1000);'],
          ];
          for (const [from, to] of replacements) {
            if (!taxonomy.includes(from)) throw new Error(`taxonomy baseline lock missing: ${from}`);
            taxonomy = taxonomy.replace(from, to);
          }
          fs.writeFileSync(taxonomyPath, taxonomy);
          NODE
      - name: Validate exact spatial delta
        run: node --test tests/person-spacetime-spatial-index-coverage.test.mjs tests/spacetime-taxonomy-migration.test.mjs
      - name: Commit exact three-file delta
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas-polity-spatial-index.json tests/person-spacetime-spatial-index-coverage.test.mjs tests/spacetime-taxonomy-migration.test.mjs
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "[spatial] Apply reconciled B62-B69 superbatch"
          git push origin HEAD:${{ github.ref_name }}
