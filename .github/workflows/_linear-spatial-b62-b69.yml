name: Linear Spatial B62-B69 One-Shot

on:
  push:
    branches:
      - linear/spatial-b62-b69-superbatch

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply reconciled reviewed B62-B69 payload
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const indexPath = 'atlas-polity-spatial-index.json';
          const coveragePath = 'tests/person-spacetime-spatial-index-coverage.test.mjs';
          const taxonomyPath = 'tests/spacetime-taxonomy-migration.test.mjs';
          const spanishEmpireId = '9e227293-7ab8-5870-b05b-0b8c715738a4';

          const exact = [
