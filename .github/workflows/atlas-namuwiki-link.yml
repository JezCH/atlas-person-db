name: ATLAS NamuWiki Link

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: atlas-namuwiki-link-production
  cancel-in-progress: false

jobs:
  link:
    if: >-
      github.event.issue.number == 431 &&
      !github.event.issue.pull_request &&
      github.actor == 'JezCH' &&
      (startsWith(github.event.comment.body, '/namuwiki-link') || startsWith(github.event.comment.body, '/namuwiki-not-found') || startsWith(github.event.comment.body, '/namuwiki-batch'))
    runs-on: ubuntu-latest
    environment: production
    env:
      ATLAS_NAMUWIKI_LINK_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-namuwiki-link
      ATLAS_PERSON_READ_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-person-read
      ATLAS_AUTHORING_READINESS_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-authoring-apply
      ATLAS_NAMUWIKI_LINK_AUDIENCE: atlas-person-db-namuwiki-link

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse and validate exact command
        id: command
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -Eeuo pipefail
          COMMANDS_FILE="$RUNNER_TEMP/atlas-namuwiki-commands.json"
          node scripts/parse-namuwiki-command.mjs "$COMMANDS_FILE"
          jq -e 'type == "array" and length > 0 and length <= 25' "$COMMANDS_FILE" >/dev/null
          COMMAND_COUNT="$(jq -r 'length' "$COMMANDS_FILE")"
          echo "ATLAS_NAMUWIKI_COMMANDS_FILE=$COMMANDS_FILE" >> "$GITHUB_ENV"
          printf 'count=%s\n' "$COMMAND_COUNT" >> "$GITHUB_OUTPUT"
          echo "Validated ${COMMAND_COUNT} NamuWiki reference command(s) before any write."

      - name: Resolve deployed runtime compatibility
        shell: bash
        run: |
          set -Eeuo pipefail
          READINESS_FILE="$RUNNER_TEMP/atlas-namuwiki-link-readiness.json"
          DIFF_FILE="$RUNNER_TEMP/atlas-namuwiki-link-runtime-diff.txt"

          curl --fail --silent --show-error \
            "$ATLAS_AUTHORING_READINESS_ENDPOINT" > "$READINESS_FILE"
          jq -e '
            .ok == true
            and (.runtime_sha | type == "string" and test("^[0-9a-f]{40}$"))
          ' "$READINESS_FILE" >/dev/null

          runtime_sha="$(jq -er '.runtime_sha' "$READINESS_FILE")"
          git cat-file -e "${runtime_sha}^{commit}" || {
            echo "Deployed runtime commit is unavailable in checkout: ${runtime_sha}" >&2
            exit 1
          }
          git merge-base --is-ancestor "$runtime_sha" "$GITHUB_SHA" || {
            echo "Deployed runtime is not an ancestor of NamuWiki link commit" >&2
            exit 1
          }
          git diff --name-only --diff-filter=ACDMRTUXB "$runtime_sha" "$GITHUB_SHA" -- > "$DIFF_FILE"

          ATLAS_RUNTIME_DIFF_FILE="$DIFF_FILE" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { requiresAuthoringRuntimeDeployment } from './scripts/vercel-ignore-build.mjs';

          const text = fs.readFileSync(process.env.ATLAS_RUNTIME_DIFF_FILE, 'utf8').trim();
          const paths = text ? text.split(/\r?\n/).filter(Boolean) : [];
          if (requiresAuthoringRuntimeDeployment(paths)) {
            console.error('NAMUWIKI_RUNTIME_CODE_DRIFT: deployment-relevant changes exist after the deployed runtime SHA');
            for (const path of paths) console.error(`  ${path}`);
            process.exit(1);
          }
          console.log(`NamuWiki link delta is deployed-runtime-safe (${paths.length} path${paths.length === 1 ? '' : 's'}).`);
          NODE

          echo "ATLAS_RUNTIME_SHA=${runtime_sha}" >> "$GITHUB_ENV"
          echo "Deployed runtime ${runtime_sha} is compatible with NamuWiki link commit ${GITHUB_SHA}."

      - name: Request dedicated GitHub OIDC token
        shell: bash
        run: |
          set -Eeuo pipefail
          TOKEN_FILE="$RUNNER_TEMP/atlas-namuwiki-link-oidc"
          umask 077
          curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ATLAS_NAMUWIKI_LINK_AUDIENCE}" \
            | jq -er '.value' > "$TOKEN_FILE"
          test -s "$TOKEN_FILE"

      - name: Apply and verify NamuWiki references sequentially
        shell: bash
        run: |
          set -Eeuo pipefail
          TOKEN_FILE="$RUNNER_TEMP/atlas-namuwiki-link-oidc"
          RESULTS_FILE="$RUNNER_TEMP/atlas-namuwiki-results.json"
          printf '[]\n' > "$RESULTS_FILE"
          echo "ATLAS_NAMUWIKI_RESULTS_FILE=$RESULTS_FILE" >> "$GITHUB_ENV"

          while IFS= read -r ITEM; do
            PERSON_ID="$(jq -r '.person_id' <<<"$ITEM")"
            REFERENCE_STATUS="$(jq -r '.status' <<<"$ITEM")"
            NAMUWIKI_URL="$(jq -r '.url // ""' <<<"$ITEM")"
            echo "ATLAS_NAMUWIKI_CURRENT_PERSON_ID=$PERSON_ID" >> "$GITHUB_ENV"

            RESPONSE_FILE="$RUNNER_TEMP/atlas-namuwiki-response-${PERSON_ID}.json"
            PAYLOAD="$(jq -cn \
              --arg runtime_sha "$ATLAS_RUNTIME_SHA" \
              --arg workflow_sha "$GITHUB_SHA" \
              --arg person_id "$PERSON_ID" \
              --arg status "$REFERENCE_STATUS" \
              --arg url "$NAMUWIKI_URL" \
              'if $status == "linked" then
                 {runtime_sha:$runtime_sha,workflow_sha:$workflow_sha,person_id:$person_id,url:$url}
               else
                 {runtime_sha:$runtime_sha,workflow_sha:$workflow_sha,person_id:$person_id,status:$status}
               end')"
            HTTP_STATUS="$(curl --silent --show-error \
              --output "$RESPONSE_FILE" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'content-type: application/json' \
              --header "Authorization: Bearer $(cat "$TOKEN_FILE")" \
              --data "$PAYLOAD" \
              "$ATLAS_NAMUWIKI_LINK_ENDPOINT")"
            cat "$RESPONSE_FILE"
            test "$HTTP_STATUS" = "200"

            if [[ "$REFERENCE_STATUS" = 'linked' ]]; then
              jq -e '.ok == true and .committed == true and .external_reference.status == "linked" and (.external_reference.url | type == "string") and (.external_reference.document_title | type == "string")' "$RESPONSE_FILE" >/dev/null
            else
              jq -e '.ok == true and .committed == true and .external_reference.status == "not_found" and .external_reference.url == null and .external_reference.document_title == null' "$RESPONSE_FILE" >/dev/null
            fi

            EXPECTED_STATUS="$(jq -r '.external_reference.status' "$RESPONSE_FILE")"
            EXPECTED_URL="$(jq -r '.external_reference.url // ""' "$RESPONSE_FILE")"
            EXPECTED_TITLE="$(jq -r '.external_reference.document_title // ""' "$RESPONSE_FILE")"
            REPLAY="$(jq -r '.replay' "$RESPONSE_FILE")"

            READ_FILE="$RUNNER_TEMP/atlas-namuwiki-readback-${PERSON_ID}.json"
            curl --fail --silent --show-error \
              --get \
              --data-urlencode "person_id=$PERSON_ID" \
              "$ATLAS_PERSON_READ_ENDPOINT" > "$READ_FILE"
            cat "$READ_FILE"
            ACTUAL_STATUS="$(jq -er '.person.external_references.namuwiki.status' "$READ_FILE")"
            test "$ACTUAL_STATUS" = "$EXPECTED_STATUS"
            if [[ "$EXPECTED_STATUS" = 'linked' ]]; then
              ACTUAL_URL="$(jq -er '.person.external_references.namuwiki.url' "$READ_FILE")"
              ACTUAL_TITLE="$(jq -er '.person.external_references.namuwiki.document_title' "$READ_FILE")"
              test "$ACTUAL_URL" = "$EXPECTED_URL"
              test "$ACTUAL_TITLE" = "$EXPECTED_TITLE"
            else
              jq -e '.person.external_references.namuwiki.url == null and .person.external_references.namuwiki.document_title == null' "$READ_FILE" >/dev/null
            fi

            RESULT="$(jq -cn \
              --arg person_id "$PERSON_ID" \
              --arg status "$EXPECTED_STATUS" \
              --arg url "$EXPECTED_URL" \
              --arg document_title "$EXPECTED_TITLE" \
              --arg replay "$REPLAY" \
              '{person_id:$person_id,status:$status,url:(if $url == "" then null else $url end),document_title:(if $document_title == "" then null else $document_title end),replay:$replay}')"
            TEMP_RESULTS="${RESULTS_FILE}.tmp"
            jq --argjson result "$RESULT" '. + [$result]' "$RESULTS_FILE" > "$TEMP_RESULTS"
            mv "$TEMP_RESULTS" "$RESULTS_FILE"
            echo "Verified $PERSON_ID as $EXPECTED_STATUS in Production."
          done < <(jq -c '.[]' "$ATLAS_NAMUWIKI_COMMANDS_FILE")

          test "$(jq -r 'length' "$RESULTS_FILE")" = "$(jq -r 'length' "$ATLAS_NAMUWIKI_COMMANDS_FILE")"

      - name: Comment verified result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          COUNT="$(jq -r 'length' "$ATLAS_NAMUWIKI_RESULTS_FILE")"
          if [[ "$COUNT" = '1' ]]; then
            PERSON_ID="$(jq -r '.[0].person_id' "$ATLAS_NAMUWIKI_RESULTS_FILE")"
            REFERENCE_STATUS="$(jq -r '.[0].status' "$ATLAS_NAMUWIKI_RESULTS_FILE")"
            CANONICAL_URL="$(jq -r '.[0].url // ""' "$ATLAS_NAMUWIKI_RESULTS_FILE")"
            DOCUMENT_TITLE="$(jq -r '.[0].document_title // ""' "$ATLAS_NAMUWIKI_RESULTS_FILE")"
            REPLAY="$(jq -r '.[0].replay' "$ATLAS_NAMUWIKI_RESULTS_FILE")"
            if [[ "$REFERENCE_STATUS" = 'linked' ]]; then
              BODY="✅ NamuWiki link verified\n\nPerson: \`$PERSON_ID\`\nStatus: linked\nDocument: $DOCUMENT_TITLE\nURL: $CANONICAL_URL\nReplay: $REPLAY\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            else
              BODY="✅ NamuWiki not-found verified\n\nPerson: \`$PERSON_ID\`\nStatus: not_found\nDocument: null\nURL: null\nReplay: $REPLAY\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            fi
          else
            LINES="$(jq -r '.[] | if .status == "linked" then "- `" + .person_id + "` — linked — " + .document_title + " — " + .url else "- `" + .person_id + "` — not_found" end' "$ATLAS_NAMUWIKI_RESULTS_FILE")"
            BODY="✅ NamuWiki batch verified: ${COUNT}/${COUNT}\n\n${LINES}\n\nEvery item passed an exact Production read-back.\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/431/comments" -f body="$BODY" >/dev/null

      - name: Comment failed result
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          VERIFIED='0'
          VERIFIED_LINES=''
          if [[ -n "${ATLAS_NAMUWIKI_RESULTS_FILE:-}" && -f "$ATLAS_NAMUWIKI_RESULTS_FILE" ]]; then
            VERIFIED="$(jq -r 'length' "$ATLAS_NAMUWIKI_RESULTS_FILE")"
            VERIFIED_LINES="$(jq -r '.[] | "- `" + .person_id + "` — " + .status' "$ATLAS_NAMUWIKI_RESULTS_FILE")"
          fi
          BODY="❌ NamuWiki reference command failed. Verified before failure: ${VERIFIED}. Current person: ${ATLAS_NAMUWIKI_CURRENT_PERSON_ID:-not-started}. No unverified item is reported as successful."
          if [[ -n "$VERIFIED_LINES" ]]; then
            BODY="${BODY}\n\nVerified prefix:\n${VERIFIED_LINES}"
          fi
          BODY="${BODY}\n\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/issues/431/comments" -f body="$BODY" >/dev/null
