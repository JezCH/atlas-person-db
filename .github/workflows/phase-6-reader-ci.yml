name: Phase 6 Reader Contract

on:
  push:
    branches:
      - agent/phase6-reader-integration
    paths:
      - atlas-reader.js
      - app.js
      - index.html
      - atlas-server-write-adapter.js
      - migration/phase-6/scripts/test-reader-contract.mjs
      - .github/workflows/phase-6-reader-ci.yml
  pull_request:
    paths:
      - atlas-reader.js
      - app.js
      - index.html
      - atlas-server-write-adapter.js
      - migration/phase-6/scripts/test-reader-contract.mjs
      - tests/atlas-direct-normalized-reader.test.mjs
      - tests/phase8c-c6-direct-normalized-read-activation.test.mjs
      - .github/workflows/phase-6-reader-ci.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run reader contract tests
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'ATLAS_READER_V2_DIRECT' atlas-reader.js; then
            node --test tests/atlas-direct-normalized-reader.test.mjs tests/phase8c-c6-direct-normalized-read-activation.test.mjs
          else
            node migration/phase-6/scripts/test-reader-contract.mjs
          fi
      - name: Verify read abstraction and authenticated server writes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'window.AtlasReader.loadPersonPolitics' app.js
          ! grep -Fq 'select("*")' app.js
          grep -Fq 'ATLAS_SERVER_WRITE_ADAPTER' app.js
          grep -Fq 'writeAdapter.createActivity' app.js
          grep -Fq 'writeAdapter.updateActivity' app.js
          grep -Fq 'writeAdapter.deleteActivity' app.js
          grep -Fq 'writeAdapter.importActivities' app.js
          ! grep -Fq 'ATLAS_WRITE_ADAPTER' app.js
          ! grep -Fq '.from("person_politics").insert' app.js
          ! grep -Fq '.from("person_politics").update' app.js
          ! grep -Fq '.from("person_politics").delete' app.js
          ! grep -Eq 'from\("atlas_person_politics_compat_v1"\).*(insert|update|delete)' app.js atlas-reader.js atlas-server-write-adapter.js
          ! grep -Eq 'from\("atlas_v2' app.js atlas-reader.js atlas-server-write-adapter.js
          grep -Fq './atlas-reader.js' index.html
          grep -Fq './atlas-server-write-adapter.js' index.html
          ! grep -Fq './atlas-write-adapter.js' index.html
          ! grep -Fq './atlas-write-mode.js' index.html
          ! grep -Fq './atlas-v2-shadow-compiler.js' index.html
          ! grep -Fq 'ATLAS_MUTATION_TOKEN' atlas-server-write-adapter.js
          ! grep -Fq 'Authorization' atlas-server-write-adapter.js
          grep -Fq 'credentials: "same-origin"' atlas-server-write-adapter.js
