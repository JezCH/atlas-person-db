name: YouTube Batch008 Staging

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/youtube-batch008-staging.yml"
      - "scripts/youtube-batch008-staging.py"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Collect staging batch
        run: python scripts/youtube-batch008-staging.py
      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-batch008-staging
          path: out/youtube-batch008
          if-no-files-found: error
          retention-days: 3
