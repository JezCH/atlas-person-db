name: YouTube B024 Stage Only Actual Extra Original Profile IDs on Own PR Branch

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/youtube-b024-stage-extra-original-profile-runtime.py'
      - '.github/workflows/youtube-b024-stage-additive-runtime-original-ids.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: atlas-b024-actual-extra-original-id-on-own-PR-branch
  cancel-in-progress: false

jobs:
  stage_verified_536_original_ids_once:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/youtube-b024-broader-original-id-person-topic-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: stage_gate
        name: Do not restage if the verified 536 IDs are already committed
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_HEAD_REF" == "feat/youtube-b024-broader-original-id-person-topic-20261020" ]]
          if [[ -f audits/youtube-b024-added-profile-title-runtime-source-20261020.json ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Previously verified 536 source IDs already staged: no redundant GitHub writes" >> "$GITHUB_STEP_SUMMARY"
          else
            [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify immutable already-executed extra ORIGINAL video evidence (NO video re-scan)
        if: steps.stage_gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12264217300" | jq -e '
            .id==12264217300 and .expired==false and
            .name=="youtube-b024-existing-extra-person-profile-original-ID-evidence-39422646162" and
            .digest=="sha256:2f74ff923eab322ea0bfa4bc145cda89e5fda41127567e05d3e2349e516e331e"
          ' >/dev/null
      - uses: actions/download-artifact@v4
        if: steps.stage_gate.outputs.run == 'true'
        with:
          name: youtube-b024-existing-extra-person-profile-original-ID-evidence-39422646162
          run-id: '39422646162'
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: verified-extra
      - name: Compile full additive 536 extra Video IDs and 400 identity rows with old 6162 ID parity
        if: steps.stage_gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/youtube-b024-stage-extra-original-profile-runtime.py \
            --reviewed-extra-artifact verified-extra/youtube-b024-additional-person-profile-title-ids.json \
            --out audits/youtube-b024-added-profile-title-runtime-source-20261020.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("audits/youtube-b024-added-profile-title-runtime-source-20261020.json")
          d=json.loads(p.read_text())
          assert len(d["rows"])==400
          assert sum(len(x[2]) for x in d["rows"])==536
          assert d["source_strict_biography_title_video_id_count"]==6162
          assert d["combined_unique_profile_plus_biography_title_video_ids"]==6698
          assert d["video_media_playback_verified_count"]==0
          assert d["production_rank_currently_changed"] is False
          PY
      - name: Commit verified additive input only, on same review branch; no Production or canonical DB mutation
        if: steps.stage_gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add audits/youtube-b024-added-profile-title-runtime-source-20261020.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "YouTube: preserve REAL 536 additional original video ID sets for all 400 affected profiles"
          # Never force push. Concurrent human changes should reject safely.
          git push origin HEAD:refs/heads/feat/youtube-b024-broader-original-id-person-topic-20261020
          echo "536 real new original Video IDs now committed with old strong 6162 preserved; 400 historical identity candidate labels affected; 0 actual watched videos." >> "$GITHUB_STEP_SUMMARY"
