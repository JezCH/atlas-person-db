name: ATLAS VIS3-05T-D Browser QA

on:
  pull_request:
    paths:
      - "atlas-dashboard-monumental-v11.css"
      - "atlas-ui-mobile-v8.css"
      - "scripts/verify-vis3-05t-d-browser.mjs"
      - ".github/workflows/atlas-vis3-05t-d-browser.yml"
permissions:
  contents: read
jobs:
  kpi_mobile_visual:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure Korean fonts without blocking QA
        run: |
          if ! fc-list :lang=ko family | grep -q .; then
            timeout 30s sudo apt-get update -qq || true
            timeout 30s sudo apt-get install -y --no-install-recommends fonts-noto-cjk || true
          fi
      - name: Start real headless Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9224 --user-data-dir=/tmp/atlas-vis3-05t-d-chrome \
            about:blank >/tmp/atlas-vis3-05t-d-chrome.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9224/json/version >/dev/null; then exit 0; fi
            sleep .3
          done
          cat /tmp/atlas-vis3-05t-d-chrome.log
          exit 1
      - name: Compare existing live KPI data and UI with branch-only CSS
        run: |
          node --check scripts/verify-vis3-05t-d-browser.mjs
          node scripts/verify-vis3-05t-d-browser.mjs
      - name: Upload original and changed DOM screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vis3-05t-d-live-kpi-${{ github.event.pull_request.head.sha }}
          path: artifacts/vis3-05t-d
          retention-days: 21
          if-no-files-found: warn
