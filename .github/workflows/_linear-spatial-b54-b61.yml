            ['619f2c3d-ef0a-42e8-9287-0216dbf83297','oceania','pacific-islands'],
            ['ee1a3777-153b-4a60-b720-0fb3030db7fe','oceania','pacific-islands'],
            ['727787e4-637c-4751-84c0-6463a8c93716','americas','mesoamerica'],
            ['0ae95b55-b343-4f4d-9b0f-87fe9c41429a','americas','south-america'],
            ['13600a43-8d24-4f34-b2c7-46c200d3cd8e','africa','maghreb-north-africa'],
            ['ea57a5b8-8553-40bb-b530-5eae8ab33801','africa','east-africa-horn'],
            ['54dd3191-c2b3-4a84-9ee2-5dd2191715ea','africa','east-africa-horn'],

            ['7e3a3d2a-ec89-4cbb-b504-daaa87c925f3','americas','north-america'],
            ['c641a768-fd7f-4adc-ae56-64338921251c','americas','north-america'],
            ['03c7195a-4853-4b78-adc3-f3cb3c74d109','americas','north-america'],
            ['9aa5f2e7-7165-460b-bed3-363b3e59fb75','americas','north-america'],
            ['7437f36b-6fe8-4b3a-a1e6-4e62fb407d1e','americas','north-america'],
            ['50b250fe-e8c2-49ea-99cf-616bac080f92','americas','north-america'],
            ['84519e07-7ff2-4a08-ad04-354849f2499d','americas','north-america'],
            ['829719ba-5961-4fc0-a829-81acab1a3398','americas','north-america'],
            ['c53ee1fc-faba-4c68-80b2-da2fd6b6b96e','americas','north-america'],
            ['791ef16f-77d2-473f-b6f6-2a6a74a8fa6e','americas','north-america'],
          ];

          if (exact.length !== 80 || new Set(exact.map(([id]) => id)).size !== 80) throw new Error('B54-B61 payload identity mismatch');
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          if (Object.keys(index.polity_geography).length !== 867 || Object.keys(index.polity_subregions).length !== 841) {
            throw new Error(`unexpected baseline ${Object.keys(index.polity_geography).length}/${Object.keys(index.polity_subregions).length}`);
          }
          for (const [id, region, subregion] of exact) {
            if (Object.hasOwn(index.polity_geography, id) || Object.hasOwn(index.polity_subregions, id)) throw new Error(`payload UUID already present: ${id}`);
            index.polity_geography[id] = region;
            index.polity_subregions[id] = subregion;
          }
          if (Object.keys(index.polity_geography).length !== 947 || Object.keys(index.polity_subregions).length !== 921) throw new Error('post-apply count mismatch');
          fs.writeFileSync(indexPath, JSON.stringify(index, null, 2) + '\n');

          let coverage = fs.readFileSync(coveragePath, 'utf8');
          if (!coverage.includes('assert.equal(Object.keys(index.polity_geography).length, 867);') || !coverage.includes('assert.equal(Object.keys(index.polity_subregions).length, 841);')) throw new Error('coverage baseline locks missing');
          coverage = coverage.replace('assert.equal(Object.keys(index.polity_geography).length, 867);', 'assert.equal(Object.keys(index.polity_geography).length, 947);');
          coverage = coverage.replace('assert.equal(Object.keys(index.polity_subregions).length, 841);', 'assert.equal(Object.keys(index.polity_subregions).length, 921);');
          fs.writeFileSync(coveragePath, coverage);

          let taxonomy = fs.readFileSync(taxonomyPath, 'utf8');
          const replacements = [
            ['  mesoamerica: 22,','  mesoamerica: 25,'],
            ['  caribbean: 8,','  caribbean: 9,'],
            ['  "eastern-europe": 14,','  "eastern-europe": 16,'],
            ['  "russia-volga": 13,','  "russia-volga": 15,'],
            ['  "maghreb-north-africa": 21,','  "maghreb-north-africa": 23,'],
            ['  "nile-valley": 13,','  "nile-valley": 15,'],
            ['assert.equal(Object.keys(index.polity_subregions).length, 841);','assert.equal(Object.keys(index.polity_subregions).length, 921);'],
          ];
          for (const [from, to] of replacements) {
            if (!taxonomy.includes(from)) throw new Error(`taxonomy baseline lock missing: ${from}`);
            taxonomy = taxonomy.replace(from, to);
          }
          fs.writeFileSync(taxonomyPath, taxonomy);
          NODE
      - name: Validate exact spatial delta
        run: node --test tests/person-spacetime-spatial-index-coverage.test.mjs tests/spacetime-taxonomy-migration.test.mjs
      - name: Commit exact three-file delta
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas-polity-spatial-index.json tests/person-spacetime-spatial-index-coverage.test.mjs tests/spacetime-taxonomy-migration.test.mjs
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "[spatial] Apply reviewed B54-B61 superbatch"
          git push origin HEAD:${{ github.ref_name }}
