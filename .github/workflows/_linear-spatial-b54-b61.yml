            ['755e850a-3e74-43ad-927c-21153ab9a758','southeast-asia','maritime-southeast-asia'],
            ['b72696d0-23e5-436e-a444-9fa9bc75685f','east-asia','korean-peninsula'],
            ['93b870e9-1800-4d3e-93a2-940f77dfb268','west-asia','iranian-plateau'],
            ['e8ab76cf-c305-48e9-a88c-cd4c167b6340','east-asia','china'],
            ['812853fe-f16b-4e08-a2b5-9624ec8f864c','americas','north-america'],
            ['e154c1b2-ee23-4ba7-a94f-c99940c75ca9','southeast-asia','maritime-southeast-asia'],
