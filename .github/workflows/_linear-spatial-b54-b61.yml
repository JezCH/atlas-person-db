name: Linear Spatial B54-B61 One-Shot

on:
  push:
    branches:
      - linear/spatial-b54-b61-superbatch

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply exact reviewed B54-B61 payload
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const indexPath = 'atlas-polity-spatial-index.json';
          const coveragePath = 'tests/person-spacetime-spatial-index-coverage.test.mjs';
          const taxonomyPath = 'tests/spacetime-taxonomy-migration.test.mjs';

          const exact = [
            ['61114748-4013-47c9-9c50-1a814f7e54d2','europe','eastern-europe'],
            ['f93d1a88-2225-43bf-9f7a-8722a7e49883','europe','russia-volga'],
            ['b0f6f245-0722-4bf4-98c6-51a2bd42f42c','europe','eastern-europe'],
            ['2c9ebf4b-5ac6-4b1f-a2ba-848c58df80c9','europe','italy'],
            ['9cb4d640-0b98-4fc1-9365-388398a3d659','europe','balkans'],
