            ['828c4b7e-bc35-40a4-bf50-e6e6291a070f','americas','north-america'],
            ['a053e4e2-ede9-4d60-9ff7-c2affcffdd85','americas','north-america'],
            ['3b364410-3f80-4d8e-9c1e-14f7b30ba7da','americas','north-america'],
            ['fd6aad9a-23ab-4bd6-83eb-5d7c312ebd7d','americas','north-america'],
            ['486460ce-17c8-44ff-bd8b-e8fef9fe3103','americas','north-america'],
            ['9a33b030-1db9-4d32-bdda-4f4cdeb7ce06','americas','north-america'],
            ['acf753ff-30db-4466-8452-02d9e7bca292','americas','north-america'],
            ['42cd2790-11ad-451e-999d-6e3c61bc2348','americas','north-america'],
            ['f0b47b08-f534-483b-b601-c614e2ee7431','americas','north-america'],
            ['9458cfaf-0509-4219-bb9e-e058ede93720','americas','north-america'],

            ['07a42911-7d36-462d-ab84-10022f20d41f','americas','north-america'],
            ['dba0de0b-43ad-4c41-aa1a-189e4c1a903e','americas','north-america'],
            ['b53e20f3-8e52-480e-8910-1c4f1d8d7f29','americas','north-america'],
            ['f5f72eb0-2b1e-4c6b-bdd3-57565b14163a','americas','north-america'],
            ['43e0fcbe-2d74-421a-ace5-dc1c5fef3560','americas','north-america'],
            ['45d8bf4c-a22d-404e-bf44-ef14aa72755c','americas','north-america'],
            ['790d1841-dc64-4813-96fc-e0f78afa22b3','americas','north-america'],
