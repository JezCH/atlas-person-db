name: ATLAS VIS3-05T-C Sidebar Browser Compare

on:
  pull_request:
    paths:
      - "atlas-ui-visual-foundation.css"
      - "scripts/verify-vis3-05t-c-sidebar-browser.mjs"
      - ".github/workflows/atlas-vis3-05t-c-sidebar-browser.yml"
permissions:
  contents: read
jobs:
  production_before_after:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ATLAS_PRODUCTION_ORIGIN: https://atlas-person-db.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Korean fonts without delaying browser verification
        run: |
          if ! fc-list :lang=ko family | grep -q .; then
            timeout 30s sudo apt-get update -qq || true
            timeout 30s sudo apt-get install -y --no-install-recommends fonts-noto-cjk || true
          fi
      - name: Start Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9226 --user-data-dir=/tmp/atlas-vis3-05t-c-chrome \
            about:blank >/tmp/atlas-vis3-05t-c-chrome.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9226/json/version >/dev/null; then exit 0; fi
            sleep .3
          done
          cat /tmp/atlas-vis3-05t-c-chrome.log
          exit 1
      - name: Compare current Production and PR sidebar CSS on same DOM
        run: |
          node --check scripts/verify-vis3-05t-c-sidebar-browser.mjs
          node scripts/verify-vis3-05t-c-sidebar-browser.mjs
      - name: Preserve real browser comparison PNGs and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vis3-05t-c-live-sidebar-${{ github.event.pull_request.head.sha }}
          path: artifacts/vis3-05t-c-rail
          retention-days: 21
          if-no-files-found: warn
