name: Phase 8C C3 Server Mutation Service

on:
  pull_request:
    paths:
      - "server/atlas-mutation-service.js"
      - "tests/atlas-server-mutation-service.test.mjs"
      - ".github/workflows/phase-8c-c3-server-mutation-service.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run server mutation service tests
        run: node --test tests/atlas-server-mutation-service.test.mjs

      - name: Verify browser boundary remains clean
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'server/atlas-mutation-service.js' index.html
          ! grep -q 'server/atlas-mutation-service.js' admin.html
          ! grep -q 'SUPABASE_DB_URL\|service_role\|postgresql://' app.js admin.js index.html admin.html
