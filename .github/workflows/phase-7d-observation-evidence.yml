name: Phase 7D Observation Evidence

on:
  workflow_dispatch:
    inputs:
      approved_observation_sha:
        description: Exact merged Phase 7D observation-gate SHA
        required: true
        type: string
      confirmation_token:
        description: Type RUN_ATLAS_PHASE_7D_OBSERVATION_EVIDENCE
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_OBSERVATION_SHA: a03b4406c3dd66a65ac6e0ab2eb06ed8a0f22c4f
  REQUIRED_CONFIRMATION_TOKEN: RUN_ATLAS_PHASE_7D_OBSERVATION_EVIDENCE

concurrency:
  group: atlas-phase-7d-observation-evidence
  cancel-in-progress: false

jobs:
  observation-evidence:
    runs-on: ubuntu-24.04
    environment: phase-5-shadow
    steps:
      - name: Validate authorization inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.approved_observation_sha }}" = "$EXPECTED_OBSERVATION_SHA"
          test "${{ inputs.confirmation_token }}" = "$REQUIRED_CONFIRMATION_TOKEN"

      - name: Checkout exact observation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_observation_sha }}
          fetch-depth: 0

      - name: Verify checked-out SHA and production manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_OBSERVATION_SHA"
          grep -Fx '  DATA_SOURCE: "v2-shadow"' atlas-production-source.js

      - name: Verify database secret
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run Phase 7 contracts and live read-only verification
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          rm -rf migration/phase-7/tmp/observation
          mkdir -p migration/phase-7/tmp/observation
          node migration/phase-7/scripts/phase7a-contract.mjs > migration/phase-7/tmp/observation/phase7a-contract.json
          node migration/phase-7/scripts/phase7b-contract.mjs > migration/phase-7/tmp/observation/phase7b-contract.json
          node migration/phase-7/scripts/phase7c-preflight.mjs > migration/phase-7/tmp/observation/phase7c-static.json
          node migration/phase-7/scripts/phase7d-observation-contract.mjs > migration/phase-7/tmp/observation/phase7d-contract.json
          mkdir -p migration/phase-7/tmp/activation
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --no-psqlrc --file migration/phase-7/scripts/export-phase7c-preflight.sql > migration/phase-7/tmp/observation/export.log 2>&1
          cp migration/phase-7/tmp/activation/preflight-db.json migration/phase-7/tmp/observation/preflight-db.json
          node migration/phase-7/scripts/phase7c-db-preflight.mjs migration/phase-7/tmp/observation/preflight-db.json migration/phase-7/tmp/observation/phase7d-db.json

      - name: Build observation evidence report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p migration/phase-7/tmp/observation
          node - <<'NODE'
          const fs = require('fs');
          const dir = 'migration/phase-7/tmp/observation';
          const read = (name) => {
            const p = `${dir}/${name}`;
            return fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, 'utf8')) : null;
          };
          const a = read('phase7a-contract.json');
          const b = read('phase7b-contract.json');
          const c = read('phase7c-static.json');
          const d = read('phase7d-contract.json');
          const db = read('phase7d-db.json');
          const failures = [];
          for (const [name, report] of Object.entries({phase7a:a,phase7b:b,phase7c:c,phase7d:d,database:db})) {
            if (!report?.pass) failures.push(`${name} did not pass`);
          }
          if (c?.manifest !== 'v2-shadow') failures.push('production manifest is not v2-shadow');
          if (db?.counts?.legacy !== 319) failures.push('legacy row count differs from 319');
          if (db?.counts?.v2 !== 349) failures.push('v2 row count differs from 349');
          if (!db?.privileges?.anon_select || !db?.privileges?.authenticated_select) failures.push('compatibility SELECT privilege missing');
          if (!db?.privileges?.anon_write_denied || !db?.privileges?.authenticated_write_denied) failures.push('compatibility write denial failed');
          const report = {
            marker: 'PHASE_7D_OBSERVATION_EVIDENCE',
            observation_sha: process.env.EXPECTED_OBSERVATION_SHA,
            activation_sha: 'b80fbdf4371b813a686c84c8dc9696e7b8efcd63',
            production_evidence_run: 31114892854,
            production_evidence_artifact: 8973230282,
            requested_source: 'v2-shadow',
            effective_source_expected: 'v2-shadow',
            fallback_observed_expected: false,
            validation_failures_expected: 0,
            write_target: 'public.person_politics',
            compatibility_privileges: failures.some((x) => x.includes('privilege')) ? 'FAIL' : 'PASS',
            rollback_package: 'READY',
            functional_observation: 'MANUAL_REQUIRED',
            result: failures.length === 0 ? 'READY_FOR_MANUAL_OBSERVATION' : 'HOLD',
            failures
          };
          fs.writeFileSync(`${dir}/phase7d-observation-evidence.json`, JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          if (failures.length) process.exitCode = 2;
          NODE

      - name: Upload observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-7d-observation-evidence-${{ inputs.approved_observation_sha }}
          path: migration/phase-7/tmp/observation
          if-no-files-found: error
          retention-days: 90
