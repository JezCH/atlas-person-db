name: Phase 8C C5A V2 Authoritative Writer Proof

on:
  pull_request:
    paths:
      - "server/atlas-postgres-v2-authoritative-transaction.js"
      - "server/atlas-v2-authoritative-mutation-service.js"
      - "tests/atlas-v2-authoritative-transaction-contract.test.mjs"
      - "tests/atlas-v2-authoritative-mutation-service.test.mjs"
      - "migration/phase-8/scripts/phase8c-c5a-v2-authoritative-proof.mjs"
      - "migration/phase-8/PHASE_8C_C5A_V2_AUTHORITATIVE_WRITER_PROOF.md"
      - ".github/workflows/phase-8c-c5a-v2-authoritative-writer-proof.yml"
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact main SHA approved for committed v2-only proof
        required: true
        type: string
      confirm:
        description: Type PHASE8C_C5A_COMMITTED_V2_ONLY_PROOF
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: atlas-phase8c-c5a-v2-authoritative-writer-proof
  cancel-in-progress: false

jobs:
  static-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run v2-authoritative focused tests
        run: >-
          node --test
          tests/atlas-v2-authoritative-transaction-contract.test.mjs
          tests/atlas-v2-authoritative-mutation-service.test.mjs
          tests/atlas-v2-command-planner.test.mjs
          tests/atlas-optional-role-schema-contract.test.mjs
      - name: Prove new persistence path has zero legacy dependency
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n 'public.person_politics' server/atlas-postgres-v2-authoritative-transaction.js server/atlas-v2-authoritative-mutation-service.js
          ! grep -n 'atlas_person_politics_compat_v1' server/atlas-postgres-v2-authoritative-transaction.js server/atlas-v2-authoritative-mutation-service.js
          ! grep -n 'executeLegacy' server/atlas-postgres-v2-authoritative-transaction.js server/atlas-v2-authoritative-mutation-service.js
          grep -n 'write_mode: "v2-only"' server/atlas-v2-authoritative-mutation-service.js
          grep -n 'v2-runtime:' server/atlas-postgres-v2-authoritative-transaction.js
          grep -n 'RECONCILIATION_NORMALIZED_INPUT_REQUIRED' server/atlas-v2-authoritative-mutation-service.js
      - name: Prove C5A does not activate production early
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'createDualWriteTransactionFactory' server/atlas-vercel-mutation-handler.js
          ! grep -n 'createV2AuthoritativeTransactionFactory' server/atlas-vercel-mutation-handler.js

  protected-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: phase-5-shadow
    steps:
      - name: Guard exact SHA and confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = "PHASE8C_C5A_COMMITTED_V2_ONLY_PROOF"
          test "${{ inputs.approved_sha }}" = "${{ github.sha }}"

      - name: Checkout approved SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install server dependency
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Run committed v2-only proof
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p migration/phase-8/tmp/phase8c-c5a-v2-authoritative
          node migration/phase-8/scripts/phase8c-c5a-v2-authoritative-proof.mjs \
            | tee migration/phase-8/tmp/phase8c-c5a-v2-authoritative/report.json

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase8c-c5a-v2-authoritative-${{ inputs.approved_sha }}
          path: migration/phase-8/tmp/phase8c-c5a-v2-authoritative
          if-no-files-found: error
          retention-days: 90
