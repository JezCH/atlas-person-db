name: TEMP Spatial B37-B39 Apply

on:
  push:
    branches:
      - ops/spatial-backfill-b37-b39
    paths:
      - .github/workflows/temp-spatial-b37-b39-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/spatial-backfill-b37-b39
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact reviewed B37-B39 spatial mappings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const spatialPath = 'atlas-polity-spatial-index.json';
          const index = JSON.parse(fs.readFileSync(spatialPath, 'utf8'));
          if (Object.keys(index.polity_geography).length !== 680 || Object.keys(index.polity_subregions).length !== 654) {
            throw new Error('unexpected B37-B39 baseline');
          }
          const mappings = {
            'fe17946c-d8d8-4ccd-ab80-af91740d1fd2': ['south-asia', 'north-india-ganges'],
            'f5916e91-73fe-49e2-abfa-339988c21651': ['africa', 'central-africa'],
            '4458776f-6c31-4b93-950e-f2cdd16c852c': ['africa', 'east-africa-horn'],
            '475a85a9-b966-4f31-b9df-2143d7d7f739': ['africa', 'southern-africa'],
            '96cb1159-e7fe-4ae2-8b35-b8b99be8ecc9': ['europe', 'northern-europe'],
            '48c5f1bc-afa3-42fc-abd1-499b807c1944': ['europe', 'italy'],
            '28448862-277d-4738-9fb4-7f51a9e4c03a': ['west-asia', 'anatolia'],
            '4b3b1761-c473-4b06-895d-14db3f653f14': ['africa', 'southern-africa'],
            '6991ca13-fafb-4fe8-ae44-515929f84e53': ['americas', 'south-america'],
            '5a290036-5e47-4426-bd2e-eb1992126804': ['west-asia', 'caucasus'],
            '4d6a9f98-8601-42df-a15c-4cbdcd82592c': ['americas', 'north-america'],
            '89deca8d-2f95-4252-b5b9-9726e44f86f9': ['americas', 'north-america'],
            'd66c84a2-0e69-4599-988a-2d76d180238f': ['americas', 'north-america'],
            '2798943e-f35d-4103-8021-0e89012c0425': ['europe', 'britain-ireland'],
            '07df9d9b-8e3e-479d-92e0-ba02fb2d9b51': ['europe', 'central-europe'],
            'e70a647f-01f4-44c0-a047-ee8a83dbb8ad': ['europe', 'central-europe'],
            '80f15df0-6ffc-4fa1-ade9-05b6d6438d35': ['americas', 'south-america'],
            'ca1f1ca3-5049-49c5-bb70-8c51b19a3b16': ['americas', 'north-america'],
            '59ba85f5-ed41-4876-81d7-28768a084f89': ['africa', 'nile-valley'],
            'bc322154-c950-4a82-9cdd-70e530ed8517': ['europe', 'central-europe'],
            '6bf5c13f-2c1b-4f90-bc50-dc7e178aae90': ['europe', 'central-europe'],
            'eef291e2-7f5c-4bbd-9700-fcf84d0562a2': ['africa', 'west-africa'],
            'fdcf30a9-5fc0-425f-b044-f9a806fcdb97': ['europe', 'russia-volga'],
            '5e472dc4-61f1-41b2-b520-0252b52bebdc': ['europe', 'central-europe'],
            '1b535d19-0108-486e-8edc-f13b79f1e8f1': ['central-asia', 'eastern-central-asia-steppe'],
            '819ae1cc-558d-49fe-a7cd-4a5ffd9f6d81': ['europe', 'western-europe'],
            'ea3a6fdc-476c-4feb-ab8b-0355c4631a72': ['africa', 'nile-valley'],
            '2e64d7d1-6ece-4fc1-a332-4e159ab982e5': ['europe', 'balkans'],
            '291e7253-4dc6-4793-a52f-b2e7f38e233d': ['europe', 'russia-volga'],
            '4a817a8d-56db-49c1-a1a4-3c566bb51c48': ['europe', 'central-europe'],
          };
          if (Object.keys(mappings).length !== 30) throw new Error('expected 30 reviewed mappings');
          for (const [id, [macro, sub]] of Object.entries(mappings)) {
            if (Object.hasOwn(index.polity_geography, id) || Object.hasOwn(index.polity_subregions, id)) {
              throw new Error(`B37-B39 candidate already mapped: ${id}`);
            }
            index.polity_geography[id] = macro;
            index.polity_subregions[id] = sub;
          }
          if (Object.keys(index.polity_geography).length !== 710) throw new Error('expected 710 geography mappings');
          if (Object.keys(index.polity_subregions).length !== 684) throw new Error('expected 684 subregion mappings');
          fs.writeFileSync(spatialPath, JSON.stringify(index, null, 2) + '\n');

          const coveragePath = 'tests/person-spacetime-spatial-index-coverage.test.mjs';
          let coverage = fs.readFileSync(coveragePath, 'utf8');
          coverage = coverage.replace('assert.equal(Object.keys(index.polity_geography).length, 680);', 'assert.equal(Object.keys(index.polity_geography).length, 710);');
          coverage = coverage.replace('assert.equal(Object.keys(index.polity_subregions).length, 654);', 'assert.equal(Object.keys(index.polity_subregions).length, 684);');
          fs.writeFileSync(coveragePath, coverage);

          const taxonomyPath = 'tests/spacetime-taxonomy-migration.test.mjs';
          let taxonomy = fs.readFileSync(taxonomyPath, 'utf8');
          taxonomy = taxonomy.replace('assert.equal(Object.keys(index.polity_subregions).length, 654);', 'assert.equal(Object.keys(index.polity_subregions).length, 684);');
          taxonomy = taxonomy.replace('"russia-volga": 11,', '"russia-volga": 13,');
          taxonomy = taxonomy.replace('"nile-valley": 8,', '"nile-valley": 10,');
          taxonomy = taxonomy.replace('anatolia: 8,', 'anatolia: 9,');
          taxonomy = taxonomy.replace('caucasus: 7,', 'caucasus: 8,');
          fs.writeFileSync(taxonomyPath, taxonomy);
          NODE
          rm .github/workflows/temp-spatial-b37-b39-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas-polity-spatial-index.json tests/person-spacetime-spatial-index-coverage.test.mjs tests/spacetime-taxonomy-migration.test.mjs .github/workflows/temp-spatial-b37-b39-apply.yml
          git commit -m "spatial: backfill batches 37 through 39 polity placements"
          git push origin HEAD:ops/spatial-backfill-b37-b39
