name: YouTube B024 Existing Originals — More Person Profile Title IDs (NO CRAWL)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/youtube-b024-broader-title-person-subject-ids.py'
      - 'tests/test_youtube_b024_broader_title_person_subject_ids.py'
      - 'tests/atlas-youtube-b024-broader-original-id-person-profile.test.mjs'
      - '.github/workflows/youtube-b024-broader-existing-original-profile-title.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: atlas-b024-archived-additional-profile-title-full-source-one-time
  cancel-in-progress: false

jobs:
  actually_find_additional_existing_original_person_titles:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed on old-ID mismatch and explain title-evidence limits
        run: python3 -m unittest discover -s tests -p test_youtube_b024_broader_title_person_subject_ids.py -v
      - name: Verify immutable EXISTING 2230031-title source archived BEFORE downloading
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11613130249" | jq -e '
            .id==11613130249 and .expired==false and
            .name=="youtube-cumulative-batch024-validated" and
            .digest=="sha256:8f3ca335012fe82c94848f63b9126b1aeec7b48c935b403605dd7752ce713946"
          ' >/dev/null
      - name: Download EXISTING original archive only — NO video requests/crawl
        uses: actions/download-artifact@v4
        with:
          name: youtube-cumulative-batch024-validated
          run-id: '37921755392'
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: corpus
      - name: Review title profiles from already acquired archived Video IDs ONCE
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/youtube-b024-broader-title-person-subject-ids.py \
            --archive corpus \
            --verified-extracted-artifact \
            --output /tmp/youtube-b024-additional-person-profile-title-ids.json \
            | tee /tmp/youtube-b024-additional-title-report.log
      - name: Verify 10127/2230031 original parity, preserve 6162 old original IDs and summarize ALL 2241 candidates
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('/tmp/youtube-b024-additional-person-profile-title-ids.json').read_text())
          assert d['archived_channels_scanned']==10127
          assert d['archived_video_titles_scanned']==2230031
          assert d['independent_source_name_lexicon']==5965
          assert d['candidate_name_groups']==2241
          assert d['previous_strict_original_video_ids']==6162
          assert d['new_distinct_explicit_profile_title_original_video_ids']>0
          assert d['title_profile_cues_are_NOT_watched_content'] is True
          assert d['actual_video_content_verified']==0
          assert d['new_youtube_videos_fetched']==0
          assert d['production_rank_changed'] is False
          assert len(d['rows'])==2241
          assert sum(r['additional_profile_title_videos'] for r in d['rows'])==d['new_distinct_explicit_profile_title_original_video_ids']
          assert all(r['combined_title_evidence_distinct_videos']==r['strict_biography_title_videos']+r['additional_profile_title_videos'] for r in d['rows'])
          assert all(r['combined_title_evidence_distinct_channels']>=r['strict_biography_title_channels'] for r in d['rows'])
          lines=[
            '# B024 REAL new person-profile TITLE original IDs from the existing 2.23m archived videos',
            '**0 newly discovered YouTube videos / requests. Reused exact archived original video/title/channel records.**',
            '- Original archived Channel IDs: **'+str(d['archived_channels_scanned'])+'**',
            '- Original archived video-title rows actually classified: **'+str(d['archived_video_titles_scanned'])+'**',
            '- Candidate source labels: **'+str(d['candidate_name_groups'])+'**',
            '- Previous stricter biography-title original Video IDs preserved: **'+str(d['previous_strict_original_video_ids'])+'**',
            '- **ADDITIONAL previously uncounted person-profile TITLE Video IDs: '+str(d['new_distinct_explicit_profile_title_original_video_ids'])+'**',
            '- **Additional candidate name groups reached: '+str(d['candidate_groups_with_new_explicit_profile_titles'])+'**',
            '- Video content watched or certified: **0**; current registry final recheck: **PENDING**',
            '- This is a SEPARATE title-only review tier; NOT a Production ranking overwrite',
            '',
            '## Top 60 combined strict+new title-evidence candidates',
            '| Candidate | Old stricter channels | Additional profile channels | Additional original Video IDs | Combined unique title channels | Example new Video ID |',
            '|---|---:|---:|---:|---:|---|'
          ]
          for x in d['rows'][:60]:
              sample=x['extra_examples'][0]['video_id'] if x['extra_examples'] else '-'
              lines.append('| '+x['name'].replace('|',' ')+' | '+
                str(x['strict_biography_title_channels'])+' | '+
                str(x['additional_profile_title_channels'])+' | '+
                str(x['additional_profile_title_videos'])+' | '+
                str(x['combined_title_evidence_distinct_channels'])+' | '+sample+' |')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as f:
              f.write('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-b024-existing-extra-person-profile-original-ID-evidence-${{ github.run_id }}
          path: /tmp/youtube-b024-additional-person-profile-title-ids.json
          if-no-files-found: error
          retention-days: 60
