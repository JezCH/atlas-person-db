name: TEMP Apply Spatial B43-B45

on:
  push:
    branches:
      - ops/spatial-backfill-b43-b45

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/spatial-backfill-b43-b45
          fetch-depth: 0

      - name: Apply reviewed B43-B45 mappings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const indexPath = 'atlas-polity-spatial-index.json';
          const coveragePath = 'tests/person-spacetime-spatial-index-coverage.test.mjs';
          const taxonomyPath = 'tests/spacetime-taxonomy-migration.test.mjs';

          const mappings = [
            ['e176d14c-1bf7-4655-8d23-4be77a5da1b3','europe','central-europe'],
            ['0ce478c6-146d-4651-acae-7e09878fe251','europe','iberia'],
            ['1bbcc9c3-06b3-47da-b9a4-147431e5fee0','west-asia','iranian-plateau'],
            ['65d2f1b4-9b42-4e64-b8b2-5b8a1af9edaa','africa','central-africa'],
            ['7945d38f-57cf-4686-a9a6-bb675e8c4a1a','south-asia','northwest-south-asia'],
            ['4461d4af-ad8b-4bd2-8dce-697a94b7ad50','central-asia','eastern-central-asia-steppe'],
            ['93bebce8-a3cb-4a40-9b50-638d2d079212','south-asia','northwest-south-asia'],
            ['df5c9e30-8676-43eb-b360-5e08627f0e2c','central-asia','western-central-asia'],
            ['bf88f81f-adf6-467b-aba2-66b11d96b477','west-asia','iranian-plateau'],
            ['5138ccd3-07ae-46c9-9965-5e074df695e5','south-asia','north-india-ganges'],
            ['b11d8733-45b5-4165-9259-f15d861a3899','east-asia','japan'],
            ['abbc4049-41e4-4b74-a246-d7561b8d0b74','east-asia','japan'],
            ['fa7be9b9-ca9e-42ec-b545-43d8fd192267','europe','britain-ireland'],
            ['7deb7866-0eff-4123-8187-86a4be97a5e7','central-asia','western-central-asia'],
            ['660d3e55-22d6-46fa-8f93-5c389fb2247c','south-asia','northwest-south-asia'],
            ['77dd0282-ccf0-406b-b261-32d1270a72e5','africa','east-africa-horn'],
            ['b8c3ef01-2492-46b3-8a5c-17a0a363296d','africa','east-africa-horn'],
            ['a098ffac-513d-4847-9a59-8d45c6b31cc3','europe','balkans'],
            ['2b9eb85d-3f92-47cd-8f3d-59c9058c03b8','europe','britain-ireland'],
            ['419420b9-db02-46a2-b72e-344ee1df7e72','europe','balkans'],
            ['1742fd4e-6e63-4210-9081-fcb166b42d6f','east-asia','korean-peninsula'],
            ['e8236d5a-5b93-4eea-b448-3549affec265','central-asia','western-central-asia'],
            ['a1e5baa6-51e0-433e-8087-d800dd1cb3a2','east-asia','manchuria'],
            ['ae657a68-ef30-4fe5-bc76-3da9d12128d2','south-asia','north-india-ganges'],
            ['d8c1e879-5135-424c-b169-fc48a7084b3e','africa','nile-valley'],
            ['3c7942cb-06d1-4b6d-bf21-394133e4035a','southeast-asia','maritime-southeast-asia'],
            ['92621dae-f2b1-4e4d-9fa3-3db959894e7a','southeast-asia','maritime-southeast-asia'],
            ['d220add8-7290-4ca9-8bf6-907919f59b4f','americas','mesoamerica'],
            ['7b81d7f9-4200-4deb-ac5f-ebfc7f627c7c','west-asia','levant'],
            ['73d89d76-b756-4e73-9daf-2b6775f49ff4','africa','southern-africa']
          ];

          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          const beforeGeo = Object.keys(index.polity_geography).length;
          const beforeSub = Object.keys(index.polity_subregions).length;
          if (beforeGeo !== 757 || beforeSub !== 731) throw new Error(`unexpected baseline counts ${beforeGeo}/${beforeSub}`);
          if (new Set(mappings.map(([id]) => id)).size !== 30) throw new Error('mapping UUIDs are not unique');
          const pfIds = new Set((index.place_function_records || []).map((r) => r.polity_id));
          for (const [id, macro, sub] of mappings) {
            if (Object.hasOwn(index.polity_geography, id)) throw new Error(`already broad-mapped: ${id}`);
            if (Object.hasOwn(index.polity_subregions, id)) throw new Error(`already subregion-mapped: ${id}`);
            if (pfIds.has(id)) throw new Error(`already temporal place-function mapped: ${id}`);
            index.polity_geography[id] = macro;
            index.polity_subregions[id] = sub;
          }
          const afterGeo = Object.keys(index.polity_geography).length;
          const afterSub = Object.keys(index.polity_subregions).length;
          if (afterGeo !== 787 || afterSub !== 761) throw new Error(`unexpected post counts ${afterGeo}/${afterSub}`);
          fs.writeFileSync(indexPath, JSON.stringify(index, null, 2) + '\n');

          let coverage = fs.readFileSync(coveragePath, 'utf8');
          if (!coverage.includes('Object.keys(index.polity_geography).length, 757')) throw new Error('coverage geography lock not found');
          if (!coverage.includes('Object.keys(index.polity_subregions).length, 731')) throw new Error('coverage subregion lock not found');
          coverage = coverage.replace('Object.keys(index.polity_geography).length, 757', 'Object.keys(index.polity_geography).length, 787');
          coverage = coverage.replace('Object.keys(index.polity_subregions).length, 731', 'Object.keys(index.polity_subregions).length, 761');
          fs.writeFileSync(coveragePath, coverage);

          let taxonomy = fs.readFileSync(taxonomyPath, 'utf8');
          const replacements = [
            ['mesoamerica: 20', 'mesoamerica: 21'],
            ['"nile-valley": 11', '"nile-valley": 12'],
            ['levant: 17', 'levant: 18'],
            ['manchuria: 5', 'manchuria: 6'],
            ['Object.keys(index.polity_subregions).length, 731', 'Object.keys(index.polity_subregions).length, 761']
          ];
          for (const [from, to] of replacements) {
            if (!taxonomy.includes(from)) throw new Error(`taxonomy lock not found: ${from}`);
            taxonomy = taxonomy.replace(from, to);
          }
          fs.writeFileSync(taxonomyPath, taxonomy);
          NODE

          node --test tests/person-spacetime-spatial-index-coverage.test.mjs tests/spacetime-taxonomy-migration.test.mjs

      - name: Commit reviewed spatial batch and remove temp workflow
        shell: bash
        run: |
          rm .github/workflows/temp-spatial-b43-b45.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "spatial: backfill batches 43 through 45"
          git push origin HEAD:ops/spatial-backfill-b43-b45
