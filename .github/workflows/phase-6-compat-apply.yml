name: Phase 6 Compatibility Apply

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Exact approved Phase 6 commit SHA to apply
        required: true
        default: 1c84199a5f57e41aa54468e9489efffed87cbbb4
        type: string
      expected_commit_sha:
        description: Exact approved Phase 6 commit SHA
        required: true
        default: 1c84199a5f57e41aa54468e9489efffed87cbbb4
        type: string
      expected_artifact_digest:
        description: Exact approved dry artifact digest
        required: true
        default: sha256:68e499e4956d5603cc1da0477d03f8df4f456936e04d0189fb109ea0144b088d
        type: string
      confirmation_token:
        description: Type APPLY_ATLAS_V2_PHASE_6_COMPAT
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase-6-compat-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    environment: phase-5-shadow
    steps:
      - name: Checkout approved target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate authorization inputs
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          APPROVED_SHA="1c84199a5f57e41aa54468e9489efffed87cbbb4"
          APPROVED_DIGEST="sha256:68e499e4956d5603cc1da0477d03f8df4f456936e04d0189fb109ea0144b088d"
          test "${{ inputs.target_ref }}" = "$APPROVED_SHA"
          test "$ACTUAL_SHA" = "$APPROVED_SHA"
          test "${{ inputs.expected_commit_sha }}" = "$APPROVED_SHA"
          test "${{ inputs.expected_artifact_digest }}" = "$APPROVED_DIGEST"
          test "${{ inputs.confirmation_token }}" = "APPLY_ATLAS_V2_PHASE_6_COMPAT"
          echo "APPROVED_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"

      - name: Verify database secret exists
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          case "$SUPABASE_DB_URL" in
            postgresql://*|postgres://*) ;;
            *) echo "SUPABASE_DB_URL must be a PostgreSQL URI" >&2; exit 41 ;;
          esac

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Build and validate compatibility bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf migration/phase-6/tmp/apply
          mkdir -p migration/phase-6/tmp/apply
          node migration/phase-6/scripts/build-compat-bundle.mjs . migration/phase-6/tmp/apply
          node migration/phase-6/scripts/validate-compat-bundle.mjs . migration/phase-6/tmp/apply
          grep -Fq -- "PHASE_6_COMPATIBILITY_READER" migration/phase-6/tmp/apply/phase-6-deployment.sql
          grep -Fq -- "public.atlas_person_politics_compat_v1" migration/phase-6/tmp/apply/phase-6-deployment.sql

      - name: Apply compatibility object transaction
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" \
            --set=ON_ERROR_STOP=1 \
            --no-psqlrc \
            --file migration/phase-6/tmp/apply/phase-6-deployment.sql \
            > migration/phase-6/tmp/apply/phase-6-apply.log 2>&1

      - name: Verify compatibility object and privileges
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" \
            --set=ON_ERROR_STOP=1 \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --command "select jsonb_build_object(
              'view_exists', to_regclass('public.atlas_person_politics_compat_v1') is not null,
              'rows', (select count(*) from public.atlas_person_politics_compat_v1),
              'duplicate_ids', (select count(*) from (select id from public.atlas_person_politics_compat_v1 group by id having count(*) > 1) d),
              'invalid_periods', (select count(*) from public.atlas_person_politics_compat_v1 where activity_end < activity_start),
              'invalid_basis', (select count(*) from public.atlas_person_politics_compat_v1 where period_basis not in ('reign','term','de_facto_rule','military_activity','religious_activity','intellectual_activity','artistic_activity','general_activity')),
              'legacy_rows', (select count(*) from public.person_politics),
              'anon_select', has_table_privilege('anon','public.atlas_person_politics_compat_v1','SELECT'),
              'authenticated_select', has_table_privilege('authenticated','public.atlas_person_politics_compat_v1','SELECT'),
              'anon_insert', has_table_privilege('anon','public.atlas_person_politics_compat_v1','INSERT'),
              'authenticated_insert', has_table_privilege('authenticated','public.atlas_person_politics_compat_v1','INSERT')
            );" \
            > migration/phase-6/tmp/apply/phase-6-validation.json

          node -e '
            const fs = require("fs");
            const p = "migration/phase-6/tmp/apply/phase-6-validation.json";
            const data = JSON.parse(fs.readFileSync(p, "utf8"));
            const expected = {
              view_exists: true,
              rows: 349,
              duplicate_ids: 0,
              invalid_periods: 0,
              invalid_basis: 0,
              legacy_rows: 319,
              anon_select: true,
              authenticated_select: true,
              anon_insert: false,
              authenticated_insert: false
            };
            for (const [k,v] of Object.entries(expected)) {
              if (data[k] !== v) throw new Error(`${k}: expected ${v}, got ${data[k]}`);
            }
          '

      - name: Upload apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-6-compat-apply-${{ env.APPROVED_SHA || github.sha }}
          path: migration/phase-6/tmp/apply
          if-no-files-found: warn
          retention-days: 90
