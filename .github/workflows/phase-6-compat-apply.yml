name: Phase 6 Compatibility Apply

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Exact approved Phase 6 commit SHA to apply
        required: true
        default: dac791bbe5a29eda468a576d604fd91a32b9641a
        type: string
      expected_commit_sha:
        description: Exact approved Phase 6 commit SHA
        required: true
        default: dac791bbe5a29eda468a576d604fd91a32b9641a
        type: string
      expected_artifact_digest:
        description: Exact approved dry artifact digest
        required: true
        default: sha256:0faf2e227bc8529d9f2a6f49e7197a65befa0535018c1d24ca64eda55deaa26d
        type: string
      confirmation_token:
        description: Type APPLY_ATLAS_V2_PHASE_6_COMPAT
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase-6-compat-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    environment: phase-5-shadow
    steps:
      - name: Checkout approved target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate authorization inputs
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          APPROVED_SHA="dac791bbe5a29eda468a576d604fd91a32b9641a"
          APPROVED_DIGEST="sha256:0faf2e227bc8529d9f2a6f49e7197a65befa0535018c1d24ca64eda55deaa26d"
          test "${{ inputs.target_ref }}" = "$APPROVED_SHA"
          test "$ACTUAL_SHA" = "$APPROVED_SHA"
          test "${{ inputs.expected_commit_sha }}" = "$APPROVED_SHA"
          test "${{ inputs.expected_artifact_digest }}" = "$APPROVED_DIGEST"
          test "${{ inputs.confirmation_token }}" = "APPLY_ATLAS_V2_PHASE_6_COMPAT"
          echo "APPROVED_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"

      - name: Verify database secret exists
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          case "$SUPABASE_DB_URL" in
            postgresql://*|postgres://*) ;;
            *) echo "SUPABASE_DB_URL must be a PostgreSQL URI" >&2; exit 41 ;;
          esac

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Build and validate compatibility bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf migration/phase-6/tmp/apply
          mkdir -p migration/phase-6/tmp/apply
          node migration/phase-6/scripts/build-compat-bundle.mjs . migration/phase-6/tmp/apply
          node migration/phase-6/scripts/validate-compat-bundle.mjs . migration/phase-6/tmp/apply
          grep -Fq -- "PHASE 6 COMPATIBILITY READER BUNDLE" migration/phase-6/tmp/apply/phase-6-deployment.sql
          grep -Fq -- "public.atlas_person_politics_compat_v1" migration/phase-6/tmp/apply/phase-6-deployment.sql

      - name: Apply compatibility object transaction
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" \
            --set=ON_ERROR_STOP=1 \
            --no-psqlrc \
            --file migration/phase-6/tmp/apply/phase-6-deployment.sql \
            > migration/phase-6/tmp/apply/phase-6-apply.log 2>&1

      - name: Verify compatibility object and privileges
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" \
            --set=ON_ERROR_STOP=1 \
            --no-psqlrc \
            --tuples-only \
            --no-align \
            --command "with explicit_grants as (
              select grantee, privilege_type
              from information_schema.role_table_grants
              where table_schema = 'public'
                and table_name = 'atlas_person_politics_compat_v1'
            )
            select jsonb_build_object(
              'view_exists', to_regclass('public.atlas_person_politics_compat_v1') is not null,
              'rows', (select count(*) from public.atlas_person_politics_compat_v1),
              'duplicate_ids', (select count(*) from (select id from public.atlas_person_politics_compat_v1 group by id having count(*) > 1) d),
              'invalid_periods', (select count(*) from public.atlas_person_politics_compat_v1 where activity_end < activity_start),
              'invalid_basis', (select count(*) from public.atlas_person_politics_compat_v1 where period_basis not in ('reign','term','de_facto_rule','military_activity','religious_activity','intellectual_activity','artistic_activity','general_activity')),
              'legacy_rows', (select count(*) from public.person_politics),
              'anon_select_explicit', exists (select 1 from explicit_grants where grantee = 'anon' and privilege_type = 'SELECT'),
              'authenticated_select_explicit', exists (select 1 from explicit_grants where grantee = 'authenticated' and privilege_type = 'SELECT'),
              'anon_write_explicit', exists (select 1 from explicit_grants where grantee = 'anon' and privilege_type in ('INSERT','UPDATE','DELETE','TRUNCATE','REFERENCES','TRIGGER')),
              'authenticated_write_explicit', exists (select 1 from explicit_grants where grantee = 'authenticated' and privilege_type in ('INSERT','UPDATE','DELETE','TRUNCATE','REFERENCES','TRIGGER'))
            );" \
            > migration/phase-6/tmp/apply/phase-6-validation.json

          node -e '
            const fs = require("fs");
            const p = "migration/phase-6/tmp/apply/phase-6-validation.json";
            const data = JSON.parse(fs.readFileSync(p, "utf8"));
            const expected = {
              view_exists: true,
              rows: 349,
              duplicate_ids: 0,
              invalid_periods: 0,
              invalid_basis: 0,
              legacy_rows: 319,
              anon_select_explicit: true,
              authenticated_select_explicit: true,
              anon_write_explicit: false,
              authenticated_write_explicit: false
            };
            for (const [k,v] of Object.entries(expected)) {
              if (data[k] !== v) throw new Error(`${k}: expected ${v}, got ${data[k]}`);
            }
          '

          cat > migration/phase-6/tmp/apply/phase-6-write-denial.sql <<'SQL'
          begin;
          set local role anon;
          do $$
          begin
            begin
              insert into public.atlas_person_politics_compat_v1
                (id, person_name, politic_name, activity_start, activity_end, role, period_basis, notes)
              values
                ('00000000-0000-0000-0000-000000000000', 'DENY_TEST', 'DENY_TEST', 1, 1, null, 'general_activity', null);
              raise exception 'anon write unexpectedly succeeded';
            exception
              when insufficient_privilege or object_not_in_prerequisite_state or feature_not_supported then
                null;
            end;
          end $$;
          rollback;
          SQL

          psql "$SUPABASE_DB_URL" \
            --set=ON_ERROR_STOP=1 \
            --no-psqlrc \
            --file migration/phase-6/tmp/apply/phase-6-write-denial.sql \
            > migration/phase-6/tmp/apply/phase-6-write-denial.log 2>&1

      - name: Upload apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-6-compat-apply-${{ env.APPROVED_SHA || github.sha }}
          path: migration/phase-6/tmp/apply
          if-no-files-found: warn
          retention-days: 90
