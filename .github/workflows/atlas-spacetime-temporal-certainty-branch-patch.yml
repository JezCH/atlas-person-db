name: ATLAS Spacetime Temporal Certainty Branch Patch

on:
  push:
    branches:
      - fix/spacetime-temporal-certainty
    paths:
      - .github/workflows/atlas-spacetime-temporal-certainty-branch-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spacetime-temporal-certainty
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply focused temporal certainty patch
        shell: python
        run: |
          from pathlib import Path

          view_path = Path("atlas-person-spacetime-view.js")
          view = view_path.read_text(encoding="utf-8")

          asset_old = '    ["./atlas-person-spacetime-uncertainty.js?v=20260903-c6", "ATLAS_PERSON_SPACETIME_UNCERTAINTY"],\n    ["./atlas-person-spacetime-inspector.js?v=20260903-c8", "ATLAS_PERSON_SPACETIME_INSPECTOR"],'
          asset_new = '    ["./atlas-person-spacetime-uncertainty.js?v=20260903-c6", "ATLAS_PERSON_SPACETIME_UNCERTAINTY"],\n    ["./atlas-person-spacetime-temporal-certainty.js?v=20260906-boundary-certainty", "ATLAS_PERSON_SPACETIME_TEMPORAL_CERTAINTY"],\n    ["./atlas-person-spacetime-inspector.js?v=20260903-c8", "ATLAS_PERSON_SPACETIME_INSPECTOR"],'
          runtime_old = '      uncertainty: window.ATLAS_PERSON_SPACETIME_UNCERTAINTY,\n      inspector: window.ATLAS_PERSON_SPACETIME_INSPECTOR,'
          runtime_new = '      uncertainty: window.ATLAS_PERSON_SPACETIME_UNCERTAINTY,\n      temporalCertainty: window.ATLAS_PERSON_SPACETIME_TEMPORAL_CERTAINTY,\n      inspector: window.ATLAS_PERSON_SPACETIME_INSPECTOR,'

          for label, old, new in [
              ("runtime asset", asset_old, asset_new),
              ("runtime api", runtime_old, runtime_new),
          ]:
              count = view.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              view = view.replace(old, new, 1)

          start_anchor = "  function periodLabel(activity) {\n"
          end_anchor = "\n\n  function placementBasisLabel(segment) {"
          if view.count(start_anchor) != 1:
              raise SystemExit(f"periodLabel start: expected exactly one match, found {view.count(start_anchor)}")
          period_start = view.index(start_anchor)
          period_end = view.index(end_anchor, period_start)
          current_period = view[period_start:period_end]
          required_tokens = ["model.yearLabel(activity.start.year)", "model.yearLabel(activity.end.year)", '"시작 미상"', '"종료 미상"']
          missing = [token for token in required_tokens if token not in current_period]
          if missing:
              raise SystemExit(f"periodLabel baseline contract changed; missing {missing}")
          period_new = '''  function periodLabel(activity) {
            const temporalCertainty = window.ATLAS_PERSON_SPACETIME_TEMPORAL_CERTAINTY;
            if (!temporalCertainty?.periodLabel) throw new Error("ATLAS_SPACETIME_TEMPORAL_CERTAINTY_RUNTIME_MISSING");
            return temporalCertainty.periodLabel(activity, model.yearLabel);
          }'''
          view = view[:period_start] + period_new + view[period_end:]
          view_path.write_text(view, encoding="utf-8")

          helper = r'''(function (root, factory) {
            const api = factory();
            if (typeof module === "object" && module.exports) module.exports = api;
            if (root) root.ATLAS_PERSON_SPACETIME_TEMPORAL_CERTAINTY = api;
          })(typeof globalThis !== "undefined" ? globalThis : this, function () {
            "use strict";

            function boundaryLabel(boundary, yearLabel) {
              const year = boundary?.year;
              if (!Number.isInteger(year) || year === 0 || typeof yearLabel !== "function") return "";
              const label = String(yearLabel(year) || "").trim();
              if (!label) return "";
              const certainty = String(boundary?.certainty || "").trim();
              if (certainty === "approximate") return `약 ${label}`;
              if (certainty === "uncertain") return `${label}?`;
              return label;
            }

            function periodLabel(activity, yearLabel) {
              const start = boundaryLabel(activity?.start, yearLabel) || "시작 미상";
              const end = activity?.end?.status === "ongoing"
                ? `현재 (${activity.end.as_of} 확인)`
                : boundaryLabel(activity?.end, yearLabel) || "종료 미상";
              return `${start} – ${end}`;
            }

            return Object.freeze({ boundaryLabel, periodLabel });
          });
          '''
          Path("atlas-person-spacetime-temporal-certainty.js").write_text(helper, encoding="utf-8")

          test = r'''import assert from "node:assert/strict";
          import test from "node:test";
          import { createRequire } from "node:module";
          import { readFile } from "node:fs/promises";

          const require = createRequire(import.meta.url);
          const temporal = require("../atlas-person-spacetime-temporal-certainty.js");
          const yearLabel = (year) => year < 0 ? `BC ${Math.abs(year)}` : `AD ${year}`;

          test("temporal certainty decorates exact, approximate, and uncertain boundaries", () => {
            assert.equal(temporal.boundaryLabel({ year: 1200, certainty: "exact" }, yearLabel), "AD 1200");
            assert.equal(temporal.boundaryLabel({ year: 1200, certainty: "approximate" }, yearLabel), "약 AD 1200");
            assert.equal(temporal.boundaryLabel({ year: 1200, certainty: "uncertain" }, yearLabel), "AD 1200?");
            assert.equal(temporal.boundaryLabel({ year: -1200, certainty: "approximate" }, yearLabel), "약 BC 1200");
            assert.equal(temporal.boundaryLabel({ year: -1190, certainty: "uncertain" }, yearLabel), "BC 1190?");
            assert.equal(temporal.boundaryLabel({ year: 1200, certainty: "future-value" }, yearLabel), "AD 1200");
          });

          test("period label preserves independent start and end certainty", () => {
            assert.equal(
              temporal.periodLabel({ start: { year: 1200, certainty: "approximate" }, end: { year: 1210, certainty: "uncertain" } }, yearLabel),
              "약 AD 1200 – AD 1210?"
            );
            assert.equal(
              temporal.periodLabel({ start: { year: -1200, certainty: "uncertain" }, end: { year: -1190, certainty: "approximate" } }, yearLabel),
              "BC 1200? – 약 BC 1190"
            );
          });

          test("unknown and ongoing boundaries preserve the existing period contract", () => {
            assert.equal(temporal.periodLabel({ start: {}, end: {} }, yearLabel), "시작 미상 – 종료 미상");
            assert.equal(temporal.periodLabel({ start: { year: 0, certainty: "approximate" }, end: { year: 1210 } }, yearLabel), "시작 미상 – AD 1210");
            assert.equal(
              temporal.periodLabel({ start: { year: 1200, certainty: "approximate" }, end: { status: "ongoing", as_of: "2026-09-06" } }, yearLabel),
              "약 AD 1200 – 현재 (2026-09-06 확인)"
            );
          });

          test("spacetime view consumes temporal certainty without changing geometry constants", async () => {
            const source = await readFile(new URL("../atlas-person-spacetime-view.js", import.meta.url), "utf8");
            assert.match(source, /atlas-person-spacetime-temporal-certainty\.js\?v=20260906-boundary-certainty/);
            assert.match(source, /temporalCertainty: window\.ATLAS_PERSON_SPACETIME_TEMPORAL_CERTAINTY/);
            assert.match(source, /return temporalCertainty\.periodLabel\(activity, model\.yearLabel\);/);
            assert.match(source, /const GLOBAL_EXTENT_COMPRESSION = 0\.748;/);
            assert.match(source, /const CAMERA_MIN_ZOOM = 5;/);
            assert.match(source, /const CAMERA_MAX_ZOOM = 8;/);
          });
          '''
          Path("tests/atlas-person-spacetime-temporal-certainty.test.mjs").write_text(test, encoding="utf-8")

      - name: Run focused regression test
        run: node --test tests/atlas-person-spacetime-temporal-certainty.test.mjs

      - name: Persist focused patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/atlas-spacetime-temporal-certainty-branch-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas-person-spacetime-view.js atlas-person-spacetime-temporal-certainty.js tests/atlas-person-spacetime-temporal-certainty.test.mjs .github/workflows/atlas-spacetime-temporal-certainty-branch-patch.yml
          git diff --cached --check
          git commit -m "fix: preserve spacetime temporal certainty"
          git push origin HEAD:fix/spacetime-temporal-certainty

      - name: Run full test suite
        run: npm test
