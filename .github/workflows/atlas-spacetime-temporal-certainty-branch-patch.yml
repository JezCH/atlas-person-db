name: ATLAS Spacetime Temporal Certainty Branch Patch

on:
  push:
    branches:
      - fix/spacetime-temporal-certainty
    paths:
      - .github/workflows/atlas-spacetime-temporal-certainty-branch-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spacetime-temporal-certainty
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Normalize periodLabel formatting
        shell: python
        run: |
          from pathlib import Path
          path = Path("atlas-person-spacetime-view.js")
          source = path.read_text(encoding="utf-8")
          old = '  function periodLabel(activity) {\n  const temporalCertainty = window.ATLAS_PERSON_SPACETIME_TEMPORAL_CERTAINTY;\n  if (!temporalCertainty?.periodLabel) throw new Error("ATLAS_SPACETIME_TEMPORAL_CERTAINTY_RUNTIME_MISSING");\n  return temporalCertainty.periodLabel(activity, model.yearLabel);\n}'
          new = '  function periodLabel(activity) {\n    const temporalCertainty = window.ATLAS_PERSON_SPACETIME_TEMPORAL_CERTAINTY;\n    if (!temporalCertainty?.periodLabel) throw new Error("ATLAS_SPACETIME_TEMPORAL_CERTAINTY_RUNTIME_MISSING");\n    return temporalCertainty.periodLabel(activity, model.yearLabel);\n  }'
          if source.count(old) != 1:
              raise SystemExit(f"expected one formatting target, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")

      - name: Verify focused regression
        run: node --test tests/atlas-person-spacetime-temporal-certainty.test.mjs

      - name: Persist formatting and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/atlas-spacetime-temporal-certainty-branch-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas-person-spacetime-view.js .github/workflows/atlas-spacetime-temporal-certainty-branch-patch.yml
          git diff --cached --check
          git commit -m "style: normalize spacetime temporal certainty integration"
          git push origin HEAD:fix/spacetime-temporal-certainty

      - name: Run full suite for evidence
        run: npm test
