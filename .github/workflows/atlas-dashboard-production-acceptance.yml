name: ATLAS Dashboard Production Acceptance

on:
  push:
    branches:
      - main
    paths:
      - "atlas-dashboard.js"
      - "atlas-dashboard-model.js"
      - "atlas-dashboard.css"
      - "atlas-client-data-store.js"
      - "atlas-main-authority-nav.js"
      - "atlas-person-main.js"
      - "index.html"
      - "scripts/verify-dashboard-production-acceptance.mjs"
      - ".github/workflows/atlas-dashboard-production-acceptance.yml"
  workflow_dispatch:
    inputs:
      expected_runtime_sha:
        description: Exact merged GitHub SHA expected on Production
        required: true
        type: string

permissions:
  contents: read

jobs:
  production_acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ATLAS_PRODUCTION_ORIGIN: https://atlas-person-db.vercel.app
      ATLAS_DASHBOARD_ACCEPTANCE_OUT_DIR: artifacts/dashboard-production-acceptance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve Production acceptance SHA
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.expected_runtime_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            EXPECTED_SHA="$DISPATCH_SHA"
          else
            EXPECTED_SHA="$GITHUB_SHA"
          fi
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "ATLAS_EXPECTED_RUNTIME_SHA=$EXPECTED_SHA" >> "$GITHUB_ENV"
          echo "Production acceptance target: $EXPECTED_SHA"

      - name: Validate verifier syntax
        run: node --check scripts/verify-dashboard-production-acceptance.mjs

      - name: Install Korean browser fonts
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Locate Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Run Production browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ATLAS_DASHBOARD_ACCEPTANCE_OUT_DIR"
          mkdir -p "$ATLAS_DASHBOARD_ACCEPTANCE_OUT_DIR"
          "$CHROME_BIN"             --headless=new             --no-sandbox             --disable-gpu             --disable-dev-shm-usage             --remote-debugging-port=9222             --user-data-dir=/tmp/atlas-dashboard-acceptance-chrome             --window-size=1440,1100             about:blank >/tmp/atlas-dashboard-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:9222/json/version >/dev/null
          node scripts/verify-dashboard-production-acceptance.mjs
          cat "$ATLAS_DASHBOARD_ACCEPTANCE_OUT_DIR/dashboard-production-acceptance.json"

      - name: Upload Production acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-dashboard-production-acceptance
          path: artifacts/dashboard-production-acceptance
          if-no-files-found: error
          retention-days: 30
