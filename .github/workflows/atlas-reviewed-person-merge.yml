name: ATLAS Reviewed Person Merge

on:
  push:
    branches:
      - main
    paths:
      - 'corrections/reviewed-person-merges/*.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-reviewed-person-merge-production
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'JezCH'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      MERGE_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-reviewed-person-merge
      PERSON_READ_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-person-read
      READINESS_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-authoring-apply
      OIDC_AUDIENCE: atlas-person-db-reviewed-person-merge

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve reviewed merge manifest
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${GITHUB_SHA}" -- \
            'corrections/reviewed-person-merges/*.json' > /tmp/reviewed-person-merge-files.txt
          test "$(grep -cve '^$' /tmp/reviewed-person-merge-files.txt)" = "1"
          MANIFEST_PATH="$(grep -ve '^$' /tmp/reviewed-person-merge-files.txt)"
          jq -e '
            .schema == "atlas-reviewed-person-merge/v1"
            and .review_status == "approved"
            and (.request_id | type == "string" and length > 0)
            and (.survivor_person_id | test("^[0-9a-fA-F-]{36}$"))
            and (.source_person_id | test("^[0-9a-fA-F-]{36}$"))
            and (.expected.source_activity_count_after_correction == 0)
          ' "$MANIFEST_PATH" >/dev/null
          echo "MANIFEST_PATH=$MANIFEST_PATH" >> "$GITHUB_ENV"
          echo "SOURCE_PERSON_ID=$(jq -er '.source_person_id' "$MANIFEST_PATH")" >> "$GITHUB_ENV"
          echo "SURVIVOR_PERSON_ID=$(jq -er '.survivor_person_id' "$MANIFEST_PATH")" >> "$GITHUB_ENV"

      - name: Resolve compatible Production runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_ready=false
          for attempt in $(seq 1 75); do
            status="$(curl --silent --show-error \
              --output /tmp/atlas-reviewed-person-merge-readiness.json \
              --write-out '%{http_code}' \
              "$READINESS_ENDPOINT")"

            if [[ "$status" == "404" ]]; then
              echo "Production readiness route is not live yet (attempt ${attempt}/75); retrying in 10s."
              sleep 10
              continue
            fi
            if [[ "$status" != "200" ]]; then
              cat /tmp/atlas-reviewed-person-merge-readiness.json >&2 || true
              echo "Reviewed merge readiness failed: HTTP ${status}" >&2
              exit 1
            fi

            jq -e '
              .ok == true
              and .ready == true
              and .readiness.person_merge_contract_ready == true
              and (.runtime_sha | type == "string" and test("^[0-9a-f]{40}$"))
            ' /tmp/atlas-reviewed-person-merge-readiness.json >/dev/null
            runtime_sha="$(jq -er '.runtime_sha' /tmp/atlas-reviewed-person-merge-readiness.json)"

            if ! git cat-file -e "${runtime_sha}^{commit}" 2>/dev/null; then
              echo "Deployed runtime commit is unavailable in checkout: ${runtime_sha}" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$runtime_sha" "$GITHUB_SHA"; then
              echo "Deployed runtime ${runtime_sha} is not an ancestor of reviewed merge commit ${GITHUB_SHA}." >&2
              exit 1
            fi

            git diff --name-only --diff-filter=ACDMRTUXB "$runtime_sha" "$GITHUB_SHA" -- > /tmp/atlas-reviewed-person-merge-runtime-diff.txt
            set +e
            ATLAS_RUNTIME_DIFF_FILE=/tmp/atlas-reviewed-person-merge-runtime-diff.txt node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { requiresAuthoringRuntimeDeployment } from './scripts/vercel-ignore-build.mjs';

          const text = fs.readFileSync(process.env.ATLAS_RUNTIME_DIFF_FILE, 'utf8').trim();
          const paths = text ? text.split(/\r?\n/).filter(Boolean) : [];
          if (requiresAuthoringRuntimeDeployment(paths)) {
            console.error('REVIEWED_MERGE_RUNTIME_CODE_DRIFT: a newer Production runtime is required');
            for (const path of paths) console.error(`  ${path}`);
            process.exit(1);
          }
          console.log(`Reviewed merge delta is deployed-runtime-safe (${paths.length} path${paths.length === 1 ? '' : 's'}).`);
          NODE
            drift_status=$?
            set -e

            if [[ "$drift_status" == "0" ]]; then
              echo "ATLAS_RUNTIME_SHA=${runtime_sha}" >> "$GITHUB_ENV"
              echo "Compatible Production runtime ready: ${runtime_sha} for workflow ${GITHUB_SHA}."
              runtime_ready=true
              break
            fi

            if [[ "$attempt" == "75" ]]; then
              echo "Production runtime never became compatible with reviewed merge commit ${GITHUB_SHA}." >&2
              exit 1
            fi
            echo "Production runtime ${runtime_sha} is behind deployment-relevant changes (attempt ${attempt}/75); retrying in 10s."
            sleep 10
          done

          [[ "$runtime_ready" == "true" ]] || { echo "Compatible Production runtime was not resolved." >&2; exit 1; }

      - name: Wait for duplicate Activity correction
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            body="$(curl --fail --silent --show-error --get \
              --data-urlencode "person_id=$SOURCE_PERSON_ID" \
              "$PERSON_READ_ENDPOINT")"
            count="$(jq -r '.person.activity_count // -1' <<<"$body")"
            if [[ "$count" == "0" ]]; then
              echo "Duplicate source Person now has zero Activities; reviewed merge may proceed."
              exit 0
            fi
            echo "Waiting for reviewed duplicate Activity retirement (activity_count=$count) — attempt ${attempt}/60"
            sleep 10
          done
          echo "Duplicate Activity correction did not complete before merge." >&2
          exit 1

      - name: Request dedicated GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_FILE="$RUNNER_TEMP/atlas-reviewed-person-merge-oidc"
          umask 077
          curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" \
            | jq -er '.value' > "$TOKEN_FILE"
          test -s "$TOKEN_FILE"
          echo "OIDC_TOKEN_FILE=$TOKEN_FILE" >> "$GITHUB_ENV"

      - name: Execute reviewed Person merge
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$RUNNER_TEMP/atlas-reviewed-person-merge-response.json"
          PAYLOAD="$(jq -cn \
            --arg deployment_sha "$ATLAS_RUNTIME_SHA" \
            --arg workflow_sha "$GITHUB_SHA" \
            --arg manifest_path "$MANIFEST_PATH" \
            --slurpfile manifest "$MANIFEST_PATH" \
            '{deployment_sha:$deployment_sha,workflow_sha:$workflow_sha,manifest_path:$manifest_path,manifest:$manifest[0]}')"
          status="$(curl --silent --show-error \
            --output "$RESPONSE" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --header "Authorization: Bearer $(cat "$OIDC_TOKEN_FILE")" \
            --data "$PAYLOAD" \
            "$MERGE_ENDPOINT")"
          cat "$RESPONSE"
          test "$status" = "200"
          jq -e --arg survivor "$SURVIVOR_PERSON_ID" --arg source "$SOURCE_PERSON_ID" '
            .ok == true
            and .marker == "ATLAS_REVIEWED_PERSON_MERGE_V1"
            and .survivor_person_id == $survivor
            and .source_person_id == $source
            and .source_person_present == false
            and (.survivor_activities | length) == 1
            and .namuwiki.status == "linked"
          ' "$RESPONSE" >/dev/null

      - name: Production read-back
        shell: bash
        run: |
          set -euo pipefail
          SURVIVOR="$RUNNER_TEMP/survivor-read.json"
          ALL="$RUNNER_TEMP/person-list-read.json"

          curl --fail --silent --show-error --get \
            --data-urlencode "person_id=$SURVIVOR_PERSON_ID" \
            "$PERSON_READ_ENDPOINT" > "$SURVIVOR"
          jq -e '
            .person.external_references.namuwiki.status == "linked"
            and .person.external_references.namuwiki.document_title == "야율대석"
            and .person.activity_count == 1
            and (.person.names | map(.name) | index("서요 덕종")) != null
            and (.person.names | map(.name) | index("Emperor Dezong of Western Liao")) != null
          ' "$SURVIVOR" >/dev/null

          curl --fail --silent --show-error \
            "https://atlas-person-db.vercel.app/api/atlas-read?__atlas_read_surface=person" > "$ALL"
          jq -e --arg source "$SOURCE_PERSON_ID" --arg survivor "$SURVIVOR_PERSON_ID" '
            ([.persons[] | select(.id == $source)] | length) == 0
            and ([.persons[] | select(.id == $survivor)] | length) == 1
          ' "$ALL" >/dev/null
