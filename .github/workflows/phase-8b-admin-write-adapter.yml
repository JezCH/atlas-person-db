name: Phase 8B Admin Write Adapter

on:
  pull_request:
    paths:
      - "admin.html"
      - "admin.js"
      - "atlas-admin-write-service.js"
      - "atlas-server-write-adapter.js"
      - "tests/atlas-admin-write-service.test.mjs"
      - "tests/atlas-server-write-adapter.test.mjs"
      - ".github/workflows/phase-8b-admin-write-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-phase-8b-admin-write-adapter
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run admin write service tests
        run: node --test tests/atlas-admin-write-service.test.mjs

      - name: Run authenticated server adapter tests
        run: node --test tests/atlas-server-write-adapter.test.mjs

      - name: Verify admin route uses authenticated server mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('admin.html','utf8');
          const admin = fs.readFileSync('admin.js','utf8');
          const service = fs.readFileSync('atlas-admin-write-service.js','utf8');
          const adapter = fs.readFileSync('atlas-server-write-adapter.js','utf8');
          const failures = [];
          const assert = (ok, msg) => { if (!ok) failures.push(msg); };
          assert(html.includes('./atlas-server-write-adapter.js'), 'authenticated server adapter not loaded');
          assert(!html.includes('./atlas-write-mode.js'), 'legacy write mode still loaded');
          assert(!html.includes('./atlas-write-adapter.js'), 'legacy browser write adapter still loaded');
          assert(!html.includes('./atlas-v2-shadow-compiler.js'), 'legacy shadow compiler still loaded');
          assert(html.includes('./atlas-admin-write-service.js'), 'admin write service not loaded');
          assert(admin.includes('ATLAS_ADMIN_WRITE_SERVICE'), 'admin.js does not use write service');
          assert(admin.includes('ATLAS_SERVER_WRITE_ADAPTER'), 'admin.js does not select server adapter');
          assert(!admin.includes('ATLAS_WRITE_ADAPTER'), 'admin.js still references legacy browser adapter');
          assert(!admin.includes('.from("person_politics").update('), 'admin.js directly updates legacy table');
          assert(!admin.includes('.from("person_politics").insert('), 'admin.js directly inserts legacy table');
          assert(service.includes('.select("id")'), 'admin exact-id read lookup missing');
          assert(!service.includes('.insert('), 'admin service contains direct insert');
          assert(!service.includes('.update('), 'admin service contains direct update');
          assert(!service.includes('.delete('), 'admin service contains direct delete');
          assert(!adapter.includes('ATLAS_MUTATION_TOKEN'), 'browser adapter exposes mutation secret');
          assert(!adapter.includes('Authorization'), 'browser adapter uses Authorization header');
          fs.mkdirSync('migration/phase-8/tmp/phase8b-admin-write-adapter', {recursive:true});
          const report = {
            marker:'PHASE_8B_ADMIN_WRITE_BOUNDARY',
            admin_adapter_loaded:true,
            admin_direct_mutation:false,
            mutation_boundary:'authenticated-server',
            client_fallback:false,
            browser_mutation_secret:false,
            failures,
            pass:failures.length===0
          };
          fs.writeFileSync('migration/phase-8/tmp/phase8b-admin-write-adapter/verification.json', JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          if (failures.length) process.exit(2);
          NODE

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-8b-admin-write-adapter-${{ github.sha }}
          path: migration/phase-8/tmp/phase8b-admin-write-adapter
          if-no-files-found: error
          retention-days: 90
