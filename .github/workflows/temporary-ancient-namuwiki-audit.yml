name: Temporary Ancient NamuWiki Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Production Person catalog and extract ancient NamuWiki state
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const endpoint = 'https://atlas-person-db.vercel.app/api/atlas-read?__atlas_read_surface=person';
          const response = await fetch(endpoint, { headers: { accept: 'application/json' } });
          if (!response.ok) throw new Error(`Production Person read failed: ${response.status} ${response.statusText}`);
          const payload = await response.json();
          if (!payload || payload.ok !== true || !Array.isArray(payload.persons)) {
            throw new Error('Unexpected Production Person payload');
          }
          const ancient = payload.persons
            .filter((person) => Number.isInteger(person.first_activity_year) && person.first_activity_year <= -481)
            .map((person) => ({
              id: person.id,
              canonical_name_en: person.canonical_name_en ?? null,
              preferred_name_ko: person.preferred_name_ko ?? null,
              display_name: person.display_name ?? null,
              historicity: person.historicity ?? null,
              first_activity_year: person.first_activity_year,
              last_activity_year: person.last_activity_year ?? null,
              namuwiki: person.external_references?.namuwiki ?? null
            }))
            .sort((a, b) => a.first_activity_year - b.first_activity_year || String(a.display_name).localeCompare(String(b.display_name), 'ko'));
          const report = {
            production_schema: payload.schema ?? null,
            production_total_persons: payload.summary?.total ?? payload.persons.length,
            ancient_boundary_end_year: -481,
            ancient_count: ancient.length,
            linked_count: ancient.filter((person) => person.namuwiki?.status === 'linked').length,
            not_found_count: ancient.filter((person) => person.namuwiki?.status === 'not_found').length,
            missing_count: ancient.filter((person) => person.namuwiki == null).length,
            persons: ancient
          };
          fs.writeFileSync('ancient-namuwiki-audit.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          NODE
      - name: Upload ancient NamuWiki audit
        uses: actions/upload-artifact@v4
        with:
          name: ancient-namuwiki-audit
          path: ancient-namuwiki-audit.json
          if-no-files-found: error
