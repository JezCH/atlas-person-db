name: ATLAS P10 Release Launcher

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/atlas-p10-release-launcher.yml'
      - 'server/atlas-p10-production-release-handler.js'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[launch-p10-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for exact main SHA to become Production runtime
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          READINESS_URL: https://atlas-person-db.vercel.app/api/atlas-authoring-apply
        run: |
          set -euo pipefail
          for attempt in $(seq 1 75); do
            body="$(curl --fail-with-body --silent --show-error "$READINESS_URL")"
            runtime_sha="$(jq -r '.runtime_sha // ""' <<<"$body")"
            if [[ "$runtime_sha" == "$EXPECTED_SHA" ]]; then
              jq -e '
                .ok==true and
                .ready==true and
                .readiness.person_merge.person_merge_lifecycle_version=="p10-v2-revalidated" and
                .readiness.person_merge.required_person_merge_lifecycle_version=="p10-v2-revalidated"
              ' <<<"$body" >/dev/null
              echo "Exact Production runtime is ready: $runtime_sha"
              exit 0
            fi
            echo "Waiting for Production $EXPECTED_SHA (currently ${runtime_sha:-unknown}) — attempt ${attempt}/75"
            sleep 10
          done
          echo "Exact Production SHA did not become ready." >&2
          exit 1

      - name: Dispatch controlled P10 revalidation release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: p10_person_duplicate_revalidation_20260815_v1
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg release "$RELEASE_ID" '{ref:"main",inputs:{release_id:$release,approval:("APPLY:"+$release)}}')"
          status="$(curl --silent --show-error --output /tmp/dispatch.json --write-out '%{http_code}' \
            --request POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/atlas-p10-revalidation-release.yml/dispatches")"
          if [[ "$status" != "204" ]]; then
            cat /tmp/dispatch.json >&2 || true
            echo "Workflow dispatch failed: HTTP $status" >&2
            exit 1
          fi
          echo "Controlled P10 revalidation workflow dispatched for ${GITHUB_SHA}."
