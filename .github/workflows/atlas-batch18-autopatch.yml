name: ATLAS Batch 18 Autopatch

on:
  push:
    branches:
      - agent/spacetime-polity-placement-batch-18

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply batch 18 spatial bindings
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const indexPath = 'atlas-polity-spatial-index.json';
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          const additions = [
            ['f2dcb5c8-08cb-4d46-995f-d3a5ca7f1808','africa','east-africa-horn'],
            ['2a3df3a5-6f18-42c0-8332-3ccaebdf3508','europe','central-europe'],
            ['ad85b693-1ee1-444d-8454-9f0f29bec36e','europe','central-europe'],
            ['9d978d31-92d8-4330-999d-161a8cf01547','africa','central-africa'],
            ['db80bdb8-2d95-43d8-8624-1c59837408a7','oceania','pacific-islands'],
            ['346628f9-ded8-4b47-9244-9bcec2fb4f45','southeast-asia','maritime-southeast-asia'],
            ['8272e9a1-9564-451a-91ae-f6f0f1e3b279','europe','central-europe'],
            ['093db31a-7064-43b2-9407-7e759fa8a945','americas','south-america'],
            ['fdb99251-0df5-4c6b-9ca0-c1ce51ae1578','europe','western-europe'],
            ['3d72277f-c92e-476c-8174-804f700d10cc','europe','western-europe']
          ];
          for (const [id, macro, sub] of additions) {
            if (index.polity_geography[id] || index.polity_subregions[id]) throw new Error(`already mapped: ${id}`);
            index.polity_geography[id] = macro;
            index.polity_subregions[id] = sub;
          }
          const sorted = (obj) => Object.fromEntries(Object.entries(obj).sort(([a],[b]) => a.localeCompare(b)));
          index.polity_geography = sorted(index.polity_geography);
          index.polity_subregions = sorted(index.polity_subregions);
          index.generated_at = '2026-09-04T07:20:00+09:00';
          fs.writeFileSync(indexPath, JSON.stringify(index, null, 2) + '\n');

          function replaceExact(path, before, after) {
            let text = fs.readFileSync(path, 'utf8');
            if (!text.includes(before)) throw new Error(`${path}: missing expected text ${before}`);
            text = text.replace(before, after);
            fs.writeFileSync(path, text);
          }
          replaceExact('tests/person-spacetime-spatial-index-coverage.test.mjs',
            'assert.equal(Object.keys(index.polity_geography).length, 495);',
            'assert.equal(Object.keys(index.polity_geography).length, 505);');
          replaceExact('tests/person-spacetime-spatial-index-coverage.test.mjs',
            'assert.equal(Object.keys(index.polity_subregions).length, 469);',
            'assert.equal(Object.keys(index.polity_subregions).length, 479);');
          replaceExact('tests/spacetime-taxonomy-migration.test.mjs',
            'assert.equal(Object.keys(index.polity_subregions).length, 469);',
            'assert.equal(Object.keys(index.polity_subregions).length, 479);');
          NODE
      - name: Commit clean batch 18 diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/atlas-batch18-autopatch.yml
          git add atlas-polity-spatial-index.json tests/person-spacetime-spatial-index-coverage.test.mjs tests/spacetime-taxonomy-migration.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Backfill clear spacetime polity placements batch 18'
          git push origin HEAD:agent/spacetime-polity-placement-batch-18
