name: ATLAS V10 Production Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/verify-spacetime-production-visual.mjs"
      - ".github/workflows/atlas-v10-production-diagnostic.yml"

permissions:
  contents: read

jobs:
  production_diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ATLAS_PRODUCTION_URL: https://atlas-person-db.vercel.app/#atlas-spacetime
      ATLAS_EXPECTED_RUNTIME_SHA: 909bc2b6fa293f4dedd2fd7fc2eb0919a6ec31b7
      ATLAS_VISUAL_OUT_DIR: artifacts/spacetime-v10-diagnostic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Korean browser fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
      - name: Locate Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Diagnose current Production rail-label parity
        run: |
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/atlas-v10-diagnostic --window-size=1600,1000 about:blank >/tmp/atlas-v10-diagnostic-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -fsS http://127.0.0.1:9222/json/version >/dev/null && break
            sleep .25
          done
          node scripts/verify-spacetime-production-visual.mjs
