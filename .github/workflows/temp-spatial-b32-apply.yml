name: TEMP Spatial B32 Apply

on:
  push:
    branches:
      - ops/spatial-backfill-b32
    paths:
      - .github/workflows/temp-spatial-b32-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/spatial-backfill-b32
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact reviewed B32 spatial mappings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const spatialPath = 'atlas-polity-spatial-index.json';
          const index = JSON.parse(fs.readFileSync(spatialPath, 'utf8'));
          const mappings = {
            'c63ab742-c86c-4fe1-842c-330546340244': ['africa', 'west-africa'],
            '37aa6b8a-9167-46af-897e-06ee531c4162': ['americas', 'south-america'],
            '868fe6f5-59dc-4f95-b8ea-7eccf5f32bff': ['americas', 'north-america'],
            'c7642cea-2a6d-43dc-b03f-5740d6cc53d6': ['southeast-asia', 'mainland-southeast-asia'],
            'b0bee257-faaf-4415-a08c-7b3a85937b3b': ['southeast-asia', 'mainland-southeast-asia'],
            '34896c16-a481-44b9-9b78-ac7260ed069d': ['southeast-asia', 'mainland-southeast-asia'],
            '3959991c-9512-41ab-8e0e-c718eee53633': ['europe', 'eastern-europe'],
            '886b9c7e-035a-490f-889d-f980b9346b4d': ['west-asia', 'levant'],
            '5037f747-2d30-4479-b321-6f01b5cba162': ['africa', 'west-africa'],
            'bf3f2bd2-e2b7-498a-b0d9-114ec3d88b92': ['southeast-asia', 'mainland-southeast-asia'],
          };
          for (const [id, [macro, sub]] of Object.entries(mappings)) {
            if (Object.hasOwn(index.polity_geography, id) || Object.hasOwn(index.polity_subregions, id)) {
              throw new Error(`B32 candidate already mapped: ${id}`);
            }
            index.polity_geography[id] = macro;
            index.polity_subregions[id] = sub;
          }
          if (Object.keys(index.polity_geography).length !== 640) throw new Error('expected 640 geography mappings');
          if (Object.keys(index.polity_subregions).length !== 614) throw new Error('expected 614 subregion mappings');
          fs.writeFileSync(spatialPath, JSON.stringify(index, null, 2) + '\n');

          const coveragePath = 'tests/person-spacetime-spatial-index-coverage.test.mjs';
          let coverage = fs.readFileSync(coveragePath, 'utf8');
          coverage = coverage.replace('assert.equal(Object.keys(index.polity_geography).length, 630);', 'assert.equal(Object.keys(index.polity_geography).length, 640);');
          coverage = coverage.replace('assert.equal(Object.keys(index.polity_subregions).length, 604);', 'assert.equal(Object.keys(index.polity_subregions).length, 614);');
          fs.writeFileSync(coveragePath, coverage);

          const taxonomyPath = 'tests/spacetime-taxonomy-migration.test.mjs';
          let taxonomy = fs.readFileSync(taxonomyPath, 'utf8');
          taxonomy = taxonomy.replace('"eastern-europe": 9,', '"eastern-europe": 10,');
          taxonomy = taxonomy.replace('assert.equal(Object.keys(index.polity_subregions).length, 604);', 'assert.equal(Object.keys(index.polity_subregions).length, 614);');
          fs.writeFileSync(taxonomyPath, taxonomy);
          NODE
          rm .github/workflows/temp-spatial-b32-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas-polity-spatial-index.json tests/person-spacetime-spatial-index-coverage.test.mjs tests/spacetime-taxonomy-migration.test.mjs .github/workflows/temp-spatial-b32-apply.yml
          git commit -m "spatial: backfill batch 32 polity placements"
          git push origin HEAD:ops/spatial-backfill-b32
