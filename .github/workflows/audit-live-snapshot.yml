name: ATLAS Audit Live Snapshot

# Temporary audit-only workflow. Verification run after Wave 15A-D.
on:
  push:
    branches: [agent/polity-semantic-audit]
    paths: ['.github/workflows/audit-live-snapshot.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch normalized Production and compute UUID coverage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 3 \
            'https://atlas-person-db.vercel.app/api/atlas-read' -o live.json
          python - <<'PY'
          import collections,json,pathlib,re
          obj=json.loads(pathlib.Path('live.json').read_text())
          assert obj.get('ok') is True and obj.get('source')=='v2-direct'
          live=obj['data']; by={str(r['id']).lower():r for r in live}; ids=set(by)
          rx=re.compile(r'(?i)\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b')
          mentioned=set()
          for p in pathlib.Path('docs/audits').glob('POLITY_SEMANTIC_AUDIT*.md'):
              mentioned.update(x.lower() for x in rx.findall(p.read_text(encoding='utf-8')))
          covered=ids & mentioned; missing=ids-mentioned
          surface=collections.defaultdict(list)
          for r in live:
              k=(r.get('person_name'),r.get('politic_name'),int(r['activity_start']),int(r['activity_end']),r.get('role'),r.get('period_basis'))
              surface[k].append(r)
          dup=[v for v in surface.values() if len(v)>1]
          summary={'current_relationship_count':len(live),'covered_current_relationships':len(covered),'uncovered_current_relationships':len(missing),'stale_or_historical_audit_uuids':len(mentioned-ids),'exact_surface_duplicate_groups':len(dup),'exact_surface_duplicate_rows':sum(map(len,dup))}
          pathlib.Path('audit-live-summary.json').write_text(json.dumps(summary,indent=2))
          pathlib.Path('audit-current-uncovered.json').write_text(json.dumps([by[x] for x in sorted(missing)],ensure_ascii=False,indent=2))
          pathlib.Path('audit-live-coverage.json').write_text(json.dumps({'summary':summary,'covered_current_ids':sorted(covered),'uncovered_current_ids':sorted(missing),'duplicate_groups':dup},ensure_ascii=False,indent=2))
          print(json.dumps(summary,indent=2))
          if missing: raise SystemExit(f'{len(missing)} current relationships remain uncovered')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-audit-current-coverage-final
          path: |
            live.json
            audit-live-summary.json
            audit-current-uncovered.json
            audit-live-coverage.json
          if-no-files-found: error
          retention-days: 7
