name: Phase 8B Legacy Reconciliation Executor

on:
  pull_request:
    paths:
      - "atlas-legacy-reconciliation-executor.js"
      - "tests/atlas-legacy-reconciliation-executor.test.mjs"
      - "migration/phase-8/scripts/verify-phase8b-legacy-reconciliation-executor.mjs"
      - ".github/workflows/phase-8b-legacy-reconciliation-executor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-phase-8b-legacy-reconciliation-executor
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run executor tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/atlas-legacy-reconciliation-executor.test.mjs

      - name: Verify executor remains unloaded and legacy-only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf migration/phase-8/tmp/phase8b-legacy-executor
          node migration/phase-8/scripts/verify-phase8b-legacy-reconciliation-executor.mjs \
            migration/phase-8/tmp/phase8b-legacy-executor/verification.json

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-8b-legacy-reconciliation-executor-${{ github.sha }}
          path: migration/phase-8/tmp/phase8b-legacy-executor
          if-no-files-found: error
          retention-days: 90
