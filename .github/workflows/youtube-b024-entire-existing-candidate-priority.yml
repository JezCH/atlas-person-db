name: YouTube B024 ALL Existing Original-ID Person Candidate Priority (NO Crawl)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/youtube-b024-rank-all-existing-source-candidates.cjs'
      - 'tests/atlas-youtube-b024-all-source-candidates-ranked.test.mjs'
      - '.github/workflows/youtube-b024-entire-existing-candidate-priority.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: atlas-youtube-b024-all-existing-candidate-review-priority
  cancel-in-progress: false

jobs:
  rank_all_existing_source_candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline regression tests for complete original-ID title candidate list
        run: node --test tests/atlas-youtube-b024-all-source-candidates-ranked.test.mjs
      - name: Verify EXACT existing full original-ID review artifact, not original 2.23m corpus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12245075061" | jq -e '
            .id==12245075061 and .expired==false and
            .name=="youtube-b024-reviewed-existing-original-id-identity-status-39379112371" and
            .digest=="sha256:faa1f30b67805bd356b6509c81f400b7f02bf6b6c8ab32a028d22f62fad55ebc"
          ' >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: youtube-b024-reviewed-existing-original-id-identity-status-39379112371
          run-id: '39379112371'
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prior-original-id
      - name: ACTUALLY classify and rank every remaining original-ID name, not only 8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b024-entire-priority
          node scripts/youtube-b024-rank-all-existing-source-candidates.cjs \
            prior-original-id/youtube-b024-actual-reviewed-original-id-cohorts.json \
            /tmp/b024-entire-priority/all-original-video-id-ranked-provisional-candidates.json \
            | tee /tmp/b024-entire-priority/execution-report.log
      - name: Validate population parity and output the COMPLETE review-priority CSV with provenance
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),path=require('node:path');
          const dest='/tmp/b024-entire-priority';
          const r=JSON.parse(fs.readFileSync(path.join(dest,'all-original-video-id-ranked-provisional-candidates.json')));
          if(r.schema!=='atlas-youtube-b024-all-original-id-title-review-priority/v1' ||
             r.source_labels_processed!==2766 ||
             r.input_original_video_ids_scanned_previously!==10706 ||
             r.screened_current_complete_ATLAS_registration_list!==false ||
             r.currently_confirmed_unregistered_historical_persons!==0 ||
             r.actually_watched_person_biography_videos!==0 ||
             r.new_youtube_videos_fetched!==0 ||
             r.official_production_rank_updated!==false ||
             r.ranked_provisional_all_identities.length!==r.provisional_identity_groups ||
             r.source_labels_processed!==r.positive_registered_living_and_nonperson_excluded+
               r.ambiguous_held+r.ranked_provisional_all_identities.reduce((n,x)=>n+x.source_names.length,0))
            throw Error('B024_ENTIRE_RANK_COMPLETE_SOURCE_PARITY_FAILED');
          const fields=['review_priority','person_name','distinct_original_channels','distinct_original_video_titles',
           'previously_reviewed_historical_person','source_name_forms','original_video_id_sample','registered_today_confirmed',
           'video_content_actually_verified','original_video_ids','original_channel_ids'];
          const value=x=>'"'+String(x??'').replaceAll('"','""').replaceAll('\n',' ').replaceAll('\r',' ')+'"';
          const rows=[fields.join(',')];
          for(const x of r.ranked_provisional_all_identities){
             const row=[x.provisional_review_priority,x.review_name,x.original_distinct_channels,x.original_distinct_videos,
              x.reviewed_historical_identity_prior_2145_person_screen,x.source_names.join(';'),
              x.sample_original_title_and_video_id[0]?.video_id||'',
              false,false,x.original_video_ids.join(';'),x.original_channel_ids.join(';')];
             rows.push(row.map(value).join(','));
          }
          const csv=rows.join('\n')+'\n';
          fs.writeFileSync(path.join(dest,'ALL-existing-original-video-id-provisional-review-priority.csv'),csv);
          fs.writeFileSync(path.join(dest,'reconciliation-summary.json'),JSON.stringify({
            input_source_archive_sha256:r.source_archive_sha256,original_video_IDs:r.input_original_video_ids_scanned_previously,
            original_source_labels:r.source_labels_processed,after_review_exclusions:r.provisional_identity_groups,
            additional_exact_living_nonperson_exclusions:r.additional_exact_living_nonperson_exclusions,
            ambiguous_holds:r.ambiguous_held,
            channel_thresholds:r.channel_threshold_groups,
            current_registration_verified:false,official_production_rank_updated:false,
            csv_sha256:crypto.createHash('sha256').update(csv).digest('hex'),
            json_sha256:crypto.createHash('sha256').update(fs.readFileSync(path.join(dest,'all-original-video-id-ranked-provisional-candidates.json'))).digest('hex')
           },null,2)+'\n');
          const lines=[
            '# Existing YouTube originals — ALL source-first provisional historical-Person review priorities',
            '**NO new videos; NO 2.23 million original titles recrawled; only precomputed original Video/Channel IDs.**',
            '',
            '- All source labels screened: **'+r.source_labels_processed+'**',
            '- Registered/living or reviewed non-person labels excluded: **'+r.positive_registered_living_and_nonperson_excluded+'**',
            '- Identity/homonym holds: **'+r.ambiguous_held+'**',
            '- **ALL** provisional identity review groups: **'+r.provisional_identity_groups+'**',
            '- 3+ original channel title-topic groups: **'+r.channel_threshold_groups['3']+'**',
            '- Actually reviewed as historic but STILL needs current registry check: **'+r.independently_reviewed_historical_groups_in_provisional_rank+'**',
            '- Actual playback verified: **0**; fully confirmed CURRENTLY UNREGISTERED historical persons: **0**',
            '- Actual Production rank publication: **0**',
            '',
            '## First 100 of the entire ranked original-ID worklist',
            '| Priority (NOT production rank) | Source name / reviewed historic alias | Distinct source channels | Original videos with explicit bio TITLE | Historical identity previously reviewed | Original Video ID sample |',
            '|---:|---|---:|---:|---|---|'
          ];
          for(const x of r.ranked_provisional_all_identities.slice(0,100)){
            lines.push('| '+x.provisional_review_priority+' | '+x.review_name.replaceAll('|',' ')+' | '+
              x.original_distinct_channels+' | '+x.original_distinct_videos+' | '+
              (x.reviewed_historical_identity_prior_2145_person_screen?'yes, older full 2,145 people review':'no')+
              ' | '+(x.sample_original_title_and_video_id[0]?.video_id||'')+' |');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          // This bounded but entire TSV-backed CSV output is made durable by
          // the coordinator on successful CI; no auto-commit or registered writes.
          console.log('BEGIN_ATLAS_B024_ALL_SOURCE_PRIORITY_CSV');
          process.stdout.write(csv);
          console.log('END_ATLAS_B024_ALL_SOURCE_PRIORITY_CSV');
          console.log('B024_COMPLETE_REVIEW_COUNTS='+JSON.stringify({
            source_labels:r.source_labels_processed,excluded:r.positive_registered_living_and_nonperson_excluded,
            held:r.ambiguous_held,open_groups:r.provisional_identity_groups,
            channel_thresholds:r.channel_threshold_groups,
            earlier_historical_reviewed:r.independently_reviewed_historical_groups_in_provisional_rank
          }));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-b024-ALL-existing-original-ID-review-priority-${{ github.run_id }}
          path: /tmp/b024-entire-priority/
          retention-days: 90
          if-no-files-found: error
