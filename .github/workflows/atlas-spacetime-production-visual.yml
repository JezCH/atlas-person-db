name: ATLAS Spacetime Production Visual Acceptance

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "status-summary.js"
      - "atlas-person-era-navigation.css"
      - "atlas-main-authority-nav.js"
      - "atlas-ui-visual-foundation.css"
      - "atlas-ui-precision-engraving-v2.css"
      - "atlas-ui-mixed-script-typography-v2.css"
      - "atlas-person-spacetime-marginalia-v2.css"
      - "atlas-person-monumental-register.css"
      - "atlas-person-register-inscription-v2.css"
      - "atlas-person-register-selection-focus-v2.css"
      - "atlas-person-detail-hero-frame-v2.css"
      - "atlas-person-chronicle-source-archive-v2.css"
      - "atlas-vis2-12-interaction-motion.css"
      - "scripts/verify-vis2-12-production-interaction-motion.mjs"
      - "atlas-vis2-11-polity-dashboard-archive.css"
      - "atlas-main-authority-nav.js"
      - "atlas-person-chronicle-detail.css"
      - "atlas-ui-mobile-v8.css"
      - "atlas-ui-motion-material-v9.css"
      - "atlas-domain-surface-owner.js"
      - "atlas-person-domain-palette.css"
      - "atlas-person-domain-ui.js"
      - "atlas-person-spacetime-*.js"
      - "atlas-person-spacetime-*.css"
      - "scripts/verify-spacetime-production-*.mjs"
      - "scripts/verify-ui-v10-production-visual.mjs"
      - "scripts/verify-polity-production-visual.mjs"
      - "scripts/capture-vis2-production-baseline.mjs"
      - "scripts/verify-vis2-01-production-material.mjs"
      - "scripts/verify-vis2-02-production-engraving.mjs"
      - "scripts/verify-vis2-03-production-typography.mjs"
      - "scripts/verify-vis2-04-production-ticks.mjs"
      - "scripts/verify-vis2-05-watermark-ab.mjs"
      - "scripts/verify-vis2-06-production-instrument.mjs"
      - "scripts/verify-vis2-07-production-register.mjs"
      - "scripts/verify-vis2-08-production-register-interaction.mjs"
      - "scripts/verify-vis2-09-production-detail-hero.mjs"
      - "scripts/verify-vis2-10-production-chronicle-source.mjs"
      - "scripts/verify-vis2-11-production-polity-dashboard.mjs"
      - "experiments/vis2-05-monumental-watermark-candidate.css"
      - ".github/workflows/atlas-spacetime-production-visual.yml"
  workflow_dispatch:
    inputs:
      expected_runtime_sha:
        description: Exact merged GitHub SHA expected on Production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: atlas-spacetime-production-visual-main
  cancel-in-progress: true

jobs:
  visual_acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ATLAS_PRODUCTION_URL: https://atlas-person-db.vercel.app/#atlas-spacetime
      ATLAS_VISUAL_OUT_DIR: artifacts/spacetime-visual-acceptance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve Production acceptance SHA
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.expected_runtime_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            EXPECTED_SHA="$DISPATCH_SHA"
          else
            EXPECTED_SHA="$GITHUB_SHA"
          fi
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "ATLAS_EXPECTED_RUNTIME_SHA=$EXPECTED_SHA" >> "$GITHUB_ENV"
          echo "Production visual acceptance target: $EXPECTED_SHA"

      - name: Install Korean browser fonts
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Locate Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Wait for exact-SHA Production parity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ATLAS_VISUAL_OUT_DIR"
          mkdir -p "$ATLAS_VISUAL_OUT_DIR"
          matched=false
          for attempt in $(seq 1 90); do
            if node scripts/verify-spacetime-production-exact-sha.mjs; then
              matched=true
              break
            fi
            echo "Production exact-SHA parity pending: expected=$ATLAS_EXPECTED_RUNTIME_SHA attempt=$attempt/90"
            sleep 10
          done
          [[ "$matched" == "true" ]] || {
            echo "Production did not converge to exact SHA $ATLAS_EXPECTED_RUNTIME_SHA." >&2
            exit 1
          }

      - name: Run exact-SHA Production visual acceptance
        shell: bash
        run: |
          set -euo pipefail
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/atlas-spacetime-visual-chrome \
            --window-size=1600,1000 \
            about:blank >/tmp/atlas-spacetime-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:9222/json/version >/dev/null
          node --check scripts/verify-vis2-11-production-polity-dashboard.mjs
          node --check scripts/verify-vis2-12-production-interaction-motion.mjs
          node scripts/verify-vis2-12-production-interaction-motion.mjs
          node scripts/verify-vis2-11-production-polity-dashboard.mjs
          node scripts/verify-spacetime-production-visual.mjs
          node scripts/verify-spacetime-production-domain-colors.mjs
          node scripts/verify-ui-v10-production-visual.mjs
          node scripts/verify-polity-production-visual.mjs
          node --check scripts/capture-vis2-production-baseline.mjs
          node scripts/capture-vis2-production-baseline.mjs
          node --check scripts/verify-vis2-01-production-material.mjs
          node scripts/verify-vis2-01-production-material.mjs
          node --check scripts/verify-vis2-02-production-engraving.mjs
          node scripts/verify-vis2-02-production-engraving.mjs
          node --check scripts/verify-vis2-03-production-typography.mjs
          node scripts/verify-vis2-03-production-typography.mjs
          node --check scripts/verify-vis2-04-production-ticks.mjs
          node scripts/verify-vis2-04-production-ticks.mjs
          node --check scripts/verify-vis2-05-watermark-ab.mjs
          node scripts/verify-vis2-05-watermark-ab.mjs
          node --check scripts/verify-vis2-06-production-instrument.mjs
          node scripts/verify-vis2-06-production-instrument.mjs
          node --check scripts/verify-vis2-07-production-register.mjs
          node scripts/verify-vis2-07-production-register.mjs
          node --check scripts/verify-vis2-08-production-register-interaction.mjs
          node scripts/verify-vis2-08-production-register-interaction.mjs
          node --check scripts/verify-vis2-09-production-detail-hero.mjs
          node scripts/verify-vis2-09-production-detail-hero.mjs
          node --check scripts/verify-vis2-10-production-chronicle-source.mjs
          node scripts/verify-vis2-10-production-chronicle-source.mjs
          for report in "$ATLAS_VISUAL_OUT_DIR"/*.json; do
            echo "===== $report ====="
            cat "$report"
          done

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-spacetime-production-visual-acceptance-${{ github.sha }}
          path: artifacts/spacetime-visual-acceptance
          if-no-files-found: error
          retention-days: 30
