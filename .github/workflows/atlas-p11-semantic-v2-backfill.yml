name: ATLAS P11 Semantic V2 Backfill

on:
  push:
    branches:
      - main
    paths:
      - 'stage2/releases/p11-semantic-v2-backfill-release.v1.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-p11-semantic-v2-backfill-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      AUDIT_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-audit-inventory
      AUDIT_AUDIENCE: atlas-person-db-audit-inventory
      CORRECTION_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-correction-apply
      CORRECTION_AUDIENCE: atlas-person-db-correction-apply
      RELEASE_FILE: stage2/releases/p11-semantic-v2-backfill-release.v1.json
      EXCEPTION_FILE: stage2/contracts/p11-reviewed-semantic-v2-exceptions.v1.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate bounded reviewed release
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schema == "atlas-stage2-p11-semantic-v2-backfill-release/v1" and
            .status == "APPROVED_FOR_EXACT_SHA_PRODUCTION_CORRECTION_WORKFLOW" and
            .expected.semantic_v2_incomplete_before == 301 and
            .expected.relation_missing_before == 259 and
            .expected.relation_backfill_rows == 238 and
            .expected.temporal_backfill_rows == 301 and
            .expected.reviewed_relation_exceptions_live_after == 21 and
            .expected.blocking_semantic_v2_incomplete_after == 0 and
            .rules.exact_production_sha_required == true and
            .rules.read_only_inventory_before_apply_required == true and
            .rules.dry_run_before_each_apply_required == true and
            .rules.generic_relation_default_forbidden == true and
            .rules.runtime_compile_override_writeback_forbidden == true and
            .rules.physical_person_merge_forbidden == true
          ' "$RELEASE_FILE" >/dev/null
          jq -e '
            .schema == "atlas-p11-reviewed-semantic-v2-exceptions/v1" and
            .rules.exception_scope == "relation_type_id_only" and
            .rules.temporal_boundary_metadata_must_be_complete == true and
            .rules.unknown_incomplete_activity_outside_this_list_blocks_p11 == true
          ' "$EXCEPTION_FILE" >/dev/null

      - name: Capture exact Production audit and build deterministic repair plans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas-p11-backfill/generated /tmp/atlas-p11-backfill/responses

          request_oidc() {
            local audience="$1"
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" | jq -er '.value'
          }

          call_json_with_retry() {
            local endpoint="$1" audience="$2" payload="$3" output="$4" label="$5"
            for attempt in $(seq 1 60); do
              local token status code
              token="$(request_oidc "$audience")"
              status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
                --request POST -H 'content-type: application/json' -H "authorization: Bearer ${token}" \
                --data "$payload" "$endpoint")"
              if [[ "$status" == "200" ]]; then return 0; fi
              code="$(jq -r '.code // "UNKNOWN"' "$output" 2>/dev/null || printf 'UNKNOWN')"
              if [[ "$status" == "404" || ( "$status" == "409" && "$code" == "DEPLOYMENT_SHA_MISMATCH" ) ]]; then
                echo "Production ${label} has not reached ${GITHUB_SHA} (attempt ${attempt}/60); retrying."
                sleep 10
                continue
              fi
              cat "$output" >&2 || true
              echo "${label} failed: HTTP ${status}, code ${code}" >&2
              return 1
            done
            echo "Production did not reach ${GITHUB_SHA} for ${label} within retry window" >&2
            return 1
          }

          audit_payload="$(jq -cn --arg sha "$GITHUB_SHA" '{deployment_sha:$sha,mode:"full_stage2_baseline"}')"
          call_json_with_retry "$AUDIT_ENDPOINT" "$AUDIT_AUDIENCE" "$audit_payload" /tmp/atlas-p11-backfill/before-audit.json "P11 pre-backfill audit"
          jq -e --arg sha "$GITHUB_SHA" '
            .ok == true and .marker == "ATLAS_AUDIT_INVENTORY_V1" and
            .mode == "full_stage2_baseline" and .read_only == true and .committed == false and
            .deployment_sha == $sha and (.row_count == .counts.activities) and
            .semantic_v2_breakdown.semantic_v2_incomplete == 301 and
            .semantic_v2_breakdown.null_counts.relation_type_id == 259
          ' /tmp/atlas-p11-backfill/before-audit.json >/dev/null

          node scripts/build-p9-completeness-repair-plan.mjs \
            --audit /tmp/atlas-p11-backfill/before-audit.json \
            --out /tmp/atlas-p11-backfill/repair-plan.json
          node scripts/build-p11-semantic-v2-backfill-execution.mjs \
            --audit /tmp/atlas-p11-backfill/before-audit.json \
            --repair /tmp/atlas-p11-backfill/repair-plan.json \
            --out-dir /tmp/atlas-p11-backfill/generated \
            --chunk-size 100

          jq -e --slurpfile release "$RELEASE_FILE" '
            .schema == "atlas-p11-semantic-v2-backfill-execution-summary/v1" and
            .semantic_v2_incomplete_before == $release[0].expected.semantic_v2_incomplete_before and
            .relation_backfill_rows == $release[0].expected.relation_backfill_rows and
            .temporal_backfill_rows == $release[0].expected.temporal_backfill_rows and
            .reviewed_relation_exceptions_live == $release[0].expected.reviewed_relation_exceptions_live_after and
            .plan_count == 4 and .chunk_size == 100 and
            .production_mutation_authorized == false
          ' /tmp/atlas-p11-backfill/generated/summary.json >/dev/null

          : > /tmp/atlas-p11-backfill/correction-results.jsonl
          for plan in /tmp/atlas-p11-backfill/generated/p11-semantic-v2-backfill-batch*.json; do
            base="$(basename "$plan")"
            plan_path="corrections/plans/${base}"
            for mode in dry_run apply; do
              output="/tmp/atlas-p11-backfill/responses/${base%.json}-${mode}.json"
              payload="$(jq -cn --arg sha "$GITHUB_SHA" --arg path "$plan_path" --arg mode "$mode" --slurpfile plan "$plan" \
                '{deployment_sha:$sha,plan_path:$path,mode:$mode,plan:$plan[0]}')"
              call_json_with_retry "$CORRECTION_ENDPOINT" "$CORRECTION_AUDIENCE" "$payload" "$output" "${base} ${mode}"
              if [[ "$mode" == "dry_run" ]]; then
                jq -e '.ok==true and .marker=="ATLAS_CORRECTION_MANIFEST_V2" and .schema=="atlas-correction-manifest/v2" and .dry_run==true and .committed==false' "$output" >/dev/null
              else
                jq -e '.ok==true and .marker=="ATLAS_CORRECTION_MANIFEST_V2" and .schema=="atlas-correction-manifest/v2" and .dry_run==false and .committed==true' "$output" >/dev/null
              fi
              jq -c --arg plan "$base" --arg mode "$mode" '. + {workflow_plan:$plan,workflow_mode:$mode}' "$output" >> /tmp/atlas-p11-backfill/correction-results.jsonl
            done
          done

          call_json_with_retry "$AUDIT_ENDPOINT" "$AUDIT_AUDIENCE" "$audit_payload" /tmp/atlas-p11-backfill/after-audit.json "P11 post-backfill audit"
          jq -e --slurpfile exceptions "$EXCEPTION_FILE" '
            .ok == true and .marker == "ATLAS_AUDIT_INVENTORY_V1" and
            .mode == "full_stage2_baseline" and .read_only == true and .committed == false and
            .semantic_v2_breakdown.semantic_v2_incomplete == 21 and
            .semantic_v2_breakdown.null_counts.relation_type_id == 21 and
            .semantic_v2_breakdown.null_counts.period_basis_id == 0 and
            .semantic_v2_breakdown.null_counts.activity_start_granularity == 0 and
            .semantic_v2_breakdown.null_counts.activity_start_calendar == 0 and
            .semantic_v2_breakdown.null_counts.activity_end_granularity == 0 and
            .semantic_v2_breakdown.null_counts.activity_end_calendar == 0 and
            ([.semantic_v2_breakdown.incomplete_rows[].activity_id] | sort) as $live and
            ([$exceptions[0].exceptions[].activity_id] | sort) as $declared and
            ($live | all(. as $id | $declared | index($id) != null))
          ' /tmp/atlas-p11-backfill/after-audit.json >/dev/null

          jq '{before:{deployment_sha:.deployment_sha,counts:.counts,semantic_v2_breakdown:.semantic_v2_breakdown}}' /tmp/atlas-p11-backfill/before-audit.json > /tmp/atlas-p11-backfill/before-summary.json
          jq '{after:{deployment_sha:.deployment_sha,counts:.counts,semantic_v2_breakdown:.semantic_v2_breakdown}}' /tmp/atlas-p11-backfill/after-audit.json > /tmp/atlas-p11-backfill/after-summary.json

      - name: Upload immutable P11 semantic-v2 backfill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-p11-semantic-v2-backfill-${{ github.sha }}
          path: /tmp/atlas-p11-backfill/
          if-no-files-found: warn
          retention-days: 90
