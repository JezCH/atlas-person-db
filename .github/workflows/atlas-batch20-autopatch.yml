name: ATLAS Batch 20 Autopatch

on:
  push:
    branches:
      - agent/spacetime-polity-placement-batch-20

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply batch 20 spatial bindings
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const indexPath = 'atlas-polity-spatial-index.json';
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          const additions = [
            ['a90248ce-3f17-41d7-a638-7d842297f79d','west-asia','mesopotamia'],
            ['2075ceb6-e162-45aa-ba3a-525b316c09c4','west-asia','mesopotamia'],
            ['4dc91fb5-3bc5-47fa-a692-1fd8cdc2a3fd','europe','balkans'],
            ['523a6c6a-a16a-4e40-bbdf-fc705a4f1e9d','west-asia','iranian-plateau'],
            ['bf2a9d75-693a-4495-9169-7c832e55bf16','east-asia','china'],
            ['94a4b95a-437a-4359-bff2-3c560c3f30b0','southeast-asia','maritime-southeast-asia'],
            ['58e1f590-7bfa-4e13-9a90-404e6037f7b6','west-asia','caucasus'],
            ['b1a3a6f3-a381-40d4-bae1-f8238b289b2c','americas','north-america'],
            ['53eac379-ca08-4cae-b8cd-3f4adcc090e0','europe','eastern-europe'],
            ['989cb3a7-011d-4e0a-95d7-0c0790c3100a','africa','maghreb-north-africa']
          ];
          for (const [id, macro, sub] of additions) {
            if (index.polity_geography[id] || index.polity_subregions[id]) throw new Error(`already mapped: ${id}`);
            index.polity_geography[id] = macro;
            index.polity_subregions[id] = sub;
          }
          const sorted = (obj) => Object.fromEntries(Object.entries(obj).sort(([a],[b]) => a.localeCompare(b)));
          index.polity_geography = sorted(index.polity_geography);
          index.polity_subregions = sorted(index.polity_subregions);
          index.generated_at = '2026-09-04T13:39:00+09:00';
          fs.writeFileSync(indexPath, JSON.stringify(index, null, 2) + '\n');

          function replaceExact(path, before, after) {
            let text = fs.readFileSync(path, 'utf8');
            if (!text.includes(before)) throw new Error(`${path}: missing expected text ${before}`);
            text = text.replace(before, after);
            fs.writeFileSync(path, text);
          }
          replaceExact('tests/person-spacetime-spatial-index-coverage.test.mjs',
            'assert.equal(Object.keys(index.polity_geography).length, 515);',
            'assert.equal(Object.keys(index.polity_geography).length, 525);');
          replaceExact('tests/person-spacetime-spatial-index-coverage.test.mjs',
            'assert.equal(Object.keys(index.polity_subregions).length, 489);',
            'assert.equal(Object.keys(index.polity_subregions).length, 499);');
          replaceExact('tests/spacetime-taxonomy-migration.test.mjs', '  "eastern-europe": 7,', '  "eastern-europe": 8,');
          replaceExact('tests/spacetime-taxonomy-migration.test.mjs', '  "maghreb-north-africa": 8,', '  "maghreb-north-africa": 9,');
          replaceExact('tests/spacetime-taxonomy-migration.test.mjs', '  caucasus: 4,', '  caucasus: 5,');
          replaceExact('tests/spacetime-taxonomy-migration.test.mjs', '  mesopotamia: 7,', '  mesopotamia: 9,');
          replaceExact('tests/spacetime-taxonomy-migration.test.mjs',
            'assert.equal(Object.keys(index.polity_subregions).length, 489);',
            'assert.equal(Object.keys(index.polity_subregions).length, 499);');
          NODE
      - name: Commit clean batch 20 diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/atlas-batch20-autopatch.yml
          git add atlas-polity-spatial-index.json tests/person-spacetime-spatial-index-coverage.test.mjs tests/spacetime-taxonomy-migration.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Backfill clear spacetime polity placements batch 20'
          git push origin HEAD:agent/spacetime-polity-placement-batch-20
