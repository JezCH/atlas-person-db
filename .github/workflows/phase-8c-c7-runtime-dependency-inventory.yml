name: Phase 8C C7 Runtime Dependency Inventory

on:
  pull_request:
    paths:
      - "api/**"
      - "server/**"
      - "*.js"
      - "index.html"
      - "admin.html"
      - "migration/phase-8/scripts/phase8c-c7-runtime-dependency-inventory.mjs"
      - "migration/phase-8/reports/phase8c-c7-pre-retirement-inventory.json"
      - ".github/workflows/phase-8c-c7-runtime-dependency-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build runtime dependency inventory
        env:
          C7_BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p migration/phase-8/tmp/c7-runtime-inventory
          node migration/phase-8/scripts/phase8c-c7-runtime-dependency-inventory.mjs \
            . migration/phase-8/tmp/c7-runtime-inventory/report.json
      - name: Validate pre/post retirement state
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = 'migration/phase-8/tmp/c7-runtime-inventory/report.json';
          const r = JSON.parse(fs.readFileSync(p,'utf8'));
          if (r.intended_runtime_forbidden_hits.length !== 0) {
            throw new Error(`intended runtime contains legacy hits: ${JSON.stringify(r.intended_runtime_forbidden_hits)}`);
          }
          const legacyRoute = r.api_routes.includes('api/run-ingest-3-7f4c9a.js');
          if (legacyRoute) {
            if (r.status !== 'RETIREMENT_REQUIRED') throw new Error(`expected RETIREMENT_REQUIRED, got ${r.status}`);
            if (!r.unexpected_api_routes.includes('api/run-ingest-3-7f4c9a.js')) throw new Error('legacy ingest route not classified as unexpected');
            if (!r.public_runtime_forbidden_hits.some(x => x.file === 'api/run-ingest-3-7f4c9a.js')) throw new Error('legacy ingest route forbidden hit missing');
          } else {
            if (r.status !== 'ZERO_REACHABLE_LEGACY_RUNTIME') throw new Error(`expected zero-dependency post-retirement state, got ${r.status}`);
            if (r.unexpected_api_routes.length !== 0) throw new Error(`unexpected API routes remain: ${r.unexpected_api_routes.join(', ')}`);
            if (r.public_runtime_forbidden_hits.length !== 0) throw new Error(`public runtime forbidden hits remain: ${JSON.stringify(r.public_runtime_forbidden_hits)}`);
          }
          NODE
      - name: Upload inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase8c-c7-runtime-inventory-${{ github.sha }}
          path: migration/phase-8/tmp/c7-runtime-inventory
          if-no-files-found: error
          retention-days: 90
