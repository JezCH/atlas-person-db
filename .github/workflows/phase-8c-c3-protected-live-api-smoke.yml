name: Phase 8C C3 Protected Live API Smoke

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact commit SHA approved for protected execution
        required: true
        type: string
      confirm:
        description: Type PHASE8C_C3_ROLLBACK_ONLY
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: atlas-phase8c-c3-protected-live-api-smoke
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: phase-5-shadow
    steps:
      - name: Guard exact SHA and confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = "PHASE8C_C3_ROLLBACK_ONLY"
          test "${{ inputs.approved_sha }}" = "${{ github.sha }}"

      - name: Checkout approved SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install server dependency
        run: npm ci

      - name: Run rollback-only live API-path smoke
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p migration/phase-8/tmp/phase8c-c3-live-api
          node migration/phase-8/scripts/phase8c-c3-live-api-smoke.mjs | tee migration/phase-8/tmp/phase8c-c3-live-api/report.json

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-8c-c3-live-api-${{ inputs.approved_sha }}
          path: migration/phase-8/tmp/phase8c-c3-live-api
          if-no-files-found: error
          retention-days: 90
