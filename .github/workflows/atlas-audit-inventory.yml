name: ATLAS Audit Inventory
# 2026-09-30: refresh exact Production baseline after Japan lineage correction committed through release order 1190.
# Japan lineage baseline refresh 2026-09-30
# 2026-09-30: capture exact Production baseline before the reviewed Japan polity lineage repair.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/atlas-audit-inventory.yml'
      - 'api/atlas-audit-inventory.js'
      - 'server/atlas-audit-inventory-handler.js'
      - 'server/atlas-polity-reference-audit-handler.js'
      - 'server/atlas-audit-github-oidc.js'
      - 'server/atlas-correction-polity-designation-retire-v2-service.js'
      - 'stage2/integration/p9-legacy-temporal-metadata-migration.v1.json'
      - 'stage2/integration/p7-explicit-person-relation-decisions-batch*.v1.json'
      - 'stage2/integration/p7-full-relation-review-dispositions.v1.json'
      - 'stage2/integration/p7-runtime-readiness-dispositions.v1.json'
      - 'docs/audits/STAGE2_R0_NORMALIZED_INVENTORY_REQUEST.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'targeted = reviewed UUID inventory; full_stage2_baseline = full snapshot; polity_reference_audit = live Polity reference/orphan audit'
        required: true
        default: targeted
        type: choice
        options:
          - targeted
          - full_stage2_baseline
          - polity_reference_audit

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-audit-inventory-production
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      ATLAS_AUDIT_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-audit-inventory
      ATLAS_AUDIT_AUDIENCE: atlas-person-db-audit-inventory
      ATLAS_AUDIT_REQUEST: docs/audits/STAGE2_R0_NORMALIZED_INVENTORY_REQUEST.json
      ATLAS_AUDIT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full_stage2_baseline' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate bounded read-only audit mode
        shell: bash
        run: |
          set -euo pipefail
          case "$ATLAS_AUDIT_MODE" in
            targeted)
              jq -e '.schema == "atlas-audit-inventory/v1" and (.activity_ids | type == "array") and (.activity_ids | length > 0) and (.activity_ids | length <= 100)' "$ATLAS_AUDIT_REQUEST" >/dev/null
              jq -e '([.activity_ids[] | select(test("^[0-9a-fA-F-]{36}$") | not)] | length) == 0' "$ATLAS_AUDIT_REQUEST" >/dev/null
              echo "Reviewed Activity IDs: $(jq '.activity_ids | unique | length' "$ATLAS_AUDIT_REQUEST")"
              ;;
            full_stage2_baseline)
              echo 'Full Stage 2 Baseline A v2 capture selected; no target UUID list is accepted in this mode.'
              ;;
            polity_reference_audit)
              echo 'Polity reference audit selected; live FK metadata and atlas_v2 polity_id columns will be counted read-only.'
              ;;
            *)
              echo "Unsupported audit mode: $ATLAS_AUDIT_MODE" >&2
              exit 1
              ;;
          esac

      - name: Fetch normalized read-only inventory through exact Production SHA
        shell: bash
        run: |
          set -euo pipefail
          request_oidc() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ATLAS_AUDIT_AUDIENCE}" | jq -er '.value'
          }

          endpoint="$ATLAS_AUDIT_ENDPOINT"
          if [[ "$ATLAS_AUDIT_MODE" == "targeted" ]]; then
            payload="$(jq -cn --arg deployment_sha "${GITHUB_SHA}" --arg mode "$ATLAS_AUDIT_MODE" --slurpfile request "$ATLAS_AUDIT_REQUEST" \
              '{deployment_sha:$deployment_sha,mode:$mode,activity_ids:$request[0].activity_ids}')"
          elif [[ "$ATLAS_AUDIT_MODE" == "polity_reference_audit" ]]; then
            endpoint="${ATLAS_AUDIT_ENDPOINT}?__atlas_audit_surface=polity-reference-audit"
            payload="$(jq -cn --arg deployment_sha "${GITHUB_SHA}" '{deployment_sha:$deployment_sha}')"
          else
            payload="$(jq -cn --arg deployment_sha "${GITHUB_SHA}" --arg mode "$ATLAS_AUDIT_MODE" '{deployment_sha:$deployment_sha,mode:$mode}')"
          fi

          fetched=false
          for attempt in $(seq 1 60); do
            oidc_token="$(request_oidc)"
            status="$(curl --silent --show-error --output audit-inventory-response.json --write-out '%{http_code}' --request POST \
              -H 'content-type: application/json' -H "authorization: Bearer ${oidc_token}" --data "$payload" "$endpoint")"
            if [[ "$status" == "200" ]]; then
              if [[ "$ATLAS_AUDIT_MODE" == "targeted" ]]; then
                jq -e '.ok == true and .marker == "ATLAS_AUDIT_INVENTORY_V1" and .mode == "targeted" and .read_only == true and .committed == false and (.row_count == .requested_count)' audit-inventory-response.json >/dev/null
              elif [[ "$ATLAS_AUDIT_MODE" == "polity_reference_audit" ]]; then
                jq -e '.ok == true and .marker == "ATLAS_POLITY_REFERENCE_AUDIT_V1" and .read_only == true and .committed == false and .complete == true and (.reference_count == (.reference_catalog | length)) and (.polity_count == (.polities | length)) and (.external_orphan_count == ([.polities[] | select(.is_external_orphan == true)] | length))' audit-inventory-response.json >/dev/null
              else
                jq -e '.ok == true and .marker == "ATLAS_AUDIT_INVENTORY_V1" and .mode == "full_stage2_baseline" and .read_only == true and .committed == false and (.row_count == .counts.activities) and (.catalogs.persons|length)==.counts.persons and (.catalogs.polities|length)==.counts.polities and (.catalogs.roles|length)==.counts.roles and ([.catalogs.roles[].names[]] | length)==.counts.role_names and (.catalogs.sources|length)==.counts.sources and (.baseline_digest | test("^sha256:[0-9a-f]{64}$"))' audit-inventory-response.json >/dev/null
              fi
              fetched=true
              break
            fi
            code="$(jq -r '.code // "UNKNOWN"' audit-inventory-response.json 2>/dev/null || printf 'UNKNOWN')"
            if [[ "$status" == "404" || ( "$status" == "409" && "$code" == "DEPLOYMENT_SHA_MISMATCH" ) ]]; then
              echo "Production audit route for ${GITHUB_SHA} is not live yet (attempt ${attempt}/60); retrying."
              sleep 10
              continue
            fi
            cat audit-inventory-response.json >&2 || true
            echo "Audit inventory failed: HTTP ${status}, code ${code}" >&2
            exit 1
          done
          [[ "$fetched" == "true" ]] || { echo "Production deployment did not reach ${GITHUB_SHA} within retry window" >&2; exit 1; }

          if [[ "$ATLAS_AUDIT_MODE" == "targeted" ]]; then
            jq '{marker,mode,read_only,committed,deployment_sha,requested_count,row_count}' audit-inventory-response.json | tee audit-inventory-summary.json
          elif [[ "$ATLAS_AUDIT_MODE" == "polity_reference_audit" ]]; then
            jq '{marker,read_only,committed,deployment_sha,complete,reference_model,reference_count,polity_count,external_orphan_count}' audit-inventory-response.json | tee audit-inventory-summary.json
            jq '.reference_catalog' audit-inventory-response.json > polity-reference-catalog.json
            jq '[.polities[] | select(.is_external_orphan == true)]' audit-inventory-response.json > polity-external-orphans.json
          else
            jq '{marker,mode,read_only,committed,deployment_sha,row_count,counts,baseline_digest,catalog_cardinality:{persons:(.catalogs.persons|length),polities:(.catalogs.polities|length),roles:(.catalogs.roles|length),role_names:([.catalogs.roles[].names[]] | length),period_bases:(.catalogs.period_bases|length),sources:(.catalogs.sources|length)}}' audit-inventory-response.json | tee audit-inventory-summary.json
            jq '.rows | map(.activity_id)' audit-inventory-response.json > baseline-activity-uuids.json
            jq '.catalogs' audit-inventory-response.json > baseline-identity-catalogs.json
          fi


      - name: Extract Brazil current Production Activity and Source census (read-only)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          jq --arg empire 'efcd0f70-bffe-5464-86e3-b28b3658404b' \
             --arg united '750bf6be-49e9-4215-95ff-a356ba1831cd' \
             --arg brazil 'a8b27d54-b180-4d51-a664-dd40b3eed08f' \
             '. as $snapshot | {
                deployment_sha: $snapshot.deployment_sha,
                read_only: $snapshot.read_only,
                committed: $snapshot.committed,
                baseline_digest: $snapshot.baseline_digest,
                polities: [$snapshot.catalogs.polities[] | select(.id == $empire or .id == $united or .id == $brazil)
                  | {id,canonical_key,polity_type,historicity,names}],
                activities: [$snapshot.rows[] | select(.polity_id == $empire or .polity_id == $united or .polity_id == $brazil)
                  | {activity_id,person_id,person_name_en,polity_id,activity_start,activity_start_month,activity_start_day,
                     activity_start_granularity,activity_end,activity_end_month,activity_end_day,activity_end_granularity,
                     chronology_status,source_count,normalized_sources,content_hash}]
              }' audit-inventory-response.json > brazil-activity-census.push.json
          jq -e '.read_only == true and .committed == false and (.polities | type) == "array" and (.activities | type) == "array"' brazil-activity-census.push.json >/dev/null
          jq -c '. as $s | {deployment_sha,read_only,committed,baseline_digest,
            polities:[.polities[] | . as $p | {polity_id:.id,canonical_key,
              activity_count:([$s.activities[] | select(.polity_id == $p.id)] | length),
              source_links:([$s.activities[] | select(.polity_id == $p.id) | .source_count] | add // 0)}],
            activity_ids:[.activities[] | {activity_id,polity_id,activity_start,activity_end,source_count}]}' \
            brazil-activity-census.push.json | tee brazil-activity-census-summary.push.json

      - name: Capture complete Polity reference evidence on main push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          request_oidc() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ATLAS_AUDIT_AUDIENCE}" | jq -er '.value'
          }

          endpoint="${ATLAS_AUDIT_ENDPOINT}?__atlas_audit_surface=polity-reference-audit"
          payload="$(jq -cn --arg deployment_sha "${GITHUB_SHA}" \
            '{deployment_sha:$deployment_sha,include_brazil_details:true,evidence_terms:["pre-meiji japan","imperial japan","tokugawa","toyotomi","empire of japan","liao dynasty","ming dynasty","tsardom of russia","shakya","haudenosaunee","swedish empire","qara khitai"]}')"
          fetched=false
          for attempt in $(seq 1 12); do
            oidc_token="$(request_oidc)"
            status="$(curl --silent --show-error --output polity-reference-audit-response.json --write-out '%{http_code}' --request POST \
              -H 'content-type: application/json' -H "authorization: Bearer ${oidc_token}" --data "$payload" "$endpoint")"
            if [[ "$status" == "200" ]]; then
              jq -e '.ok == true and .marker == "ATLAS_POLITY_REFERENCE_AUDIT_V1" and .read_only == true and .committed == false and .complete == true and (.reference_count == (.reference_catalog | length)) and (.polity_count == (.polities | length)) and (.external_orphan_count == ([.polities[] | select(.is_external_orphan == true)] | length))' polity-reference-audit-response.json >/dev/null
              fetched=true
              break
            fi
            code="$(jq -r '.code // "UNKNOWN"' polity-reference-audit-response.json 2>/dev/null || printf 'UNKNOWN')"
            if [[ "$status" == "404" || ( "$status" == "409" && "$code" == "DEPLOYMENT_SHA_MISMATCH" ) ]]; then
              echo "Production Polity audit route for ${GITHUB_SHA} is not live yet (attempt ${attempt}/12); retrying."
              sleep 10
              continue
            fi
            cat polity-reference-audit-response.json >&2 || true
            echo "Polity reference audit failed: HTTP ${status}, code ${code}" >&2
            exit 1
          done
          [[ "$fetched" == "true" ]] || { echo "Production Polity audit did not reach ${GITHUB_SHA} within retry window" >&2; exit 1; }

          jq '{marker,read_only,committed,deployment_sha,complete,reference_model,reference_count,polity_count,external_orphan_count}' polity-reference-audit-response.json | tee polity-reference-audit-summary.json
          jq '.reference_catalog' polity-reference-audit-response.json > polity-reference-catalog.push.json
          jq '[.polities[] | select(.is_external_orphan == true)]' polity-reference-audit-response.json > polity-external-orphans.push.json
          jq '
            [ .polities[]
              | . as $p
              | ([.external_references[]
                    | select(.source_schema == "atlas_v2" and .source_table == "person_politics_v2" and .source_column == "polity_id")
                    | .count][0] // 0) as $activity_refs
              | select($activity_refs == 0)
              | {
                  polity_id,
                  canonical_key,
                  names:[.names[] | {locale,name,is_preferred}],
                  owned_reference_total,
                  external_reference_total,
                  nonzero_external_references:[
                    .external_references[]
                    | select((.count // 0) > 0)
                    | {source_schema,source_table,source_column,count}
                  ]
                }
            ]
          ' polity-reference-audit-response.json | tee polity-zero-activity-reference-audit.push.json
          jq -e 'type == "array" and all(.[]; (.polity_id | type) == "string") and ((map(.polity_id) | length) == (map(.polity_id) | unique | length))' polity-zero-activity-reference-audit.push.json >/dev/null
          echo 'ATLAS_ZERO_ACTIVITY_POLITY_REFERENCE_AUDIT_V1'
          cat polity-zero-activity-reference-audit.push.json
          jq '[.polities[] | select(((.canonical_key // "") + " " + ([.names[]?.name] | join(" "))) | ascii_downcase | test("fifth|kamakura|tokugawa|toyotomi|liao dynasty|ming dynasty|tsardom of russia|empire of japan|shakya|haudenosaunee|swedish empire|qara khitai"))]' polity-reference-audit-response.json | tee polity-reference-candidates.push.json



      - name: Extract Brazil temporal designation, polity provenance and identity edges (read-only)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.ok == true and .read_only == true and .committed == false
             and (.brazil_details.polity_ids | length) == 3
             and (.brazil_details.polity_sources | type) == "array"
             and (.brazil_details.designations | type) == "array"
             and (.brazil_details.identity_relations | type) == "array"
             and (.brazil_details.governance_periods | type) == "array"' polity-reference-audit-response.json >/dev/null
          jq '.brazil_details' polity-reference-audit-response.json | tee brazil-polity-temporal-detail.push.json
          jq -c '.brazil_details | {
            polity_ids, direct_polity_sources:(.polity_sources|length),
            designation_rows:(.designations|length),
            designation_source_links:([.designations[].source_links|length]|add//0),
            identity_relation_edges:(.identity_relations|length),
            identity_source_links:([.identity_relations[].source_links|length]|add//0),
            governance_period_rows:(.governance_periods|length),
            governance_source_links:([.governance_periods[].source_links|length]|add//0)
          }' polity-reference-audit-response.json | tee brazil-polity-temporal-summary.push.json

      - name: Extract Brazil current Production Polity reference counts (read-only)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          jq --arg empire 'efcd0f70-bffe-5464-86e3-b28b3658404b' \
             --arg united '750bf6be-49e9-4215-95ff-a356ba1831cd' \
             --arg brazil 'a8b27d54-b180-4d51-a664-dd40b3eed08f' \
             '[.polities[] | select(.polity_id == $empire or .polity_id == $united or .polity_id == $brazil)
               | {polity_id,canonical_key,owned_reference_total,external_reference_total,external_references}]' \
             polity-reference-audit-response.json | tee brazil-polity-reference-census.push.json
          jq -e 'type == "array" and all(.[]; (.polity_id | type) == "string")' brazil-polity-reference-census.push.json >/dev/null

      - name: Upload read-only inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-audit-${{ env.ATLAS_AUDIT_MODE }}-${{ github.sha }}
          path: |
            audit-inventory-response.json
            audit-inventory-summary.json
            baseline-activity-uuids.json
            baseline-identity-catalogs.json
            polity-reference-catalog.json
            polity-external-orphans.json
            polity-reference-audit-response.json
            polity-reference-audit-summary.json
            polity-reference-catalog.push.json
            polity-external-orphans.push.json
            polity-zero-activity-reference-audit.push.json
            polity-reference-candidates.push.json
            brazil-activity-census.push.json
            brazil-activity-census-summary.push.json
            brazil-polity-reference-census.push.json
            brazil-polity-temporal-detail.push.json
            brazil-polity-temporal-summary.push.json
            docs/audits/STAGE2_R0_NORMALIZED_INVENTORY_REQUEST.json
          if-no-files-found: warn
          retention-days: 90
