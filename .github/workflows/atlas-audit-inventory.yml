name: ATLAS Audit Inventory

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/atlas-audit-inventory.yml'
      - 'api/atlas-audit-inventory.js'
      - 'server/atlas-audit-inventory-handler.js'
      - 'server/atlas-github-oidc.js'
      - 'docs/audits/STAGE2_R0_NORMALIZED_INVENTORY_REQUEST.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-audit-inventory-production
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      ATLAS_AUDIT_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-audit-inventory
      ATLAS_AUDIT_AUDIENCE: atlas-person-db-audit-inventory
      ATLAS_AUDIT_REQUEST: docs/audits/STAGE2_R0_NORMALIZED_INVENTORY_REQUEST.json
    steps:
      - uses: actions/checkout@v4

      - name: Validate reviewed inventory request
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schema == "atlas-audit-inventory/v1" and (.activity_ids | type == "array") and (.activity_ids | length > 0) and (.activity_ids | length <= 100)' "$ATLAS_AUDIT_REQUEST" >/dev/null
          jq -e '([.activity_ids[] | select(test("^[0-9a-fA-F-]{36}$") | not)] | length) == 0' "$ATLAS_AUDIT_REQUEST" >/dev/null
          echo "Reviewed Activity IDs: $(jq '.activity_ids | unique | length' "$ATLAS_AUDIT_REQUEST")"

      - name: Fetch normalized read-only inventory through exact Production SHA
        shell: bash
        run: |
          set -euo pipefail

          request_oidc() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ATLAS_AUDIT_AUDIENCE}" | jq -er '.value'
          }

          payload="$(jq -cn \
            --arg deployment_sha "${GITHUB_SHA}" \
            --slurpfile request "$ATLAS_AUDIT_REQUEST" \
            '{deployment_sha:$deployment_sha,activity_ids:$request[0].activity_ids}')"

          fetched=false
          for attempt in $(seq 1 60); do
            oidc_token="$(request_oidc)"
            status="$(curl --silent --show-error \
              --output audit-inventory-response.json \
              --write-out '%{http_code}' \
              --request POST \
              -H 'content-type: application/json' \
              -H "authorization: Bearer ${oidc_token}" \
              --data "$payload" \
              "$ATLAS_AUDIT_ENDPOINT")"

            if [[ "$status" == "200" ]]; then
              jq -e '.ok == true and .marker == "ATLAS_AUDIT_INVENTORY_V1" and .read_only == true and .committed == false and (.row_count == .requested_count)' audit-inventory-response.json >/dev/null
              fetched=true
              break
            fi

            code="$(jq -r '.code // "UNKNOWN"' audit-inventory-response.json 2>/dev/null || printf 'UNKNOWN')"
            if [[ "$status" == "404" ]]; then
              echo "Production audit route for ${GITHUB_SHA} is not live yet (attempt ${attempt}/60); retrying."
              sleep 10
              continue
            fi
            if [[ "$status" == "409" && "$code" == "DEPLOYMENT_SHA_MISMATCH" ]]; then
              echo "Production deployment has not reached ${GITHUB_SHA} yet (attempt ${attempt}/60); retrying."
              sleep 10
              continue
            fi

            cat audit-inventory-response.json >&2 || true
            echo "Audit inventory failed: HTTP ${status}, code ${code}" >&2
            exit 1
          done

          [[ "$fetched" == "true" ]] || { echo "Production deployment did not reach ${GITHUB_SHA} within retry window" >&2; exit 1; }
          jq '{marker,read_only,committed,deployment_sha,requested_count,row_count}' audit-inventory-response.json | tee audit-inventory-summary.json

      - name: Upload read-only inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: atlas-stage2-r0-normalized-inventory
          path: |
            audit-inventory-response.json
            audit-inventory-summary.json
            docs/audits/STAGE2_R0_NORMALIZED_INVENTORY_REQUEST.json
          if-no-files-found: error
          retention-days: 14
