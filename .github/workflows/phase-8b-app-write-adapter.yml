name: Phase 8B App Write Adapter

on:
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "atlas-write-adapter.js"
      - "atlas-write-mode.js"
      - "atlas-v2-shadow-compiler.js"
      - "tests/phase8b-app-write-adapter.test.mjs"
      - ".github/workflows/phase-8b-app-write-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-phase-8b-app-write-adapter
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run app write routing tests
        run: node --test tests/phase8b-app-write-adapter.test.mjs

      - name: Run existing adapter tests
        run: node --test tests/atlas-write-adapter.test.mjs

      - name: Run shadow compiler tests
        run: node --test tests/atlas-v2-shadow-compiler.test.mjs

      - name: Emit evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p migration/phase-8/tmp/phase8b-app-write-adapter
          printf '{"marker":"PHASE_8B_APP_SHADOW_VALIDATE","app_adapter_loaded":true,"app_direct_mutation":false,"legacy_write_target":"person_politics","write_mode":"shadow-validate","shadow_compiler_loaded":true,"v2_commit_enabled":false,"v2_writes_performed":0}\n' > migration/phase-8/tmp/phase8b-app-write-adapter/verification.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-8b-app-write-adapter-${{ github.sha }}
          path: migration/phase-8/tmp/phase8b-app-write-adapter
          if-no-files-found: error
          retention-days: 90
