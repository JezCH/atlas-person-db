name: TEMP Spatial B32 Apply

on:
  push:
    branches:
      - ops/spatial-backfill-b32
    paths:
      - '.github/workflows/tmp-spatial-b32-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/spatial-backfill-b32
      - name: Apply reviewed B32 mappings and count locks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          index_path = Path('atlas-polity-spatial-index.json')
          data = json.loads(index_path.read_text())
          geo = data['polity_geography']
          sub = data['polity_subregions']

          if len(geo) != 630 or len(sub) != 604:
              raise SystemExit(f'Unexpected B32 baseline: geography={len(geo)} subregions={len(sub)}')

          mappings = {
              'c63ab742-c86c-4fe1-842c-330546340244': ('africa', 'west-africa'),
              '37aa6b8a-9167-46af-897e-06ee531c4162': ('americas', 'south-america'),
              '868fe6f5-59dc-4f95-b8ea-7eccf5f32bff': ('americas', 'north-america'),
              'c7642cea-2a6d-43dc-b03f-5740d6cc53d6': ('southeast-asia', 'mainland-southeast-asia'),
              'b0bee257-faaf-4415-a08c-7b3a85937b3b': ('southeast-asia', 'mainland-southeast-asia'),
              '34896c16-a481-44b9-9b78-ac7260ed069d': ('southeast-asia', 'mainland-southeast-asia'),
              '3959991c-9512-41ab-8e0e-c718eee53633': ('europe', 'eastern-europe'),
              '886b9c7e-035a-490f-889d-f980b9346b4d': ('west-asia', 'levant'),
              '5037f747-2d30-4479-b321-6f01b5cba162': ('africa', 'west-africa'),
              'bf3f2bd2-e2b7-498a-b0d9-114ec3d88b92': ('southeast-asia', 'mainland-southeast-asia'),
          }

          collisions = [pid for pid in mappings if pid in geo or pid in sub]
          if collisions:
              raise SystemExit(f'B32 candidate already mapped: {collisions}')

          for pid, (macro, leaf) in mappings.items():
              geo[pid] = macro
              sub[pid] = leaf

          if len(geo) != 640 or len(sub) != 614:
              raise SystemExit(f'Unexpected B32 result: geography={len(geo)} subregions={len(sub)}')

          index_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          coverage = Path('tests/person-spacetime-spatial-index-coverage.test.mjs')
          text = coverage.read_text()
          if 'Object.keys(index.polity_geography).length, 630' not in text or 'Object.keys(index.polity_subregions).length, 604' not in text:
              raise SystemExit('B32 coverage count-lock baseline missing')
          text = text.replace('Object.keys(index.polity_geography).length, 630', 'Object.keys(index.polity_geography).length, 640')
          text = text.replace('Object.keys(index.polity_subregions).length, 604', 'Object.keys(index.polity_subregions).length, 614')
          coverage.write_text(text)

          taxonomy = Path('tests/spacetime-taxonomy-migration.test.mjs')
          text = taxonomy.read_text()
          required = ['"eastern-europe": 9', 'levant: 12', 'Object.keys(index.polity_subregions).length, 604']
          if any(x not in text for x in required):
              raise SystemExit('B32 taxonomy count-lock baseline missing')
          text = text.replace('"eastern-europe": 9', '"eastern-europe": 10')
          text = text.replace('levant: 12', 'levant: 13')
          text = text.replace('Object.keys(index.polity_subregions).length, 604', 'Object.keys(index.polity_subregions).length, 614')
          taxonomy.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas-polity-spatial-index.json tests/person-spacetime-spatial-index-coverage.test.mjs tests/spacetime-taxonomy-migration.test.mjs
          git commit -m 'spatial: backfill batch 32 polity placements'
          git push origin HEAD:ops/spatial-backfill-b32