name: Temporary Garha Spatial Compile

on:
  push:
    branches:
      - agent/spatial-garha-katanga-20260909

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spatial-garha-katanga-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compile reviewed spatial bindings
        run: node scripts/compile-spatial-bindings.mjs
      - name: Commit generated canonical index if changed
        run: |
          if git diff --quiet -- atlas-polity-spatial-index.json; then
            echo "Canonical index already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas-polity-spatial-index.json
          git commit -m "Compile Garha-Katanga spatial index"
          git push origin HEAD:agent/spatial-garha-katanga-20260909
