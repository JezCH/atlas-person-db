name: Temporary Spacetime Place Function Audit

on:
  push:
    branches:
      - agent/spacetime-place-function-v2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spacetime-place-function-v2
      - name: Compile canonical place-function v2 once
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          schema="$(node -p "JSON.parse(require('fs').readFileSync('atlas-polity-spatial-index.json','utf8')).schema")"
          if [[ "$schema" == "atlas-polity-spatial-index/v1" ]]; then
            node scripts/compile-spacetime-place-function-v2.mjs
            node --check atlas-person-spacetime-model.js
            node --check atlas-person-spacetime-view.js
            node --test tests/person-spacetime-spatial-index-coverage.test.mjs
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add atlas-polity-spatial-index.json atlas-person-spacetime-model.js atlas-person-spacetime-view.js tests/person-spacetime-spatial-index-coverage.test.mjs
            git commit -m 'Use canonical temporal polity place functions'
            git push origin HEAD:agent/spacetime-place-function-v2
          fi
      - name: Verify compiled contract
        shell: bash
        run: |
          set -euo pipefail
          node --check atlas-person-spacetime-model.js
          node --check atlas-person-spacetime-view.js
          node --test tests/person-spacetime-spatial-index-coverage.test.mjs
          node - <<'NODE'
          const fs=require('fs');
          const index=JSON.parse(fs.readFileSync('atlas-polity-spatial-index.json','utf8'));
          console.log(JSON.stringify({schema:index.schema,direct:Object.keys(index.polity_geography||{}).length,place_function_records:(index.place_function_records||[]).length,review_queue:(index.review_queue||[]).length,legacy_capital:Object.hasOwn(index,'capital_records'),legacy_authority:Object.hasOwn(index,'authority_center_records')},null,2));
          NODE
