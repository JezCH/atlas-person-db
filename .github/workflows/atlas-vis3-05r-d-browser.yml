name: ATLAS VIS3-05R D Real Chrome Compare

on:
  pull_request:
    paths:
      - "atlas-ui-phase3-ornaments.css"
      - "atlas-dashboard.js"
      - "scripts/verify-vis3-05r-d-production-browser.mjs"
      - ".github/workflows/atlas-vis3-05r-d-browser.yml"

permissions:
  contents: read

jobs:
  same_dom_browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ATLAS_PRODUCTION_ORIGIN: https://atlas-person-db.vercel.app
      ATLAS_BRANCH_SHA: ${{ github.event.pull_request.head.sha }}
      ATLAS_VISUAL_OUT_DIR: artifacts/vis3-05r-d-browser
      ATLAS_CDP_URL: http://127.0.0.1:9224
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Start read-only Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9224 --user-data-dir=/tmp/atlas-vis3-05r-review \
            about:blank >/tmp/atlas-vis3-05r-browser.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9224/json/version >/dev/null; then exit 0; fi
            sleep .3
          done
          cat /tmp/atlas-vis3-05r-browser.log
          exit 1
      - name: Compare current Production and D paint on same live DOM
        run: |
          node --check scripts/verify-vis3-05r-d-production-browser.mjs
          node scripts/verify-vis3-05r-d-production-browser.mjs
      - name: Upload browser comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vis3-05r-d-browser-${{ github.event.pull_request.head.sha }}
          path: artifacts/vis3-05r-d-browser
          if-no-files-found: warn
          retention-days: 14
