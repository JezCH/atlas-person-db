name: Ancient NamuWiki inventory diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ancient-namuwiki-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture complete ancient Person inventory from Production
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          global.window = {};
          require('./atlas-person-era-model.js');
          const eraForYear = global.window.ATLAS_PERSON_ERA_MODEL.eraForYear;

          async function readProduction() {
            const urls = [
              'https://atlas-person-db.vercel.app/api/atlas-person-read',
              'https://atlas-person-db.vercel.app/api/atlas-read?__atlas_read_surface=person'
            ];
            let lastError = null;
            for (const url of urls) {
              try {
                const response = await fetch(url, { headers: { accept: 'application/json' } });
                const text = await response.text();
                if (!response.ok) throw new Error(`${url} -> HTTP ${response.status}: ${text.slice(0, 500)}`);
                const payload = JSON.parse(text);
                if (!Array.isArray(payload.persons)) throw new Error(`${url} did not return persons[]`);
                return { url, payload };
              } catch (error) {
                lastError = error;
              }
            }
            throw lastError || new Error('Production Person read failed');
          }

          function htmlTitle(text) {
            const m = text.match(/<title[^>]*>([^<]+)<\/title>/i);
            return m ? m[1].replace(/\s+/g, ' ').trim() : null;
          }

          async function probe(base, title) {
            const url = `${base}/w/${encodeURIComponent(title)}`;
            try {
              const response = await fetch(url, {
                redirect: 'follow',
                headers: {
                  accept: 'text/html,application/xhtml+xml',
                  'user-agent': 'Mozilla/5.0 ATLAS-NamuWiki-link-verifier/1.0'
                }
              });
              const text = await response.text();
              return {
                requested_title: title,
                status: response.status,
                ok: response.ok,
                final_url: response.url,
                html_title: htmlTitle(text),
                body_prefix: text.slice(0, 180).replace(/\s+/g, ' ')
              };
            } catch (error) {
              return { requested_title: title, error: String(error) };
            }
          }

          (async () => {
            const { url, payload } = await readProduction();
            const ancient = payload.persons
              .filter((person) => eraForYear(person.first_activity_year == null ? null : Number(person.first_activity_year)).code === 'ancient')
              .map((person) => ({
                id: String(person.id),
                canonical_name_en: person.canonical_name_en || null,
                preferred_name_ko: person.preferred_name_ko || null,
                display_name: person.display_name || null,
                historicity: person.historicity || null,
                first_activity_year: person.first_activity_year == null ? null : Number(person.first_activity_year),
                last_activity_year: person.last_activity_year == null ? null : Number(person.last_activity_year),
                namuwiki: person.external_references?.namuwiki || null
              }))
              .sort((a, b) => (a.first_activity_year - b.first_activity_year) || String(a.display_name).localeCompare(String(b.display_name), 'ko'));

            const result = {
              source_url: url,
              production_total: payload.persons.length,
              ancient_count: ancient.length,
              ancient
            };
            fs.writeFileSync('ancient-namuwiki-inventory.json', JSON.stringify(result, null, 2));
            console.log(`PRODUCTION_PERSON_TOTAL=${result.production_total}`);
            console.log(`ANCIENT_PERSON_COUNT=${result.ancient_count}`);
            console.log('ANCIENT_INVENTORY_BEGIN');
            for (const person of ancient) console.log(JSON.stringify(person));
            console.log('ANCIENT_INVENTORY_END');

            const missing = ancient.filter((person) => !person.namuwiki);
            console.log(`MISSING_NAMUWIKI_COUNT=${missing.length}`);
            console.log('NAMUWIKI_PROBE_BEGIN');
            for (const person of missing) {
              const preferred = person.preferred_name_ko || person.display_name || person.canonical_name_en;
              const variants = [...new Set([preferred, preferred.replace(/\s+/g, '')])];
              const probes = [];
              for (const variant of variants) {
                probes.push({ source: 'namu.wiki', ...(await probe('https://namu.wiki', variant)) });
                probes.push({ source: 'www.namu.moe', ...(await probe('https://www.namu.moe', variant)) });
              }
              console.log(JSON.stringify({ id: person.id, name: preferred, probes }));
            }
            console.log('NAMUWIKI_PROBE_END');
          })().catch((error) => {
            console.error(error?.stack || error);
            process.exit(1);
          });
          NODE
      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: ancient-namuwiki-inventory
          path: ancient-namuwiki-inventory.json
          if-no-files-found: error
