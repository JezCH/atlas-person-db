name: Temporary spatial live residual compile

on:
  push:
    branches:
      - codex/spatial-live-residual-2-20260918

permissions:
  contents: write

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Compile canonical spatial index
        run: |
          node scripts/compile-spatial-bindings-r4.mjs
          node scripts/compile-spatial-bindings-r4.mjs --check
      - name: Focused spatial tests
        run: |
          node --test \
            tests/spatial-binding-compiler.test.mjs \
            tests/spatial-taxonomy-r4-compiler.test.mjs \
            tests/spatial-reviewed-corrections.test.mjs \
            tests/person-spacetime-spatial-index-coverage.test.mjs \
            tests/atlas-spacetime-macro-only-unresolved.test.mjs
      - run: git diff --check
      - name: Commit generated index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas-polity-spatial-index.json
          git diff --cached --quiet && { echo 'canonical index did not change'; exit 1; }
          git commit -m 'spatial: compile Hazor and Sweden-Norway residuals'
          git push origin HEAD:${GITHUB_REF_NAME}
