name: Phase 9 UI Live Localization Audit

on:
  pull_request:
    paths:
      - ".github/workflows/phase9-ui-live-localization-audit.yml"
      - "server/atlas-normalized-read-service.js"
      - "app.js"
      - "index.html"
      - "person-locales*.js"

permissions:
  contents: read

jobs:
  live-readonly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: phase-5-shadow
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify DB secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Audit localization and chronology
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p migration/phase-9/tmp/ui-audit
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --no-psqlrc --tuples-only --no-align <<'SQL' > migration/phase-9/tmp/ui-audit/report.txt
          select 'COUNTS';
          select 'relationships=' || count(*) from atlas_v2.person_politics_v2;
          select 'active_persons=' || count(distinct person_id) from atlas_v2.person_politics_v2;
          select 'active_polities=' || count(distinct polity_id) from atlas_v2.person_politics_v2;
          select 'active_roles=' || count(distinct role_id) from atlas_v2.person_politics_v2 where role_id is not null;

          select 'MISSING_KO_PERSONS';
          select en.name
          from atlas_v2.persons p
          join atlas_v2.person_names en on en.person_id=p.id and en.locale='en' and en.is_preferred=true
          where exists(select 1 from atlas_v2.person_politics_v2 pp where pp.person_id=p.id)
            and not exists(select 1 from atlas_v2.person_names ko where ko.person_id=p.id and ko.locale='ko' and ko.is_preferred=true)
          order by en.name;

          select 'MISSING_KO_POLITIES';
          select en.name
          from atlas_v2.polities p
          join atlas_v2.polity_names en on en.polity_id=p.id and en.locale='en' and en.is_preferred=true
          where exists(select 1 from atlas_v2.person_politics_v2 pp where pp.polity_id=p.id)
            and not exists(select 1 from atlas_v2.polity_names ko where ko.polity_id=p.id and ko.locale='ko' and ko.is_preferred=true)
          order by en.name;

          select 'ROLE_LOCALIZATION';
          select r.source_label || '|' || coalesce(ko.name,'<MISSING_KO>') || '|' || count(*)
          from atlas_v2.person_politics_v2 pp
          join atlas_v2.roles r on r.id=pp.role_id
          left join atlas_v2.role_names ko on ko.role_id=r.id and ko.locale='ko' and ko.is_preferred=true
          group by r.id,r.source_label,ko.name
          order by r.source_label;

          select 'CHRONOLOGY_BOUNDS';
          select min(activity_start) || '|' || max(activity_start) || '|' || min(activity_end) || '|' || max(activity_end)
          from atlas_v2.person_politics_v2;
          SQL
          cat migration/phase-9/tmp/ui-audit/report.txt
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: phase9-ui-live-localization-audit
          path: migration/phase-9/tmp/ui-audit/report.txt
          retention-days: 30
