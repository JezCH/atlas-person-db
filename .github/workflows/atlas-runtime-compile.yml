name: ATLAS Runtime Projection Compile

on:
  push:
    branches:
      - main
    paths:
      - 'server/atlas-runtime-compile-handler.js'
      - 'server/atlas-runtime-compile-service.js'
      - 'server/atlas-runtime-migrations.js'
      - 'server/atlas-runtime-publication-read-service.js'
      - 'server/atlas-runtime-publication-read-handler.js'
      - 'db/migrations/20260906_runtime_person_politics_projection_v1.sql'
      - 'db/migrations/20260920_runtime_projection_activation_history_v1.sql'
      - 'db/migrations/20260920_runtime_compile_exclusion_targets_v1.sql'
      - 'contracts/runtime-projection-contract.v1.json'
  workflow_run:
    workflows:
      - ATLAS Authoring Apply
      - ATLAS Correction Apply
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-runtime-projection-compile
  # Publication is derived from the current canonical DB snapshot. A newer
  # publication run supersedes an older run that has not committed yet.
  cancel-in-progress: true

jobs:
  compile:
    # Authoring and Correction are canonical Activity mutation boundaries.
    # A terminal run triggers publication even when the producer workflow
    # reports failure because isolated earlier operations may already have
    # committed. workflow_dispatch is recovery-only, never a semantic trigger.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      ATLAS_RUNTIME_IDENTITY_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-read?__atlas_read_surface=runtime-identity
      ATLAS_RUNTIME_PUBLICATION_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-read?__atlas_read_surface=runtime-publication
      ATLAS_RUNTIME_COMPILE_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-runtime-compile
      ATLAS_RUNTIME_COMPILE_AUDIENCE: atlas-person-db-runtime-compile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record publication trigger
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "Canonical producer: ${{ github.event.workflow_run.name }}"
            echo "Producer head SHA: ${{ github.event.workflow_run.head_sha }}"
            echo "Producer conclusion: ${{ github.event.workflow_run.conclusion }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "Runtime compiler code/contract changed at ${GITHUB_SHA}; exact deployed code is required."
          else
            echo "Recovery publication requested at workflow SHA ${GITHUB_SHA}."
          fi

      - name: Resolve compatible deployed Runtime
        shell: bash
        run: |
          set -euo pipefail
          require_exact_runtime=false
          if [[ "${{ github.event_name }}" == "push" ]]; then
            require_exact_runtime=true
          fi

          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error               --output /tmp/atlas-runtime-identity.json               --write-out '%{http_code}'               "$ATLAS_RUNTIME_IDENTITY_ENDPOINT")"
            if [[ "$status" == "200" ]]; then
              runtime_sha="$(jq -r '.identity.git_commit_sha // ""' /tmp/atlas-runtime-identity.json)"
              runtime_ref="$(jq -r '.identity.git_commit_ref // ""' /tmp/atlas-runtime-identity.json)"
              if [[ "$runtime_sha" =~ ^[0-9a-f]{40}$ && "$runtime_ref" == "main" ]]; then
                if [[ "$require_exact_runtime" == "true" && "$runtime_sha" != "$GITHUB_SHA" ]]; then
                  echo "Runtime code deployment ${runtime_sha} is behind compiler change ${GITHUB_SHA} (attempt ${attempt}/60)."
                else
                  echo "ATLAS_RUNTIME_SHA=$runtime_sha" >> "$GITHUB_ENV"
                  echo "Using deployed Runtime code ${runtime_sha}; publication workflow SHA is ${GITHUB_SHA}."
                  exit 0
                fi
              else
                echo "Runtime identity is incomplete: sha=${runtime_sha:-unknown}, ref=${runtime_ref:-unknown} (attempt ${attempt}/60)."
              fi
            else
              echo "Runtime identity returned HTTP ${status} (attempt ${attempt}/60)."
            fi
            sleep 10
          done

          cat /tmp/atlas-runtime-identity.json >&2 || true
          echo "COMPATIBLE_PRODUCTION_RUNTIME_NOT_AVAILABLE" >&2
          exit 1

      - name: Compile and atomically publish Runtime projection
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$(curl --fail-with-body --silent --show-error             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ATLAS_RUNTIME_COMPILE_AUDIENCE}" | jq -er '.value')"
          payload="$(jq -cn             --arg runtime_sha "$ATLAS_RUNTIME_SHA"             --arg authoring_sha "$GITHUB_SHA"             '{runtime_sha:$runtime_sha,authoring_sha:$authoring_sha,dry_run:false}')"
          status="$(curl --silent --show-error             --output /tmp/atlas-runtime-compile.json             --write-out '%{http_code}'             --request POST             -H 'content-type: application/json'             -H "authorization: Bearer ${oidc_token}"             --data "$payload"             "$ATLAS_RUNTIME_COMPILE_ENDPOINT")"
          if [[ "$status" != "200" ]]; then
            cat /tmp/atlas-runtime-compile.json >&2 || true
            echo "Runtime compile failed: HTTP ${status}" >&2
            exit 1
          fi
          jq -e             --arg runtime "$ATLAS_RUNTIME_SHA"             --arg authoring "$GITHUB_SHA" '
              .ok==true
              and .marker=="ATLAS_RUNTIME_COMPILE_TRANSPORT_V1"
              and .runtime_sha==$runtime
              and .authoring_sha==$authoring
              and .outcome.marker=="ATLAS_RUNTIME_PERSON_POLITICS_COMPILE_V1"
              and .outcome.dry_run==false
              and .outcome.committed==true
              and (.outcome.input_fingerprint | test("^[0-9a-f]{64}$"))
              and (.outcome.output_fingerprint | test("^[0-9a-f]{64}$"))
              and (.outcome.input_row_count == (.outcome.output_row_count + .outcome.excluded_row_count))
              and (.outcome.disposition_counts.published == .outcome.output_row_count)
              and (.outcome.disposition_counts.excluded == .outcome.excluded_row_count)
              and .outcome.activation.activation_kind=="compile_commit"
            ' /tmp/atlas-runtime-compile.json >/dev/null
          jq . /tmp/atlas-runtime-compile.json

      - name: Verify active publication and explicit dispositions
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error             --output /tmp/atlas-runtime-publication.json             --write-out '%{http_code}'             "$ATLAS_RUNTIME_PUBLICATION_ENDPOINT")"
          [[ "$status" == "200" ]] || {
            cat /tmp/atlas-runtime-publication.json >&2 || true
            echo "Runtime publication verification failed: HTTP ${status}" >&2
            exit 1
          }
          jq -e             --slurpfile compiled /tmp/atlas-runtime-compile.json             --arg runtime "$ATLAS_RUNTIME_SHA"             --arg authoring "$GITHUB_SHA" '
              $compiled[0].outcome as $out
              | .ok==true
              and .schema=="atlas-runtime-publication/v1"
              and .projection_matches_active_compile==true
              and .authoring_matches_active_compile==true
              and .publication_current==true
              and .current_authoring_input_fingerprint==$out.input_fingerprint
              and .active_compile.input_fingerprint==$out.input_fingerprint
              and .active_compile.output_fingerprint==$out.output_fingerprint
              and .active_compile.input_row_count==$out.input_row_count
              and .active_compile.output_row_count==$out.output_row_count
              and .active_compile.excluded_row_count==$out.excluded_row_count
              and .activation_history.available==true
              and .activation_history.latest_matches_projection==true
              and .activation_history.latest_recorded.compile_key==$out.compile_key
              and .activation_history.latest_recorded.runtime_sha==$runtime
              and .activation_history.latest_recorded.authoring_sha==$authoring
            ' /tmp/atlas-runtime-publication.json >/dev/null
          jq . /tmp/atlas-runtime-publication.json
