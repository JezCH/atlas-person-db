name: ATLAS Runtime Projection Compile

on:
  workflow_run:
    workflows:
      - ATLAS Authoring Apply
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-runtime-projection-compile
  cancel-in-progress: false

jobs:
  compile:
    # Compile after every terminal main-branch Authoring Apply, including a failure.
    # A Human Authoring Apply can commit Authoring data and then fail only because
    # its legacy public read-back is now Runtime-backed. Compiling that committed
    # Authoring state breaks the post-cutover circular dependency without falling
    # back to raw Authoring reads. A subsequent rerun can then verify Runtime.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      ATLAS_AUTHORING_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-authoring-apply
      ATLAS_RUNTIME_COMPILE_ENDPOINT: https://atlas-person-db.vercel.app/api/atlas-runtime-compile
      ATLAS_RUNTIME_COMPILE_AUDIENCE: atlas-person-db-runtime-compile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for exact Production runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error \
              --output /tmp/atlas-runtime-readiness.json \
              --write-out '%{http_code}' \
              "$ATLAS_AUTHORING_ENDPOINT")"
            if [[ "$status" == "200" ]]; then
              runtime_sha="$(jq -r '.runtime_sha // ""' /tmp/atlas-runtime-readiness.json)"
              ready="$(jq -r '.ready // false' /tmp/atlas-runtime-readiness.json)"
              if [[ "$runtime_sha" == "$GITHUB_SHA" && "$ready" == "true" ]]; then
                echo "Production authoring runtime is exact target ${GITHUB_SHA}."
                exit 0
              fi
              echo "Production runtime ${runtime_sha:-unknown}, ready=${ready}; target ${GITHUB_SHA} (attempt ${attempt}/60)."
            else
              echo "Authoring readiness returned HTTP ${status} (attempt ${attempt}/60)."
            fi
            sleep 10
          done
          cat /tmp/atlas-runtime-readiness.json >&2 || true
          echo "PRODUCTION_RUNTIME_NOT_AT_COMPILE_SHA:${GITHUB_SHA}" >&2
          exit 1

      - name: Compile sealed Runtime projection
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ATLAS_RUNTIME_COMPILE_AUDIENCE}" | jq -er '.value')"
          payload="$(jq -cn \
            --arg runtime_sha "$GITHUB_SHA" \
            --arg authoring_sha "$GITHUB_SHA" \
            '{runtime_sha:$runtime_sha,authoring_sha:$authoring_sha,dry_run:false}')"
          status="$(curl --silent --show-error \
            --output /tmp/atlas-runtime-compile.json \
            --write-out '%{http_code}' \
            --request POST \
            -H 'content-type: application/json' \
            -H "authorization: Bearer ${oidc_token}" \
            --data "$payload" \
            "$ATLAS_RUNTIME_COMPILE_ENDPOINT")"
          if [[ "$status" != "200" ]]; then
            cat /tmp/atlas-runtime-compile.json >&2 || true
            echo "Runtime compile failed: HTTP ${status}" >&2
            exit 1
          fi
          jq -e \
            --arg sha "$GITHUB_SHA" '
              .ok==true
              and .marker=="ATLAS_RUNTIME_COMPILE_TRANSPORT_V1"
              and .runtime_sha==$sha
              and .authoring_sha==$sha
              and .outcome.marker=="ATLAS_RUNTIME_PERSON_POLITICS_COMPILE_V1"
              and .outcome.dry_run==false
              and .outcome.committed==true
              and (.outcome.input_fingerprint | test("^[0-9a-f]{64}$"))
              and (.outcome.output_fingerprint | test("^[0-9a-f]{64}$"))
              and (.outcome.input_row_count == (.outcome.output_row_count + .outcome.excluded_row_count))
            ' /tmp/atlas-runtime-compile.json >/dev/null
          jq . /tmp/atlas-runtime-compile.json
