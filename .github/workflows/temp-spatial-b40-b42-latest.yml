name: TEMP Apply Spatial B40-B42 Latest

on:
  push:
    branches:
      - ops/spatial-backfill-b40-b42-latest

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/spatial-backfill-b40-b42-latest
          fetch-depth: 0

      - name: Apply latest reviewed B40-B42 mappings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const indexPath = 'atlas-polity-spatial-index.json';
          const coveragePath = 'tests/person-spacetime-spatial-index-coverage.test.mjs';
          const taxonomyPath = 'tests/spacetime-taxonomy-migration.test.mjs';

          const mappings = [
            ['2448cf13-737f-4f8c-94eb-c67f02e439f1','europe','eastern-europe'],
            ['c509f237-34d1-45ed-8b1a-37fb55176cb2','europe','eastern-europe'],
            ['9cc6bfac-dc17-43b7-976b-61a93873fc4e','central-asia','eastern-central-asia-steppe'],
            ['02799dee-d86d-4a11-8cae-0911ea72803b','africa','east-africa-horn'],
            ['8e2a0e63-9115-4236-8632-81f9c1979e80','oceania','pacific-islands'],
            ['97f4a060-f28c-42e4-955c-68ce821aa021','europe','central-europe'],
            ['6117ed42-3fff-4aa9-bed0-78e4cc8af970','americas','north-america'],
            ['2d13c907-3156-4f8a-8e1d-51cf4aa6c72f','americas','caribbean'],
            ['bf8f4f5d-2a26-42c6-886c-0e3b0be399eb','southeast-asia','mainland-southeast-asia'],
            ['784f0fca-9e79-4ccf-a5fe-1c03763a75b3','west-asia','levant'],
            ['06f4ac04-2ab7-4918-87ad-225441a512ba','americas','north-america'],
            ['0ca4b318-0b60-49a4-91c9-5bbd362a6a34','south-asia','deccan-south-india'],
            ['7326adc8-b70d-4349-a37e-cfe67200fa03','south-asia','northwest-south-asia'],
            ['f7564dcc-b9b8-4826-b5a2-761d9c1461f7','europe','italy'],
            ['3209f9ae-445d-4923-b40c-b416cb69e772','west-asia','levant'],
            ['8ec4423d-16e9-46da-bab0-decc0035b65b','americas','mesoamerica'],
            ['5dea7d5a-8c1c-45c9-bad6-06be53bff37a','americas','north-america'],
            ['49951425-53b1-41ff-a0fd-45ee53396338','americas','north-america'],
            ['a0a49c85-184d-4b29-b64d-b3b6ad140626','americas','south-america'],
            ['2f1c9873-ad68-4e35-b871-99840fcbecbc','west-asia','arabia'],
            ['b42a54aa-60c3-4559-9364-5f007550d12b','europe','western-europe'],
            ['88defb71-c038-49c7-b744-6f826f441a54','oceania','pacific-islands'],
            ['15dc2169-3792-4290-8112-31b65bc7677e','europe','iberia'],
            ['653fadee-cba6-4eae-94c1-8d42d6e0f0e9','west-asia','arabia'],
            ['5c3598af-1d9a-423c-9852-3964cb3250bf','africa','west-africa'],
            ['6388a19f-f0be-4fef-9742-b8e91c40eb60','east-asia','japan'],
            ['85341335-9f4a-4c50-96b4-f23173b3fd9c','south-asia','northwest-south-asia'],
            ['f2393b2d-2264-46fb-aa71-9b538a9a4cd2','southeast-asia','maritime-southeast-asia'],
            ['ae86f3f6-2857-4cdb-9850-e518bad4b86e','southeast-asia','maritime-southeast-asia'],
            ['1183ac38-f2bc-45cc-bffb-930ce32fed65','americas','caribbean']
          ];

          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          const beforeGeo = Object.keys(index.polity_geography).length;
          const beforeSub = Object.keys(index.polity_subregions).length;
          if (beforeGeo !== 710 || beforeSub !== 684) {
            throw new Error(`unexpected baseline counts ${beforeGeo}/${beforeSub}`);
          }
          if (new Set(mappings.map(([id]) => id)).size !== 30) throw new Error('mapping UUIDs are not unique');
          const pfIds = new Set((index.place_function_records || []).map((r) => r.polity_id));
          for (const [id, macro, sub] of mappings) {
            if (Object.hasOwn(index.polity_geography, id)) throw new Error(`already broad-mapped: ${id}`);
            if (Object.hasOwn(index.polity_subregions, id)) throw new Error(`already subregion-mapped: ${id}`);
            if (pfIds.has(id)) throw new Error(`already temporal place-function mapped: ${id}`);
            index.polity_geography[id] = macro;
            index.polity_subregions[id] = sub;
          }
          const afterGeo = Object.keys(index.polity_geography).length;
          const afterSub = Object.keys(index.polity_subregions).length;
          if (afterGeo !== 740 || afterSub !== 714) throw new Error(`unexpected post counts ${afterGeo}/${afterSub}`);
          fs.writeFileSync(indexPath, JSON.stringify(index, null, 2) + '\n');

          let coverage = fs.readFileSync(coveragePath, 'utf8');
          if (!coverage.includes('Object.keys(index.polity_geography).length, 710')) throw new Error('coverage geography lock not found');
          if (!coverage.includes('Object.keys(index.polity_subregions).length, 684')) throw new Error('coverage subregion lock not found');
          coverage = coverage.replace('Object.keys(index.polity_geography).length, 710', 'Object.keys(index.polity_geography).length, 740');
          coverage = coverage.replace('Object.keys(index.polity_subregions).length, 684', 'Object.keys(index.polity_subregions).length, 714');
          fs.writeFileSync(coveragePath, coverage);

          let taxonomy = fs.readFileSync(taxonomyPath, 'utf8');
          const replacements = [
            ['mesoamerica: 19', 'mesoamerica: 20'],
            ['caribbean: 6', 'caribbean: 8'],
            ['"eastern-europe": 12', '"eastern-europe": 14'],
            ['levant: 15', 'levant: 17'],
            ['Object.keys(index.polity_subregions).length, 684', 'Object.keys(index.polity_subregions).length, 714']
          ];
          for (const [from, to] of replacements) {
            if (!taxonomy.includes(from)) throw new Error(`taxonomy lock not found: ${from}`);
            taxonomy = taxonomy.replace(from, to);
          }
          fs.writeFileSync(taxonomyPath, taxonomy);
          NODE

          node --test tests/person-spacetime-spatial-index-coverage.test.mjs tests/spacetime-taxonomy-migration.test.mjs

      - name: Commit reviewed spatial batch
        shell: bash
        run: |
          rm .github/workflows/temp-spatial-b40-b42-latest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "spatial: backfill latest batches 40 through 42"
          git push origin HEAD:ops/spatial-backfill-b40-b42-latest
