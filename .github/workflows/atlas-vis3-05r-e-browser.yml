name: ATLAS VIS3-05R-E Exact Production Evidence

on:
  pull_request:
    paths:
      - "scripts/verify-vis3-05r-e-production-browser.mjs"
      - ".github/workflows/atlas-vis3-05r-e-browser.yml"
permissions:
  contents: read
jobs:
  same_dom_exact_production:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      ATLAS_PRODUCTION_ORIGIN: https://atlas-person-db.vercel.app
      ATLAS_EXPECTED_RUNTIME_SHA: 0c9746028efa307d69580df08a18dfcf040af8b8
      ATLAS_VISUAL_OUT_DIR: artifacts/vis3-05r-e-production
      ATLAS_CDP_URL: http://127.0.0.1:9224
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Korean fonts with bounded setup
        run: |
          if ! fc-list :lang=ko family | grep -q .; then
            timeout 32s sudo apt-get update -qq || true
            timeout 32s sudo apt-get install -y --no-install-recommends fonts-noto-cjk || true
          fi
          fc-list :lang=ko family | head -n 4 || true
      - name: Start Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9224 --user-data-dir=/tmp/atlas-vis3-05r-e-chrome \
            about:blank >/tmp/atlas-vis3-05r-e-chrome.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9224/json/version >/dev/null; then exit 0; fi
            sleep .3
          done
          cat /tmp/atlas-vis3-05r-e-chrome.log
          exit 1
      - name: Compare deployed exact-SHA Dashboard ornament ON and OFF
        run: |
          node --check scripts/verify-vis3-05r-e-production-browser.mjs
          node scripts/verify-vis3-05r-e-production-browser.mjs
      - name: Archive read-only Chrome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vis3-05r-e-exact-production-${{ github.event.pull_request.head.sha }}
          path: artifacts/vis3-05r-e-production
          if-no-files-found: warn
          retention-days: 30
