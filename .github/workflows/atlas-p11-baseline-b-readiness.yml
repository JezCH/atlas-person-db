name: ATLAS P11 Baseline B Readiness

on:
  pull_request:
    paths:
      - '.github/workflows/atlas-p11-baseline-b-readiness.yml'
      - 'scripts/rehearse-p11-*.mjs'
      - 'server/atlas-baseline-b.js'
      - 'server/atlas-p11-*.js'
      - 'server/atlas-duplicate-review-service.js'
      - 'server/atlas-person-duplicate-revalidation-readiness.js'
      - 'server/atlas-person-merge-service.js'
      - 'server/atlas-authoring-migrations.js'
      - 'server/atlas-correction-migrations.js'
      - 'server/atlas-stage2-schema-release.js'
      - 'server/atlas-stage2-p9-db-cutover.js'
      - 'db/schema/**'
      - 'migration/phase-10/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/atlas-p11-baseline-b-readiness.yml'
      - 'scripts/rehearse-p11-*.mjs'
      - 'server/atlas-baseline-b.js'
      - 'server/atlas-p11-*.js'
      - 'server/atlas-duplicate-review-service.js'
      - 'server/atlas-person-duplicate-revalidation-readiness.js'
      - 'server/atlas-person-merge-service.js'
      - 'server/atlas-authoring-migrations.js'
      - 'server/atlas-correction-migrations.js'
      - 'server/atlas-stage2-schema-release.js'
      - 'server/atlas-stage2-p9-db-cutover.js'
      - 'db/schema/**'
      - 'migration/phase-10/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_p11_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_p11_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atlas_p11_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rehearse P11 Baseline B readiness and read-only capture
        shell: bash
        run: |
          set -euo pipefail
          node scripts/rehearse-p11-baseline-b-readiness.mjs
