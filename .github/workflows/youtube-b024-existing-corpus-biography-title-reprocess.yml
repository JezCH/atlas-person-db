name: YouTube B024 existing 2.23m titles reprocess (NO NEW CRAWL)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/youtube-b024-existing-corpus-biography-title-reprocess.py'
      - 'tests/test_youtube_b024_existing_corpus_biography_title_reprocess.py'
      - 'tests/atlas-youtube-b024-existing-corpus-biography-title-reprocess.test.mjs'
      - '.github/workflows/youtube-b024-existing-corpus-biography-title-reprocess.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: atlas-youtube-b024-existing-original-source-title-triage
  cancel-in-progress: false

jobs:
  reprocess_existing_original_archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline title-focus and original-ID fixture tests FIRST
        run: python3 -m unittest discover -s tests -p test_youtube_b024_existing_corpus_biography_title_reprocess.py -v
      - name: Confirm EXACT already-retained immutable Batch024 artifact before downloading
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11613130249" | jq -e '
            .id==11613130249 and
            .expired==false and
            .name=="youtube-cumulative-batch024-validated" and
            .digest=="sha256:8f3ca335012fe82c94848f63b9126b1aeec7b48c935b403605dd7752ce713946"
          ' > /dev/null
      - name: Restore SAME 10,127 channel / 2,230,031 video files — no YouTube requests
        uses: actions/download-artifact@v4
        with:
          name: youtube-cumulative-batch024-validated
          run-id: '37921755392'
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: corpus
      - name: Actually scan ALL archived title rows once and save original ID-backed cues
        run: |
          set -euo pipefail
          python3 scripts/youtube-b024-existing-corpus-biography-title-reprocess.py \
            --archive corpus \
            --verified-extracted-artifact \
            --output /tmp/youtube-b024-original-biography-title-reprocess.json \
            | tee /tmp/youtube-b024-title-triage-summary.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/youtube-b024-original-biography-title-reprocess.json').read_text())
          assert d['schema']=='atlas-youtube-b024-existing-originals-biography-title-triage/v1'
          assert d['original_channel_files_scanned']==10127
          assert d['original_video_title_rows_scanned']==2230031
          assert d['independent_source_name_label_count']==5965
          assert d['explicit_biography_title_video_ids']>0
          assert d['video_content_verified_count']==0
          assert d['historical_persons_confirmed_unregistered']==0
          assert d['production_writes']==0
          assert d['rank_publication_allowed']==False
          assert d['new_youtube_crawling_attempted']==False
          assert d['video_media_retrieval_attempted']==False
          for row in d['rows']:
              assert len(set(row['strong_biography_original_video_ids']))==row['strong_biography_title_original_video_count']
              assert len(set(row['strong_biography_original_channel_ids']))==row['strong_biography_title_original_channel_count']
          PY
      - name: Report actual source original-ID title-focused Person review candidates
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path('/tmp/youtube-b024-original-biography-title-reprocess.json').read_text())
          lines=[
            '## Actually rescanned existing Batch024: NO new crawls or YouTube API',
            f"- Archived source: **{x['original_channel_files_scanned']:,} channels / {x['original_video_title_rows_scanned']:,} video-title rows**",
            f"- Independent source-extracted name labels: **{x['independent_source_name_label_count']:,}**",
            f"- Original videos with explicit biography-title syntax: **{x['explicit_biography_title_video_ids']:,}** (NOT watched or content verified)",
            f"- Source labels with such original IDs: **{x['distinct_name_labels_with_explicit_biography_title_cues']:,}**",
            "- Actual video watched: **0**; final current ATLAS registry screening: PENDING; Production writes: **0**",
            "- The IDs are archival-original, but title grammar is **not video content proof**",
            '',
            '| Source-extracted name label | Distinct original channels with explicit biography title | Original videos | Example ORIGINAL Video ID |',
            '|---|---:|---:|---|'
          ]
          for row in x['rows'][:25]:
              sample=row['source_title_samples'][0]['video_id']
              lines.append(f"| {row['raw_name'].replace(chr(124),' ')} | {row['strong_biography_title_original_channel_count']} | {row['strong_biography_title_original_video_count']} | {sample} |")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as f:
              f.write('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-b024-existing-2230031-original-title-biography-cues-${{ github.run_id }}
          path: /tmp/youtube-b024-original-biography-title-reprocess.json
          if-no-files-found: error
          retention-days: 30
