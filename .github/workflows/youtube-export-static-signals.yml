name: Export YouTube static signal read model (no Supabase)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: youtube-cumulative-batch017-validated
          run-id: "37771318676"
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: corpus
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and validate static read model without external API
        run: |
          python -m pip install --disable-pip-version-check pycountry
          python scripts/youtube-build-person-signal-snapshot.py \
            --root corpus --output /tmp/youtube-publication.json \
            --artifact-id 11548326100 \
            --artifact-digest sha256:b40f8efdccfacce194afb44cc7cca3e93a4ab12a2153c5a19b70ceb3f56b0b1f
          python scripts/youtube-export-static-signals.py \
            --source /tmp/youtube-publication.json --output /tmp/youtube-static-signals.json
      - name: Upload independent read model for review
        uses: actions/upload-artifact@v4
        with:
          name: youtube-static-signals-validated
          path: /tmp/youtube-static-signals.json
          retention-days: 90
