name: YouTube Batch011 Staging

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/youtube-batch011-staging.yml"
      - "scripts/youtube-batch011-staging.py"

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download batch010 long-retention archive
        uses: actions/download-artifact@v4
        with:
          name: youtube-batch010-staging-longterm
          path: prior/archive010
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37599569031
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Collect staging batch
        run: python scripts/youtube-batch011-staging.py
      - name: Upload long-retention staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-batch011-staging-longterm
          path: |
            prior/archive010
            out/youtube-batch011
          if-no-files-found: error
          retention-days: 90
