name: Phase 8A Dependency Inventory

on:
  pull_request:
    paths:
      - "migration/phase-8/**"
      - ".github/workflows/phase-8a-dependency-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-phase-8a-dependency-inventory
  cancel-in-progress: false

jobs:
  repository-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run repository dependency inventory
        run: |
          set -euo pipefail
          bash migration/phase-8/scripts/run-phase8a-inventory.sh

      - name: Upload repository inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-8a-repository-inventory-${{ github.sha }}
          path: migration/phase-8/tmp/phase8a
          if-no-files-found: error
          retention-days: 90

  live-database-inventory:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: phase-5-shadow
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify database secret
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Export live database inventory in read-only transaction
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          rm -rf migration/phase-8/tmp/phase8a-live
          mkdir -p migration/phase-8/tmp/phase8a-live
          mkdir -p migration/phase-8/tmp/phase8a
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --no-psqlrc --file migration/phase-8/scripts/export-phase8a-db-inventory.sql > migration/phase-8/tmp/phase8a-live/export.log 2>&1
          cp migration/phase-8/tmp/phase8a/database-inventory.json migration/phase-8/tmp/phase8a-live/database-inventory.json
          node migration/phase-8/scripts/phase8a-db-inventory.mjs migration/phase-8/tmp/phase8a-live/database-inventory.json migration/phase-8/tmp/phase8a-live/database-inventory-report.json
          printf 'PHASE_8A_LIVE_DATABASE_INVENTORY\n' > migration/phase-8/tmp/phase8a-live/marker.txt

      - name: Upload live database inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-8a-live-database-inventory-${{ github.sha }}
          path: migration/phase-8/tmp/phase8a-live
          if-no-files-found: error
          retention-days: 90
