name: TEMP Spatial B29 Apply

on:
  push:
    branches:
      - ops/spatial-backfill-b29
    paths:
      - '.github/workflows/tmp-spatial-b29-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/spatial-backfill-b29
      - name: Apply reviewed B29 mappings and count locks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          index_path = Path('atlas-polity-spatial-index.json')
          data = json.loads(index_path.read_text())
          geo = data['polity_geography']
          sub = data['polity_subregions']

          if len(geo) != 600 or len(sub) != 574:
              raise SystemExit(f'Unexpected B29 baseline: geography={len(geo)} subregions={len(sub)}')

          mappings = {
              '6c9e3efd-60af-451e-8178-e07c2b5d9348': ('southeast-asia', 'mainland-southeast-asia'),
              'a91ef245-d5a8-480a-b27f-43bec3ddffbd': ('europe', 'central-europe'),
              'f05b73c3-3eca-4c32-8a8e-0297a02a85a1': ('africa', 'central-africa'),
              '96a28134-38ab-4213-bd1f-00a808ecd845': ('africa', 'nile-valley'),
              '3a8c6594-cbd7-4994-9f87-b3c5932c9ac9': ('europe', 'britain-ireland'),
              'c05edf28-d8ce-4d77-affa-8d41cecce8ee': ('africa', 'maghreb-north-africa'),
              'c0e95372-3ea6-4b2d-996c-61a15d8e1648': ('south-asia', 'northwest-south-asia'),
              '71838f1f-0098-4ab1-bbc4-8679f1683c1d': ('europe', 'balkans'),
              'ba461ca4-dd1b-4f3f-8682-ee67e59024d9': ('southeast-asia', 'mainland-southeast-asia'),
              '81ff499c-879e-452f-9893-6618ec580825': ('africa', 'maghreb-north-africa'),
          }

          collisions = [pid for pid in mappings if pid in geo or pid in sub]
          if collisions:
              raise SystemExit(f'B29 candidate already mapped: {collisions}')

          for pid, (macro, leaf) in mappings.items():
              geo[pid] = macro
              sub[pid] = leaf

          if len(geo) != 610 or len(sub) != 584:
              raise SystemExit(f'Unexpected B29 result: geography={len(geo)} subregions={len(sub)}')

          index_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          coverage = Path('tests/person-spacetime-spatial-index-coverage.test.mjs')
          text = coverage.read_text()
          text = text.replace('Object.keys(index.polity_geography).length, 600', 'Object.keys(index.polity_geography).length, 610')
          text = text.replace('Object.keys(index.polity_subregions).length, 574', 'Object.keys(index.polity_subregions).length, 584')
          coverage.write_text(text)

          taxonomy = Path('tests/spacetime-taxonomy-migration.test.mjs')
          text = taxonomy.read_text()
          text = text.replace('"maghreb-north-africa": 13', '"maghreb-north-africa": 15')
          text = text.replace('"nile-valley": 7', '"nile-valley": 8')
          text = text.replace('Object.keys(index.polity_subregions).length, 574', 'Object.keys(index.polity_subregions).length, 584')
          taxonomy.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas-polity-spatial-index.json tests/person-spacetime-spatial-index-coverage.test.mjs tests/spacetime-taxonomy-migration.test.mjs
          git commit -m 'spatial: backfill batch 29 polity placements'
          git push origin HEAD:ops/spatial-backfill-b29
