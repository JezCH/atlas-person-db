name: Phase 8B Reconciliation Planner Evidence

on:
  pull_request:
    paths:
      - "atlas-reconciliation-planner.js"
      - "tests/atlas-reconciliation-planner.test.mjs"
      - "migration/phase-8/scripts/verify-phase8b-reconciliation-planner.mjs"
      - ".github/workflows/phase-8b-reconciliation-planner-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-phase-8b-reconciliation-planner-evidence
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run reconciliation planner tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/atlas-reconciliation-planner.test.mjs

      - name: Verify planner remains pure and unloaded
        shell: bash
        run: |
          set -euo pipefail
          rm -rf migration/phase-8/tmp/phase8b-reconciliation
          node migration/phase-8/scripts/verify-phase8b-reconciliation-planner.mjs \
            migration/phase-8/tmp/phase8b-reconciliation/verification.json
          printf 'PHASE_8B_RECONCILIATION_PLANNER_EVIDENCE\n' > migration/phase-8/tmp/phase8b-reconciliation/marker.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-8b-reconciliation-planner-${{ github.sha }}
          path: migration/phase-8/tmp/phase8b-reconciliation
          if-no-files-found: error
          retention-days: 90
