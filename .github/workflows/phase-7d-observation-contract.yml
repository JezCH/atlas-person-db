name: Phase 7D Observation Contract

on:
  pull_request:
    paths:
      - "atlas-production-source.js"
      - "atlas-source-control.js"
      - "atlas-reader.js"
      - "atlas-reader-observability.js"
      - "app.js"
      - "migration/phase-7/PHASE_7D_OBSERVATION_PLAN.md"
      - "migration/phase-7/PHASE_7_ROLLBACK_RUNBOOK.md"
      - "migration/phase-7/scripts/phase7d-observation-contract.mjs"
      - "tests/phase8c-c6-direct-normalized-read-activation.test.mjs"
      - ".github/workflows/phase-7d-observation-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observation-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run historical observation contract or C6 successor contract
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'ATLAS_READER_V2_DIRECT' atlas-reader.js; then
            node --test tests/phase8c-c6-direct-normalized-read-activation.test.mjs
          else
            node migration/phase-7/scripts/phase7a-contract.mjs
            node migration/phase-7/scripts/phase7b-contract.mjs
            node migration/phase-7/scripts/phase7c-preflight.mjs
            node migration/phase-7/scripts/phase7d-observation-contract.mjs
          fi
